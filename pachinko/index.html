<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>파칭코 타이쿤</title>
<style>
  :root { --bg: #140a24; --card: #24143c; --line: #4a3272; --gold: #ffd23f; --pink: #ff4fa0; --cyan: #4fe0ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; justify-content: center; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  #top { flex: none; padding: calc(8px + env(safe-area-inset-top)) 12px 6px; text-align: center; position: relative; }
  #money { font: 900 30px/1.1 system-ui, sans-serif; color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(255, 210, 63, 0.5); }
  #money.pop { animation: pop 0.25s; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  #sub { margin-top: 2px; font: 700 12.5px system-ui, sans-serif; opacity: 0.85; }
  #gear { position: absolute; right: 8px; top: calc(6px + env(safe-area-inset-top)); width: 36px; height: 36px; border: none; border-radius: 10px; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 17px; }
  /* 릴 */
  #reelBox { flex: none; margin: 0 12px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: linear-gradient(#3a1e62, #24143c); box-shadow: 0 0 0 2px var(--line), 0 0 16px rgba(255, 79, 160, 0.25); }
  #reels { display: flex; gap: 5px; }
  .reel { width: 38px; height: 46px; border-radius: 8px; background: #fff; color: #d0203a; font: 900 34px/46px system-ui, sans-serif; text-align: center; box-shadow: inset 0 -6px 8px rgba(0, 0, 0, 0.18), inset 0 6px 8px rgba(0, 0, 0, 0.18); }
  .reel.spin { color: #8a8a9a; }
  .reel.win { background: var(--gold); animation: flash 0.25s steps(2) infinite; }
  @keyframes flash { 50% { background: #fff; } }
  #reelBox.reach { animation: shake 0.12s linear infinite; box-shadow: 0 0 0 2px var(--pink), 0 0 22px var(--pink); }
  @keyframes shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  #reelInfo { flex: 1; min-width: 0; font: 800 12px/1.5 system-ui, sans-serif; }
  #holds { letter-spacing: 3px; color: var(--cyan); font-size: 13px; }
  #feverBar { margin-top: 3px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  #feverBar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff4fa0, #ffd23f); }
  #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #app.fever #status { color: var(--gold); }
  #boardWrap { flex: 1; min-height: 0; position: relative; margin: 6px 0 0; }
  #cv { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
  #big { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(0.5); font: 900 44px system-ui, sans-serif; color: var(--gold); text-shadow: 0 0 20px #ff4fa0, 0 3px 0 #a0205a; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.3s, transform 0.3s cubic-bezier(.2, 2, .4, 1); }
  #big.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  /* 패널 */
  #panel { flex: none; height: 36%; display: flex; flex-direction: column; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: #1c0f30; border-top: 2px solid var(--line); }
  #panelHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font: 900 13.5px system-ui, sans-serif; color: var(--gold); }
  #prestige { min-height: 34px; padding: 0 10px; border: none; border-radius: 9px; background: linear-gradient(#ffb03a, #e07a1a); color: #2a1404; font: 900 12.5px system-ui, sans-serif; }
  #prestige:disabled { background: #3a2a52; color: #8a7aa2; }
  #ups { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; -webkit-overflow-scrolling: touch; }
  .up { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .up .ic { font-size: 20px; text-align: center; }
  .up .nm { font: 900 13px system-ui, sans-serif; } .up .nm em { font-style: normal; color: var(--cyan); font-size: 11.5px; margin-left: 4px; }
  .up .ds { font-size: 11px; opacity: 0.75; margin-top: 1px; }
  .up button { min-width: 76px; min-height: 38px; border: none; border-radius: 9px; background: linear-gradient(#ff6ab0, #d0308a); color: #fff; font: 900 13px system-ui, sans-serif; box-shadow: 0 3px 0 #7a1a52; }
  .up button:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a1a52; }
  .up button:disabled { background: #3a2a52; color: #8a7aa2; box-shadow: none; }
  .screen { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.72); }
  .card { width: 100%; max-width: 330px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; }
  .card h2 { margin: 0; font: 900 22px system-ui, sans-serif; text-align: center; }
  .card p { margin: 0; text-align: center; line-height: 1.55; font-size: 14px; }
  .card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; align-self: stretch; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
  .card .stats b { text-align: right; color: var(--gold); }
  .btn { width: 100%; min-height: 46px; border: none; border-radius: 10px; background: #3a2a52; color: #fff; font: 900 15px system-ui, sans-serif; }
  .btn.main { background: var(--gold); color: #2a1a04; }
  .btn.red { background: #7a2a3a; }
  #reload { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); z-index: 9; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="money">0</div>
    <div id="sub"></div>
    <button id="gear" aria-label="설정">⚙</button>
  </div>
  <div id="reelBox">
    <div id="reels"><div class="reel">7</div><div class="reel">7</div><div class="reel">7</div></div>
    <div id="reelInfo">
      <div id="status">가운데 ★ 구멍에 넣으면 릴이 돌아요</div>
      <div>보류 <span id="holds"></span></div>
      <div id="feverBar"><i></i></div>
    </div>
  </div>
  <div id="boardWrap"><canvas id="cv"></canvas><div id="big"></div></div>
  <div id="panel">
    <div id="panelHead"><span>업그레이드</span><button id="prestige" disabled></button></div>
    <div id="ups"></div>
  </div>
  <div id="modal" class="screen" hidden><div class="card" id="card"></div></div>
  <button id="reload" class="btn main" style="width:auto;padding:0 16px" hidden onclick="location.reload()">다시 불러오기</button>
</div>
<script>setTimeout(function () { if (!window.pachinkoReady) document.getElementById('reload').hidden = false; }, 4000);</script>
<script type="module">
import * as L from './logic.js?v=1';

const $ = (id) => document.getElementById(id);
const save = L.loadSave(localStorage);
const persist = () => L.storeSave(localStorage, save);

// ---------- 판 ----------
const BW = 360, BH = 400, SLOT_Y = 352, SLOT_W = BW / L.SLOTS.length, BALL_R = 5, PEG_R = 3.5;
const POCKET = { x: 180, y: 196, w: 6 };
const T = { rest: 1.3, jit: 14, spread: 45, drag: 0.6, vmax: 999 };   // 튕김, 흔들림, 떨어지는 폭, 옆 감속
const pegs = [];
for (let row = 0; row < 10; row++) {
  const y = 44 + row * 30, off = row % 2 ? 18 : 0;
  for (let x = 18 + off; x < BW - 8; x += 36) {
    if (Math.hypot(x - POCKET.x, y - POCKET.y) < 24) continue;   // 스타트 구멍 자리
    pegs.push({ x, y, hit: 0 });
  }
}
for (let i = 1; i < L.SLOTS.length; i++) pegs.push({ x: i * SLOT_W, y: SLOT_Y, hit: 0, post: true });   // 칸막이 머리
pegs.push({ x: POCKET.x, y: POCKET.y - 30, hit: 0 });   // 바로 위 못: 곧장 떨어지는 구슬을 막는다

const balls = [];
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function dropBall(x) {
  if (balls.length > 220) return;
  balls.push({ x: x ?? Math.max(24, Math.min(BW - 24, 180 + gauss() * T.spread)), y: -6, vx: (Math.random() - 0.5) * 40, vy: 30, gold: Math.random() < L.goldChance(save), slot: -1 });
}
const floats = [];
// 물리 한 단계. onSlot(ball, index), onStart(ball)
function stepBalls(dt, onSlot, onStart, onPeg) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.vy += 720 * dt; b.vx *= 1 - T.drag * dt; if (b.vx > T.vmax) b.vx = T.vmax; else if (b.vx < -T.vmax) b.vx = -T.vmax; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx) * 0.5; } else if (b.x > BW - BALL_R) { b.x = BW - BALL_R; b.vx = -Math.abs(b.vx) * 0.5; }
    if (b.slot < 0) {
      // 스타트 구멍
      if (Math.abs(b.x - POCKET.x) < POCKET.w && b.y > POCKET.y - 4 && b.y < POCKET.y + 8 && b.vy > 0) { balls.splice(i, 1); onStart(b); continue; }
      for (const p of pegs) {
        const dx = b.x - p.x, dy = b.y - p.y, rr = BALL_R + PEG_R;
        if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
        const d2 = dx * dx + dy * dy; if (d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
        b.x = p.x + nx * rr; b.y = p.y + ny * rr;
        if (vn < 0) { b.vx -= T.rest * vn * nx; b.vy -= T.rest * vn * ny; b.vx += (Math.random() - 0.5) * T.jit; if (vn < -60) { p.hit = 1; onPeg && onPeg(); } }
      }
      if (b.y > SLOT_Y + 6) { b.slot = Math.max(0, Math.min(L.SLOTS.length - 1, Math.floor(b.x / SLOT_W))); }
    } else {
      // 칸 안: 칸막이 사이에 갇힌다
      const x0 = b.slot * SLOT_W + BALL_R + 1, x1 = (b.slot + 1) * SLOT_W - BALL_R - 1;
      if (b.x < x0) { b.x = x0; b.vx = Math.abs(b.vx) * 0.4; } if (b.x > x1) { b.x = x1; b.vx = -Math.abs(b.vx) * 0.4; }
      if (b.y > BH - 14) { balls.splice(i, 1); onSlot(b, b.slot); }
    }
  }
}

// ---------- 소리 ----------
let ac = null;
function audio() { if (!save.sound) return null; try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { return null; } return ac; }
function tone(f, dur, { type = 'sine', vol = 0.05, to = null, delay = 0 } = {}) { const a = audio(); if (!a) return; const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.01, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02); }
let pegT = 0, coinT = 0;
const sfx = {
  peg() { const n = performance.now(); if (n - pegT < 45) return; pegT = n; tone(1800 + Math.random() * 1400, 0.03, { type: 'triangle', vol: 0.012 }); },
  coin(m) { const n = performance.now(); if (n - coinT < 60 && m < 4) return; coinT = n; tone(m >= 4 ? 1320 : 880, 0.08, { type: 'square', vol: m >= 4 ? 0.035 : 0.015, to: m >= 4 ? 1760 : 1100 }); if (m >= 8) tone(2093, 0.2, { type: 'square', vol: 0.03, delay: 0.08 }); },
  start() { [660, 990].forEach((f, i) => tone(f, 0.08, { type: 'square', vol: 0.03, delay: i * 0.06 })); },
  tick() { tone(520, 0.03, { type: 'square', vol: 0.012 }); },
  stop() { tone(300, 0.08, { type: 'square', vol: 0.04, to: 200 }); },
  reach() { for (let i = 0; i < 8; i++) tone(500 + i * 90, 0.1, { type: 'sawtooth', vol: 0.02, delay: i * 0.12 }); },
  jackpot() { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.18, { type: 'square', vol: 0.045, delay: i * 0.09 })); },
  miss() { tone(220, 0.2, { type: 'triangle', vol: 0.03, to: 150 }); },
  buy() { [784, 1175].forEach((f, i) => tone(f, 0.08, { type: 'square', vol: 0.03, delay: i * 0.05 })); },
};
const buzz = (p) => { if (save.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch { /* 없음 */ } };

// ---------- 릴 ----------
const reelEls = [...document.querySelectorAll('.reel')];
let reel = null;   // { res, t, stopped }
function big(text, ms = 1400) { const b = $('big'); b.textContent = text; b.classList.add('show'); clearTimeout(big.t); big.t = setTimeout(() => b.classList.remove('show'), ms); }
function startSpin() {
  const res = L.spin(save); if (!res) return;
  reel = { res, t: 0, stopped: 0, tick: 0, stops: [0.5, 0.85, res.reach ? 2.6 : 1.2] };
  for (const e of reelEls) e.className = 'reel spin';
  $('status').textContent = '두근두근…';
}
function stepReel(dt) {
  if (!reel) { if (save.hold > 0) startSpin(); return; }
  reel.t += dt; reel.tick -= dt;
  if (reel.tick <= 0) { reel.tick = reel.stopped === 2 && reel.res.reach ? 0.11 : 0.06; for (let i = reel.stopped; i < 3; i++) reelEls[i].textContent = 1 + Math.floor(Math.random() * 9); if (reel.stopped < 3) sfx.tick(); }
  while (reel.stopped < 3 && reel.t >= reel.stops[reel.stopped]) {
    const i = reel.stopped++; reelEls[i].textContent = reel.res.digits[i]; reelEls[i].className = 'reel'; sfx.stop();
    if (i === 1 && reel.res.reach) { $('reelBox').classList.add('reach'); $('status').textContent = '리치!! 하나만 더!'; sfx.reach(); buzz([30, 60, 30, 60, 30]); }
  }
  if (reel.stopped === 3 && !reel.done) {
    reel.done = true; $('reelBox').classList.remove('reach');
    if (reel.res.jackpot) {
      const bonus = L.jackpot(save);
      for (const e of reelEls) e.className = 'reel win';
      big(`🎉 잭팟! +${L.fmt(bonus)}`, 2200); sfx.jackpot(); buzz([60, 40, 60, 40, 200]);
      $('status').textContent = `🔥 피버! 수익 ×${L.feverMult(save)}`;
      for (let i = 0; i < 40; i++) setTimeout(() => dropBall(), i * 45);
      persist();
    } else { if (reel.res.reach) { sfx.miss(); $('status').textContent = '아깝다…!'; } else $('status').textContent = save.fever > 0 ? `🔥 피버! 수익 ×${L.feverMult(save)}` : '꽝'; }
  }
  if (reel.done && reel.t > reel.stops[2] + (reel.res.jackpot ? 1.6 : 0.45)) { reel = null; for (const e of reelEls) e.className = 'reel'; }
}

// ---------- 그리기 ----------
const cv = $('cv'), wrap = $('boardWrap');
let ctx, K = 1, DPR = 1;
function resize() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  K = Math.min(wrap.clientWidth / BW, wrap.clientHeight / BH);
  cv.width = Math.round(BW * K * DPR); cv.height = Math.round(BH * K * DPR);
  cv.style.width = `${BW * K}px`; cv.style.height = `${BH * K}px`;
  ctx = cv.getContext('2d');
}
new ResizeObserver(resize).observe(wrap);
const SLOT_COL = (m) => (m >= 8 ? '#ffd23f' : m >= 2 ? '#ff4fa0' : m >= 1 ? '#4fe0ff' : m >= 0.5 ? '#8a7ab8' : '#5a4a7a');
let gameT = 0;
function render(t) {
  const c = ctx, fever = save.fever > 0;
  c.setTransform(K * DPR, 0, 0, K * DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, BH);
  if (fever) { const h = (t * 80) % 360; g.addColorStop(0, `hsl(${h}, 70%, 22%)`); g.addColorStop(1, `hsl(${(h + 80) % 360}, 70%, 14%)`); }
  else { g.addColorStop(0, '#2a1650'); g.addColorStop(1, '#170c2c'); }
  c.fillStyle = g; c.fillRect(0, 0, BW, BH);
  // 칸
  for (let i = 0; i < L.SLOTS.length; i++) {
    const lit = i === L.luckySlot(gameT), m = L.SLOTS[i] * (lit ? L.LUCKY_MULT : 1), x = i * SLOT_W;
    c.fillStyle = SLOT_COL(m); c.globalAlpha = lit ? 0.75 : 0.22 + (fever ? 0.15 : 0); c.fillRect(x + 1, SLOT_Y, SLOT_W - 2, BH - SLOT_Y); c.globalAlpha = 1;
    c.fillStyle = lit ? '#2a1404' : SLOT_COL(m); c.font = '900 13px system-ui, sans-serif'; c.textAlign = 'center'; c.fillText(`×${m}`, x + SLOT_W / 2, BH - 8);
    if (lit) { c.fillStyle = '#fff6c0'; c.fillText('★', x + SLOT_W / 2, SLOT_Y + 16); }
  }
  c.fillStyle = '#4a3272'; for (let i = 1; i < L.SLOTS.length; i++) c.fillRect(i * SLOT_W - 1, SLOT_Y, 2, BH - SLOT_Y);
  // 스타트 구멍
  c.fillStyle = '#0a0414'; c.beginPath(); c.ellipse(POCKET.x, POCKET.y + 3, POCKET.w + 2, 7, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#ffd23f'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(POCKET.x - 19, POCKET.y - 6); c.lineTo(POCKET.x - 14, POCKET.y + 8); c.lineTo(POCKET.x + 14, POCKET.y + 8); c.lineTo(POCKET.x + 19, POCKET.y - 6); c.stroke();
  c.fillStyle = '#ffd23f'; c.font = '900 12px system-ui, sans-serif'; c.fillText('★', POCKET.x, POCKET.y + 22);
  // 못
  for (const p of pegs) {
    if (p.hit > 0) { c.fillStyle = `rgba(255,240,160,${p.hit * 0.5})`; c.beginPath(); c.arc(p.x, p.y, PEG_R + 5 * p.hit, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = p.hit > 0.3 ? '#fff6c0' : p.post ? '#8a7ab8' : '#d8b24a'; c.beginPath(); c.arc(p.x, p.y, PEG_R, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.7)'; c.fillRect(p.x - 1.5, p.y - 2, 1.5, 1.5);
  }
  // 구슬
  for (const b of balls) {
    c.fillStyle = b.gold ? '#ffcf3a' : '#dfe6ee'; c.beginPath(); c.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); c.fill();
    c.fillStyle = b.gold ? '#fff6c8' : '#ffffff'; c.beginPath(); c.arc(b.x - 1.6, b.y - 1.8, 1.8, 0, Math.PI * 2); c.fill();
    if (b.gold) { c.strokeStyle = 'rgba(255,220,90,0.6)'; c.lineWidth = 2; c.beginPath(); c.arc(b.x, b.y, BALL_R + 2, 0, Math.PI * 2); c.stroke(); }
  }
  // 번 돈
  c.font = '900 12px system-ui, sans-serif';
  for (const f of floats) { c.globalAlpha = 1 - f.t; c.fillStyle = f.col; c.fillText(f.text, f.x, f.y - f.t * 26); }
  c.globalAlpha = 1;
  if (!save.balls && !balls.length) { c.fillStyle = 'rgba(255,255,255,0.8)'; c.font = '800 14px system-ui, sans-serif'; c.fillText('판을 누르면 구슬이 떨어져요', BW / 2, 24); }
}

// ---------- 글자 ----------
let upsKey = '', lastMoney = -1;
function updateUI() {
  const m = $('money'); m.textContent = `${L.fmt(save.money)}원`;
  if (save.money > lastMoney * 1.2 + 50) { m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop'); } lastMoney = save.money;
  $('sub').textContent = `초당 약 ${L.fmt(L.perSecond(save) * L.feverMult(save) * (save.fever > 0 ? 2 : 1))}원 · 구슬 ${L.fmt(L.ballValue(save))}원${save.medals ? ` · 🏅${save.medals} (+${save.medals * 10}%)` : ''}`;
  $('holds').textContent = '●'.repeat(save.hold) + '○'.repeat(L.HOLD_MAX - save.hold);
  $('feverBar').querySelector('i').style.width = `${Math.min(100, (save.fever / L.FEVER_SEC) * 100)}%`;
  $('app').classList.toggle('fever', save.fever > 0);
  const gain = L.medalsFor(save.total), pb = $('prestige');
  pb.disabled = gain < 1; pb.textContent = gain >= 1 ? `🏬 가게 확장 🏅+${gain}` : `🏬 확장까지 ${L.fmt(Math.max(0, 50000 - save.total))}원`;
  const key = L.UPGRADES.map((u) => `${save.up[u.id]}:${save.money >= L.upgradeCost(save, u.id)}`).join(',');
  if (key !== upsKey) { upsKey = key; buildUps(); }
}
const EFFECT = {
  value: (s) => `${L.fmt(L.ballValue(s))}원`, rate: (s) => `초당 ${(0.5 + 0.25 * s.up.rate).toFixed(2)}개`, gold: (s) => `${Math.round(L.goldChance(s) * 100)}%`,
  luck: (s) => `1/${(1 / L.jackpotChance(s)).toFixed(1)}`, fever: (s) => `×${5 + s.up.fever}`,
};
function buildUps() {
  const box = $('ups'), top = box.scrollTop; box.innerHTML = '';
  for (const u of L.UPGRADES) {
    const lv = save.up[u.id], cost = L.upgradeCost(save, u.id), max = lv >= u.max, row = document.createElement('div');
    row.className = 'up';
    row.innerHTML = `<div class="ic">${u.icon}</div><div><div class="nm">${u.name}<em>Lv.${lv} · ${EFFECT[u.id](save)}</em></div><div class="ds">${u.desc}</div></div>`;
    const b = document.createElement('button'); b.textContent = max ? '최대' : `${L.fmt(cost)}원`; b.disabled = max || save.money < cost;
    b.onclick = () => { if (L.buyUpgrade(save, u.id)) { sfx.buy(); buzz(10); updateUI(); } };
    row.appendChild(b); box.appendChild(row);
  }
  box.scrollTop = top;
}

// ---------- 입력 ----------
let tapT = 0;
cv.addEventListener('pointerdown', (e) => {
  audio();
  const now = performance.now(); if (now - tapT < 90) return; tapT = now;
  const r = cv.getBoundingClientRect(); dropBall(Math.max(12, Math.min(BW - 12, (e.clientX - r.left) / K)));
});
function modal(html, buttons) { const card = $('card'); card.innerHTML = html; for (const [label, cls, fn] of buttons) { const b = document.createElement('button'); b.className = `btn ${cls || ''}`; b.innerHTML = label; b.onclick = fn; card.appendChild(b); } $('modal').hidden = false; }
const close = () => { $('modal').hidden = true; };
$('prestige').onclick = () => {
  const gain = L.medalsFor(save.total);
  modal(`<h2>🏬 가게 확장</h2><p>지금 가게를 팔고 더 큰 가게를 열어요.<br>메달 <b style="color:var(--gold)">🏅 +${gain}</b>개를 받고, 메달 하나마다 모든 수익이 <b>+10%</b> 늘어요.</p><p style="font-size:12.5px;opacity:.8">돈과 업그레이드는 처음으로 돌아가요.</p>`, [
    ['확장하기', 'main', () => { L.prestige(save); balls.length = 0; persist(); close(); big(`🏅 메달 ${save.medals}개!`, 1800); sfx.jackpot(); updateUI(); }], ['아직 안 해요', '', close]]);
};
function intro() {
  modal(`<h2>🎰 파칭코 타이쿤</h2><ul>
    <li>구슬이 저절로 떨어져 아래 칸의 <b>배수</b>만큼 돈을 벌어요. 불이 켜진 <b>럭키 칸</b>은 ×8</li>
    <li>판을 누르면 그 자리에 구슬을 더 떨어뜨려요</li>
    <li>가운데 <b>★ 구멍</b>에 들어가면 릴이 돌아요. 숫자 셋이 맞으면 <b>잭팟 + 피버</b>(수익 ×5 이상, 발사 2배)</li>
    <li>번 돈으로 업그레이드, 많이 벌면 <b>가게 확장</b>으로 영구 보너스</li>
    <li>게임을 꺼 둬도 최대 8시간 동안 돈이 쌓여요(절반 속도)</li></ul>`, [['시작', 'main', () => { save.seenIntro = true; persist(); close(); }]]);
}
$('gear').onclick = () => modal(`<h2>⚙ 설정</h2><div class="stats"><span>떨어뜨린 구슬</span><b>${L.fmt(save.balls)}</b><span>릴</span><b>${L.fmt(save.spins)}번</b><span>잭팟</span><b>${save.jackpots}번</b><span>연 가게</span><b>${save.shops + 1}번째</b></div>`, [
  [`소리 ${save.sound ? '켬 🔊' : '끔 🔇'}`, '', () => { save.sound = !save.sound; persist(); close(); }], [`진동 ${save.vibrate ? '켬' : '끔'}`, '', () => { save.vibrate = !save.vibrate; persist(); close(); }],
  ['❓ 하는 법', '', intro], ['🗑️ 처음부터 다시', 'red', () => { if (confirm('정말 모두 지울까요?')) { Object.assign(save, L.defaultSave(), { seenIntro: true }); balls.length = 0; persist(); close(); } }], ['닫기', 'main', close]]);

// ---------- 루프 ----------
const onSlot = (b, i) => { const m = L.SLOTS[i] * (i === L.luckySlot(gameT) ? L.LUCKY_MULT : 1), v = L.payout(save, m, b.gold); floats.push({ x: i * SLOT_W + SLOT_W / 2, y: SLOT_Y + 14, t: 0, text: `+${L.fmt(v)}`, col: b.gold ? '#ffd23f' : SLOT_COL(m) }); sfx.coin(m); if (m >= 8) buzz(25); };
const onStart = (b) => { const v = L.payout(save, L.START_MULT, b.gold); floats.push({ x: POCKET.x, y: POCKET.y - 8, t: 0, text: `★ +${L.fmt(v)}`, col: '#ffd23f' }); L.holdSpin(save); sfx.start(); buzz(15); };
let last = performance.now(), acc = 0, spawn = 0, uiT = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if ($('modal').hidden) {
    spawn += dt * L.dropRate(save); while (spawn >= 1) { spawn -= 1; dropBall(); }
    acc += dt; while (acc >= 1 / 120) { acc -= 1 / 120; stepBalls(1 / 120, onSlot, onStart, sfx.peg); }
    gameT += dt; L.stepFever(save, dt); stepReel(dt);
    for (const p of pegs) p.hit = Math.max(0, p.hit - dt * 5);
    for (const f of floats) f.t += dt * 1.4; while (floats.length && floats[0].t >= 1) floats.shift();
    saveT -= dt; if (saveT <= 0) { saveT = 5; persist(); }
  }
  render(now / 1000);
  uiT -= dt; if (uiT <= 0) { uiT = 0.12; updateUI(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); else last = performance.now(); });
resize(); updateUI();
// 자리를 비운 동안
const away = (Date.now() - save.lastSeen) / 1000;
if (!save.seenIntro) intro();
else if (away > 60) { const r = L.offlineEarnings(save, away); if (r.money >= 1) modal(`<h2>💤 다녀오셨어요</h2><p>${r.seconds >= 3600 ? `${(r.seconds / 3600).toFixed(1)}시간` : `${Math.round(r.seconds / 60)}분`} 동안 가게가 벌었어요.</p><p style="font:900 26px system-ui;color:var(--gold)">+${L.fmt(r.money)}원</p>`, [['받기', 'main', () => { close(); persist(); }]]); }
requestAnimationFrame(frame);
// 평균 배수 재기(개발용): 구슬 n개를 빠르게 떨어뜨려 본다
window.__pk = { save, L, balls, T, POCKET, dropBall, measure(n) { let sum = 0, cnt = 0, starts = 0; const hist = Array(L.SLOTS.length).fill(0), keep = balls.splice(0); for (let i = 0; i < n; i++) { dropBall(); balls[balls.length - 1].gold = false; for (let k = 0; k < 2400 && balls.length; k++) stepBalls(1 / 120, (b, s) => { sum += L.SLOTS[s]; cnt++; hist[s]++; }, () => { sum += L.START_MULT; cnt++; starts++; }); } const stuck = balls.length; balls.length = 0; balls.push(...keep); return { avg: sum / cnt, starts: starts / cnt, cnt, hist, stuck }; } };
window.pachinkoReady = true;
</script>
</body>
