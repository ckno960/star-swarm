<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>정중앙 스매시</title>
<style>
  :root { --cream: #f6ecd0; --cream2: #ddc99c; --ink: #2b2638; --red: #e04848; --slate: #5a6582; --slate2: #454f69; --gold: #ffd23f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: #1a1824; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { display: flex; justify-content: center; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; overflow: hidden; background: #7fc8f0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .ol { text-shadow: -3px 0 var(--ink), 3px 0 var(--ink), 0 -3px var(--ink), 0 3px var(--ink), -2px -2px var(--ink), 2px 2px var(--ink), -2px 2px var(--ink), 2px -2px var(--ink), 0 6px 0 rgba(0, 0, 0, 0.35); }
  .ol2 { text-shadow: -2px 0 var(--ink), 2px 0 var(--ink), 0 -2px var(--ink), 0 2px var(--ink), -1px -1px var(--ink), 1px 1px var(--ink), -1px 1px var(--ink), 1px -1px var(--ink), 0 3px 0 rgba(0, 0, 0, 0.35); }

  /* 위쪽: 체력 막대 + 일시정지, 큰 남은 체력 숫자 */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events: none; }
  .topRow { display: flex; gap: 8px; align-items: center; }
  #timer { flex: 1; height: 24px; background: var(--cream); border: 3px solid var(--ink); border-radius: 6px; padding: 3px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
  #timerFill { height: 100%; width: 100%; background: linear-gradient(#7dff9b, #2fbf5a); border-radius: 2px; transition: width 0.15s; }
  #timerFill.mid { background: linear-gradient(#ffe066, #e0a020); }
  #timerFill.low { background: linear-gradient(#ff7a7a, #d02a2a); }
  @keyframes blink { 50% { opacity: 0.45; } }
  .sqBtn {
    pointer-events: auto; width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: var(--cream); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    color: var(--ink); font: 900 16px system-ui, sans-serif;
  }
  .sqBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
  #score { margin-top: 6px; text-align: center; font: 900 54px/1.05 system-ui, sans-serif; letter-spacing: 1px; }
  #stageLine { margin-top: 2px; text-align: center; font: 800 14px system-ui, sans-serif; }
  #hudCoins { margin-top: 4px; text-align: center; font: 900 16px system-ui, sans-serif; color: #fff3a0; }
  .sideBtn { pointer-events: auto; width: 58px; height: 58px; flex: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    background: var(--cream); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink); color: var(--ink); font: 900 12px system-ui, sans-serif; }
  .sideBtn b { font-size: 20px; line-height: 1; }
  .sideBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .sideBtn.can { background: #fff3b0; animation: glow 0.8s ease-in-out infinite; }
  .bigBtn .autoBar { position: absolute; left: 10px; right: 10px; bottom: 9px; height: 6px; border-radius: 3px; background: rgba(43, 38, 56, 0.18); overflow: hidden; }
  .bigBtn .autoBar i { display: block; height: 100%; width: 0; background: #8a7aa8; }
  .bigBtn .autoTag { position: absolute; right: 12px; top: 8px; font: 900 11px system-ui, sans-serif; color: #8a7aa8; }
  #upgrades { justify-content: flex-start; padding-top: calc(16px + env(safe-area-inset-top)); background: var(--slate2); overflow-y: auto; }
  #upgrades .head { width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: space-between; }
  #upgrades h2 { margin: 0; font: 900 24px system-ui, sans-serif; }
  .upCard { width: 100%; max-width: 360px; display: flex; gap: 10px; align-items: center; padding: 12px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
  .upCard .info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .upCard .info b { font-size: 17px; }
  .upCard .info span { font-size: 13px; line-height: 1.4; }
  .upCard .btn { width: 104px; min-height: 48px; font-size: 15px; flex: none; padding: 0 6px; }
  .upCard .btn:disabled { opacity: 0.45; }
  .upNote { width: 100%; max-width: 360px; font: 700 13px/1.5 system-ui, sans-serif; text-align: center; opacity: 0.9; }
  #combo { margin-top: 6px; text-align: center; font: 900 15px system-ui, sans-serif; color: var(--gold); min-height: 18px; }

  /* 판정 문구 */
  #judgeBox { position: absolute; left: 0; right: 0; top: 40%; text-align: center; pointer-events: none; }
  .judge { display: inline-block; font: 900 36px/1 system-ui, sans-serif; letter-spacing: 2px; animation: pop 0.7s ease-out forwards; }
  .judge small { display: block; font-size: 14px; letter-spacing: 0; margin-bottom: 2px; }
  .judge.perfect {
    font-size: 46px; color: #fff3a0;
    background: linear-gradient(#fffbe0 10%, #ffd23f 50%, #ff9a20 90%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 0 var(--ink)) drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(0 0 12px rgba(255, 210, 63, 0.9));
    animation: popBig 0.9s ease-out forwards;
  }
  .judge.perfect small { -webkit-text-fill-color: #fff; color: #fff; }
  .judge.great { color: #7df0ff; }
  .judge.good { color: #ffffff; }
  .judge.miss { color: #b0b0c0; font-size: 30px; }
  .judge.go { color: var(--gold); font-size: 50px; }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; } 15% { transform: scale(1.25); opacity: 1; } 30% { transform: scale(1); }
    75% { transform: translateY(-6px); opacity: 1; } 100% { transform: translateY(-18px); opacity: 0; }
  }
  @keyframes popBig {
    0% { transform: scale(2.6) rotate(-8deg); opacity: 0; } 12% { transform: scale(0.85) rotate(2deg); opacity: 1; }
    22% { transform: scale(1.12) rotate(-1deg); } 34% { transform: scale(1) rotate(0); }
    80% { transform: translateY(-4px); opacity: 1; } 100% { transform: translateY(-20px) scale(1.05); opacity: 0; }
  }
  .dmg { position: absolute; transform: translate(-50%, -50%); font: 900 22px system-ui, sans-serif; pointer-events: none; animation: dmgUp 0.9s ease-out forwards; white-space: nowrap; }
  .dmg.crit { font-size: 32px; color: var(--gold); }
  .dmg.auto { font-size: 16px; color: #e0e0f0; }
  @keyframes dmgUp { 0% { transform: translate(-50%, -20%) scale(0.5); opacity: 0; } 15% { transform: translate(-50%, -80%) scale(1.3); opacity: 1; } 30% { transform: translate(-50%, -90%) scale(1); } 100% { transform: translate(-50%, -260%); opacity: 0; } }
  #hLabel { position: absolute; left: 30px; font: 900 14px system-ui, sans-serif; pointer-events: none; white-space: nowrap; }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(24% + 64px); padding: 6px 12px; background: rgba(43, 38, 56, 0.85); border: 2px solid var(--cream); border-radius: 8px; font: 800 14px system-ui, sans-serif; pointer-events: none; white-space: nowrap; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateX(-50%) translateY(-4px); } }
  #banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; }
  #banner .t { font: 900 46px/1.1 system-ui, sans-serif; color: var(--gold); animation: popBig 2.4s ease-out forwards; }
  #banner .s { font: 800 17px/1.5 system-ui, sans-serif; margin-top: 6px; animation: pop 2.4s ease-out forwards; }

  /* 아래쪽: 큰 버튼 두 개 */
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 24%; min-height: 150px;
    background: var(--slate); border-top: 4px solid var(--ink); box-shadow: inset 0 4px 0 #74809e;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 12px env(safe-area-inset-bottom);
  }
  .bigBtn {
    position: relative; height: 74%; flex: 1; max-width: 260px; padding: 0;
    background: var(--cream); border: 4px solid var(--ink); border-radius: 20px;
    box-shadow: 0 7px 0 var(--ink), inset 0 -7px 0 var(--cream2);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--ink); font: 900 30px system-ui, sans-serif; transition: opacity 0.15s, filter 0.15s, background 0.1s;
    touch-action: none;
  }
  .bigBtn svg { height: 62%; width: auto; }
  .bigBtn .smashIcon, .bigBtn.smash .jumpIcon { display: none; }
  .bigBtn.smash .smashIcon { display: flex; }
  .bigBtn .jumpIcon, .bigBtn .smashIcon { height: 100%; align-items: center; gap: 10px; }
  .bigBtn .jumpIcon { display: flex; }
  .bigBtn.smash { background: #ffe58a; box-shadow: 0 7px 0 var(--ink), inset 0 -7px 0 #e0b040; }
  .bigBtn.press { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink), inset 0 -3px 0 var(--cream2); }
  .bigBtn.dim { filter: saturate(0.4) brightness(0.85); }
  .bigBtn.glow { animation: glow 0.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 7px 0 var(--ink), inset 0 -7px 0 var(--cream2), 0 0 0 4px var(--gold); } }

  /* 화면(메인, 스테이지, 결과, 일시정지, 설정) */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .screen.dark { background: rgba(26, 22, 36, 0.72); }
  .card {
    width: 100%; max-width: 320px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: var(--cream); color: var(--ink); border: 4px solid var(--ink); border-radius: 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
  }
  .card h2 { margin: 0; font: 900 30px system-ui, sans-serif; }
  .card p { margin: 0; text-align: center; line-height: 1.5; font-size: 15px; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
  .card .stats b { text-align: right; }
  .btn {
    width: 100%; min-height: 50px; padding: 0 14px; background: var(--cream); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 4px 0 var(--ink); font: 900 17px system-ui, sans-serif;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.main { background: var(--gold); }
  .btn.red { background: #ffb0a8; }
  .btn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.75; }
  .card .btn { background: #fff8e4; }
  .card .btn.main { background: var(--gold); }
  #home { justify-content: space-between; padding: calc(28px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(26, 22, 36, 0.35), rgba(26, 22, 36, 0) 40%, rgba(26, 22, 36, 0) 55%, rgba(26, 22, 36, 0.55)); }
  #home h1 { margin: 22px 0 0; text-align: center; font: 900 46px/1.1 system-ui, sans-serif; color: var(--gold); letter-spacing: 2px; }
  #home .sub { margin-top: 8px; text-align: center; font: 800 15px/1.5 system-ui, sans-serif; }
  #home .menu { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
  #home .how { font: 700 13px/1.6 system-ui, sans-serif; text-align: center; background: rgba(43, 38, 56, 0.8); border-radius: 10px; padding: 8px 10px; }
  #home .best { text-align: center; font: 900 15px system-ui, sans-serif; }
  #gear { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; font-size: 20px; }
  #stages { justify-content: flex-start; padding-top: calc(16px + env(safe-area-inset-top)); background: var(--slate2); overflow-y: auto; }
  #stages .head { width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: space-between; }
  #stages h2 { margin: 0; font: 900 24px system-ui, sans-serif; }
  .region { width: 100%; max-width: 360px; }
  .region h3 { margin: 6px 0; font: 900 16px system-ui, sans-serif; }
  .region .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .region .row button {
    aspect-ratio: 1 / 1; padding: 0; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px;
    box-shadow: 0 3px 0 var(--ink); font: 900 18px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .region .row button small { font-size: 10px; color: #b08000; }
  .region .row button.boss { background: #ffd6c8; }
  .region .row button:disabled { opacity: 0.4; }
  .setRow { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: space-between; font: 800 16px system-ui, sans-serif; }
  .setRow .btn { width: 110px; min-height: 42px; }
  #reload { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .coin { display: inline-block; width: 0.9em; height: 0.9em; margin: 0 3px -1px 0; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd23f 45%, #c88a10); border: 2px solid var(--ink); vertical-align: baseline; }
  #coinBar { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; padding: 6px 10px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 8px; font: 900 16px system-ui, sans-serif; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
  #shop { justify-content: flex-start; padding-top: calc(16px + env(safe-area-inset-top)); background: var(--slate2); overflow-y: auto; }
  #shop .head { width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: space-between; }
  #shop h2 { margin: 0; font: 900 24px system-ui, sans-serif; }
  #shopCoins { font: 900 18px system-ui, sans-serif; }
  .charCard { width: 100%; max-width: 360px; display: flex; gap: 10px; align-items: center; padding: 10px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
  .charCard.on { background: #fff3b0; }
  .charCard canvas { width: 56px; height: 72px; image-rendering: pixelated; flex: none; background: #8fd4f8; border: 2px solid var(--ink); border-radius: 8px; }
  .charCard .info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .charCard .info b { font-size: 17px; }
  .charCard .info span { font-size: 13px; line-height: 1.4; }
  .charCard .btn { width: 88px; min-height: 44px; font-size: 15px; flex: none; padding: 0 6px; }
  .charCard .btn:disabled { opacity: 0.45; }
  .sfxText { position: absolute; transform: translate(-50%, -50%) rotate(-10deg); font: italic 900 28px system-ui, sans-serif; color: #fff; pointer-events: none; white-space: nowrap; animation: sfxShake 0.08s linear infinite, fadeOut 0.9s ease-out forwards; }
  .sfxText.big { font-size: 44px; color: #ffd23f; animation: popBig 0.9s ease-out forwards; }
  @keyframes sfxShake { 50% { margin-left: 2px; margin-top: -2px; } }
  @keyframes fadeOut { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="topRow">
      <div id="timer" aria-label="남은 체력"><div id="timerFill"></div></div>
      <button id="pauseBtn" class="sqBtn" aria-label="일시정지">❚❚</button>
    </div>
    <div id="score" class="ol">0</div>
    <div id="stageLine" class="ol2"></div>
    <div id="hudCoins" class="ol2"></div>
    <div id="combo" class="ol2"></div>
  </div>
  <div id="judgeBox"></div>
  <div id="banner"></div>
  <div id="hLabel" class="ol2" hidden></div>
  <div id="fx"></div>
  <div id="hint" hidden></div>

  <div id="panel" hidden>
    <button id="upBtnGame" class="sideBtn" aria-label="강화"><b>⬆</b>강화</button>
    <button id="btn" class="bigBtn" aria-label="점프">
      <span class="autoTag">AUTO</span><span class="autoBar"><i id="autoFill"></i></span>
      <span class="jumpIcon"><svg viewBox="0 0 40 40"><path d="M20 5 L35 27 L26 27 L26 35 L14 35 L14 27 L5 27 Z" fill="#e04848" stroke="#2b2638" stroke-width="3" stroke-linejoin="round"/></svg><span id="jumpWord">점프</span></span>
      <span class="smashIcon"><svg viewBox="0 0 40 40"><path d="M14 4 L26 4 L26 16 L35 16 L20 33 L5 16 L14 16 Z" fill="#e04848" stroke="#2b2638" stroke-width="3" stroke-linejoin="round"/><path d="M6 37 L12 34 M34 37 L28 34 M20 39 L20 36" stroke="#2b2638" stroke-width="3" stroke-linecap="round"/></svg>찍기</span>
    </button>
    <button id="shopBtnGame" class="sideBtn" aria-label="캐릭터"><b>☺</b>캐릭터</button>
  </div>

  <div id="home" class="screen">
    <div id="coinBar"><span class="coin"></span><span id="homeCoins">0</span></div>
    <button id="gear" class="sqBtn" aria-label="환경설정">⚙</button>
    <div>
      <h1 class="ol">정중앙<br>스매시</h1>
      <div class="sub ol2">정중앙을 맞혀 하늘 높이 뛰고<br>최고점에서 내려찍어 부숴라!</div>
    </div>
    <div class="menu">
      <div class="how">가만히 두어도 <b style="color:#ffd23f">자동으로</b> 뛰어 부숩니다<br>직접 누르면 훨씬 빨라요: ① 바늘이 <b style="color:#ffd23f">정중앙</b>일 때 점프<br>② <b style="color:#ffd23f">최고점</b>에서 한 번 더 → 강하게 내려찍기</div>
      <div class="best ol2" id="bestLine"></div>
      <button id="startBtn" class="btn main"></button>
      <div style="display:flex;gap:10px">
        <button id="upBtn" class="btn">강화</button>
        <button id="shopBtn" class="btn">캐릭터</button>
      </div>
    </div>
  </div>

  <div id="upgrades" class="screen" hidden>
    <div class="head"><h2 class="ol2">강화</h2><span id="upCoins" class="ol2"></span><button id="upBack" class="sqBtn" aria-label="닫기">✕</button></div>
    <div id="upList" style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;padding-bottom:16px"></div>
  </div>

  <div id="shop" class="screen" hidden>
    <div class="head"><h2 class="ol2">캐릭터</h2><span id="shopCoins" class="ol2"></span><button id="shopBack" class="sqBtn" aria-label="닫기">✕</button></div>
    <div id="charList" style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;padding-bottom:16px"></div>
  </div>

  <div id="modal" class="screen dark" hidden><div class="card" id="modalCard"></div></div>

  <div id="reload" hidden><div class="card"><p>새 버전을 불러오지 못했어요.</p><button class="btn main" onclick="location.reload()">새로고침</button></div></div>
</div>

<script>
  setTimeout(function () { if (!window.smashReady) document.getElementById('reload').hidden = false; }, 4000);
</script>
<script type="module">
import * as L from './logic.js?v=5';

const $ = (id) => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const INK = '#2b2638';

// ---------- 화면 크기 ----------
const W = 180;
let H = 320, GY = 210, BAR_Y = 226, TOP_SAFE = 64, cssScale = 2;
const AREA = () => GY - TOP_SAFE;   // 기본 구도에서 땅 위로 보이는 높이(px)
function resize() {
  const r = app.getBoundingClientRect();
  H = Math.max(280, Math.min(440, Math.round(W * r.height / r.width)));
  cv.width = W; cv.height = H;
  cssScale = r.width / W;
  const panelTop = H * (1 - Math.max(0.24, 150 / r.height));
  GY = Math.round(panelTop - 34);
  BAR_Y = Math.round(GY + 13);
  TOP_SAFE = Math.round(H * 0.22);
  ctx.imageSmoothingEnabled = false;
  spriteCache.clear(); targetCache = null; decorCache = null;
  if (G) setupCamera();
}
window.addEventListener('resize', resize);

// ---------- 저장 ----------
const save = L.loadSave(window.localStorage);
const persist = () => L.storeSave(window.localStorage, save);

// ---------- 소리 ----------
let ac = null;
function audio() {
  if (!save.sound) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch { return null; }
  return ac;
}
function tone(freq, dur, { type = 'square', vol = 0.06, to = null, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);

// 자동일 때 누르면: 게이지가 나오고 주인공이 바로 시작 자리(건물 앞 땅)로 돌아와 직접 조작이 시작된다.

function popDamage(text, crit, manual = true) {
  const el = document.createElement('div');
  el.className = 'dmg ol' + (crit ? ' crit' : '') + (manual ? '' : ' auto');
  el.textContent = text;
  domAt(el, (Math.random() - 0.5) * 20 * mpp(), targetTop() + 12 * mpp());
  setTimeout(() => el.remove(), 950);
}
function sfxText(text, x, y, cls) {
  const el = document.createElement('div');
  el.className = 'sfxText ol ' + cls;
  el.textContent = text;
  domAt(el, x, y);
  setTimeout(() => el.remove(), 950);
}
function banner(title, sub) {
  $('banner').innerHTML = `<div class="t ol">${title}</div><div class="s ol2">${sub}</div>`;
  setTimeout(() => { $('banner').innerHTML = ''; }, 2500);
}

function launch() {
  const jp = G.jump, f = jp.frac, u = mpp(), x = G.hx, col = G.info.sphere ? G.info.target.roof : SKY[G.info.regionIndex].dirt;
  G.phase = 'air'; G.arc.t = 0;
  hero.sq = 0.45 + 0.2 * f; hero.sqv = 0;
  if (jp.j.grade === 'perfect') {
    // 콰앙! 땅이 패이며 튀어 오름
    G.mega = true; G.crater = 1;
    cam.focus = null;
    flash('#ffffff', 0.9); cam.shake = 12;
    ring(x, 0, 4 * u, 260 * u, '#ffd23f', 4, 0.6, true);
    ring(x, 0, 2 * u, 170 * u, '#ffffff', 3, 0.5, true);
    ring(x, 0.5, 6 * u, 200 * u, '#fff2a0', 2, 0.45);
    fx.rays.push({ x, y: 0.5, life: 0.6, max: 0.6, color: '#fff2a0' });
    burst(x, 0, 40, ['#e8e0d0', '#c8bca8', col], 160 * u, 0.9, { up: true, spread: 2.8, g: 300 * u, size: 3 });
    burst(x, 0, 30, ['#ffd23f', '#fff6c0', '#ff9a20'], 200 * u, 0.7, { up: true, spread: 1.6 });
    for (let i = 0; i < 14; i++) { const dir = i % 2 ? 1 : -1; fx.parts.push({ x, y: 0.2, vx: dir * (60 + Math.random() * 120) * u, vy: Math.random() * 20 * u, g: 0, life: 0.8, max: 0.8, size: 5 + Math.floor(Math.random() * 4), color: '#e8e0d0', kind: 'puff' }); }
    sfxText('콰앙!', x, L.HERO_M * 2, 'big');
    sfx.blast(); buzz([60, 30, 80]);
  } else {
    burst(x, 0, 10 + Math.round(20 * f), ['#e8e0d0', '#c8bca8', col], (40 + 60 * f) * u, 0.5, { up: true, spread: 3, g: 120 * u, size: 2 });
    ring(x, 0, 3 * u, (40 + 60 * f) * u, '#ffffff', 2, 0.35, true);
    cam.shake = Math.max(cam.shake, 1 + 3 * f);
    sfx.jump(f);
    const g = jp.j.grade;
    if (!G.manual) { /* 자동 점프는 판정 문구 없음 */ }
    else if (g === 'great') judge('GREAT', 'great', '점프');
    else if (g === 'good') judge('GOOD', 'good', '점프');
    else { judge('MISS', 'miss', '점프'); sfx.miss(); }
  }
}
function releaseApex() {
  const u = mpp();
  cam.focus = null;
  G.mega = true;
  flash('#fff2a0', 0.8); cam.shake = 8;
  ring(G.hx, G.hy, 4 * u, 220 * u, '#ffd23f', 4, 0.5);
  ring(G.hx, G.hy, 2 * u, 140 * u, '#ffffff', 2, 0.4);
  fx.rays.push({ x: G.hx, y: G.hy, life: 0.5, max: 0.5, color: '#ffd23f' });
  sfxText('하앗!', G.hx, G.hy + 20 * u, 'big');
  sfx.blast(); buzz(50);
  startDive();
}

function impact() {
  const jp = G.jump, apex = G.apex || 'none';
  const dmg = L.damage(jp.j, apex, G.combo, G.mult);
  G.combo = L.nextCombo(G.combo, jp.j, apex);
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  G.hp = Math.max(0, G.hp - dmg);
  const shown = dmg * G.info.region.hpUnit;
  const earned = L.hitCoins(G.info.index, dmg, G.info.maxHp);
  coinFrac += earned;
  const whole = Math.floor(coinFrac);
  if (whole > 0) { save.coins += whole; coinFrac -= whole; }
  save.hpLeft = G.hp > 0 ? G.hp : null;
  const m = dmg / L.BASE_DAMAGE, f = Math.min(1, m / 5);
  const top = targetTop(), crit = apex === 'perfect', t = G.info.target, u = mpp();
  G.freeze = 0.05 + 0.13 * f + (crit ? 0.1 : 0);
  cam.shake = 2 + 9 * f + (crit ? 4 : 0);
  flash(crit ? '#fff2a0' : '#ffffff', 0.2 + 0.45 * f + (crit ? 0.3 : 0));
  ring(0, top, 4 * u, (70 + 140 * f) * u, crit ? '#ffd23f' : '#ffffff', 3, 0.5, true);
  if (f > 0.35) ring(0, top, 2 * u, (50 + 90 * f) * u, '#ffffff', 2, 0.4, true);
  burst(0, top, 14 + Math.round(40 * f), [t.color, t.roof, shade(t.color, -0.3)], (60 + 120 * f) * u, 0.9, { up: true, spread: 2.6, g: 260 * u, size: 2 });
  for (let i = 0; i < 8 + 10 * f; i++) {
    const dir = i % 2 ? 1 : -1;
    fx.parts.push({ x: dir * Math.random() * 6 * u, y: top + u, vx: dir * (30 + Math.random() * 60) * (0.6 + f) * u, vy: Math.random() * 10 * u, g: 0, life: 0.6 + Math.random() * 0.4, max: 1, size: 3 + Math.floor(Math.random() * 3), color: '#e8e0d0', kind: 'puff' });
  }
  if (crit) {
    fx.rays.push({ x: 0, y: top, life: 0.7, max: 0.7, color: '#ffd23f' });
    burst(0, top, 40, ['#ffd23f', '#fff6c0', '#ffffff'], 180 * u, 0.8, { up: true, spread: 3, g: 100 * u });
    ring(0, top, 6 * u, 300 * u, '#fff2a0', 5, 0.6, true);
    sfxText('쾅!!', 0, top + 30 * u, 'big');
  }
  popDamage(L.formatNumber(shown), crit || jp.j.grade === 'perfect', G.manual);
  sfx.impact(f); buzz(Math.round(20 + 50 * f));
  $('combo').textContent = G.combo >= 2 ? `PERFECT 콤보 ×${G.combo}  (+${Math.round((L.comboMult(G.combo) - 1) * 100)}%)` : '';
  // 반동으로 살짝 튀어 올랐다가 원래 자리 땅으로
  const newTop = targetTop();
  G.hop = { t: 0, T: L.BOUNCE_TIME, x0: 0, x1: G.info.x0, y0: newTop, y1: 0, b: G.info.sphere ? G.info.extra * 0.06 : newTop * 0.3 + 1.2 };
  hero.pose = 'jump'; hero.angle = 0; hero.sq = -0.45 - 0.2 * f; hero.sqv = 0;
  G.mega = false; G.hy = newTop; G.hx = 0;
  G.phase = G.hp <= 0 ? 'destroy' : 'bounce'; G.t = 0;
  if (G.hp <= 0) sfx.destroy();
  updateHud();
}

// ---------- 갱신 ----------
function update(rdt) {
  if (G.freeze > 0) { G.freeze -= rdt; return; }
  let dt = rdt;
  if (G.slow > 0) { G.slow -= rdt; dt = rdt * 0.3; }
  const s = G.info;

  if (G.hop) {
    const hp = G.hop;
    hp.t += dt;
    const k = Math.min(1, hp.t / hp.T);
    G.hx = hp.x0 + (hp.x1 - hp.x0) * k;
    G.hy = hp.y0 + (hp.y1 - hp.y0) * k + 4 * hp.b * k * (1 - k);
    hero.angle = -Math.PI * 2 * Math.min(1, k * 1.15);
    if (k >= 1) {
      G.hop = null; hero.angle = 0; hero.pose = 'stand'; hero.sq = -0.25; hero.sqv = 0; G.hy = hp.y1; G.hx = hp.x1;
      burst(G.hx, 0, 6, ['#e8e0d0', '#c8bca8'], 30 * mpp(), 0.4, { up: true, spread: 3, g: 100 * mpp(), size: 2 });
      sfx.land();
    }
  }

  switch (G.phase) {
    case 'intro':
      G.t += dt;
      if (G.t >= 1.1) { G.phase = 'ready'; G.needleT = 0; G.needlePhase = 0; G.autoT = 0; judge('GO!', 'go'); }
      break;
    case 'ready':
      if (G.aim) {
        G.needleT += dt;
        G.aimIdle += dt;
        if (G.aimIdle >= AIM_IDLE) { G.aim = false; G.autoT = 0; }
      } else {
        G.autoT += dt;
        if (G.autoT >= L.autoDelay(save, G.char)) startJump(true);
      }
      break;
    case 'crouch':
      G.t += dt;
      if (G.t >= 0.07) launch();
      break;
    case 'charge': {
      G.t += rdt;
      const k = Math.min(1, G.t / G.charge.dur), u = mpp();
      G.crack = k;
      hero.sq = -0.32 + (Math.random() - 0.5) * 0.08; hero.sqv = 0;
      cam.shake = 0.6 + 2.2 * k;
      for (let i = 0; i < 3; i++) fx.parts.push({ x: G.hx + (Math.random() - 0.5) * 16 * u, y: G.hy + Math.random() * 6 * u, vx: (Math.random() - 0.5) * 6 * u, vy: (30 + Math.random() * 50) * u, g: 0, life: 0.35 + Math.random() * 0.2, max: 0.55, size: 2 + Math.floor(Math.random() * 2), color: ['#ffd23f', '#fff6c0', '#7dff8a', '#ffffff'][Math.floor(Math.random() * 4)], kind: 'flame' });
      if (Math.random() < 0.5) fx.parts.push({ x: G.hx + (Math.random() - 0.5) * 50 * u, y: 0.1, vx: 0, vy: (8 + Math.random() * 18) * u, g: 0, life: 0.9, max: 0.9, size: 2 + Math.floor(Math.random() * 2), color: ['#8a7a6a', '#a89a88', '#6a5a4a'][Math.floor(Math.random() * 3)], kind: 'sq' });
      if (k >= 1) { G.charge = null; G.crack = 0; launch(); }
      break;
    }
    case 'air': {
      const a = G.arc;
      a.t += dt;
      const u = a.t / a.T;
      G.hy = L.arcY(a.t, a.T, a.y0, a.apex, a.end);
      G.hx = u < 0.5 ? a.xs + (a.xe - a.xs) * (1 - (1 - u * 2) ** 2) : a.xe;
      G.peak = Math.max(G.peak, G.hy);
      hero.pose = 'jump';
      if (u < 0.5 && !G.doubled) {
        const spins = G.jump.frac >= 0.99 ? 2 : G.jump.frac >= 0.55 ? 1 : 0;
        const k = Math.min(1, u / 0.42);
        hero.angle = spins * Math.PI * 2 * (1 - (1 - k) ** 3);
      } else if (u < 0.5) hero.angle = Math.PI * 2 * Math.min(1, u * 2.4);
      else hero.angle = 0;
      if (G.mega && Math.random() < 0.8) {
        const m = mpp();
        fx.parts.push({ x: G.hx + (Math.random() - 0.5) * 6 * m, y: G.hy, vx: 0, vy: 0, g: 0, life: 0.35, max: 0.35, size: 3, color: ['#ffd23f', '#fff6c0', '#ff9a20'][Math.floor(Math.random() * 3)], kind: 'flame' });
      }
      if (a.t >= a.T) { G.apex = 'none'; G.hy = a.end; impact(); }
      break;
    }
    case 'apexCharge': {
      G.t += rdt;
      const k = Math.min(1, G.t / G.charge.dur), u = mpp();
      hero.angle += rdt * 26;
      cam.shake = 0.5 + 1.5 * k;
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * Math.PI * 2, d = (30 + Math.random() * 25) * u;
        fx.parts.push({ x: G.hx + Math.cos(a) * d, y: G.hy + Math.sin(a) * d, vx: -Math.cos(a) * d / 0.3, vy: -Math.sin(a) * d / 0.3, g: 0, life: 0.3, max: 0.3, size: 2, color: ['#ffd23f', '#ffffff', '#7df0ff'][i], kind: 'sq' });
      }
      if (Math.random() < 0.15) ring(G.hx, G.hy, 50 * u, -140 * u, '#ffd23f', 2, 0.3);
      if (k >= 1) { G.charge = null; releaseApex(); }
      break;
    }
    case 'dive': {
      G.diveT += dt;
      const k = Math.min(1, G.diveT / G.diveD);
      const top = targetTop();
      G.hy = G.diveFrom + (top - G.diveFrom) * k * k;
      G.hx = G.diveX * (1 - k);
      if (G.mega || G.diveFrom - top > G.info.extra * 0.4) {
        const u = mpp();
        for (let i = 0; i < (G.mega ? 5 : 3); i++) fx.parts.push({ x: G.hx + (Math.random() - 0.5) * (G.mega ? 14 : 8) * u, y: G.hy + 4 * u, vx: (Math.random() - 0.5) * 20 * u, vy: Math.random() * 30 * u, g: 0, life: 0.25 + Math.random() * 0.2, max: 0.45, size: 2 + Math.floor(Math.random() * 3), color: (G.mega ? ['#ffffff', '#fff6c0', '#ffd23f', '#ff9a20'] : ['#fff6c0', '#ffd23f', '#ff8a20', '#e04020'])[i % 4], kind: 'flame' });
      }
      if (k >= 1) { G.hy = top; impact(); }
      break;
    }
    case 'bounce':
      if (!G.hop) { G.phase = 'ready'; G.needleT = 0; G.needlePhase = Math.random() < 0.5 ? 0 : 0.5; G.autoT = 0; }
      break;
    case 'destroy': {
      G.t += dt;
      if (s.sphere) {
        if (!G.exploded) {
          G.exploded = true;
          const u = mpp();
          burst(0, -sphereDepth(s.target), 110, [s.target.color, s.target.roof, '#ffd23f', '#ff7a20'], 240 * u, 1.6, { size: 3 });
          ring(0, -sphereDepth(s.target), 10 * u, 300 * u, '#ffd23f', 4, 1);
          ring(0, -sphereDepth(s.target), 10 * u, 200 * u, '#ffffff', 3, 0.8);
          flash('#ffffff', 1); cam.shake = 14;
        }
        G.collapse = 1;
      } else {
        G.collapse = Math.min(1, G.t / 1.1);
        cam.shake = Math.max(cam.shake, 4 * (1 - G.collapse));
        if (Math.random() < 0.6) {
          const u = mpp();
          fx.parts.push({ x: (Math.random() - 0.5) * s.target.w, y: Math.random() * 6 * u, vx: (Math.random() - 0.5) * 40 * u, vy: (10 + Math.random() * 20) * u, g: 0, life: 1, max: 1, size: 4 + Math.floor(Math.random() * 4), color: '#d8d0c0', kind: 'puff' });
        }
      }
      if (G.t >= 1.7 && !G.hop) { G.phase = 'done'; showClear(); }
      break;
    }
    case 'done': {
      G.t += dt;
      if (G.next != null && G.t >= 1.7 + 1.6) startStage(G.next);
      break;
    }
  }
  hero.sqv += (-90 * hero.sq - 9 * hero.sqv) * rdt;
  hero.sq += hero.sqv * rdt;
  updateFx(dt);
  updateHud();
}

function updateFx(dt) {
  for (const p of fx.parts) { p.life -= dt; p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'puff') { p.vx *= 0.94; p.vy *= 0.94; } }
  fx.parts = fx.parts.filter((p) => p.life > 0);
  if (fx.parts.length > 900) fx.parts.splice(0, fx.parts.length - 900);
  for (const r of fx.rings) { r.life -= dt; r.r = Math.max(0, r.r + r.vr * dt * (r.vr > 0 ? r.life / r.max + 0.3 : 1)); }
  fx.rings = fx.rings.filter((r) => r.life > 0);
  for (const r of fx.rays) r.life -= dt;
  fx.rays = fx.rays.filter((r) => r.life > 0);
}

function updateCamera(rdt) {
  const b = G.base;
  let tx = b.cx, ty = b.cy, tv = b.view;
  if (cam.focus) { tx = cam.focus.x; tv = cam.focus.view; ty = cam.focus.y - tv * 0.28; }
  else {
    const heroTop = G.hy + L.HERO_M * 1.4 - b.cy;
    tv = Math.max(b.view, heroTop * 1.12);
  }
  const rate = cam.focus ? 9 : tv > cam.view ? 24 : 5;
  cam.view = Math.exp(Math.log(cam.view) + (Math.log(tv) - Math.log(cam.view)) * Math.min(1, rate * rdt));
  cam.cx += (tx - cam.cx) * Math.min(1, (cam.focus ? 9 : 7) * rdt);
  cam.cy += (ty - cam.cy) * Math.min(1, (cam.focus ? 9 : 7) * rdt);
  if (!cam.focus) {   // 주인공이 화면 위로 나가지 않게
    const need = (G.hy + L.HERO_M * 1.4 - cam.cy) * 1.04;
    if (need > cam.view) cam.view = need;
  }
  cam.shake *= Math.pow(0.0008, rdt);
  cam.sx = (Math.random() * 2 - 1) * cam.shake;
  cam.sy = (Math.random() * 2 - 1) * cam.shake;
  fx.flash *= Math.pow(0.002, rdt);
}

// ---------- 그리기 ----------
function render(rdt) {
  const info = G.info, r = info.regionIndex, sky = SKY[r], t = info.target;
  const ppm = AREA() / cam.view;
  const X = (x) => Math.round(W / 2 + (x - cam.cx) * ppm + cam.sx);
  const Y = (y) => Math.round(GY - (y - cam.cy) * ppm + cam.sy);
  const dec = decor();
  const space = r >= 3;

  // 하늘: 화면 꼭대기 고도(m)로 색과 별을 정한다
  const topM = cam.cy + GY / ppm;
  const lg = Math.log10(Math.max(1, topM));
  const dark = space ? 1 : Math.max(0, Math.min(1, (lg - 4) / 0.9));
  const grad = ctx.createLinearGradient(0, 0, 0, GY);
  grad.addColorStop(0, mixHex(sky.high, '#05040e', space ? 0 : dark));
  grad.addColorStop(1, mixHex(sky.low, '#0a0a24', space ? 0 : dark * 0.9));
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (dark > 0.05) {
    const tw = performance.now() / 500;
    for (const s of dec.stars) {
      const a = dark * (0.4 + 0.6 * s.b) * (0.75 + 0.25 * Math.sin(tw + s.x));
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(Math.round(s.x), Math.round(s.y), s.b > 0.85 ? 2 : 1, s.b > 0.85 ? 2 : 1);
    }
  }
  if (r === 3) {
    ctx.fillStyle = 'rgba(140,80,200,0.18)'; ctx.beginPath(); ctx.ellipse(40, 90, 70, 26, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,120,0.25)'; ctx.beginPath(); ctx.arc(W - 24, 70, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(W - 24, 70, 9, 0, Math.PI * 2); ctx.fill();
  } else if (r === 4) {
    for (const [x, y, rr, col] of [[30, 80, 60, 'rgba(120,60,200,0.16)'], [150, 140, 50, 'rgba(40,140,220,0.14)'], [90, 50, 40, 'rgba(220,80,160,0.12)']]) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rr, rr * 0.45, -0.3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 하늘의 구름·새·바위
  for (const c of dec.sky) {
    const x = X(c.x), y = Y(c.alt);
    if (c.kind === 'cloud') {
      const w = c.w * ppm;
      if (w < 2 || y < -w || y > GY + w || x < -w || x > W + w) continue;
      ctx.fillStyle = mixHex('#ffffff', '#c8d8e8', c.shade * 0.6 + dark * 0.4);
      if (c.high) ctx.fillRect(x - w / 2, y, w, Math.max(1, w * 0.04));
      else {
        ctx.fillRect(x - w / 2, y - w * 0.12, w, w * 0.24);
        ctx.fillRect(x - w * 0.3, y - w * 0.24, w * 0.5, w * 0.16);
        ctx.fillStyle = 'rgba(160,180,210,0.6)'; ctx.fillRect(x - w / 2, y + w * 0.08, w, w * 0.05);
      }
    } else if (c.kind === 'bird') {
      if (y < 0 || y > GY || x < 0 || x > W) continue;
      const f = Math.floor(performance.now() / 180 + c.ph) % 2;
      ctx.fillStyle = INK; ctx.fillRect(x - 2, y - f, 2, 1); ctx.fillRect(x + 1, y - f, 2, 1); ctx.fillRect(x, y, 1, 1);
    } else {
      const s = Math.max(1, c.size * ppm);
      if (y < -s || y > GY + s) continue;
      ctx.fillStyle = c.c; ctx.fillRect(x - s / 2, y - s / 2, s, s);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x - s / 2, y - s / 2, Math.max(1, s / 3), Math.max(1, s / 3));
    }
  }

  // 땅과 주변 풍경
  if (!info.sphere) {
    for (const it of dec.items.filter((i) => i.back)) drawScaled(it, X(it.x), Y(0), ppm, 0.85);
    ctx.fillStyle = sky.dirt; ctx.fillRect(0, Y(0), W, H);
    ctx.fillStyle = sky.ground; ctx.fillRect(0, Y(0), W, Math.max(2, Math.round(0.3 * ppm)));
    if (r === 1 && ppm > 2) { ctx.fillStyle = '#e8e8a0'; for (let x = -400; x < 400; x += 8) ctx.fillRect(X(x), Y(0) + Math.max(3, 1.5 * ppm), Math.max(1, 3 * ppm), 1); }
    for (const it of dec.items.filter((i) => !i.back)) drawScaled(it, X(it.x), Y(0), ppm, 1);
    if (G.crater > 0) {   // 퍼펙트 도약 자국
      ctx.fillStyle = 'rgba(40,25,20,0.6)';
      const cw = Math.max(4, L.HERO_M * 2.4 * ppm);
      ctx.beginPath(); ctx.ellipse(X(info.x0), Y(0) + 1, cw / 2, Math.max(2, cw * 0.14), 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 부술 대상
  const tg = targetImage();
  const k = ppm / tg.nppm;
  if (info.sphere) {
    if (!G.exploded) {
      const cx = X(0), cy = Y(-sphereDepth(t));
      if (t.kind === 'star') {
        const rr = t.h / 2 * ppm * 1.5, gl = ctx.createRadialGradient(cx, cy, rr * 0.5, cx, cy, rr);
        gl.addColorStop(0, t.roof + 'aa'); gl.addColorStop(1, t.roof + '00');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.drawImage(tg.c, Math.round(cx - tg.cx * k), Math.round(cy - tg.cy * k), Math.round(tg.c.width * k), Math.round(tg.c.height * k));
    }
  } else {
    const w = tg.c.width * k, h = tg.c.height * k, sink = G.collapse * t.h * ppm * 0.65;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, Y(0)); ctx.clip();
    ctx.drawImage(tg.c, Math.round(X(0) - w / 2), Math.round(Y(0) - h + sink), Math.round(w), Math.round(h));
    ctx.restore();
    if (G.collapse > 0) {
      ctx.fillStyle = shade(t.color, -0.3);
      const rw = t.w * ppm * (0.6 + 0.5 * G.collapse);
      for (let i = 0; i < 7; i++) { const hh = Math.round((1 + (i * 37 % 5)) * Math.max(1, t.h * ppm / 40) * G.collapse) + 1; ctx.fillRect(Math.round(X(0) - rw / 2 + i * rw / 7), Y(0) - hh, Math.ceil(rw / 7), hh); }
    }
  }

  const hs = toScreen(G.hx, G.hy + L.HERO_M * 0.5);
  const charging = G.phase === 'charge' || G.phase === 'apexCharge';
  // 기 모으기: 땅 갈라짐, 어둠, 집중선
  if (G.crack > 0 && !info.sphere) {
    ctx.strokeStyle = INK; ctx.lineWidth = 1;
    const cr = seeded(7);
    for (let i = 0; i < 6; i++) {
      let x = X(G.hx), y = Y(0); const dir = i < 3 ? -1 : 1, len = G.crack * (18 + cr() * 22);
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let s = 0; s < 5; s++) { x += dir * len / 5; y += (cr() * 2 - 0.3) * 3 + 1; ctx.lineTo(Math.round(x), Math.round(y)); }
      ctx.stroke();
    }
  }
  if (charging) {
    const k2 = Math.min(1, G.t / 0.15);
    ctx.fillStyle = `rgba(10,6,20,${0.55 * k2})`; ctx.fillRect(0, 0, W, H);
    focusLines(hs[0], hs[1] + cam.sy);
  }

  // 빛줄기
  for (const ry of fx.rays) {
    const a = ry.life / ry.max;
    ctx.save(); ctx.translate(X(ry.x), Y(ry.y)); ctx.rotate(performance.now() / 600);
    ctx.fillStyle = ry.color; ctx.globalAlpha = a * 0.32;
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(170 * (0.5 + 0.5 * a), -6); ctx.lineTo(170 * (0.5 + 0.5 * a), 6); ctx.fill(); }
    ctx.restore();
  }

  // 잔상
  const airborne = ['air', 'dive'].includes(G.phase) || G.hop;
  const vel = airborne ? Math.hypot(G.hy - fx.lastHy, 0) / Math.max(rdt, 0.001) * ppm : 0;
  fx.lastHy = G.hy;
  if (airborne && vel > 40) fx.trail.push({ x: G.hx, y: G.hy, angle: hero.angle, pose: hero.pose, life: 0.18 });
  for (const tr of fx.trail) tr.life -= rdt;
  fx.trail = fx.trail.filter((q) => q.life > 0).slice(-8);
  const gold = G.mega || (G.jump && (G.jump.j.grade === 'perfect' || G.apex === 'perfect'));
  for (const tr of fx.trail) {
    ctx.globalAlpha = tr.life / 0.18 * 0.45;
    drawHero(tr.pose, X(tr.x), Y(tr.y), ppm, tr.angle, 0, gold ? '#ffd23f' : '#ffffff');
  }
  ctx.globalAlpha = 1;

  // 내려찍기 불꽃 앞머리
  if (G.phase === 'dive' && (G.mega || G.diveFrom - targetTop() > info.extra * 0.4)) {
    const s = Math.max(0.6, heroScale(ppm)) * (G.mega ? 1.5 : 1);
    ctx.fillStyle = G.mega ? 'rgba(255,230,120,0.6)' : 'rgba(255,140,40,0.55)'; ctx.beginPath(); ctx.ellipse(X(G.hx), Y(G.hy) + 2, 10 * s, 6 * s, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,250,220,0.9)'; ctx.beginPath(); ctx.ellipse(X(G.hx), Y(G.hy) + 1, 6 * s, 3 * s, 0, 0, Math.PI); ctx.fill();
  }

  // 주인공 (작아지면 점 + 위치 표시)
  if (charging) {
    const pulse = 1.25 + 0.12 * Math.sin(performance.now() / 40);
    ctx.globalAlpha = 0.6;
    drawHero(hero.pose, X(G.hx), Y(G.hy) + 2, ppm, hero.angle, hero.sq, '#ffd23f', pulse);
    ctx.globalAlpha = 1;
  }
  drawHero(hero.pose, X(G.hx), Y(G.hy), ppm, hero.angle, hero.sq);
  if (charging && Math.floor(performance.now() / 60) % 2) {
    ctx.globalAlpha = 0.5; drawHero(hero.pose, X(G.hx), Y(G.hy), ppm, hero.angle, hero.sq, '#ffffff'); ctx.globalAlpha = 1;
  }

  // 알갱이
  for (const p of fx.parts) {
    const a = Math.min(1, p.life / p.max * 1.5);
    ctx.globalAlpha = p.kind === 'puff' ? a * 0.7 : a;
    ctx.fillStyle = p.color;
    const s = p.kind === 'puff' ? p.size * (1.6 - a * 0.6) : p.size;
    ctx.fillRect(Math.round(X(p.x) - s / 2), Math.round(Y(p.y) - s / 2), Math.ceil(s), Math.ceil(s));
  }
  ctx.globalAlpha = 1;
  for (const rg of fx.rings) {
    ctx.globalAlpha = Math.min(1, rg.life / rg.max * 1.3);
    ctx.strokeStyle = rg.color; ctx.lineWidth = rg.width;
    ctx.beginPath();
    const rr = rg.r * ppm;
    if (rg.flat) ctx.ellipse(X(rg.x), Y(rg.y), rr, rr * 0.28, 0, 0, Math.PI * 2);
    else ctx.arc(X(rg.x), Y(rg.y), rr, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 속도선
  if (vel > 60 && !charging) {
    const n = Math.min(20, Math.floor(vel / 25));
    const len = Math.min(120, vel * 0.12);
    ctx.fillStyle = G.phase === 'dive' ? 'rgba(255,240,200,0.7)' : 'rgba(255,255,255,0.6)';
    for (let i = 0; i < n; i++) {
      const x = Math.random() * W, y = Math.random() * (GY + 20) - len / 2;
      if (Math.abs(x - X(G.hx)) < 12) continue;
      ctx.fillRect(Math.round(x), Math.round(y), 1, Math.round(len * (0.4 + Math.random() * 0.6)));
    }
  }

  drawBar();
  drawGauge();
  if (fx.flash > 0.01) { ctx.globalAlpha = Math.min(1, fx.flash); ctx.fillStyle = fx.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

function focusLines(cx, cy) {
  ctx.save(); ctx.translate(cx, cy);
  for (let i = 0; i < 46; i++) {
    const a = Math.random() * Math.PI * 2, inner = 26 + Math.random() * 18, w = 0.012 + Math.random() * 0.02;
    ctx.fillStyle = i % 3 ? 'rgba(255,255,255,0.75)' : 'rgba(255,220,90,0.8)';
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
    ctx.lineTo(Math.cos(a - w) * 260, Math.sin(a - w) * 260);
    ctx.lineTo(Math.cos(a + w) * 260, Math.sin(a + w) * 260);
    ctx.fill();
  }
  ctx.restore();
}
function drawScaled(it, x, groundY, ppm, alpha) {
  const k = ppm / it.ppm, w = it.c.width * k, h = it.c.height * k;
  if (w < 1 || x + w / 2 < 0 || x - w / 2 > W) return;
  ctx.globalAlpha = alpha;
  ctx.drawImage(it.c, Math.round(x - w / 2), Math.round(groundY - h), Math.round(w), Math.round(h));
  ctx.globalAlpha = 1;
}
const heroScale = (ppm) => (L.HERO_M * ppm) / 16;
function drawHero(pose, x, footY, ppm, angle, sq, tint = null, extra = 1) {
  const k = heroScale(ppm) * extra;
  if (k < 0.22) {
    // 점이 된 주인공: 반짝이는 점과 위치 화살표
    if (tint) { ctx.fillStyle = tint; ctx.fillRect(x - 1, footY - 3, 3, 3); return; }
    const pal = CHAR_LOOK[G.char.id] || CHAR_LOOK.punch;
    const pulse = Math.floor(performance.now() / 250) % 2;
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - 3, footY - 6, 7, 7);
    ctx.fillStyle = INK; ctx.fillRect(x - 2, footY - 5, 5, 5);
    ctx.fillStyle = pal.r; ctx.fillRect(x - 1, footY - 4, 3, 3);
    if (!['air', 'dive', 'apexCharge'].includes(G.phase)) {
      ctx.fillStyle = pulse ? '#ffffff' : '#ffd23f';
      ctx.beginPath(); ctx.moveTo(x - 3, footY - 13); ctx.lineTo(x + 4, footY - 13); ctx.lineTo(x + 0.5, footY - 8); ctx.fill();
    }
    return;
  }
  const img = heroSprite(pose, G.char.id, tint);
  const sy = (1 + sq) * k, sx = (1 - sq * 0.6) * k;
  const w = img.width, h = img.height;
  ctx.save();
  ctx.translate(x, footY - (h / 2) * k);
  if (angle) ctx.rotate(angle);
  ctx.translate(0, (h / 2) * k);
  ctx.scale(sx, sy);
  ctx.drawImage(img, -w / 2, -h);
  ctx.restore();
}

function drawBar() {
  if (!G.aim) return;   // 자동일 때는 게이지를 숨긴다
  const s = G.info, bw = 150, x0 = Math.round((W - bw) / 2), y = BAR_Y, h = 10;
  const active = G.phase === 'ready';
  const p = active ? L.needlePos(G.needleT, s.needleSpeed, G.needlePhase) : G.phase === 'intro' || G.phase === 'idle' ? -1 : G.lastP;
  R(ctx, x0 - 4, y - 4, bw + 8, h + 8, INK);
  R(ctx, x0 - 2, y - 2, bw + 4, h + 4, '#f6ecd0');
  const zone = (z, col) => R(ctx, W / 2 - Math.min(1, z) * bw / 2, y, Math.min(1, z) * bw, h, col);
  zone(1, '#d05050'); zone(L.GOOD_ZONE * s.zone, '#f0c040'); zone(L.GREAT_ZONE * s.zone, '#6ad06a');
  const pw = Math.max(2, L.perfectZone(s.needleSpeed, s.zone) * bw);
  R(ctx, W / 2 - pw / 2, y, pw, h, '#fff6b0');
  R(ctx, W / 2 - pw / 2 - 1, y, 1, h, '#b08000'); R(ctx, W / 2 + pw / 2, y, 1, h, '#b08000');
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.moveTo(W / 2 - 4, y - 8); ctx.lineTo(W / 2 + 4, y - 8); ctx.lineTo(W / 2, y - 4); ctx.fill();
  if (!active) { ctx.fillStyle = 'rgba(43,38,56,0.45)'; ctx.fillRect(x0, y, bw, h); }
  const nx = Math.round(W / 2 + p * bw / 2);
  R(ctx, nx - 2, y - 5, 4, h + 10, INK);
  R(ctx, nx - 1, y - 4, 2, h + 8, active ? '#ffffff' : '#c8c8d0');
}

function drawGauge() {
  const show = G.aim && G.manual && ['crouch', 'charge', 'air', 'apexCharge', 'dive', 'bounce'].includes(G.phase) && G.arc;
  const lab = $('hLabel');
  if (!show) { lab.hidden = true; return; }
  const gx = 6, gw = 9, gt = Math.round(H * 0.25), gb = GY - 10, gh = gb - gt;
  const a = G.arc, max = G.gaugeMax;
  R(ctx, gx - 2, gt - 2, gw + 4, gh + 4, INK);
  R(ctx, gx, gt, gw, gh, '#f6ecd0');
  const fill = Math.max(0, Math.min(1, G.hy / max));
  const fh = Math.round(fill * (gh - 2));
  const grd = ctx.createLinearGradient(0, gb, 0, gt);
  grd.addColorStop(0, '#4ab0ff'); grd.addColorStop(0.6, '#b060ff'); grd.addColorStop(1, '#ffd23f');
  ctx.fillStyle = grd; ctx.fillRect(gx + 1, gb - 1 - fh, gw - 2, fh);
  const my = Math.round(gb - 1 - Math.min(1, a.apex / max) * (gh - 2));
  const inWin = G.phase === 'air' && Math.abs(a.t - a.T / 2) <= L.APEX_GREAT;
  const blink = inWin && Math.floor(performance.now() / 60) % 2;
  R(ctx, gx - 3, my - 1, gw + 6, 3, blink ? '#ffffff' : '#ff4040');
  ctx.fillStyle = blink ? '#ffffff' : '#ff4040';
  ctx.beginPath(); ctx.moveTo(gx + gw + 3, my); ctx.lineTo(gx + gw + 8, my - 4); ctx.lineTo(gx + gw + 8, my + 4); ctx.fill();
  lab.hidden = false;
  lab.textContent = G.phase === 'bounce' ? `최고 ${L.formatMeters(G.peak)}` : L.formatMeters(Math.max(0, G.hy));
  lab.style.top = `${(Math.max(gt, gb - 1 - fh) - 6) * cssScale}px`;
  lab.style.left = `${(gx + gw + 10) * cssScale}px`;
  lab.style.color = inWin ? '#ffd23f' : '#ffffff';
}

// ---------- HUD ----------
function updateHud() {
  if (!G) return;
  const s = G.info;
  // 큰 숫자 = 남은 체력, 위 막대 = 체력
  $('score').textContent = L.formatNumber(Math.ceil(G.hp) * s.region.hpUnit);
  $('stageLine').textContent = `${s.label}${s.boss ? ' 보스' : ''} · ${s.target.name}`;
  const hf = G.hp / s.maxHp, hpEl = $('timerFill');
  hpEl.style.width = `${hf * 100}%`;
  hpEl.className = hf < 0.25 ? 'low' : hf < 0.55 ? 'mid' : '';
  $('hudCoins').innerHTML = `<span class="coin"></span>${L.formatNumber(save.coins)}`;
  $('autoFill').style.width = G.phase === 'ready' && !G.aim ? `${Math.min(1, G.autoT / L.autoDelay(save, G.char)) * 100}%` : '0';
  document.querySelector('.autoTag').style.visibility = G.aim ? 'hidden' : 'visible';
  document.querySelector('.autoBar').style.visibility = G.aim ? 'hidden' : 'visible';
  const cheapest = Math.min(...L.UPGRADES.map((u) => L.upgradeCost(u.id, save.upgrades[u.id] || 0)));
  $('upBtnGame').classList.toggle('can', save.coins >= cheapest);
  // 버튼 하나: 땅에서는 점프, 뛰는 순간 찍기로 바뀜(깡총이는 공중에서 먼저 2단 점프)
  const btn = $('btn');
  const mine = G.aim && G.manual;
  const canDouble = mine && G.char.double && !G.doubled && ['crouch', 'charge', 'air'].includes(G.phase);
  const smashing = mine && !canDouble && ['crouch', 'charge', 'air', 'apexCharge', 'dive'].includes(G.phase);
  btn.classList.toggle('smash', smashing);
  $('jumpWord').textContent = canDouble ? '2단 점프' : '점프';
  btn.setAttribute('aria-label', smashing ? '내려찍기' : canDouble ? '2단 점프' : '점프');
  const busy = ['intro', 'charge', 'apexCharge', 'destroy', 'done'].includes(G.phase);
  const live = !busy && (!G.aim || G.phase === 'ready' || (G.phase === 'air' && !G.smashed && G.manual));
  btn.classList.toggle('glow', live);
  btn.classList.toggle('dim', !(live || (mine && G.phase === 'crouch')));
  const hint = $('hint');
  if (mode === 'play' && !save.cleared[0] && s.index === 0) {
    if (!G.aim) { hint.hidden = false; hint.textContent = '가만히 둬도 뛰지만, 눌러서 직접 하면 훨씬 세요!'; }
    else if (G.phase === 'ready') { hint.hidden = false; hint.textContent = '바늘이 정중앙에 올 때 누르세요!'; }
    else if (G.phase === 'air' && !G.smashed && G.manual) { hint.hidden = false; hint.textContent = '최고점(빨간 선)에서 한 번 더!'; }
    else hint.hidden = true;
  } else if (mode === 'play' && mine && G.char.double && G.phase === 'air' && !G.doubled && !save.cleared['bunnyHint']) {
    hint.hidden = false; hint.textContent = '최고점에서 누르면 2단 점프, 한 번 더 누르면 찍기!';
  } else hint.hidden = true;
}

// ---------- 화면 전환 ----------
function showScreen(id) {
  for (const s of ['home', 'upgrades', 'shop', 'modal']) $(s).hidden = s !== id;
}
function modal(html, buttons) {
  const card = $('modalCard');
  card.innerHTML = html;
  for (const [label, cls, fn] of buttons) {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || ''); b.innerHTML = label;
    b.addEventListener('click', () => { sfx.tick(); fn(); });
    card.appendChild(b);
  }
  showScreen('modal');
}
function goHome() {
  mode = 'home'; paused = false;
  $('hud').hidden = true; $('panel').hidden = true; $('hint').hidden = true; $('hLabel').hidden = true;
  $('judgeBox').innerHTML = ''; $('combo').textContent = ''; $('banner').innerHTML = '';
  newGame(save.unlocked);
  G.phase = 'idle';
  const s = L.stageInfo(save.unlocked);
  const left = Math.ceil((save.hpLeft ?? s.maxHp) / s.maxHp * 100);
  $('startBtn').innerHTML = save.done ? '우주 정복 완료!<small>다시 은하를 부수러 가기</small>' : `${save.cleared[0] ? '이어하기' : '시작하기'}<small>${s.label} · ${s.target.name} (체력 ${left}%)</small>`;
  const n = Object.keys(save.cleared).filter((k) => /^\d+$/.test(k)).length;
  $('bestLine').textContent = n ? `부순 곳 ${n} / ${L.STAGE_COUNT}` : '';
  $('homeCoins').textContent = save.coins.toLocaleString('en-US');
  showScreen('home');
}
function showUpgrades() {
  $('upCoins').innerHTML = `<span class="coin"></span>${L.formatNumber(save.coins)}`;
  const list = $('upList');
  list.innerHTML = '';
  const now = {
    power: () => `피해 ×${L.formatNumber(L.powerMult(save) * 100) / 100 >= 100 ? L.formatNumber(L.powerMult(save)) : L.powerMult(save).toFixed(2)}`,
    auto: () => `대기 ${L.autoDelay(save).toFixed(2)}초`,
    aim: () => `정확도 ${Math.round(L.autoAcc(save) * 100)}%`,
  };
  for (const u of L.UPGRADES) {
    const lv = save.upgrades[u.id] || 0, cost = L.upgradeCost(u.id, lv);
    const card = document.createElement('div'); card.className = 'upCard';
    card.innerHTML = `<div class="info"><b>${u.name} <small>Lv.${lv}${u.max < 999 ? ` / ${u.max}` : ''}</small></b><span>${u.desc}</span><span>지금: ${now[u.id]()}</span></div>`;
    const b = document.createElement('button'); b.className = 'btn main';
    if (cost === Infinity) { b.textContent = '최대'; b.disabled = true; }
    else { b.innerHTML = `<span class="coin"></span>${L.formatNumber(cost)}`; b.disabled = save.coins < cost; b.onclick = () => { if (L.buyUpgrade(save, u.id)) { persist(); sfx.coin(); showUpgrades(); } }; }
    card.appendChild(b); list.appendChild(card);
  }
  const note = document.createElement('div'); note.className = 'upNote ol2';
  note.innerHTML = `자동으로 초당 약 ${L.formatNumber(L.autoDps(save, curChar()))} 피해<br>코인은 때릴 때마다, 부술 때 한 번 더 받아요. 꺼 둔 동안(최대 8시간)도 자동으로 부숴요`;
  list.appendChild(note);

}
function showShop() {
  $('shopCoins').innerHTML = `<span class="coin"></span>${save.coins.toLocaleString('en-US')}`;
  const list = $('charList');
  list.innerHTML = '';
  for (const c of L.CHARACTERS) {
    const owned = save.owned.includes(c.id), on = save.char === c.id;
    const card = document.createElement('div');
    card.className = 'charCard' + (on ? ' on' : '');
    const pic = document.createElement('canvas');
    const img = heroSprite('stand', c.id);
    pic.width = 28; pic.height = 36;
    const pg = pic.getContext('2d'); pg.imageSmoothingEnabled = false;
    pg.drawImage(img, Math.round((28 - img.width * 2) / 2), 36 - img.height * 2 - 1, img.width * 2, img.height * 2);
    card.appendChild(pic);
    const info = document.createElement('div'); info.className = 'info';
    info.innerHTML = `<b>${c.name}</b><span>${c.desc}</span>`;
    card.appendChild(info);
    const b = document.createElement('button');
    b.className = 'btn' + (on ? '' : owned ? '' : ' main');
    if (on) { b.textContent = '사용 중'; b.disabled = true; }
    else if (owned) { b.textContent = '선택'; b.onclick = () => { L.selectChar(save, c.id); persist(); sfx.tick(); showShop(); }; }
    else {
      b.innerHTML = `<span class="coin"></span>${c.price.toLocaleString('en-US')}`;
      b.disabled = save.coins < c.price;
      b.onclick = () => { if (L.buyChar(save, c.id)) { persist(); sfx.coin(); showShop(); } };
    }
    card.appendChild(b);
    list.appendChild(card);
  }
  showScreen('shop');
}
// 부수면 코인을 받고 잠시 뒤 다음 대상으로 자동으로 넘어간다
function showClear() {
  const s = G.info;
  const coins = L.recordClear(save, s.index);
  if (G.char.double) save.cleared.bunnyHint = true;
  persist();
  sfx.coin();
  $('hint').hidden = true;
  if (s.index === L.STAGE_COUNT - 1) {
    modal('<h2>우주 정복!</h2><p>은하까지 부숴 버렸어요.<br>당신은 이제 우주 최강의 점퍼!</p>', [['다시 은하 부수기', 'main', () => startStage(s.index)], ['처음으로', '', goHome]]);
    return;
  }
  const next = L.stageInfo(s.index + 1);
  banner('파괴!', `${s.target.name}을(를) 부쉈어요 · <span class="coin"></span>+${L.formatNumber(coins)}${next.regionIndex !== s.regionIndex ? `<br>${s.region.name} 정복! 다음은 ${next.region.name}` : ''}`);
  G.next = s.index + 1;
}
function pause() {
  if (mode !== 'play' || paused || ['done', 'destroy'].includes(G.phase)) return;
  paused = true;
  modal('<h2>일시정지</h2>' + settingsHtml(), [
    ['계속하기', 'main', () => { paused = false; showScreen(null); }],
    ['처음으로', '', goHome],
  ]);
  bindSettings();
}
function settingsHtml() {
  return `<div class="setRow"><span>소리</span><button class="btn" id="setSound">${save.sound ? '켬' : '끔'}</button></div>
    <div class="setRow"><span>진동</span><button class="btn" id="setVib">${save.vibrate ? '켬' : '끔'}</button></div>`;
}
function bindSettings() {
  $('setSound').onclick = () => { save.sound = !save.sound; persist(); $('setSound').textContent = save.sound ? '켬' : '끔'; sfx.tick(); };
  $('setVib').onclick = () => { save.vibrate = !save.vibrate; persist(); $('setVib').textContent = save.vibrate ? '켬' : '끔'; buzz(20); };
}
function showSettings() {
  modal('<h2>환경설정</h2>' + settingsHtml(), [
    ['기록 지우기', 'red', () => modal('<h2>기록 지우기</h2><p>진행, 코인, 강화, 캐릭터가<br>모두 지워져요.</p>', [
      ['지우기', 'red', () => { Object.assign(save, L.defaultSave(), { sound: save.sound, vibrate: save.vibrate }); persist(); goHome(); }],
      ['취소', '', showSettings],
    ])],
    ['닫기', 'main', goHome],
  ]);
  bindSettings();
}

// ---------- 연결 ----------
const btn = $('btn');
btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.classList.add('press'); action(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, () => btn.classList.remove('press'));
btn.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('pointerdown', (e) => { if (mode === 'play') { e.preventDefault(); action(); } });
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'KeyJ', 'KeyK', 'KeyW', 'KeyS', 'Enter'].includes(e.code)) {
    if (mode === 'play' && $('modal').hidden) { e.preventDefault(); action(); }
  } else if (e.code === 'Escape' || e.code === 'KeyP') {
    if (paused) { paused = false; showScreen(null); } else pause();
  }
});
$('pauseBtn').addEventListener('click', pause);
$('startBtn').addEventListener('click', () => { sfx.tick(); startStage(save.unlocked); });
$('upBtn').addEventListener('click', () => { sfx.tick(); showUpgrades(); });
$('shopBtn').addEventListener('click', () => { sfx.tick(); showShop(); });
$('upBtnGame').addEventListener('click', () => { sfx.tick(); showUpgrades(); });
$('shopBtnGame').addEventListener('click', () => { sfx.tick(); showShop(); });
// 게임 중에 연 화면은 닫으면 게임으로(그동안에도 자동으로 계속 부순다)
const backTo = () => (mode === 'play' ? showScreen(null) : goHome());
$('upBack').addEventListener('click', backTo);
$('shopBack').addEventListener('click', () => {
  // 캐릭터를 바꾸면 능력이 바로 적용되도록 지금 대상을 이어서 다시 시작
  if (mode === 'play' && G && G.char.id !== save.char && !['destroy', 'done'].includes(G.phase)) { save.hpLeft = G.hp; startStage(G.info.index); }
  else backTo();
});
$('gear').addEventListener('click', showSettings);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G && mode === 'play') save.hpLeft = G.phase === 'done' ? null : G.hp; persist(); pause(); }
  else applyOffline();
});
// 자리를 비운 동안의 자동 진행
let coinFrac = 0;
function applyOffline() {
  const now = Date.now(), away = (now - (save.lastSeen || now)) / 1000;
  save.lastSeen = now;
  if (away < 30) return;
  if (G && mode === 'play' && !['destroy', 'done'].includes(G.phase)) save.hpLeft = G.hp;
  const r = L.offlineProgress(save, away, curChar());
  persist();
  if (r.coins <= 0 && r.stages <= 0) return;
  const h = Math.floor(r.seconds / 3600), m = Math.floor((r.seconds % 3600) / 60);
  const wasPlaying = mode === 'play';
  if (wasPlaying) { paused = true; }
  modal(`<h2>다녀오셨어요!</h2><p>자리를 비운 ${h ? `${h}시간 ` : ''}${m}분 동안<br>자동으로 ${r.stages ? `<b>${r.stages}곳</b>을 부수고` : '열심히 때리고'}<br><span class="coin"></span><b>${L.formatNumber(r.coins)}</b> 코인을 벌었어요</p>`, [
    ['좋아요', 'main', () => (wasPlaying ? startStage(save.unlocked) : goHome())],
  ]);
}
setInterval(() => {
  if (G && mode === 'play' && !['destroy', 'done'].includes(G.phase)) save.hpLeft = G.hp;
  save.lastSeen = Date.now();
  persist();
}, 3000);

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (mode === 'play' && !paused) update(rdt);
  else if (G && G.phase === 'idle') { hero.sqv += (-90 * hero.sq - 9 * hero.sqv) * rdt; hero.sq += hero.sqv * rdt; }
  updateCamera(rdt);
  render(rdt);
  requestAnimationFrame(frame);
}
resize();
goHome();
applyOffline();
requestAnimationFrame(frame);
window.smashReady = true;
window.__smash = { get G() { return G; }, action, startStage, cam, save };
</script>
</body>
</html>
