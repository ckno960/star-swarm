<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>정중앙 스매시</title>
<style>
  :root { --cream: #f6ecd0; --cream2: #ddc99c; --ink: #2b2638; --red: #e04848; --slate: #5a6582; --slate2: #454f69; --gold: #ffd23f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: #1a1824; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { display: flex; justify-content: center; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; overflow: hidden; background: #7fc8f0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .ol { text-shadow: -3px 0 var(--ink), 3px 0 var(--ink), 0 -3px var(--ink), 0 3px var(--ink), -2px -2px var(--ink), 2px 2px var(--ink), -2px 2px var(--ink), 2px -2px var(--ink), 0 6px 0 rgba(0, 0, 0, 0.35); }
  .ol2 { text-shadow: -2px 0 var(--ink), 2px 0 var(--ink), 0 -2px var(--ink), 0 2px var(--ink), -1px -1px var(--ink), 1px 1px var(--ink), -1px 1px var(--ink), 1px -1px var(--ink), 0 3px 0 rgba(0, 0, 0, 0.35); }

  /* 위쪽: 시간 막대 + 일시정지, 큰 점수 */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events: none; }
  .topRow { display: flex; gap: 8px; align-items: center; }
  #timer { flex: 1; height: 24px; background: var(--cream); border: 3px solid var(--ink); border-radius: 6px; padding: 3px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
  #timerFill { height: 100%; width: 100%; background: linear-gradient(#ffb04a, #e8602a); border-radius: 2px; }
  #timer.low #timerFill { background: linear-gradient(#ff6a6a, #c41c1c); animation: blink 0.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  .sqBtn {
    pointer-events: auto; width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: var(--cream); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    color: var(--ink); font: 900 16px system-ui, sans-serif;
  }
  .sqBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
  #score { margin-top: 6px; text-align: center; font: 900 54px/1.05 system-ui, sans-serif; letter-spacing: 1px; }
  #stageLine { margin-top: 2px; text-align: center; font: 800 14px system-ui, sans-serif; }
  #hpWrap { width: 62%; margin: 5px auto 0; height: 12px; background: var(--ink); border-radius: 4px; padding: 2px; }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(#7dff9b, #2fbf5a); border-radius: 2px; transition: width 0.15s; }
  #hpFill.mid { background: linear-gradient(#ffe066, #e0a020); }
  #hpFill.low { background: linear-gradient(#ff7a7a, #d02a2a); }
  #combo { margin-top: 6px; text-align: center; font: 900 15px system-ui, sans-serif; color: var(--gold); min-height: 18px; }

  /* 판정 문구 */
  #judgeBox { position: absolute; left: 0; right: 0; top: 40%; text-align: center; pointer-events: none; }
  .judge { display: inline-block; font: 900 36px/1 system-ui, sans-serif; letter-spacing: 2px; animation: pop 0.7s ease-out forwards; }
  .judge small { display: block; font-size: 14px; letter-spacing: 0; margin-bottom: 2px; }
  .judge.perfect {
    font-size: 46px; color: #fff3a0;
    background: linear-gradient(#fffbe0 10%, #ffd23f 50%, #ff9a20 90%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 0 var(--ink)) drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(0 0 12px rgba(255, 210, 63, 0.9));
    animation: popBig 0.9s ease-out forwards;
  }
  .judge.perfect small { -webkit-text-fill-color: #fff; color: #fff; }
  .judge.great { color: #7df0ff; }
  .judge.good { color: #ffffff; }
  .judge.miss { color: #b0b0c0; font-size: 30px; }
  .judge.go { color: var(--gold); font-size: 50px; }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; } 15% { transform: scale(1.25); opacity: 1; } 30% { transform: scale(1); }
    75% { transform: translateY(-6px); opacity: 1; } 100% { transform: translateY(-18px); opacity: 0; }
  }
  @keyframes popBig {
    0% { transform: scale(2.6) rotate(-8deg); opacity: 0; } 12% { transform: scale(0.85) rotate(2deg); opacity: 1; }
    22% { transform: scale(1.12) rotate(-1deg); } 34% { transform: scale(1) rotate(0); }
    80% { transform: translateY(-4px); opacity: 1; } 100% { transform: translateY(-20px) scale(1.05); opacity: 0; }
  }
  .dmg { position: absolute; transform: translate(-50%, -50%); font: 900 22px system-ui, sans-serif; pointer-events: none; animation: dmgUp 0.9s ease-out forwards; white-space: nowrap; }
  .dmg.crit { font-size: 32px; color: var(--gold); }
  @keyframes dmgUp { 0% { transform: translate(-50%, -20%) scale(0.5); opacity: 0; } 15% { transform: translate(-50%, -80%) scale(1.3); opacity: 1; } 30% { transform: translate(-50%, -90%) scale(1); } 100% { transform: translate(-50%, -260%); opacity: 0; } }
  #hLabel { position: absolute; left: 30px; font: 900 14px system-ui, sans-serif; pointer-events: none; white-space: nowrap; }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(24% + 64px); padding: 6px 12px; background: rgba(43, 38, 56, 0.85); border: 2px solid var(--cream); border-radius: 8px; font: 800 14px system-ui, sans-serif; pointer-events: none; white-space: nowrap; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateX(-50%) translateY(-4px); } }
  #banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; }
  #banner .t { font: 900 46px/1.1 system-ui, sans-serif; color: var(--gold); animation: popBig 2.4s ease-out forwards; }
  #banner .s { font: 800 17px/1.5 system-ui, sans-serif; margin-top: 6px; animation: pop 2.4s ease-out forwards; }

  /* 아래쪽: 큰 버튼 두 개 */
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 24%; min-height: 150px;
    background: var(--slate); border-top: 4px solid var(--ink); box-shadow: inset 0 4px 0 #74809e;
    display: flex; justify-content: space-between; align-items: center; padding: 0 20px env(safe-area-inset-bottom);
  }
  .bigBtn {
    height: 74%; aspect-ratio: 1 / 1; max-width: 42%; padding: 0;
    background: var(--cream); border: 4px solid var(--ink); border-radius: 20px;
    box-shadow: 0 7px 0 var(--ink), inset 0 -7px 0 var(--cream2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--ink); font: 900 15px system-ui, sans-serif; transition: opacity 0.15s, filter 0.15s;
    touch-action: none;
  }
  .bigBtn svg { width: 50%; height: auto; }
  .bigBtn.press { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink), inset 0 -3px 0 var(--cream2); }
  .bigBtn.dim { filter: saturate(0.4) brightness(0.85); }
  .bigBtn.glow { animation: glow 0.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 7px 0 var(--ink), inset 0 -7px 0 var(--cream2), 0 0 0 4px var(--gold); } }

  /* 화면(메인, 스테이지, 결과, 일시정지, 설정) */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .screen.dark { background: rgba(26, 22, 36, 0.72); }
  .card {
    width: 100%; max-width: 320px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: var(--cream); color: var(--ink); border: 4px solid var(--ink); border-radius: 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
  }
  .card h2 { margin: 0; font: 900 30px system-ui, sans-serif; }
  .card p { margin: 0; text-align: center; line-height: 1.5; font-size: 15px; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
  .card .stats b { text-align: right; }
  .btn {
    width: 100%; min-height: 50px; padding: 0 14px; background: var(--cream); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 4px 0 var(--ink); font: 900 17px system-ui, sans-serif;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.main { background: var(--gold); }
  .btn.red { background: #ffb0a8; }
  .btn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.75; }
  .card .btn { background: #fff8e4; }
  .card .btn.main { background: var(--gold); }
  #home { justify-content: space-between; padding: calc(28px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(26, 22, 36, 0.35), rgba(26, 22, 36, 0) 40%, rgba(26, 22, 36, 0) 55%, rgba(26, 22, 36, 0.55)); }
  #home h1 { margin: 22px 0 0; text-align: center; font: 900 46px/1.1 system-ui, sans-serif; color: var(--gold); letter-spacing: 2px; }
  #home .sub { margin-top: 8px; text-align: center; font: 800 15px/1.5 system-ui, sans-serif; }
  #home .menu { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
  #home .how { font: 700 13px/1.6 system-ui, sans-serif; text-align: center; background: rgba(43, 38, 56, 0.8); border-radius: 10px; padding: 8px 10px; }
  #home .best { text-align: center; font: 900 15px system-ui, sans-serif; }
  #gear { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; font-size: 20px; }
  #stages { justify-content: flex-start; padding-top: calc(16px + env(safe-area-inset-top)); background: var(--slate2); overflow-y: auto; }
  #stages .head { width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: space-between; }
  #stages h2 { margin: 0; font: 900 24px system-ui, sans-serif; }
  .region { width: 100%; max-width: 360px; }
  .region h3 { margin: 6px 0; font: 900 16px system-ui, sans-serif; }
  .region .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .region .row button {
    aspect-ratio: 1 / 1; padding: 0; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px;
    box-shadow: 0 3px 0 var(--ink); font: 900 18px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .region .row button small { font-size: 10px; color: #b08000; }
  .region .row button.boss { background: #ffd6c8; }
  .region .row button:disabled { opacity: 0.4; }
  .setRow { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: space-between; font: 800 16px system-ui, sans-serif; }
  .setRow .btn { width: 110px; min-height: 42px; }
  #reload { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="topRow">
      <div id="timer"><div id="timerFill"></div></div>
      <button id="pauseBtn" class="sqBtn" aria-label="일시정지">❚❚</button>
    </div>
    <div id="score" class="ol">0</div>
    <div id="stageLine" class="ol2"></div>
    <div id="hpWrap"><div id="hpFill"></div></div>
    <div id="combo" class="ol2"></div>
  </div>
  <div id="judgeBox"></div>
  <div id="banner"></div>
  <div id="hLabel" class="ol2" hidden></div>
  <div id="fx"></div>
  <div id="hint" hidden></div>

  <div id="panel" hidden>
    <button id="btnL" class="bigBtn" aria-label="점프">
      <svg viewBox="0 0 40 40"><path d="M20 5 L35 27 L26 27 L26 35 L14 35 L14 27 L5 27 Z" fill="#e04848" stroke="#2b2638" stroke-width="3" stroke-linejoin="round"/></svg>
      점프
    </button>
    <button id="btnR" class="bigBtn" aria-label="내려찍기">
      <svg viewBox="0 0 40 40"><path d="M14 4 L26 4 L26 16 L35 16 L20 33 L5 16 L14 16 Z" fill="#e04848" stroke="#2b2638" stroke-width="3" stroke-linejoin="round"/><path d="M6 37 L12 34 M34 37 L28 34 M20 39 L20 36" stroke="#2b2638" stroke-width="3" stroke-linecap="round"/></svg>
      찍기
    </button>
  </div>

  <div id="home" class="screen">
    <button id="gear" class="sqBtn" aria-label="환경설정">⚙</button>
    <div>
      <h1 class="ol">정중앙<br>스매시</h1>
      <div class="sub ol2">정중앙을 맞혀 하늘 높이 뛰고<br>최고점에서 내려찍어 부숴라!</div>
    </div>
    <div class="menu">
      <div class="how">① 바늘이 <b style="color:#ffd23f">정중앙</b>일 때 버튼 → 높이 점프<br>② <b style="color:#ffd23f">최고점</b>에서 한 번 더 → 강하게 내려찍기<br>마을 → 도시 → 나라 → 행성을 차례로 부숩니다</div>
      <div class="best ol2" id="bestLine"></div>
      <button id="startBtn" class="btn main"></button>
      <button id="stagesBtn" class="btn">스테이지 선택</button>
    </div>
  </div>

  <div id="stages" class="screen" hidden>
    <div class="head"><h2 class="ol2">스테이지</h2><button id="stagesBack" class="sqBtn" aria-label="닫기">✕</button></div>
    <div id="stageList" style="display:flex;flex-direction:column;gap:6px;width:100%;align-items:center"></div>
  </div>

  <div id="modal" class="screen dark" hidden><div class="card" id="modalCard"></div></div>

  <div id="reload" hidden><div class="card"><p>새 버전을 불러오지 못했어요.</p><button class="btn main" onclick="location.reload()">새로고침</button></div></div>
</div>

<script>
  setTimeout(function () { if (!window.smashReady) document.getElementById('reload').hidden = false; }, 4000);
</script>
<script type="module">
import * as L from './logic.js?v=1';

const $ = (id) => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const INK = '#2b2638';

// ---------- 화면 크기 ----------
const W = 180;
let H = 320, GY = 210, BAR_Y = 226, PXU0 = 1.5, TOP_SAFE = 64, cssScale = 2;
function resize() {
  const r = app.getBoundingClientRect();
  H = Math.max(280, Math.min(440, Math.round(W * r.height / r.width)));
  cv.width = W; cv.height = H;
  cssScale = r.width / W;
  const panelTop = H * (1 - Math.max(0.24, 150 / r.height));
  GY = Math.round(panelTop - 34);
  BAR_Y = Math.round(GY + 13);
  TOP_SAFE = Math.round(H * 0.22);
  PXU0 = (GY - TOP_SAFE) / L.VIEW;
  ctx.imageSmoothingEnabled = false;
  spriteCache.clear(); targetCache = null; decorCache = null;
}
window.addEventListener('resize', resize);

// ---------- 저장 ----------
const save = L.loadSave(window.localStorage);
const persist = () => L.storeSave(window.localStorage, save);

// ---------- 소리 ----------
let ac = null;
function audio() {
  if (!save.sound) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch { return null; }
  return ac;
}
function tone(freq, dur, { type = 'square', vol = 0.06, to = null, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, { vol = 0.12, from = 2000, to = 200, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'lowpass';
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0);
}
const sfx = {
  jump(f) { tone(180, 0.18 + 0.2 * f, { to: 500 + 700 * f, vol: 0.05 }); noise(0.2 + 0.2 * f, { vol: 0.06, from: 600, to: 3000 }); },
  perfect() { [880, 1175, 1760].forEach((fq, i) => tone(fq, 0.18, { type: 'triangle', vol: 0.07, delay: i * 0.06 })); },
  apex() { tone(1500, 0.08, { type: 'triangle', vol: 0.05 }); },
  dive(f) { noise(0.3, { vol: 0.08 + 0.06 * f, from: 4000, to: 300 }); },
  impact(f) { tone(140, 0.3 + 0.3 * f, { type: 'sine', vol: 0.18, to: 35 }); noise(0.25 + 0.4 * f, { vol: 0.12 + 0.12 * f, from: 2500, to: 80 }); },
  destroy() { noise(1.2, { vol: 0.22, from: 3000, to: 60 }); tone(90, 1, { type: 'sine', vol: 0.2, to: 25 }); },
  miss() { tone(220, 0.15, { to: 140, vol: 0.04 }); },
  tick() { tone(660, 0.05, { vol: 0.03 }); },
};
const buzz = (p) => { if (save.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch { /* 없음 */ } };

// ---------- 픽셀 도우미 ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255];
  const f = (v) => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  return '#' + ch.map((v) => f(v).toString(16).padStart(2, '0')).join('');
}
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// 불투명한 픽셀 둘레에 1픽셀 테두리
function outline(src, color = INK) {
  const [c, g] = mk(src.width + 2, src.height + 2);
  const d = src.getContext('2d').getImageData(0, 0, src.width, src.height).data;
  g.fillStyle = color;
  for (let y = -1; y <= src.height; y++) for (let x = -1; x <= src.width; x++) {
    const at = (xx, yy) => xx >= 0 && yy >= 0 && xx < src.width && yy < src.height && d[(yy * src.width + xx) * 4 + 3] > 0;
    if (!at(x, y) && (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1))) g.fillRect(x + 1, y + 1, 1, 1);
  }
  g.drawImage(src, 1, 1);
  return c;
}

// ---------- 주인공 ----------
const HERO_ART = {
  stand: ['....hhhh....', '...hhhhhh...', '...wwwwww.w.', '...ssssss...', '...sesses...', '...ssssss...', '....ssss....', '..rrrrrrrr..',
    '.srrrrrrrrs.', '.srrrrrrrrs.', '.s.yyyyyy.s.', '...bbbbbb...', '...bb..bb...', '...bb..bb...', '..ooo..ooo..', '............'],
  jump: ['.s........s.', '.s..hhhh..s.', '.sshhhhhhss.', '...wwwwww.w.', '...ssssss...', '...sesses...', '...ssssss...', '...rrrrrr...',
    '..rrrrrrrr..', '..rrrrrrrr..', '...yyyyyy...', '..bbbbbbbb..', '.bbb....bbb.', '.oo......oo.', '............', '............'],
};
const HERO_PAL = [
  { h: '#3a2416', w: '#ffffff', s: '#f2c28e', e: INK, r: '#d83a3a', y: '#ffcc33', b: '#2f4a8a', o: '#2b2b2b' },
  { h: '#3a2416', w: '#ffcc33', s: '#f2c28e', e: INK, r: '#2f7ae0', y: '#ffffff', b: '#2b2b3b', o: '#2b2b2b' },
  { h: '#c8c8d0', w: '#e04040', s: '#f2c28e', e: INK, r: '#a4aec2', y: '#d4a020', b: '#5a4a6a', o: '#3a3a4a' },
  { h: '#f0f0ff', w: '#ffe060', s: '#d8c8ff', e: INK, r: '#5a2ab0', y: '#80f0ff', b: '#2a1a5a', o: '#80f0ff' },
];
const spriteCache = new Map();
function heroSprite(pose, region, tint = null) {
  const key = pose + region + (tint || '');
  if (spriteCache.has(key)) return spriteCache.get(key);
  const art = HERO_ART[pose], pal = HERO_PAL[region];
  const [c, g] = mk(12, 16);
  art.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') R(g, x, y, 1, 1, pal[ch]); }));
  let out = outline(c);
  if (tint) {
    const [t, tg] = mk(out.width, out.height);
    tg.drawImage(out, 0, 0); tg.globalCompositeOperation = 'source-in'; tg.fillStyle = tint; tg.fillRect(0, 0, out.width, out.height);
    out = t;
  }
  spriteCache.set(key, out);
  return out;
}

// ---------- 부술 대상 그리기 ----------
function triRoof(g, cx, baseY, w, h, col) {
  for (let i = 0; i < h; i++) {
    const ww = Math.max(1, Math.round(w * (1 - i / h)));
    R(g, cx - ww / 2, baseY - 1 - i, ww, 1, i === 0 ? shade(col, -0.35) : col);
    R(g, cx - ww / 2, baseY - 1 - i, 1, 1, shade(col, 0.3));
  }
}
function body(g, x, y, w, h, col) {
  R(g, x, y, w, h, col);
  R(g, x, y, 2, h, shade(col, 0.25));
  R(g, x + w - 3, y, 3, h, shade(col, -0.22));
  R(g, x, y + h - 2, w, 2, shade(col, -0.35));
}
function windowsGrid(g, x, y, w, h, cell, col, rand) {
  for (let yy = y + 3; yy + cell - 2 <= y + h - 3; yy += cell) for (let xx = x + 3; xx + cell - 2 <= x + w - 3; xx += cell) {
    R(g, xx, yy, cell - 3, cell - 3, rand() < 0.75 ? col : shade(col, -0.6));
  }
}
function crenel(g, x, y, w, col) { for (let xx = x; xx < x + w - 1; xx += 4) R(g, xx, y - 3, 2, 3, col); }

function drawBuilding(g, cw, ch, t, frac, rand) {
  const bw = Math.round(t.w * PXU0), full = Math.round(t.h * PXU0);
  const bh = Math.max(4, Math.round(full * (0.35 + 0.65 * frac)));
  const cx = cw / 2, x0 = Math.round(cx - bw / 2), base = ch;
  const c = t.color, rf = t.roof, win = '#ffe58a';
  switch (t.kind) {
    case 'hut': {
      const bodyH = Math.round(bh * 0.6);
      body(g, x0 + 2, base - bodyH, bw - 4, bodyH, c);
      for (let y = base - bodyH + 3; y < base - 2; y += 3) R(g, x0 + 4, y, bw - 9, 1, shade(c, -0.2));
      R(g, cx - 3, base - 9, 6, 9, '#5a3a20'); R(g, x0 + 5, base - bodyH + 4, 5, 4, win);
      triRoof(g, cx, base - bodyH, bw + 4, bh - bodyH, rf);
      break;
    }
    case 'mill': {
      const bodyH = Math.round(bh * 0.75);
      for (let i = 0; i < bodyH; i++) { const ww = Math.round(bw * (0.75 - 0.25 * i / bodyH)); R(g, cx - ww / 2, base - 1 - i, ww, 1, i % 6 === 0 ? shade(c, -0.15) : c); R(g, cx - ww / 2, base - 1 - i, 1, 1, shade(c, 0.3)); }
      R(g, cx - 2, base - 7, 4, 7, '#5a3a20');
      triRoof(g, cx, base - bodyH, Math.round(bw * 0.6), bh - bodyH, rf);
      const hy = base - bodyH + 2, L2 = Math.round(bw * 0.55);
      g.save(); g.translate(cx, hy); g.rotate(performance.now() / 900);
      for (let k = 0; k < 4; k++) { g.rotate(Math.PI / 2); R(g, 0, -1, L2, 2, '#6a4a2a'); R(g, 4, 1, L2 - 4, 3, '#f4ecd8'); }
      g.restore();
      break;
    }
    case 'house': {
      const bodyH = Math.round(bh * 0.72);
      body(g, x0, base - bodyH, bw, bodyH, c);
      R(g, x0 + bw - 9, base - bh - 4, 5, bh - bodyH + 6, '#5a4a4a');
      for (let i = 0; i < bh - bodyH; i++) R(g, x0 - 2 + i, base - bodyH - 1 - i, bw + 4 - 2 * i, 1, i === 0 ? shade(rf, -0.3) : rf);
      R(g, cx - 5, base - 10, 10, 10, '#3a2a20'); R(g, cx - 4, base - 6, 8, 2, '#ff8a30');
      break;
    }
    case 'church': {
      const mw = Math.round(bw * 0.68), bodyH = Math.round(bh * 0.5);
      body(g, x0, base - bodyH, mw, bodyH, c);
      triRoof(g, x0 + mw / 2, base - bodyH, mw + 4, Math.round(bh * 0.2), rf);
      const tw = Math.round(bw * 0.3), tx = x0 + bw - tw, th = Math.round(bh * 0.72);
      body(g, tx, base - th, tw, th, shade(c, -0.05));
      triRoof(g, tx + tw / 2, base - th, tw + 2, bh - th, rf);
      R(g, tx + tw / 2 - 1, base - bh - 6, 2, 6, '#ffd23f'); R(g, tx + tw / 2 - 3, base - bh - 4, 6, 2, '#ffd23f');
      R(g, tx + tw / 2 - 2, base - th + 4, 4, 6, '#6aa0ff'); R(g, x0 + mw / 2 - 3, base - 10, 6, 10, '#5a3a20');
      break;
    }
    case 'manor': {
      const bodyH = Math.round(bh * 0.6), tw = Math.round(bw * 0.2), th = Math.round(bh * 0.8);
      body(g, x0, base - bodyH, bw, bodyH, c);
      windowsGrid(g, x0 + tw, base - bodyH, bw - 2 * tw, bodyH - 8, 7, win, rand);
      triRoof(g, cx, base - bodyH, bw - 2 * tw + 6, Math.round(bh * 0.28), rf);
      for (const tx of [x0, x0 + bw - tw]) { body(g, tx, base - th, tw, th, shade(c, -0.08)); triRoof(g, tx + tw / 2, base - th, tw + 4, bh - th, rf); }
      R(g, cx - 5, base - 12, 10, 12, '#5a3a20');
      break;
    }
    case 'shop': {
      body(g, x0, base - bh, bw, bh, c);
      R(g, x0, base - bh, bw, 4, rf);
      for (let x = x0; x < x0 + bw; x += 6) R(g, x, base - bh * 0.62, 3, 4, rf), R(g, x + 3, base - bh * 0.62, 3, 4, '#ffffff');
      R(g, x0 + 4, base - bh * 0.5, bw - 8, bh * 0.5 - 2, '#9ad8ff'); R(g, x0 + 4, base - bh * 0.5, 3, bh * 0.5 - 2, '#d8f4ff');
      break;
    }
    case 'tower': case 'mall': case 'sky': {
      body(g, x0, base - bh, bw, bh, c);
      if (t.kind === 'sky') { for (let x = x0 + 3; x < x0 + bw - 3; x += 4) R(g, x, base - bh + 4, 2, bh - 8, '#bfe4ff'); R(g, cx - 1, base - bh - 10, 2, 10, '#c0c8d0'); R(g, cx - 4, base - bh - 3, 8, 3, rf); }
      else windowsGrid(g, x0, base - bh, bw, bh - 6, t.kind === 'mall' ? 8 : 6, t.kind === 'mall' ? '#d8f4ff' : win, rand);
      if (t.kind === 'mall') { R(g, x0, base - bh, bw, 7, rf); R(g, cx - 8, base - bh + 2, 16, 3, '#ffd23f'); R(g, cx - 6, base - 10, 12, 10, '#9ad8ff'); }
      if (t.kind === 'tower') { R(g, x0 + 4, base - bh - 6, 8, 6, '#8a8a90'); R(g, x0 + bw - 8, base - bh - 3, 4, 3, rf); }
      break;
    }
    case 'antenna': {
      const baseH = Math.round(bh * 0.25);
      body(g, x0 - 4, base - baseH, bw + 8, baseH, '#9aa8b8');
      for (let i = baseH; i < bh; i++) { const ww = Math.max(2, Math.round(bw * 0.5 * (1 - (i - baseH) / (bh - baseH)) + 2)); R(g, cx - ww / 2, base - 1 - i, ww, 1, i % 4 === 0 ? '#5a6878' : c); }
      R(g, cx - 5, base - Math.round(bh * 0.6), 10, 5, '#d8e0e8'); R(g, cx - 1, base - bh - 6, 2, 6, '#888');
      R(g, cx - 2, base - bh - 8, 4, 3, Math.floor(performance.now() / 400) % 2 ? rf : '#701010');
      break;
    }
    case 'fort': case 'castle': case 'capital': {
      if (t.kind === 'fort') {
        const bodyH = Math.round(bh * 0.75);
        body(g, x0, base - bodyH, bw, bodyH, c); crenel(g, x0, base - bodyH, bw, c);
        for (const tx of [x0 - 2, x0 + bw - 10]) { body(g, tx, base - bh, 12, bh, shade(c, -0.1)); crenel(g, tx, base - bh, 12, shade(c, -0.1)); }
        R(g, cx - 6, base - 14, 12, 14, '#3a3028'); R(g, cx - 4, base - 16, 8, 2, '#3a3028');
      } else if (t.kind === 'castle') {
        const bodyH = Math.round(bh * 0.55), kw = Math.round(bw * 0.45), kh = Math.round(bh * 0.82);
        body(g, x0, base - bodyH, bw, bodyH, c); crenel(g, x0, base - bodyH, bw, c);
        body(g, cx - kw / 2, base - kh, kw, kh, shade(c, 0.05));
        windowsGrid(g, cx - kw / 2, base - kh, kw, kh - bodyH, 6, '#6aa0ff', rand);
        triRoof(g, cx, base - kh, kw + 4, bh - kh, rf);
        for (const tx of [x0, x0 + bw - 10]) { body(g, tx, base - kh * 0.85, 10, kh * 0.85, shade(c, -0.08)); triRoof(g, tx + 5, base - kh * 0.85, 12, Math.round(bh * 0.18), rf); }
        R(g, cx - 5, base - 12, 10, 12, '#3a3028');
      } else {
        for (const [ox, ww, hh, col] of [[-0.5, 0.22, 0.55, '#b8a888'], [0.28, 0.22, 0.62, '#a89878'], [-0.3, 0.2, 0.75, c], [0.1, 0.2, 0.7, shade(c, -0.1)]]) {
          const w2 = Math.round(bw * ww), h2 = Math.round(bh * hh);
          body(g, cx + ox * bw, base - h2, w2, h2, col); windowsGrid(g, cx + ox * bw, base - h2, w2, h2, 5, win, rand);
        }
        const dr = Math.round(bw * 0.16), dy = base - Math.round(bh * 0.72);
        g.fillStyle = rf; g.beginPath(); g.arc(cx, dy, dr, Math.PI, 0); g.fill();
        R(g, cx - dr, dy, dr * 2, Math.round(bh * 0.72), shade(c, 0.1)); R(g, cx - 1, dy - dr - 6, 2, 6, rf);
        R(g, cx - dr / 2, dy - dr + 2, 2, dr - 3, shade(rf, 0.5));
      }
      break;
    }
    case 'volcano': case 'mountain': {
      const topW = t.kind === 'volcano' ? 0.28 : 0.04;
      for (let i = 0; i < bh; i++) {
        const k = i / bh, ww = Math.round(bw * (1 - k * (1 - topW)) + (rand() < 0.3 ? 2 : 0));
        let col = c;
        if (t.kind === 'mountain' && k > 0.62) col = rf;
        else if (k > 0.5 && i % 5 === 0) col = shade(c, -0.12);
        R(g, cx - ww / 2, base - 1 - i, ww, 1, col);
        R(g, cx - ww / 2, base - 1 - i, 2, 1, shade(col, 0.25));
        R(g, cx + ww / 2 - 2, base - 1 - i, 2, 1, shade(col, -0.25));
      }
      if (t.kind === 'volcano') {
        const tw = Math.round(bw * topW);
        R(g, cx - tw / 2 + 2, base - bh, tw - 4, 3, rf); R(g, cx - tw / 2 + 4, base - bh - 1, tw - 8, 1, '#ffd23f');
        for (let k = 0; k < 3; k++) { const lx = cx - tw / 2 + 4 + k * (tw - 8) / 2; for (let i = 0; i < bh * (0.25 + 0.15 * k); i++) R(g, lx + (i > 6 ? (k - 1) * (i - 6) * 0.3 : 0), base - bh + 2 + i, 2, 1, i % 3 ? rf : '#ffd23f'); }
      }
      break;
    }
  }
}

function drawPlanet(g, cw, ch, t, frac, rand) {
  const r = Math.round(t.w * PXU0 / 2), cx = cw / 2, cy = ch / 2;
  const img = g.getImageData(0, 0, cw, ch), d = img.data;
  const base = parseInt(t.color.slice(1), 16), dark = parseInt(t.roof.slice(1), 16);
  const rgb = (n) => [n >> 16, (n >> 8) & 255, n & 255];
  const B = rgb(base), D = rgb(dark);
  const craters = Array.from({ length: t.kind === 'planet' ? 9 : 0 }, () => [(rand() * 2 - 1) * r * 0.7, (rand() * 2 - 1) * r * 0.7, 2 + rand() * r * 0.16]);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy, dd = dx * dx + dy * dy;
    if (dd > r * r) continue;
    const nz = Math.sqrt(1 - dd / (r * r));
    let light = (-dx / r) * 0.45 + (-dy / r) * 0.55 + nz * 0.8;
    light = Math.round(Math.max(0, Math.min(1.2, light)) * 4) / 4;  // 픽셀 느낌의 단계 명암
    let mix = 0;
    if (t.kind === 'gas' || t.kind === 'ringed') mix = (Math.floor((dy / r + 1) * 7 + Math.sin(dx / r * 3) * 0.6) % 2) * 0.55;
    for (const [qx, qy, qr] of craters) if ((dx - qx) ** 2 + (dy - qy) ** 2 < qr * qr) mix = 0.75;
    if (t.kind === 'gas' && (dx + r * 0.3) ** 2 / 4 + (dy - r * 0.35) ** 2 < (r * 0.14) ** 2) mix = -0.6;
    const i = (y * cw + x) * 4;
    for (let k = 0; k < 3; k++) {
      let v = B[k] * (1 - Math.max(0, mix)) + D[k] * Math.max(0, mix);
      if (mix < 0) v = v * 0.7 + 255 * 0.3 * -mix + 60;
      d[i + k] = Math.max(0, Math.min(255, v * (0.35 + 0.55 * light)));
    }
    d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  if (t.kind === 'ringed') {
    g.strokeStyle = '#e8d8a8'; g.lineWidth = 3;
    g.beginPath(); g.ellipse(cx, cy, r * 1.55, r * 0.32, -0.25, Math.PI * 1.05, Math.PI * 1.95, true); g.stroke();
    g.strokeStyle = '#a89060'; g.lineWidth = 1;
    g.beginPath(); g.ellipse(cx, cy, r * 1.35, r * 0.25, -0.25, Math.PI * 1.05, Math.PI * 1.95, true); g.stroke();
  }
}

let targetCache = null;
function targetImage() {
  const t = G.info.target, frac = Math.max(0, G.hp / G.info.maxHp);
  const step = Math.ceil(frac * 20);
  if (targetCache && targetCache.stage === G.info.index && targetCache.step === step && !['mill', 'antenna'].includes(t.kind)) return targetCache;
  const planet = ['planet', 'ringed', 'gas'].includes(t.kind);
  const cw = Math.ceil(t.w * PXU0 * (t.kind === 'ringed' ? 1.7 : 1)) + 16, ch = planet ? Math.ceil(t.w * PXU0) + 4 : Math.ceil(t.h * PXU0) + 16;
  const [c, g] = mk(cw, ch);
  const rand = seeded(G.info.index * 977 + 13);
  if (planet) drawPlanet(g, cw, ch, t, frac, rand); else drawBuilding(g, cw, ch, t, step / 20, rand);
  // 금 가기 + 떨어져 나간 조각
  const crand = seeded(G.info.index * 31 + 7), hurt = 1 - step / 20;
  g.globalCompositeOperation = 'source-atop';
  const cracks = Math.floor(hurt * 12);
  for (let k = 0; k < cracks; k++) {
    let x = cw * (0.25 + crand() * 0.5), y = ch * (0.15 + crand() * 0.8);
    const col = planet ? (k % 2 ? '#ff7a20' : '#ffd23f') : 'rgba(30,20,30,0.85)';
    for (let s = 0; s < 6 + crand() * 6; s++) { R(g, x, y, 1, 2, col); x += crand() < 0.5 ? -1 : 1; y += 2; }
  }
  g.fillStyle = `rgba(20,10,20,${hurt * 0.25})`; g.fillRect(0, 0, cw, ch);
  g.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < Math.floor(hurt * 7); k++) {
    const a = crand() * Math.PI * 2, rr = 2 + crand() * 4 * PXU0;
    if (planet) { const pr = t.w * PXU0 / 2; R(g, cw / 2 + Math.cos(a) * pr - rr / 2, ch / 2 + Math.sin(a) * pr - rr / 2, rr, rr, '#000'); }
    else R(g, cw * (0.2 + crand() * 0.6), ch - Math.round(t.h * PXU0 * (0.35 + 0.65 * step / 20)) - 2 + crand() * 4, rr, rr, '#000');
  }
  g.globalCompositeOperation = 'source-over';
  targetCache = { stage: G.info.index, step, c, planet, cw, ch };
  return targetCache;
}
// 대상 꼭대기 높이(단위). 주인공이 서는 곳.
function targetTop() {
  const t = G.info.target;
  if (['planet', 'ringed', 'gas'].includes(t.kind)) return t.h / 2;
  const frac = Math.ceil(Math.max(0, G.hp / G.info.maxHp) * 20) / 20;
  return t.h * (0.35 + 0.65 * frac) * (1 - G.collapse);
}

// ---------- 배경 ----------
let decorCache = null;
function decor() {
  const r = G.info.regionIndex;
  if (decorCache && decorCache.r === r) return decorCache;
  const rand = seeded(r * 101 + 5), items = [];
  const sprite = (w, h, draw) => { const [c, g] = mk(w * PXU0 + 2, h * PXU0 + 2); draw(g, c.width, c.height); return c; };
  const side = () => (rand() < 0.5 ? -1 : 1);
  if (r === 0) {
    for (let i = 0; i < 9; i++) {
      const h = 12 + rand() * 10, x = side() * (34 + rand() * 70);
      items.push({ x, c: sprite(10, h, (g, w, hh) => { R(g, w / 2 - 1, hh - 6, 3, 6, '#6a4022'); for (let k = 0; k < 3; k++) { const s = w * (1 - k * 0.25); g.fillStyle = ['#2f7a3a', '#3f9a4a', '#5ab85a'][k]; g.beginPath(); g.arc(w / 2, hh - 8 - k * (hh - 10) / 3, s / 2, 0, Math.PI * 2); g.fill(); } }) });
    }
    for (let i = 0; i < 3; i++) { const x = side() * (60 + rand() * 40); items.push({ x, back: true, c: sprite(16, 14, (g, w, hh) => { R(g, 1, hh * 0.45, w - 2, hh * 0.55, '#c8a070'); triRoof(g, w / 2, hh * 0.45, w, hh * 0.45, '#a04030'); }) }); }
  } else if (r === 1) {
    for (let i = 0; i < 16; i++) {
      const h = 26 + rand() * 70, w = 12 + rand() * 12, x = side() * (26 + rand() * 110);
      items.push({ x, back: true, c: sprite(w, h, (g, cw, ch) => { R(g, 0, 0, cw, ch, ['#5a6a8a', '#4a5a7a', '#6a7a98'][i % 3]); for (let y = 3; y < ch - 3; y += 5) for (let xx = 2; xx < cw - 3; xx += 4) if (rand() < 0.5) R(g, xx, y, 2, 2, '#ffe58a'); }) });
    }
    for (let i = 0; i < 6; i++) { const x = side() * (30 + i * 14); items.push({ x, c: sprite(3, 12, (g, w, h) => { R(g, 1, 2, 1, h - 2, '#3a3a44'); R(g, 0, 0, 3, 2, '#ffe58a'); }) }); }
  } else if (r === 2) {
    for (let i = 0; i < 7; i++) {
      const h = 18 + rand() * 30, w = h * 2.2, x = side() * (40 + rand() * 120);
      items.push({ x, back: true, c: sprite(w, h, (g, cw, ch) => { for (let k = 0; k < ch; k++) { const ww = cw * Math.sqrt(1 - (k / ch) ** 2); R(g, cw / 2 - ww / 2, ch - 1 - k, ww, 1, k % 6 === 0 ? '#3a6a32' : '#4a7a3a'); } }) });
    }
    for (let i = 0; i < 6; i++) { const x = side() * (40 + rand() * 80); items.push({ x, c: sprite(8, 8, (g, w, h) => { R(g, 1, h * 0.4, w - 2, h * 0.6, '#d8c8a0'); triRoof(g, w / 2, h * 0.4, w, h * 0.4, '#8a3a2a'); }) }); }
  }
  const clouds = [];
  const top = G.info.region.jumps[4] * 1.4;
  for (let i = 0; i < (r === 3 ? 0 : 16); i++) {
    const alt = 80 * Math.pow(top / 80, rand()), size = alt * (0.14 + rand() * 0.14);
    clouds.push({ alt, x: (rand() * 2 - 1) * alt * 0.9, size, shade: rand() });
  }
  const rocks = [];
  if (r === 3) for (let i = 0; i < 30; i++) { const alt = 80 * Math.pow(100, rand()); rocks.push({ alt, x: (rand() * 2 - 1) * alt * 0.8, size: alt * (0.03 + rand() * 0.05), c: ['#8a7a6a', '#6a6a7a', '#a08a70'][i % 3] }); }
  const stars = Array.from({ length: 70 }, () => ({ x: rand() * W, y: rand() * H, b: rand() }));
  decorCache = { r, items, clouds, rocks, stars };
  return decorCache;
}

const SKY = [
  { low: '#8fd4f8', high: '#4aa0e8', ground: '#5ab04c', dirt: '#8a5a3a' },
  { low: '#ffd8a8', high: '#5a8ad8', ground: '#a0a0a8', dirt: '#4a4a52' },
  { low: '#b8e0f8', high: '#3a70c8', ground: '#4a8a3a', dirt: '#6a4a30' },
  { low: '#0a0820', high: '#05040e', ground: null, dirt: '#0a0818' },
];
function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

const cam = { view: L.VIEW, shake: 0, sx: 0, sy: 0, zoomPunch: 0 };
const fx = { parts: [], rings: [], rays: [], flash: 0, flashColor: '#ffffff', trail: [], lines: 0, lineDir: 1 };
const hero = { sq: 0, sqv: 0, angle: 0, pose: 'stand', scale: 1, glow: 0 };
let mode = 'home';   // home | play
let paused = false;

function newGame(index, carryScore = 0) {
  const info = L.stageInfo(index);
  G = {
    info, hp: info.maxHp, timeLeft: info.time, phase: 'intro', t: 0,
    score: carryScore, scoreAtStart: carryScore, combo: 0, maxCombo: 0, perfects: 0,
    needleT: 0, needlePhase: 0, lastP: -1, jump: null, h: 0, apex: null, smashed: false,
    diveFrom: 0, diveT: 0, diveD: 0, freeze: 0, slow: 0, collapse: 0, evolveT: 0, peak: 0,
  };
  targetCache = null; decorCache = null;
  fx.parts.length = 0; fx.rings.length = 0; fx.rays.length = 0; fx.trail.length = 0;
  hero.sq = 0; hero.sqv = 0; hero.angle = 0; hero.pose = 'stand'; hero.scale = 1;
  $('combo').textContent = '';
  updateHud();
}

function startStage(index, carry) {
  mode = 'play'; paused = false;
  newGame(index, carry);
  showScreen(null);
  $('hud').hidden = false; $('panel').hidden = false;
  judge('READY', 'go', `${G.info.label} · ${G.info.target.name}`);
}

// ---------- 입력 ----------
function action() {
  if (mode !== 'play' || paused || !G) return;
  audio();
  if (G.phase === 'ready') startJump();
  else if (G.phase === 'air' && !G.smashed) smash();
}
function startJump() {
  const s = G.info;
  const p = L.needlePos(G.needleT, s.needleSpeed, G.needlePhase);
  const j = L.judgeJump(p);
  const frac = L.jumpFraction(j);
  G.lastP = p;
  G.jump = { j, frac, H: frac * s.maxJump, T: L.airTime(frac, s.regionIndex) };
  G.phase = 'crouch'; G.t = 0; G.smashed = false; G.apex = null; G.peak = 0;
  hero.sq = -0.35; hero.sqv = 0; hero.pose = 'stand';
}
function smash() {
  const jp = G.jump;
  const apex = L.judgeApex(G.t, jp.T);
  G.apex = apex; G.smashed = true;
  const z = cam.view / L.VIEW;
  if (apex === 'perfect') {
    G.perfects++;
    G.freeze = 0.26; cam.zoomPunch = 0.12;
    flash('#fff2a0', 0.55);
    ring(0, heroY(), 6 * z, 90 * z, '#ffd23f', 3, 0.45);
    ring(0, heroY(), 4 * z, 60 * z, '#ffffff', 2, 0.35);
    fx.rays.push({ x: 0, y: heroY(), life: 0.55, max: 0.55, color: '#fff2a0' });
    burst(0, heroY(), 26, ['#ffd23f', '#fff6c0', '#ffffff'], 80 * z, 0.6);
    judge('PERFECT', 'perfect', '최고점');
    sfx.perfect(); buzz(30);
  } else if (apex === 'great') {
    G.freeze = 0.08; flash('#ffffff', 0.25);
    ring(0, heroY(), 4 * z, 50 * z, '#7df0ff', 2, 0.3);
    judge('GREAT', 'great', '최고점'); sfx.apex();
  } else if (apex === 'ok') {
    judge('GOOD', 'good', '최고점'); sfx.apex();
  } else {
    judge(apex === 'early' ? '빨라요' : '늦어요', 'miss', '최고점');
  }
  G.phase = 'dive'; G.diveFrom = G.h; G.diveT = 0; G.diveD = L.diveTime(G.h, G.info.maxJump);
  hero.pose = 'jump'; hero.angle = Math.PI; hero.sq = 0.3;
  sfx.dive(G.h / G.info.maxJump);
}

// ---------- 효과 ----------
function flash(color, a) { fx.flashColor = color; fx.flash = Math.max(fx.flash, a); }
function ring(x, y, r, vr, color, width, life, flat = false) { fx.rings.push({ x, y, r, vr, color, width, life, max: life, flat }); }
function burst(x, y, n, colors, speed, life, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = opts.up ? -Math.PI / 2 + (Math.random() - 0.5) * (opts.spread || 2.4) : Math.random() * Math.PI * 2;
    const v = speed * (0.4 + Math.random() * 0.8);
    fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, g: opts.g || 0, life: life * (0.6 + Math.random() * 0.6), max: life, size: opts.size || (1 + Math.floor(Math.random() * 2)), color: colors[i % colors.length], kind: opts.kind || 'sq' });
  }
}
// 단위 길이로 바꾼 값: 지금 화면 확대 비율에서 px 크기를 단위로
const unitsPerPx = () => cam.view / L.VIEW / PXU0;

function judge(text, cls, sub) {
  const box = $('judgeBox');
  box.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'judge ' + cls + (cls === 'perfect' ? '' : ' ol');
  el.innerHTML = (sub ? `<small class="ol2">${sub}</small>` : '') + text;
  box.appendChild(el);
}
function popDamage(text, crit) {
  const el = document.createElement('div');
  el.className = 'dmg ol' + (crit ? ' crit' : '');
  el.textContent = text;
  const top = targetTop();
  const pxu = PXU0 * L.VIEW / cam.view;
  el.style.left = `${(W / 2 + (Math.random() * 30 - 15)) * cssScale}px`;
  el.style.top = `${(GY - top * pxu - 10) * cssScale}px`;
  $('fx').appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function banner(title, sub) {
  $('banner').innerHTML = `<div class="t ol">${title}</div><div class="s ol2">${sub}</div>`;
  setTimeout(() => { $('banner').innerHTML = ''; }, 2500);
}

const heroY = () => targetTop() + G.h;

function launchFx() {
  const jp = G.jump, top = targetTop(), f = jp.frac;
  const col = G.info.target.roof;
  burst(0, top, 10 + Math.round(20 * f), ['#e8e0d0', '#c8bca8', col], 40 + 60 * f, 0.5, { up: true, spread: 3, g: 120 * unitsPerPx(), size: 2 });
  ring(0, top, 3, 40 + 60 * f, '#ffffff', 2, 0.35, true);
  cam.shake = Math.max(cam.shake, 1 + 3 * f);
  hero.sq = 0.45 + 0.2 * f; hero.sqv = 0;
  sfx.jump(f);
  const g = jp.j.grade;
  if (g === 'perfect') {
    G.perfects++;
    G.slow = 0.22;
    flash('#fff2a0', 0.45);
    ring(0, top + 6, 4, 120, '#ffd23f', 3, 0.5);
    ring(0, top + 6, 2, 80, '#ffffff', 2, 0.4);
    fx.rays.push({ x: 0, y: top + 6, life: 0.5, max: 0.5, color: '#fff2a0' });
    burst(0, top + 4, 30, ['#ffd23f', '#fff6c0', '#ff9a20'], 100, 0.7, { up: true, spread: 2.2 });
    judge('PERFECT', 'perfect', '점프');
    sfx.perfect(); buzz(25);
  } else if (g === 'great') judge('GREAT', 'great', '점프');
  else if (g === 'good') judge('GOOD', 'good', '점프');
  else { judge('MISS', 'miss', '점프'); sfx.miss(); }
}

function impact() {
  const jp = G.jump, apex = G.apex || 'none';
  const dmg = L.damage(jp.j, apex, G.combo);
  G.combo = L.nextCombo(G.combo, jp.j, apex);
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  G.hp = Math.max(0, G.hp - dmg);
  const shown = dmg * G.info.region.hpUnit;
  G.score += shown;
  const m = dmg / L.BASE_DAMAGE, f = Math.min(1, m / 5);
  const top = targetTop(), crit = apex === 'perfect';
  const t = G.info.target;
  G.freeze = 0.04 + 0.12 * f + (crit ? 0.06 : 0);
  cam.shake = 2 + 9 * f;
  flash(crit ? '#fff2a0' : '#ffffff', 0.2 + 0.45 * f);
  ring(0, top, 4, 70 + 140 * f, crit ? '#ffd23f' : '#ffffff', 3, 0.5, true);
  if (f > 0.35) ring(0, top, 2, 50 + 90 * f, '#ffffff', 2, 0.4, true);
  const u = unitsPerPx();
  burst(0, top, 14 + Math.round(40 * f), [t.color, t.roof, shade(t.color, -0.3)], (60 + 120 * f) * u * PXU0 / 1.5, 0.9, { up: true, spread: 2.6, g: 260 * u, size: 2 });
  for (let i = 0; i < 8 + 10 * f; i++) {
    const dir = i % 2 ? 1 : -1;
    fx.parts.push({ x: dir * Math.random() * 6, y: top + 1, vx: dir * (30 + Math.random() * 60) * (0.6 + f) * u, vy: Math.random() * 10 * u, g: 0, life: 0.6 + Math.random() * 0.4, max: 1, size: 3 + Math.floor(Math.random() * 3), color: '#e8e0d0', kind: 'puff' });
  }
  if (crit) {
    fx.rays.push({ x: 0, y: top, life: 0.6, max: 0.6, color: '#ffd23f' });
    burst(0, top, 30, ['#ffd23f', '#fff6c0', '#ffffff'], 150 * u, 0.7, { up: true, spread: 3, g: 100 * u });
  }
  hero.pose = 'stand'; hero.angle = 0; hero.sq = -0.45 - 0.2 * f; hero.sqv = 0;
  popDamage(L.formatNumber(shown), crit || jp.j.grade === 'perfect');
  sfx.impact(f); buzz(Math.round(20 + 50 * f));
  if (G.combo >= 2) $('combo').textContent = `PERFECT 콤보 ×${G.combo}  (+${Math.round((L.comboMult(G.combo) - 1) * 100)}%)`;
  else $('combo').textContent = '';
  G.phase = 'land'; G.t = 0; G.h = 0;
  if (G.hp <= 0) { G.phase = 'destroy'; G.t = 0; sfx.destroy(); }
  updateHud();
}

// ---------- 갱신 ----------
function update(rdt) {
  if (G.freeze > 0) { G.freeze -= rdt; cam.zoomPunch *= 0.9; return; }
  let dt = rdt;
  if (G.slow > 0) { G.slow -= rdt; dt = rdt * 0.3; }
  const s = G.info;
  const counting = ['ready', 'crouch', 'air', 'dive', 'land'].includes(G.phase);
  if (counting) G.timeLeft = Math.max(0, G.timeLeft - dt);

  switch (G.phase) {
    case 'intro':
      G.t += dt;
      if (G.t >= 1.1) { G.phase = 'ready'; G.needleT = 0; G.needlePhase = 0; judge('GO!', 'go'); }
      break;
    case 'ready':
      G.needleT += dt;
      if (G.timeLeft <= 0) fail();
      break;
    case 'crouch':
      G.t += dt;
      if (G.t >= 0.07) { G.phase = 'air'; G.t = 0; launchFx(); }
      break;
    case 'air': {
      const jp = G.jump;
      G.t += dt;
      G.h = L.heightAt(G.t, jp.T, jp.H);
      G.peak = Math.max(G.peak, G.h);
      const u = G.t / jp.T;
      if (u < 0.5) {
        hero.pose = 'jump';
        const spins = jp.frac >= 0.99 ? 2 : jp.frac >= 0.55 ? 1 : 0;
        const k = Math.min(1, u / 0.42);
        hero.angle = spins * Math.PI * 2 * (1 - (1 - k) ** 3);
      } else { hero.angle = 0; hero.pose = 'jump'; }
      if (G.t >= jp.T) { G.apex = 'none'; impact(); }
      break;
    }
    case 'dive': {
      G.diveT += dt;
      const k = Math.min(1, G.diveT / G.diveD);
      G.h = G.diveFrom * (1 - k * k);
      if (G.diveFrom > G.info.maxJump * 0.4) {
        const u = unitsPerPx();
        for (let i = 0; i < 3; i++) fx.parts.push({ x: (Math.random() - 0.5) * 8 * u, y: heroY() + 4 * u, vx: (Math.random() - 0.5) * 20 * u, vy: Math.random() * 30 * u, g: 0, life: 0.25 + Math.random() * 0.2, max: 0.45, size: 2 + Math.floor(Math.random() * 3), color: ['#fff6c0', '#ffd23f', '#ff8a20', '#e04020'][i + (Math.random() < 0.5 ? 1 : 0)], kind: 'flame' });
      }
      if (k >= 1) impact();
      break;
    }
    case 'land':
      G.t += dt;
      if (G.t >= 0.3) {
        if (G.timeLeft <= 0) { fail(); break; }
        G.phase = 'ready'; G.needleT = 0; G.needlePhase = Math.random() < 0.5 ? 0 : 0.5;
      }
      break;
    case 'destroy': {
      G.t += dt;
      const planet = ['planet', 'ringed', 'gas'].includes(s.target.kind);
      if (planet) {
        if (G.t < dt * 1.5) {
          const u = unitsPerPx();
          burst(0, 0, 90, [s.target.color, s.target.roof, '#ffd23f', '#ff7a20'], 220 * u, 1.6, { size: 3 });
          ring(0, 0, 10, 260, '#ffd23f', 4, 1);
          ring(0, 0, 10, 180, '#ffffff', 3, 0.8);
          flash('#ffffff', 1); cam.shake = 14;
        }
        G.collapse = 1;
      } else {
        G.collapse = Math.min(1, G.t / 1.1);
        cam.shake = Math.max(cam.shake, 4 * (1 - G.collapse));
        if (Math.random() < 0.6) {
          const u = unitsPerPx();
          fx.parts.push({ x: (Math.random() - 0.5) * s.target.w, y: Math.random() * 6, vx: (Math.random() - 0.5) * 40 * u, vy: (10 + Math.random() * 20) * u, g: 0, life: 1, max: 1, size: 4 + Math.floor(Math.random() * 4), color: '#d8d0c0', kind: 'puff' });
        }
      }
      if (G.t >= 1.7 && G.phase === 'destroy') { G.phase = 'done'; showClear(); }
      break;
    }
    case 'evolve': {
      G.evolveT += dt;
      hero.scale = 1 + 2.5 * Math.min(1, G.evolveT / 1.5) ** 2;
      hero.glow = Math.min(1, G.evolveT / 1.2);
      if (Math.random() < 0.7) burst((Math.random() - 0.5) * 30, targetTop(), 1, ['#ffd23f', '#ffffff', '#7df0ff'], 60, 0.8, { up: true, spread: 0.6 });
      if (G.evolveT >= 1.6) {
        const next = G.info.index + 1, score = G.score;
        startStage(next, score);
        $('judgeBox').innerHTML = '';
        flash('#ffffff', 1);
        cam.view = L.VIEW * 0.28;   // 커진 몸에서 시작해 세상이 작아지며 드러남
        const ni = L.stageInfo(next).regionIndex, r = L.REGIONS[ni];
        banner('진화!', `${L.REGIONS[ni - 1].title} → ${r.title}<br>이제 최대 ${L.formatMeters(r.jumps[4], r)}까지 뛸 수 있어요`);
        G.t = -1.2;
      }
      break;
    }
  }
  hero.sqv += (-90 * hero.sq - 9 * hero.sqv) * rdt;
  hero.sq += hero.sqv * rdt;
  if (G.phase !== 'evolve') hero.glow = Math.max(0, hero.glow - rdt);
  updateFx(dt);
  updateHud();
}

function updateFx(dt) {
  for (const p of fx.parts) { p.life -= dt; p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'puff') { p.vx *= 0.94; p.vy *= 0.94; } }
  fx.parts = fx.parts.filter((p) => p.life > 0);
  for (const r of fx.rings) { r.life -= dt; r.r += r.vr * dt * (r.life / r.max + 0.3); }
  fx.rings = fx.rings.filter((r) => r.life > 0);
  for (const r of fx.rays) r.life -= dt;
  fx.rays = fx.rays.filter((r) => r.life > 0);
}

function updateCamera(rdt) {
  let desired = L.VIEW;
  if (G) {
    const heroTop = (targetTop() + G.h + L.HERO_H * hero.scale) * 1.1 + 4;
    desired = Math.max(L.VIEW, heroTop);
  }
  if (desired > cam.view && !(G && G.phase === 'intro')) cam.view = desired;
  else cam.view += (desired - cam.view) * Math.min(1, rdt * (G && G.phase === 'dive' ? 3 : 5));
  cam.shake *= Math.pow(0.0008, rdt);
  cam.sx = (Math.random() * 2 - 1) * cam.shake;
  cam.sy = (Math.random() * 2 - 1) * cam.shake;
  fx.flash *= Math.pow(0.002, rdt);
}

// ---------- 그리기 ----------
function render(rdt) {
  const view = cam.view * (1 - cam.zoomPunch);
  const pxu = PXU0 * L.VIEW / view;
  const r = G.info.regionIndex, sky = SKY[r], region = G.info.region;
  const X = (u) => Math.round(W / 2 + u * pxu + cam.sx);
  const Y = (u) => Math.round(GY - u * pxu + cam.sy);
  const dec = decor();

  // 하늘: 화면 꼭대기 고도(m)로 색과 별을 정한다
  const topM = (GY / pxu) * region.mPerUnit;
  const lg = Math.log10(Math.max(1, topM));
  const space = r === 3 ? 1 : Math.max(0, Math.min(1, (lg - 3.6) / 1.2));
  const grad = ctx.createLinearGradient(0, 0, 0, GY);
  grad.addColorStop(0, mixHex(sky.high, '#05040e', space));
  grad.addColorStop(1, mixHex(sky.low, '#0a0a24', space * 0.9));
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (space > 0.05) {
    const tw = performance.now() / 500;
    for (const s of dec.stars) {
      const a = space * (0.4 + 0.6 * s.b) * (0.75 + 0.25 * Math.sin(tw + s.x));
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(Math.round(s.x), Math.round(s.y), s.b > 0.85 ? 2 : 1, s.b > 0.85 ? 2 : 1);
    }
  }
  if (r === 3) {
    // 멀리 있는 태양과 성운
    ctx.fillStyle = 'rgba(140,80,200,0.18)'; ctx.beginPath(); ctx.ellipse(40, 90, 70, 26, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,120,0.25)'; ctx.beginPath(); ctx.arc(W - 24, 70, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(W - 24, 70, 9, 0, Math.PI * 2); ctx.fill();
  }

  // 구름(지역마다 다른 높이에 깔려 있어서 높이 뛸수록 지나쳐 올라감)
  for (const c of dec.clouds) {
    const w = c.size * pxu;
    if (w < 2) continue;
    const x = X(c.x), y = Y(c.alt);
    if (y < -w || y > GY + w) continue;
    ctx.fillStyle = mixHex('#ffffff', '#c8d8e8', c.shade * 0.6 + space * 0.4);
    ctx.fillRect(x - w / 2, y - w * 0.16, w, w * 0.32);
    ctx.fillRect(x - w * 0.3, y - w * 0.3, w * 0.5, w * 0.2);
    ctx.fillStyle = 'rgba(160,180,210,0.6)';
    ctx.fillRect(x - w / 2, y + w * 0.1, w, w * 0.06);
  }
  for (const k of dec.rocks) {
    const s = Math.max(1, k.size * pxu), x = X(k.x), y = Y(k.alt);
    if (y < -s || y > GY + s) continue;
    ctx.fillStyle = k.c; ctx.fillRect(x - s / 2, y - s / 2, s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x - s / 2, y - s / 2, Math.max(1, s / 3), Math.max(1, s / 3));
  }

  // 땅과 주변 풍경
  const k = pxu / PXU0;
  if (sky.ground) {
    for (const it of dec.items.filter((i) => i.back)) drawScaled(it.c, X(it.x), Y(0), k, 0.85);
    ctx.fillStyle = sky.dirt; ctx.fillRect(0, Y(0), W, H);
    ctx.fillStyle = sky.ground; ctx.fillRect(0, Y(0), W, Math.max(2, Math.round(3 * k)));
    if (r === 1) { ctx.fillStyle = '#e8e8a0'; for (let x = -200; x < 200; x += 14) ctx.fillRect(X(x), Y(0) + Math.max(3, 6 * k), Math.max(1, 6 * k), 1); }
    for (const it of dec.items.filter((i) => !i.back)) drawScaled(it.c, X(it.x), Y(0), k, 1);
  } else {
    ctx.fillStyle = sky.dirt; ctx.fillRect(0, GY + 40, W, H);
  }

  // 부술 대상
  const tg = targetImage();
  if (G.phase !== 'done' || !tg.planet) {
    if (tg.planet) {
      if (!(G.phase === 'destroy' || G.phase === 'done')) {
        const w = tg.cw * k, h = tg.ch * k;
        ctx.drawImage(tg.c, Math.round(X(0) - w / 2), Math.round(Y(0) - h / 2), Math.round(w), Math.round(h));
      }
    } else {
      const w = tg.cw * k, h = tg.ch * k, sink = G.collapse * G.info.target.h * pxu * 0.65;
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, Y(0)); ctx.clip();
      ctx.drawImage(tg.c, Math.round(X(0) - w / 2), Math.round(Y(0) - h + sink), Math.round(w), Math.round(h));
      ctx.restore();
      if (G.collapse > 0) {   // 무너진 잔해
        ctx.fillStyle = shade(G.info.target.color, -0.3);
        const rw = G.info.target.w * pxu * (0.6 + 0.5 * G.collapse);
        for (let i = 0; i < 7; i++) ctx.fillRect(Math.round(X(0) - rw / 2 + i * rw / 7), Y(0) - Math.round((2 + (i * 37 % 5)) * k * G.collapse), Math.ceil(rw / 7), Math.round((2 + (i * 37 % 5)) * k * G.collapse) + 1);
      }
    }
  }

  // 빛줄기
  for (const ry of fx.rays) {
    const a = ry.life / ry.max, x = X(ry.x), y = Y(ry.y);
    ctx.save(); ctx.translate(x, y); ctx.rotate(performance.now() / 600);
    ctx.fillStyle = ry.color; ctx.globalAlpha = a * 0.3;
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(160 * (0.5 + 0.5 * a), -6); ctx.lineTo(160 * (0.5 + 0.5 * a), 6); ctx.fill(); }
    ctx.restore();
  }

  // 잔상
  const hy = heroY();
  const airborne = ['air', 'dive'].includes(G.phase);
  const vel = airborne ? Math.abs(hy - (fx.lastHy ?? hy)) / Math.max(rdt, 0.001) * pxu : 0;
  fx.lastHy = hy;
  if (airborne && vel > 40) fx.trail.push({ y: hy, angle: hero.angle, pose: hero.pose, life: 0.18 });
  for (const tr of fx.trail) tr.life -= rdt;
  fx.trail = fx.trail.filter((t) => t.life > 0).slice(-8);
  const gold = G.jump && (G.jump.j.grade === 'perfect' || G.apex === 'perfect');
  for (const tr of fx.trail) {
    ctx.globalAlpha = tr.life / 0.18 * 0.45;
    drawHero(heroSprite(tr.pose, r, gold ? '#ffd23f' : '#ffffff'), X(0), Y(tr.y), pxu, tr.angle, 0);
  }
  ctx.globalAlpha = 1;

  // 내려찍기 불꽃 앞머리
  if (G.phase === 'dive' && G.diveFrom > G.info.maxJump * 0.4) {
    const s = Math.max(0.6, pxu / PXU0);
    ctx.fillStyle = 'rgba(255,140,40,0.55)'; ctx.beginPath(); ctx.ellipse(X(0), Y(hy) + 2, 10 * s, 6 * s, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,0.85)'; ctx.beginPath(); ctx.ellipse(X(0), Y(hy) + 1, 6 * s, 3 * s, 0, 0, Math.PI); ctx.fill();
  }

  // 주인공
  {
    const glowA = Math.max(hero.glow, r === 3 ? 0.35 : 0);
    if (glowA > 0 || pxu / PXU0 < 0.5) {
      const rad = (pxu / PXU0 < 0.5 ? 6 : 0) + 14 * hero.scale * Math.max(0.4, pxu / PXU0) * Math.max(glowA, 0.4);
      const gg = ctx.createRadialGradient(X(0), Y(hy + 6), 0, X(0), Y(hy + 6), rad);
      gg.addColorStop(0, gold ? 'rgba(255,220,80,0.8)' : 'rgba(255,255,255,0.7)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gg; ctx.fillRect(X(0) - rad, Y(hy + 6) - rad, rad * 2, rad * 2);
    }
    drawHero(heroSprite(hero.pose, r), X(0), Y(hy), pxu, hero.angle, hero.sq, hero.scale);
  }

  // 알갱이
  for (const p of fx.parts) {
    const a = Math.min(1, p.life / p.max * 1.5);
    ctx.globalAlpha = p.kind === 'puff' ? a * 0.7 : a;
    ctx.fillStyle = p.color;
    const s = p.kind === 'puff' ? p.size * (1.6 - a * 0.6) : p.size;
    ctx.fillRect(Math.round(X(p.x) - s / 2), Math.round(Y(p.y) - s / 2), Math.ceil(s), Math.ceil(s));
  }
  ctx.globalAlpha = 1;
  // 충격파
  for (const rg of fx.rings) {
    ctx.globalAlpha = rg.life / rg.max;
    ctx.strokeStyle = rg.color; ctx.lineWidth = rg.width;
    ctx.beginPath();
    const rr = rg.r * pxu;
    if (rg.flat) ctx.ellipse(X(rg.x), Y(rg.y), rr, rr * 0.28, 0, 0, Math.PI * 2);
    else ctx.arc(X(rg.x), Y(rg.y), rr, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 속도선: 화면 속에서 빠르게 움직일수록 많이, 길게
  if (vel > 60) {
    const n = Math.min(18, Math.floor(vel / 25));
    const len = Math.min(120, vel * 0.12);
    ctx.fillStyle = G.phase === 'dive' ? 'rgba(255,240,200,0.7)' : 'rgba(255,255,255,0.6)';
    for (let i = 0; i < n; i++) {
      const x = Math.random() * W, y = Math.random() * (GY + 20) - len / 2;
      if (Math.abs(x - W / 2) < 14) continue;
      ctx.fillRect(Math.round(x), Math.round(y), 1, Math.round(len * (0.4 + Math.random() * 0.6)));
    }
  }

  drawBar();
  drawGauge(pxu);

  if (fx.flash > 0.01) { ctx.globalAlpha = Math.min(1, fx.flash); ctx.fillStyle = fx.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

function drawScaled(img, x, groundY, k, alpha) {
  const w = img.width * k, h = img.height * k;
  if (w < 1) return;
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, Math.round(x - w / 2), Math.round(groundY - h), Math.round(w), Math.round(h));
  ctx.globalAlpha = 1;
}
function drawHero(img, x, footY, pxu, angle, sq, scale = 1) {
  const k = Math.max(0.35, pxu / PXU0) * scale;
  const sy = (1 + sq) * k, sx = (1 - sq * 0.6) * k;
  const w = img.width, h = img.height;
  ctx.save();
  ctx.translate(x, footY - (h / 2) * k);
  if (angle) ctx.rotate(angle);
  ctx.translate(0, (h / 2) * k);
  ctx.scale(sx, sy);
  ctx.drawImage(img, -w / 2, -h);
  ctx.restore();
}

function drawBar() {
  const s = G.info, bw = 150, x0 = Math.round((W - bw) / 2), y = BAR_Y, h = 10;
  const active = G.phase === 'ready';
  const p = active ? L.needlePos(G.needleT, s.needleSpeed, G.needlePhase) : G.phase === 'intro' ? -1 : G.lastP;
  R(ctx, x0 - 4, y - 4, bw + 8, h + 8, INK);
  R(ctx, x0 - 2, y - 2, bw + 4, h + 4, '#f6ecd0');
  const zone = (z, col) => R(ctx, W / 2 - z * bw / 2, y, z * bw, h, col);
  zone(1, '#d05050'); zone(L.GOOD_ZONE, '#f0c040'); zone(L.GREAT_ZONE, '#6ad06a'); zone(L.PERFECT_ZONE, '#fff6b0');
  R(ctx, W / 2 - L.PERFECT_ZONE * bw / 2 - 1, y, 1, h, '#b08000'); R(ctx, W / 2 + L.PERFECT_ZONE * bw / 2, y, 1, h, '#b08000');
  // 정중앙 표시
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.moveTo(W / 2 - 4, y - 8); ctx.lineTo(W / 2 + 4, y - 8); ctx.lineTo(W / 2, y - 4); ctx.fill();
  if (!active) { ctx.fillStyle = 'rgba(43,38,56,0.45)'; ctx.fillRect(x0, y, bw, h); }
  const nx = Math.round(W / 2 + p * bw / 2);
  R(ctx, nx - 2, y - 5, 4, h + 10, INK);
  R(ctx, nx - 1, y - 4, 2, h + 8, active ? '#ffffff' : '#c8c8d0');
}

function drawGauge(pxu) {
  const show = ['crouch', 'air', 'dive', 'land'].includes(G.phase) && G.jump;
  const lab = $('hLabel');
  if (!show) { lab.hidden = true; return; }
  const gx = 6, gw = 9, gt = Math.round(H * 0.25), gb = GY - 10, gh = gb - gt;
  const s = G.info, jp = G.jump;
  R(ctx, gx - 2, gt - 2, gw + 4, gh + 4, INK);
  R(ctx, gx, gt, gw, gh, '#f6ecd0');
  const fill = Math.min(1, G.h / s.maxJump);
  const fh = Math.round(fill * (gh - 2));
  const grd = ctx.createLinearGradient(0, gb, 0, gt);
  grd.addColorStop(0, '#4ab0ff'); grd.addColorStop(0.6, '#b060ff'); grd.addColorStop(1, '#ffd23f');
  ctx.fillStyle = grd; ctx.fillRect(gx + 1, gb - 1 - fh, gw - 2, fh);
  // 이번 점프의 최고점 표시
  const my = Math.round(gb - 1 - (jp.H / s.maxJump) * (gh - 2));
  const inWin = G.phase === 'air' && Math.abs(G.t - jp.T / 2) <= L.APEX_GREAT;
  const blink = inWin && Math.floor(performance.now() / 60) % 2;
  R(ctx, gx - 3, my - 1, gw + 6, 3, blink ? '#ffffff' : '#ff4040');
  ctx.fillStyle = blink ? '#ffffff' : '#ff4040';
  ctx.beginPath(); ctx.moveTo(gx + gw + 3, my); ctx.lineTo(gx + gw + 8, my - 4); ctx.lineTo(gx + gw + 8, my + 4); ctx.fill();
  R(ctx, gx + gw + 3, my - 1, 1, 3, INK);
  lab.hidden = false;
  lab.textContent = G.phase === 'land' ? `최고 ${L.formatMeters(G.peak, s.region)}` : L.formatMeters(G.h, s.region);
  lab.style.top = `${(Math.max(gt, gb - 1 - fh) - 6) * cssScale}px`;
  lab.style.left = `${(gx + gw + 10) * cssScale}px`;
  lab.style.color = inWin ? '#ffd23f' : '#ffffff';
}

// ---------- HUD ----------
function updateHud() {
  if (!G) return;
  const s = G.info;
  $('score').textContent = L.formatNumber(G.score);
  $('stageLine').textContent = `${s.label}${s.boss ? ' 보스' : ''} · ${s.target.name}`;
  const hf = G.hp / s.maxHp;
  const hpEl = $('hpFill');
  hpEl.style.width = `${hf * 100}%`;
  hpEl.className = hf < 0.25 ? 'low' : hf < 0.55 ? 'mid' : '';
  $('timerFill').style.width = `${(G.timeLeft / s.time) * 100}%`;
  $('timer').classList.toggle('low', G.timeLeft / s.time < 0.25 && mode === 'play');
  const ground = G.phase === 'ready' || G.phase === 'intro';
  $('btnL').classList.toggle('glow', G.phase === 'ready');
  $('btnR').classList.toggle('glow', G.phase === 'air' && !G.smashed);
  $('btnL').classList.toggle('dim', !ground);
  $('btnR').classList.toggle('dim', ground);
  if (mode === 'play' && !save.cleared[0] && G.info.index === 0) {
    const hint = $('hint');
    if (G.phase === 'ready') { hint.hidden = false; hint.textContent = '바늘이 정중앙에 올 때 누르세요!'; }
    else if (G.phase === 'air' && !G.smashed) { hint.hidden = false; hint.textContent = '최고점(빨간 선)에서 한 번 더!'; }
    else hint.hidden = true;
  } else $('hint').hidden = true;
}

// ---------- 화면 전환 ----------
function showScreen(id) {
  for (const s of ['home', 'stages', 'modal']) $(s).hidden = s !== id;
}
function modal(html, buttons) {
  const card = $('modalCard');
  card.innerHTML = html;
  for (const [label, cls, fn] of buttons) {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || ''); b.innerHTML = label;
    b.addEventListener('click', () => { sfx.tick(); fn(); });
    card.appendChild(b);
  }
  showScreen('modal');
}
function goHome() {
  mode = 'home'; paused = false;
  $('hud').hidden = true; $('panel').hidden = true; $('hint').hidden = true; $('hLabel').hidden = true;
  $('judgeBox').innerHTML = ''; $('combo').textContent = '';
  newGame(save.unlocked);
  G.phase = 'idle';
  const s = L.stageInfo(save.unlocked);
  $('startBtn').innerHTML = `${save.cleared[0] ? '이어하기' : '시작하기'}<small>${s.label} · ${s.target.name}</small>`;
  $('bestLine').textContent = save.best ? `최고 점수 ${L.formatNumber(save.best)}` : '';
  showScreen('home');
}
function showStages() {
  const list = $('stageList');
  list.innerHTML = '';
  L.REGIONS.forEach((reg, ri) => {
    const box = document.createElement('div'); box.className = 'region';
    box.innerHTML = `<h3 class="ol2">${reg.name} <span style="font-size:12px;opacity:.85">· ${reg.title} · 최대 ${L.formatMeters(reg.jumps[4], reg)}</span></h3>`;
    const row = document.createElement('div'); row.className = 'row';
    reg.targets.forEach((t, i) => {
      const idx = ri * 5 + i;
      const b = document.createElement('button');
      b.className = t.boss ? 'boss' : '';
      b.disabled = idx > save.unlocked;
      b.innerHTML = idx > save.unlocked ? '🔒' : `${i + 1}<small>${save.cleared[idx] ? '★' : t.boss ? '보스' : ''}</small>`;
      b.title = t.name;
      b.addEventListener('click', () => { sfx.tick(); startStage(idx, 0); });
      row.appendChild(b);
    });
    box.appendChild(row); list.appendChild(box);
  });
  showScreen('stages');
}
function showClear() {
  const s = G.info, last = s.index === L.STAGE_COUNT - 1;
  L.recordClear(save, s.index, G.score); persist();
  $('hint').hidden = true;
  const stats = `<div class="stats"><span>남은 시간</span><b>${G.timeLeft.toFixed(1)}초</b><span>Perfect</span><b>${G.perfects}번</b><span>최고 콤보</span><b>${G.maxCombo}</b><span>점수</span><b>${L.formatNumber(G.score)}</b></div>`;
  if (last) {
    modal(`<h2>우주 정복!</h2><p>목성까지 부숴 버렸어요.<br>당신은 이제 우주 최강의 점퍼!</p>${stats}`, [['처음으로', 'main', goHome]]);
    return;
  }
  const next = L.stageInfo(s.index + 1), evolve = next.regionIndex !== s.regionIndex;
  modal(`<h2>파괴!</h2><p><b>${s.target.name}</b>을(를) 부쉈어요${evolve ? `<br>${s.region.name} 정복! 다음은 <b>${next.region.name}</b>` : ''}</p>${stats}`, [
    [evolve ? '진화하기 ▶' : '다음 스테이지 ▶', 'main', () => (evolve ? startEvolve() : startStage(s.index + 1, G.score))],
    ['다시 하기', '', () => startStage(s.index, G.scoreAtStart)],
    ['처음으로', '', goHome],
  ]);
}
function startEvolve() {
  showScreen(null);
  G.phase = 'evolve'; G.evolveT = 0; G.collapse = 1; G.h = 0;
  sfx.perfect(); tone(220, 1.4, { type: 'sawtooth', vol: 0.04, to: 880 });
}
function fail() {
  if (G.phase === 'fail') return;
  G.phase = 'fail';
  $('hint').hidden = true;
  sfx.miss();
  const left = Math.ceil((G.hp / G.info.maxHp) * 100);
  modal(`<h2>시간 초과!</h2><p><b>${G.info.target.name}</b>이(가) 아직 ${left}% 남았어요.<br>정중앙과 최고점을 노려 보세요!</p>`, [
    ['다시 하기', 'main', () => startStage(G.info.index, G.scoreAtStart)],
    ['처음으로', '', goHome],
  ]);
}
function pause() {
  if (mode !== 'play' || paused || ['fail', 'done', 'destroy', 'evolve'].includes(G.phase)) return;
  paused = true;
  modal('<h2>일시정지</h2>' + settingsHtml(), [
    ['계속하기', 'main', () => { paused = false; showScreen(null); }],
    ['다시 하기', '', () => startStage(G.info.index, G.scoreAtStart)],
    ['처음으로', '', goHome],
  ]);
  bindSettings();
}
function settingsHtml() {
  return `<div class="setRow"><span>소리</span><button class="btn" id="setSound">${save.sound ? '켬' : '끔'}</button></div>
    <div class="setRow"><span>진동</span><button class="btn" id="setVib">${save.vibrate ? '켬' : '끔'}</button></div>`;
}
function bindSettings() {
  $('setSound').onclick = () => { save.sound = !save.sound; persist(); $('setSound').textContent = save.sound ? '켬' : '끔'; sfx.tick(); };
  $('setVib').onclick = () => { save.vibrate = !save.vibrate; persist(); $('setVib').textContent = save.vibrate ? '켬' : '끔'; buzz(20); };
}
function showSettings() {
  modal('<h2>환경설정</h2>' + settingsHtml(), [
    ['기록 지우기', 'red', () => modal('<h2>기록 지우기</h2><p>스테이지 진행과 최고 점수가<br>모두 지워져요.</p>', [
      ['지우기', 'red', () => { Object.assign(save, L.defaultSave(), { sound: save.sound, vibrate: save.vibrate }); persist(); goHome(); }],
      ['취소', '', showSettings],
    ])],
    ['닫기', 'main', goHome],
  ]);
  bindSettings();
}

// ---------- 연결 ----------
for (const id of ['btnL', 'btnR']) {
  const b = $(id);
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.classList.add('press'); action(); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => b.classList.remove('press'));
  b.addEventListener('contextmenu', (e) => e.preventDefault());
}
cv.addEventListener('pointerdown', (e) => { if (mode === 'play') { e.preventDefault(); action(); } });
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'KeyJ', 'KeyK', 'KeyW', 'KeyS', 'Enter'].includes(e.code)) {
    if (mode === 'play' && $('modal').hidden) { e.preventDefault(); action(); }
  } else if (e.code === 'Escape' || e.code === 'KeyP') {
    if (paused) { paused = false; showScreen(null); } else pause();
  }
});
$('pauseBtn').addEventListener('click', pause);
$('startBtn').addEventListener('click', () => { sfx.tick(); startStage(save.unlocked, 0); });
$('stagesBtn').addEventListener('click', () => { sfx.tick(); showStages(); });
$('stagesBack').addEventListener('click', goHome);
$('gear').addEventListener('click', showSettings);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (mode === 'play' && !paused) update(rdt);
  else if (G && G.phase === 'idle') { hero.sqv += (-90 * hero.sq - 9 * hero.sqv) * rdt; hero.sq += hero.sqv * rdt; }
  updateCamera(rdt);
  render(rdt);
  requestAnimationFrame(frame);
}
resize();
goHome();
requestAnimationFrame(frame);
window.smashReady = true;
window.__smash = { get G() { return G; }, action, startStage, cam };
</script>
</body>
</html>
