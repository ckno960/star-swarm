<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>쓰레기 행성</title>
<style>
  :root { --cream: #f6ecd0; --cream2: #ddc99c; --ink: #2b2638; --slate: #5a6582; --slate2: #454f69; --gold: #ffd23f; --yellow: #fff03a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { display: flex; justify-content: center; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; overflow: hidden; background: #6aa8e8; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .ol { text-shadow: -2px 0 #000, 2px 0 #000, 0 -2px #000, 0 2px #000, -2px -2px #000, 2px 2px #000, -2px 2px #000, 2px -2px #000; }

  /* 위쪽 검은 띠: 쇼츠 자막처럼 */
  #top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 44px 8px; background: #000; text-align: center; }
  #title { font: 900 20px/1.2 system-ui, sans-serif; white-space: nowrap; color: var(--yellow); letter-spacing: 1px; }
  #dist { margin-top: 4px; font: 900 18px/1.1 system-ui, sans-serif; white-space: nowrap; }
  #dist b { display: inline-block; min-width: 4.6em; font-size: 40px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  #dist.danger b { color: #ff5a3a; animation: throb 0.5s ease-in-out infinite; }
  @keyframes throb { 50% { transform: scale(1.06); } }
  #stats { margin-top: 6px; font: 800 13px system-ui, sans-serif; color: #cfd8e8; }
  #stats b { color: #fff; }
  #gear { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 8px; width: 34px; height: 34px; padding: 0; border: 2px solid #555; border-radius: 8px; background: #111; color: #ddd; font-size: 17px; }

  /* 속보 띠 */
  #news { position: absolute; left: 0; right: 0; height: 24px; display: flex; align-items: center; background: rgba(0, 0, 0, 0.7); overflow: hidden; pointer-events: none; }
  #news .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 8px; background: #d02a2a; font: 900 13px system-ui, sans-serif; }
  #news .txt { padding-left: 10px; font: 800 13px system-ui, sans-serif; white-space: nowrap; }

  /* 아래쪽: 돈, 발사 버튼, 발사대 목록 */
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 43%; display: flex; flex-direction: column;
    background: var(--slate); border-top: 4px solid var(--ink); box-shadow: inset 0 4px 0 #74809e; padding: 8px 10px env(safe-area-inset-bottom);
  }
  #row1 { display: flex; gap: 10px; align-items: stretch; }
  #money { flex: none; width: 34%; display: flex; flex-direction: column; justify-content: center; padding: 6px 8px; background: var(--ink); border-radius: 10px; }
  #money small { font: 800 11px system-ui, sans-serif; color: #b8b0d0; }
  #money b { font: 900 20px system-ui, sans-serif; color: var(--gold); font-variant-numeric: tabular-nums; }
  #launch {
    position: relative; flex: 1; min-height: 76px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #ff6a4a; color: #fff; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink), inset 0 -6px 0 #c83a2a;
    font: 900 24px system-ui, sans-serif; touch-action: manipulation;
  }
  #launch small { position: absolute; bottom: 9px; left: 0; right: 0; font: 800 11px system-ui, sans-serif; opacity: 0.9; }
  #launch.press { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink), inset 0 -3px 0 #c83a2a; }
  #list { flex: 1; margin-top: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .item { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; }
  .item canvas { flex: none; width: 36px; height: 36px; image-rendering: pixelated; background: #8fc0ea; border: 2px solid var(--ink); border-radius: 6px; }
  .item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .item .info b { font-size: 15px; }
  .item .info b small { font-size: 12px; color: #6a5a8a; }
  .item .info span { font-size: 11px; line-height: 1.3; color: #5a5468; }
  .item .info .gain { color: #2a8a4a; font-weight: 800; }
  .item button { flex: none; width: 88px; min-height: 42px; padding: 0 4px; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); font: 900 14px system-ui, sans-serif; }
  .item button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .item button:disabled { background: #d8d0c0; color: #8a8494; }
  .item.locked { opacity: 0.6; }
  .item.locked canvas { filter: brightness(0); }
  .pop { position: absolute; transform: translate(-50%, -50%); font: 900 18px system-ui, sans-serif; color: #fff; pointer-events: none; animation: up 0.8s ease-out forwards; white-space: nowrap; }
  @keyframes up { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -220%); } }

  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.7); }
  .card { width: 100%; max-width: 320px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--cream); color: var(--ink); border: 4px solid var(--ink); border-radius: 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4); }
  .card h2 { margin: 0; font: 900 28px system-ui, sans-serif; }
  .card p { margin: 0; text-align: center; line-height: 1.55; font-size: 15px; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
  .card .stats b { text-align: right; }
  .btn { width: 100%; min-height: 48px; background: #fff8e4; color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 4px 0 var(--ink); font: 900 16px system-ui, sans-serif; }
  .btn.main { background: var(--gold); }
  .btn.red { background: #ffb0a8; }
  .btn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.75; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .setRow { width: 100%; display: flex; align-items: center; justify-content: space-between; font: 800 16px system-ui, sans-serif; }
  .setRow .btn { width: 100px; min-height: 40px; }
  #reload { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="top">
    <div id="title" class="ol">쓰레기 행성이 지구에 떨어지면</div>
    <div id="dist">지구까지 <b id="km">384,400</b> km</div>
    <div id="stats">질량 <b id="mass">0</b>톤 · 초당 <b id="rate">0</b>톤</div>
    <button id="gear" aria-label="환경설정">⚙</button>
  </div>
  <div id="news"><span class="tag">속보</span><span class="txt" id="newsTxt"></span></div>
  <div id="fx"></div>
  <div id="panel">
    <div id="row1">
      <div id="money"><small>쓰레기 처리비</small><b id="cash">0원</b></div>
      <button id="launch" aria-label="쓰레기 발사">🚀 쓰레기 발사!<small id="tapInfo">한 번에 1톤</small></button>
    </div>
    <div id="list"></div>
  </div>
  <div id="modal" class="screen" hidden><div class="card" id="modalCard"></div></div>
  <div id="reload" hidden><div class="card"><p>새 버전을 불러오지 못했어요.</p><button class="btn main" onclick="location.reload()">새로고침</button></div></div>
</div>

<script>
  setTimeout(function () { if (!window.trashReady) document.getElementById('reload').hidden = false; }, 4000);
</script>
<script type="module">
import * as L from './logic.js?v=1';

const $ = (id) => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const save = L.loadSave(window.localStorage);
const persist = () => { save.lastSeen = Date.now(); L.storeSave(window.localStorage, save); };

// ---------- 화면 크기 ----------
const W = 180;
let H = 360, SKY_TOP = 60, GROUND = 260, SCENE_BOT = 280, cssScale = 2, maxR = 90;
function resize() {
  const r = app.getBoundingClientRect();
  H = Math.round(W * r.height / r.width);
  cv.width = W; cv.height = H;
  cssScale = r.width / W;
  const topH = $('top').offsetHeight, panelTop = r.height - $('panel').offsetHeight;
  $('news').style.top = `${panelTop - 24}px`;
  SKY_TOP = topH / cssScale;
  SCENE_BOT = (panelTop - 24) / cssScale;
  GROUND = Math.round(SCENE_BOT - Math.max(14, (SCENE_BOT - SKY_TOP) * 0.12));
  maxR = W * 0.5;
  ctx.imageSmoothingEnabled = false;
  city = null; planetCache = null;
}
window.addEventListener('resize', resize);

// ---------- 소리 ----------
let ac = null;
function audio() {
  if (!save.sound) return null;
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { return null; }
  return ac;
}
function tone(freq, dur, { type = 'square', vol = 0.05, to = null, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, { vol = 0.1, from = 2000, to = 200, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'lowpass';
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0);
}
const sfx = {
  launch() { tone(300, 0.16, { to: 900, vol: 0.04 }); noise(0.18, { vol: 0.04, from: 800, to: 3000 }); },
  buy() { [988, 1319].forEach((f, i) => tone(f, 0.1, { vol: 0.04, delay: i * 0.07 })); },
  hit() { noise(0.35, { vol: 0.12, from: 1500, to: 80 }); tone(90, 0.3, { type: 'sine', vol: 0.12, to: 40 }); },
  rumble() { noise(1.2, { vol: 0.06, from: 200, to: 60 }); },
  boom() { noise(2.5, { vol: 0.3, from: 3000, to: 40 }); tone(60, 2.4, { type: 'sine', vol: 0.3, to: 20 }); },
  tick() { tone(660, 0.05, { vol: 0.03 }); },
};
const buzz = (p) => { if (save.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch { /* 없음 */ } };

// ---------- 픽셀 도우미 ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const clamp01 = (x) => Math.max(0, Math.min(1, x));

// ---------- 도시(쇼츠 영상처럼 강가의 빌딩 숲) ----------
let city = null;
function buildCity() {
  const rand = seeded(42), list = [];
  const colors = ['#f0d0b8', '#e8c4ac', '#f4dcc8', '#dcb8a0', '#e0c0b0', '#c8a898'];
  const maxH = (GROUND - SKY_TOP) * 0.42;
  let x = -4;
  while (x < W + 4) {
    const w = 5 + Math.floor(rand() * 10);
    const mid = 1 - Math.abs((x + w / 2) / W - 0.45) * 1.3;
    const h = Math.max(6, Math.round(maxH * (0.25 + 0.6 * rand() * Math.max(0.3, mid))));
    list.push({ x, w, h, col: colors[Math.floor(rand() * colors.length)], fall: 0.7 + rand() * 0.28, back: rand() < 0.45 });
    x += w - (rand() < 0.5 ? 2 : 0);
  }
  // 뾰족한 탑 하나
  list.push({ x: Math.round(W * 0.2), w: 7, h: Math.round(maxH * 1.35), col: '#f4e4d4', fall: 0.9, spire: true, back: false });
  for (const b of list) {
    const [c, g] = mk(b.w, b.h + (b.spire ? 14 : 0));
    const top = b.spire ? 14 : 0;
    R(g, 0, top, b.w, b.h, b.col);
    R(g, 0, top, 1, b.h, '#fff4ea');
    R(g, b.w - 1, top, 1, b.h, '#b89888');
    for (let y = top + 2; y < top + b.h - 2; y += 3) for (let xx = 1; xx < b.w - 1; xx += 2) if (rand() < 0.55) R(g, xx, y, 1, 1, '#a8b8c8');
    if (b.spire) { R(g, b.w / 2 - 1, 0, 1, 14, '#e8e8f0'); R(g, 1, top - 2, b.w - 2, 2, '#e8dccc'); }
    b.img = c;
  }
  const trees = Array.from({ length: 70 }, () => ({ x: rand() * W, s: 2 + Math.floor(rand() * 3), c: ['#4a8a3a', '#6aa040', '#d8b040', '#8ab040'][Math.floor(rand() * 4)] }));
  const clouds = Array.from({ length: 13 }, () => ({ x: rand() * W, y: SKY_TOP + 10 + rand() * (GROUND - SKY_TOP) * 0.6, w: 10 + rand() * 22, v: 0.4 + rand() * 1.2 }));
  city = { list, trees, clouds };
}

// ---------- 쓰레기 행성 ----------
let planetCache = null;
const TRASH = ['#3a9a4a', '#d04040', '#4a7ad0', '#2a2a2a', '#e8e0c8', '#e8c040', '#8a5a3a'];
function planetImage(r) {
  const ri = Math.max(1, Math.round(r));
  if (planetCache && planetCache.r === ri) return planetCache;
  const size = ri * 2 + 2;
  const [c, g] = mk(size, size);
  if (ri <= 2) { R(g, 1, 1, ri * 2, ri * 2, '#d8d0c0'); planetCache = { r: ri, c }; return planetCache; }
  const img = g.getImageData(0, 0, size, size), d = img.data;
  const N = Math.min(ri, 36);   // 반지름당 쓰레기 조각 수: 커질수록 자잘하게
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const base = rgb('#8a8070');
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = x + 0.5 - size / 2, dy = y + 0.5 - size / 2, dd = dx * dx + dy * dy;
    if (dd > ri * ri) continue;
    const nz = Math.sqrt(1 - dd / (ri * ri));
    let light = (-dx / ri) * 0.4 + (-dy / ri) * 0.45 + nz * 0.75;
    light = Math.round(Math.max(0.15, Math.min(1.1, light)) * 5) / 5;
    // 쓰레기 조각: 행성 표면 위치에 고정된 무늬(크기가 변해도 같은 모양)
    const u = Math.floor((dx / ri) * N + 100), v = Math.floor((dy / ri) * N + 100);
    const hsh = hash(u, v);
    let col = base;
    if (hsh < 0.5) col = rgb(TRASH[Math.floor(hash(u + 7, v + 3) * TRASH.length)]);
    else if (hsh < 0.62) col = rgb('#6a6458');
    const i = (y * size + x) * 4;
    for (let k = 0; k < 3; k++) d[i + k] = Math.min(255, col[k] * (0.3 + 0.75 * light));
    d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  planetCache = { r: ri, c };
  return planetCache;
}

// ---------- 상태 ----------
const shots = [], parts = [], meteors = [];
let shake = 0, flash = 0, flashColor = '#ffffff', ending = null, spawnAcc = 0, rumbleT = 0, lastNews = '';
const planetPos = () => [W / 2, SKY_TOP + (GROUND - SKY_TOP) * 0.36];

function launchShot(kind, big = false) {
  const x0 = 6 + Math.random() * (W - 12);
  shots.push({ x0, y0: GROUND - 2, t: 0, T: 0.9 + Math.random() * 0.5, kind, big, bend: (Math.random() - 0.5) * 50 });
}
// 탭: 한 번에 보내는 쓰레기
function tapLaunch() {
  if (ending) return;
  audio();
  const n = L.tapPower(save);
  L.addTrash(save, n);
  launchShot(Math.min(L.LAUNCHERS.length - 1, save.tapLv), true);
  sfx.launch(); buzz(8);
  const b = $('launch').getBoundingClientRect(), a = app.getBoundingClientRect();
  pop(`+${L.formatNumber(n)}톤`, b.left - a.left + b.width / 2 + (Math.random() - 0.5) * 60, b.top - a.top + 6);
  checkEnd();
}
function pop(text, x, y) {
  const el = document.createElement('div');
  el.className = 'pop ol'; el.textContent = text;
  el.style.left = `${x}px`; el.style.top = `${y}px`;
  $('fx').appendChild(el);
  setTimeout(() => el.remove(), 800);
}
function burst(x, y, n, colors, speed, life, g = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, life: life * (0.6 + Math.random() * 0.6), max: life, c: colors[i % colors.length], s: 1 + Math.floor(Math.random() * 2) });
  }
}
function checkEnd() {
  if (!ending && save.mass >= L.END_MASS) { ending = { t: 0 }; sfx.rumble(); persist(); }
}

// ---------- 갱신 ----------
let uiT = 0;
function update(dt) {
  const p = L.progress(save.mass);
  if (!ending) {
    const rate = L.totalRate(save);
    L.addTrash(save, rate * dt);
    save.time += dt;
    // 자동 발사 모습: 생산이 클수록 자주(초당 최대 7개), 높은 단계 발사대가 더 자주 보인다
    if (rate > 0) {
      spawnAcc += dt * Math.min(7, 0.6 + Math.log10(1 + rate) * 0.9);
      while (spawnAcc >= 1) {
        spawnAcc -= 1;
        let pick = 0, sum = 0;
        const total = L.LAUNCHERS.reduce((s, _, i) => s + Math.sqrt(L.launcherRate(save, i)), 0);
        let rr = Math.random() * total;
        for (let i = 0; i < L.LAUNCHERS.length; i++) { sum += Math.sqrt(L.launcherRate(save, i)); if (rr <= sum) { pick = i; break; } }
        launchShot(pick);
      }
    }
    checkEnd();
  }
  // 날아가는 쓰레기
  const [px, py] = planetPos(), r = L.apparentRadius(p, maxR);
  for (const s of shots) {
    s.t += dt;
    if (s.t >= s.T && !s.done) {
      s.done = true;
      const k = 0.85;
      burst(px + (s.x0 - px) * 0.1, py + r * k, s.big ? 6 : 3, TRASH, 12, 0.4);
    }
  }
  for (let i = shots.length - 1; i >= 0; i--) if (shots[i].done) shots.splice(i, 1);
  if (shots.length > 60) shots.splice(0, shots.length - 60);
  // 다가올수록: 운석, 땅울림
  if (p > 0.82 && !ending) {
    if (Math.random() < dt * (p - 0.8) * 12) meteors.push({ x0: px + (Math.random() - 0.5) * r, y0: py + r * 0.6, x1: 6 + Math.random() * (W - 12), t: 0, T: 0.8 + Math.random() * 0.6 });
    rumbleT -= dt;
    if (p > 0.7 && rumbleT <= 0) { rumbleT = 6 - 4 * p; sfx.rumble(); }
  }
  shake = Math.max(shake * Math.pow(0.02, dt), p > 0.7 ? (p - 0.7) * 6 : 0);
  for (const m of meteors) {
    m.t += dt;
    if (m.t >= m.T && !m.done) { m.done = true; burst(m.x1, GROUND - 4, 14, ['#ffd23f', '#ff7a20', '#5a4a40', '#e8e0d0'], 30, 0.7, 40); shake = Math.max(shake, 3); sfx.hit(); }
  }
  for (let i = meteors.length - 1; i >= 0; i--) if (meteors[i].done) meteors.splice(i, 1);
  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  flash *= Math.pow(0.05, dt);
  if (ending) updateEnding(dt);
  uiT -= dt;
  if (uiT <= 0) { uiT = 0.2; refreshList(); }
  updateTop(p);
}

function updateEnding(dt) {
  const e = ending;
  e.t += dt;
  shake = e.t < 3 ? 2 + e.t * 4 : Math.max(0, 14 - (e.t - 3) * 8);
  if (e.t < 3 && Math.random() < dt * 14) {
    const [px, py] = planetPos();
    meteors.push({ x0: px + (Math.random() - 0.5) * W, y0: py + maxR * 0.5, x1: Math.random() * W, t: 0, T: 0.5 + Math.random() * 0.4 });
  }
  if (e.t >= 2.8 && !e.boom) { e.boom = true; sfx.boom(); buzz([200, 80, 300]); }
  if (e.t >= 6.5 && !e.shown) { e.shown = true; showEnd(); }
}

function updateTop(p) {
  const km = ending ? 0 : Math.ceil(L.distanceKm(p));
  $('km').textContent = km.toLocaleString('en-US');
  $('dist').classList.toggle('danger', p > 0.85);
  $('mass').textContent = L.formatNumber(save.mass);
  $('rate').textContent = L.formatRate(L.totalRate(save));
  $('cash').textContent = `${L.formatNumber(save.money)}원`;
  $('tapInfo').textContent = `한 번에 ${L.formatNumber(L.tapPower(save))}톤`;
  const news = L.currentNews(p);
  if (news !== lastNews) { lastNews = news; $('newsTxt').textContent = news; }
}

// ---------- 그리기 ----------
function render() {
  if (!city) buildCity();
  const p = ending ? 1 : L.progress(save.mass);
  const danger = clamp01((p - 0.78) / 0.22);
  const sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake;
  ctx.save(); ctx.translate(Math.round(sx), Math.round(sy));

  // 하늘: 맑은 파랑 → 위험할수록 붉게
  const g = ctx.createLinearGradient(0, SKY_TOP, 0, GROUND);
  g.addColorStop(0, mixHex('#3a7ad8', '#3a0a14', danger));
  g.addColorStop(1, mixHex('#b4dcf4', '#ff8a3a', danger));
  ctx.fillStyle = g; ctx.fillRect(-10, 0, W + 20, H);

  // 쓰레기 행성: 처음엔 점, 다가올수록 커진다
  const [px, py] = planetPos();
  let r = L.apparentRadius(p, maxR);
  if (ending) r = maxR * (1 + Math.min(3, ending.t * ending.t * 0.35));
  if (danger > 0) {
    const gl = ctx.createRadialGradient(px, py, r * 0.9, px, py, r * (1.25 + 0.2 * danger));
    gl.addColorStop(0, `rgba(255,140,60,${0.5 * danger})`); gl.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(px, py, r * 1.5, 0, Math.PI * 2); ctx.fill();
  }
  const pl = planetImage(Math.min(r, 400));
  const pr = pl.r, scale = r / pr;
  ctx.drawImage(pl.c, Math.round(px - (pr + 1) * scale), Math.round(py - (pr + 1) * scale), Math.round(pl.c.width * scale), Math.round(pl.c.height * scale));

  // 구름: 절반쯤 오면 행성 쪽으로 끌려간다
  const pull = clamp01((p - 0.5) / 0.4);
  for (const c of city.clouds) {
    c.x += c.v * 0.016 * (1 + pull * 4);
    if (c.x > W + 30) c.x = -30;
    const x = c.x + (px - c.x) * pull * 0.35, y = c.y + (py - c.y) * pull * 0.35;
    const w = c.w * (1 + pull * 0.5);
    ctx.fillStyle = mixHex('#ffffff', '#ffb080', danger);
    ctx.fillRect(Math.round(x - w / 2), Math.round(y - w * 0.12), Math.round(w), Math.round(w * 0.24));
    ctx.fillRect(Math.round(x - w * 0.25), Math.round(y - w * 0.24), Math.round(w * 0.45), Math.round(w * 0.14));
    ctx.fillStyle = mixHex('#f0c8d8', '#c05030', danger);
    ctx.fillRect(Math.round(x - w / 2), Math.round(y + w * 0.08), Math.round(w), Math.max(1, Math.round(w * 0.05)));
  }

  // 날아가는 쓰레기
  for (const s of shots) {
    const k = Math.min(1, s.t / s.T), e = k * k * (3 - 2 * k);
    const x = s.x0 + (px - s.x0) * e + Math.sin(k * Math.PI) * s.bend * 0.3;
    const y = s.y0 + (py + r * 0.8 - s.y0) * e;
    drawShot(s, x, y, 1 - k * 0.6);
  }
  // 운석
  for (const m of meteors) {
    const k = Math.min(1, m.t / m.T);
    const x = m.x0 + (m.x1 - m.x0) * k, y = m.y0 + (GROUND - 4 - m.y0) * k * k;
    for (let i = 0; i < 5; i++) { ctx.fillStyle = ['#fff6c0', '#ffd23f', '#ff8a20', '#e04020', '#803020'][i]; ctx.fillRect(Math.round(x - (m.x1 - m.x0) * 0.02 * i), Math.round(y - 3 * i), 3 - Math.floor(i / 2), 3 - Math.floor(i / 2)); }
  }

  // 도시: 뒤쪽 빌딩 → 앞쪽 빌딩. 지진이 나면 하나씩 무너져 내린다
  const sink = (b) => clamp01((p - b.fall) / 0.06);
  for (const pass of [true, false]) {
    for (const b of city.list) {
      if (b.back !== pass) continue;
      const s = ending ? Math.max(sink(b), clamp01(ending.t / 2.5)) : sink(b);
      const h = b.img.height;
      ctx.save(); ctx.beginPath(); ctx.rect(-10, 0, W + 20, GROUND); ctx.clip();
      ctx.globalAlpha = pass ? 0.85 : 1;
      const jit = s > 0 && s < 1 ? (Math.random() - 0.5) * 2 : 0;
      ctx.drawImage(b.img, Math.round(b.x + jit), Math.round(GROUND - h + s * h));
      ctx.restore();
      if (s > 0 && s < 1 && Math.random() < 0.3) parts.push({ x: b.x + Math.random() * b.w, y: GROUND - h * (1 - s), vx: (Math.random() - 0.5) * 10, vy: -5, g: 0, life: 0.8, max: 0.8, c: '#e0d0c0', s: 2 });
    }
  }
  ctx.globalAlpha = 1;
  for (const t of city.trees) { ctx.fillStyle = t.c; ctx.fillRect(Math.round(t.x), GROUND - t.s, t.s, t.s); }
  // 강: 다가올수록 물이 차오른다(조석)
  const rise = Math.round(clamp01((p - 0.6) / 0.4) * 10);
  const wy = GROUND - rise;
  ctx.fillStyle = mixHex('#7a9ac0', '#a05040', danger * 0.7); ctx.fillRect(-10, wy, W + 20, H - wy);
  ctx.globalAlpha = 0.35;
  for (const b of city.list) { if (b.back) continue; const s = sink(b); const hh = Math.round(b.img.height * (1 - s) * 0.5); if (hh > 0) ctx.drawImage(b.img, 0, 0, b.img.width, b.img.height, Math.round(b.x), wy + 1, b.img.width, hh); }
  ctx.globalAlpha = 1;
  const tw = performance.now() / 400;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let y = wy + 2; y < SCENE_BOT + 4; y += 3) for (let x = (y * 7) % 13; x < W; x += 13) ctx.fillRect(Math.round(x + Math.sin(tw + y) * 2), y, 4, 1);

  for (const q of parts) { ctx.globalAlpha = clamp01(q.life / q.max * 1.4); ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x), Math.round(q.y), q.s, q.s); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 충돌 연출: 하얗게 번쩍 → 우주에서 본 지구가 갈라진다
  if (ending) {
    const t = ending.t;
    if (t > 2.6) {
      const a = t < 3.2 ? (t - 2.6) / 0.6 : Math.max(0, 1 - (t - 3.2) / 1.2);
      if (t > 3.2) drawBrokenEarth(t - 3.2);
      ctx.globalAlpha = a; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
  }
  if (flash > 0.01) { ctx.globalAlpha = flash; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

function drawShot(s, x, y, size) {
  const k = Math.max(1, Math.round((s.big ? 3 : 2) * size + s.kind * 0.25));
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(Math.round(x), Math.round(y + k), 1, k * 2);
  const c = TRASH[s.kind % TRASH.length];
  if (s.kind >= 3 && s.kind <= 5) {   // 로켓 모양
    ctx.fillStyle = '#e8e8f0'; ctx.fillRect(Math.round(x - 1), Math.round(y - k), 2, k * 2);
    ctx.fillStyle = '#ff8a20'; ctx.fillRect(Math.round(x - 1), Math.round(y + k), 2, 2);
  } else {
    ctx.fillStyle = '#2b2638'; ctx.fillRect(Math.round(x - k / 2) - 1, Math.round(y - k / 2) - 1, k + 2, k + 2);
    ctx.fillStyle = c; ctx.fillRect(Math.round(x - k / 2), Math.round(y - k / 2), k, k);
  }
}
function drawBrokenEarth(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const rand = seeded(9);
  for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(255,255,255,${0.3 + rand() * 0.7})`; ctx.fillRect(Math.round(rand() * W), Math.round(rand() * H), 1, 1); }
  const cx = W / 2, cy = H * 0.42, r = W * 0.28, spread = Math.min(1, t / 3) * 26;
  for (let k = 0; k < 6; k++) {
    const a0 = (k / 6) * Math.PI * 2, a1 = ((k + 1) / 6) * Math.PI * 2, am = (a0 + a1) / 2;
    const ox = Math.cos(am) * spread, oy = Math.sin(am) * spread;
    ctx.save(); ctx.translate(cx + ox, cy + oy); ctx.rotate(t * 0.1 * (k % 2 ? 1 : -1));
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a1); ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#2a6ad0'; ctx.fillRect(-r, -r, r * 2, r * 2);
    const lr = seeded(k + 3);
    ctx.fillStyle = '#4aa04a';
    for (let i = 0; i < 6; i++) ctx.fillRect(Math.round((lr() - 0.5) * r * 1.6), Math.round((lr() - 0.5) * r * 1.6), Math.round(4 + lr() * 10), Math.round(3 + lr() * 6));
    ctx.fillStyle = '#ff7a20'; ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  for (let i = 0; i < 40; i++) { const a = rand() * Math.PI * 2, d = r * 0.6 + spread * (1 + rand() * 3); ctx.fillStyle = TRASH[i % TRASH.length]; ctx.fillRect(Math.round(cx + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), 2, 2); }
}

// ---------- 발사대 목록 ----------
function icon(i) {
  const [c, g] = mk(18, 18);
  const ink = '#2b2638';
  const draw = [
    () => { R(g, 5, 7, 8, 8, '#3a6a3a'); R(g, 7, 4, 4, 3, '#3a6a3a'); R(g, 8, 3, 2, 1, '#ffd23f'); R(g, 6, 8, 2, 5, '#5a9a5a'); },
    () => { R(g, 2, 8, 10, 6, '#3a8a5a'); R(g, 12, 9, 4, 5, '#e8e8e8'); R(g, 13, 10, 2, 2, '#8ac0ea'); R(g, 3, 14, 3, 3, ink); R(g, 11, 14, 3, 3, ink); R(g, 3, 5, 6, 3, '#8a5a3a'); },
    () => { R(g, 8, 8, 2, 9, '#8a5a3a'); R(g, 4, 2, 2, 7, '#8a5a3a'); R(g, 12, 2, 2, 7, '#8a5a3a'); R(g, 5, 8, 8, 2, '#8a5a3a'); R(g, 6, 3, 6, 1, '#d04040'); },
    () => { R(g, 7, 2, 4, 11, '#e8e8f0'); R(g, 8, 1, 2, 1, '#d04040'); R(g, 5, 10, 2, 4, '#d04040'); R(g, 11, 10, 2, 4, '#d04040'); R(g, 8, 13, 2, 3, '#ff8a20'); },
    () => { R(g, 2, 13, 14, 4, '#8a8a90'); R(g, 4, 4, 3, 9, '#e8e8f0'); R(g, 11, 6, 3, 7, '#e8e8f0'); R(g, 4, 3, 3, 1, '#d04040'); R(g, 8, 8, 2, 5, '#5a5a60'); },
    () => { R(g, 8, 0, 2, 18, '#c0c8d0'); R(g, 6, 9, 6, 4, '#ffd23f'); R(g, 7, 10, 4, 2, '#3a9a4a'); },
    () => { for (let k = 0; k < 8; k++) R(g, 1 + k, 16 - k, 16 - 2 * k, 1, k % 2 ? '#8a7a5a' : '#6a5a40'); R(g, 6, 11, 2, 2, '#d04040'); R(g, 10, 12, 2, 2, '#4a7ad0'); },
    () => { R(g, 1, 6, 4, 11, '#9a8a80'); R(g, 6, 3, 5, 14, '#b0a090'); R(g, 12, 8, 5, 9, '#8a7a70'); R(g, 7, 6, 1, 1, ink); R(g, 13, 10, 1, 1, ink); },
    () => { R(g, 0, 12, 18, 6, '#3a6ab0'); R(g, 3, 9, 12, 4, '#8a7a5a'); R(g, 5, 8, 3, 2, '#3a9a4a'); R(g, 10, 8, 3, 2, '#d04040'); },
    () => { R(g, 2, 12, 8, 5, '#5a5a60'); R(g, 7, 7, 10, 4, '#3a3a40'); R(g, 14, 6, 3, 6, '#2a2a30'); R(g, 3, 16, 3, 2, ink); R(g, 7, 16, 3, 2, ink); },
  ][i];
  draw();
  return c;
}
let rows = null;
function buildList() {
  const list = $('list');
  list.innerHTML = '';
  rows = [];
  // 탭 강화
  const tapRow = document.createElement('div'); tapRow.className = 'item';
  const tc = document.createElement('canvas'); tc.width = 18; tc.height = 18;
  const tg = tc.getContext('2d'); R(tg, 4, 5, 10, 10, '#4a4a4a'); R(tg, 7, 3, 4, 2, '#4a4a4a'); R(tg, 8, 2, 2, 1, '#ffd23f'); R(tg, 6, 7, 2, 6, '#7a7a7a');
  tapRow.appendChild(tc);
  const ti = document.createElement('div'); ti.className = 'info'; tapRow.appendChild(ti);
  const tb = document.createElement('button'); tapRow.appendChild(tb);
  tb.onclick = () => { if (L.buyTap(save)) { sfx.buy(); persist(); refreshList(); } };
  list.appendChild(tapRow);
  rows.push({ tap: true, info: ti, btn: tb });
  L.LAUNCHERS.forEach((ln, i) => {
    const row = document.createElement('div'); row.className = 'item';
    const c = icon(i); row.appendChild(c);
    const info = document.createElement('div'); info.className = 'info'; row.appendChild(info);
    const btn = document.createElement('button'); row.appendChild(btn);
    btn.onclick = () => { if (L.buyLauncher(save, i)) { sfx.buy(); persist(); refreshList(); } };
    list.appendChild(row);
    rows.push({ i, row, info, btn });
  });
}
function refreshList() {
  if (!rows) buildList();
  const vis = L.visibleLaunchers(save);
  for (const r of rows) {
    if (r.tap) {
      const lv = save.tapLv, c = L.tapCost(lv);
      r.info.innerHTML = `<b>봉투 키우기 <small>Lv.${lv}</small></b><span>버튼 한 번에 보내는 쓰레기 두 배</span><span class="gain">한 번에 ${L.formatNumber(L.tapPower(save))}톤 → ${L.formatNumber(L.tapPower(save) * 2)}톤</span>`;
      r.btn.textContent = `${L.formatNumber(c)}원`; r.btn.disabled = save.money < c;
      continue;
    }
    const i = r.i, ln = L.LAUNCHERS[i], n = save.owned[i];
    r.row.hidden = i > vis;
    const locked = i === vis;
    r.row.classList.toggle('locked', locked);
    if (locked) { r.info.innerHTML = `<b>???</b><span>${L.formatNumber(ln.cost * 0.5)}원을 모으면 공개</span>`; r.btn.textContent = '잠김'; r.btn.disabled = true; continue; }
    const next = L.MILESTONES.find((m) => n < m);
    const c = L.launcherCost(i, n);
    r.info.innerHTML = `<b>${ln.name} <small>× ${n}</small></b><span>${ln.desc}</span><span class="gain">초당 +${L.formatRate(L.nextGain(save, i))}톤${n ? ` · 지금 ${L.formatRate(L.launcherRate(save, i))}톤` : ''}${next ? ` · ${next}개면 ×2` : ''}</span>`;
    r.btn.textContent = `${L.formatNumber(c)}원`; r.btn.disabled = save.money < c;
  }
}

// ---------- 창 ----------
function modal(html, buttons) {
  const card = $('modalCard');
  card.innerHTML = html;
  for (const [label, cls, fn] of buttons) {
    const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.innerHTML = label;
    b.addEventListener('click', () => { sfx.tick(); fn(); });
    card.appendChild(b);
  }
  $('modal').hidden = false;
}
const closeModal = () => { $('modal').hidden = true; };
function fmtTime(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}시간 ${m}분` : `${m}분 ${Math.floor(s % 60)}초`; }
function showEnd() {
  const n = (save.earths || 0) + 1;
  modal(`<h2>지구 멸망!</h2><p>쓰레기 행성이 지구와 부딪혔어요.<br>${n}번째 지구가 사라졌습니다.</p>
    <div class="stats"><span>걸린 시간</span><b>${fmtTime(save.time)}</b><span>보낸 쓰레기</span><b>${L.formatNumber(save.sent)}톤</b>${save.best ? `<span>최고 기록</span><b>${fmtTime(Math.min(save.best, save.time))}</b>` : ''}</div>`, [
    [`새 지구에서 다시<small>모든 생산·발사 영구 ×${2 ** n}</small>`, 'main', () => {
      L.prestige(save); persist(); ending = null; shots.length = 0; meteors.length = 0; parts.length = 0; shake = 0; city = null; planetCache = null; rows = null; refreshList(); closeModal();
    }],
  ]);
}
function settingsHtml() {
  return `<div class="setRow"><span>소리</span><button class="btn" id="setSound">${save.sound ? '켬' : '끔'}</button></div>
    <div class="setRow"><span>진동</span><button class="btn" id="setVib">${save.vibrate ? '켬' : '끔'}</button></div>`;
}
function showSettings() {
  modal(`<h2>환경설정</h2>${settingsHtml()}<p style="font-size:13px">부순 지구 ${save.earths || 0}개 · 생산 ×${L.prestigeMult(save)}</p>`, [
    ['기록 지우기', 'red', () => modal('<h2>기록 지우기</h2><p>질량, 돈, 발사대, 부순 지구가<br>모두 지워져요.</p>', [
      ['지우기', 'red', () => { Object.assign(save, L.defaultSave(), { sound: save.sound, vibrate: save.vibrate }); persist(); ending = null; city = null; rows = null; refreshList(); closeModal(); }],
      ['취소', '', showSettings],
    ])],
    ['닫기', 'main', closeModal],
  ]);
  $('setSound').onclick = () => { save.sound = !save.sound; persist(); $('setSound').textContent = save.sound ? '켬' : '끔'; };
  $('setVib').onclick = () => { save.vibrate = !save.vibrate; persist(); $('setVib').textContent = save.vibrate ? '켬' : '끔'; buzz(20); };
}
function applyOffline() {
  const now = Date.now(), away = (now - (save.lastSeen || now)) / 1000;
  save.lastSeen = now;
  if (away < 30 || ending || L.totalRate(save) <= 0) return;
  const r = L.offlineProgress(save, away);
  persist();
  if (r.tons <= 0) return;
  modal(`<h2>다녀오셨어요!</h2><p>자리를 비운 ${fmtTime(r.seconds)} 동안<br>발사대가 쓰레기 <b>${L.formatNumber(r.tons)}톤</b>을 보내고<br>처리비 <b>${L.formatNumber(r.money)}원</b>을 벌었어요</p>`, [['좋아요', 'main', () => { closeModal(); checkEnd(); }]]);
}

// ---------- 연결 ----------
const lb = $('launch');
lb.addEventListener('pointerdown', (e) => { e.preventDefault(); lb.classList.add('press'); tapLaunch(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) lb.addEventListener(ev, () => lb.classList.remove('press'));
lb.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && $('modal').hidden) { e.preventDefault(); tapLaunch(); } });
$('gear').addEventListener('click', showSettings);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); else applyOffline(); });
setInterval(persist, 3000);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
refreshList();
applyOffline();
checkEnd();
requestAnimationFrame(frame);
window.trashReady = true;
window.__trash = { save, tapLaunch, L };
</script>
</body>
</html>
