<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>쓰레기 행성</title>
<style>
  :root { --cream: #f6ecd0; --ink: #2b2638; --slate: #4a5272; --gold: #ffd23f; --yellow: #fff03a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { display: flex; justify-content: center; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; overflow: hidden; background: #6aa8e8; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ol { text-shadow: -2px 0 #000, 2px 0 #000, 0 -2px #000, 0 2px #000, -2px -2px #000, 2px 2px #000, -2px 2px #000, 2px -2px #000; }

  /* 위쪽 검은 띠: 쇼츠 자막처럼 */
  #top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 44px 8px; background: #000; text-align: center; }
  #title { font: 900 20px/1.2 system-ui, sans-serif; color: var(--yellow); letter-spacing: 1px; white-space: nowrap; }
  #dist { margin-top: 4px; font: 900 18px/1.1 system-ui, sans-serif; white-space: nowrap; }
  #dist b { display: inline-block; min-width: 4.6em; font-size: 40px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  #dist.danger b { color: #ff4a5a; animation: throb 0.9s ease-in-out infinite; }
  @keyframes throb { 50% { transform: scale(1.06); text-shadow: 0 0 14px #ff2a4a; } }
  #stats { margin-top: 6px; font: 800 13px system-ui, sans-serif; color: #cfd8e8; }
  #stats b { color: #fff; }
  #gear { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 8px; width: 34px; height: 34px; padding: 0; border: 2px solid #555; border-radius: 8px; background: #111; color: #ddd; font-size: 17px; }

  #news { position: absolute; left: 0; right: 0; height: 24px; display: flex; align-items: center; background: rgba(0, 0, 0, 0.72); overflow: hidden; pointer-events: none; }
  #news .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 8px; background: #d02a2a; font: 900 13px system-ui, sans-serif; }
  #news .txt { padding-left: 10px; font: 800 13px system-ui, sans-serif; white-space: nowrap; }

  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 43%; display: flex; flex-direction: column;
    background: linear-gradient(#1c1a2e, #121020); border-top: 2px solid #3a3658; padding: 10px 10px env(safe-area-inset-bottom);
  }
  #row1 { display: flex; gap: 10px; align-items: stretch; }
  #money { flex: none; width: 34%; display: flex; flex-direction: column; justify-content: center; padding: 6px 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; }
  #money small { font: 700 11px system-ui, sans-serif; color: #a8a0c8; }
  #money b { font: 900 20px system-ui, sans-serif; color: var(--gold); font-variant-numeric: tabular-nums; }
  #launch {
    position: relative; flex: 1; min-height: 76px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(#ff7a5a, #e8402a); color: #fff; border: none; border-radius: 16px; box-shadow: 0 6px 0 #8a1a10, 0 10px 24px rgba(255, 80, 40, 0.35);
    font: 900 24px system-ui, sans-serif; touch-action: manipulation;
  }
  #launch small { position: absolute; bottom: 9px; left: 0; right: 0; font: 700 11px system-ui, sans-serif; opacity: 0.9; }
  #launch.press { transform: translateY(5px); box-shadow: 0 1px 0 #8a1a10; }
  #list { flex: 1; margin-top: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
  .item .ic { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
  .item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .item .info b { font-size: 15px; }
  .item .info b small { font-size: 12px; color: #a8a0c8; }
  .item .info span { font-size: 11px; line-height: 1.3; color: #a8a4b8; }
  .item .info .gain { color: #7dffb0; font-weight: 800; }
  .item button { flex: none; width: 88px; min-height: 42px; padding: 0 4px; background: var(--gold); color: var(--ink); border: none; border-radius: 10px; box-shadow: 0 3px 0 #8a6a10; font: 900 14px system-ui, sans-serif; }
  .item button:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6a10; }
  .item button:disabled { background: #3a3850; color: #7a7690; box-shadow: none; }
  .item.locked { opacity: 0.55; }
  .pop { position: absolute; transform: translate(-50%, -50%); font: 900 18px system-ui, sans-serif; color: #fff; pointer-events: none; animation: up 0.8s ease-out forwards; white-space: nowrap; }
  @keyframes up { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -220%); } }

  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.72); }
  .card { width: 100%; max-width: 320px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: #1c1a2e; color: #fff; border: 1px solid #4a4670; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
  .card h2 { margin: 0; font: 900 28px system-ui, sans-serif; }
  .card p { margin: 0; text-align: center; line-height: 1.55; font-size: 15px; color: #d8d4e8; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
  .card .stats b { text-align: right; }
  .btn { width: 100%; min-height: 48px; background: #2e2b46; color: #fff; border: 1px solid #4a4670; border-radius: 12px; font: 900 16px system-ui, sans-serif; }
  .btn.main { background: var(--gold); color: var(--ink); border: none; }
  .btn.red { background: #7a2a3a; }
  .btn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.8; }
  .btn:active { transform: translateY(2px); }
  .setRow { width: 100%; display: flex; align-items: center; justify-content: space-between; font: 800 16px system-ui, sans-serif; }
  .setRow .btn { width: 100px; min-height: 40px; }
  #reload { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="top">
    <div id="title" class="ol">쓰레기 행성이 지구에 떨어지면</div>
    <div id="dist">지구까지 <b id="km">384,400</b> km</div>
    <div id="stats">질량 <b id="mass">0</b>톤 · 초당 <b id="rate">0</b>톤</div>
    <button id="gear" aria-label="환경설정">⚙</button>
  </div>
  <div id="news"><span class="tag">속보</span><span class="txt" id="newsTxt"></span></div>
  <div id="fx"></div>
  <div id="panel">
    <div id="row1">
      <div id="money"><small>쓰레기 처리비</small><b id="cash">0원</b></div>
      <button id="launch" aria-label="쓰레기 발사">🚀 쓰레기 발사!<small id="tapInfo">한 번에 1톤</small></button>
    </div>
    <div id="list"></div>
  </div>
  <div id="modal" class="screen" hidden><div class="card" id="modalCard"></div></div>
  <div id="reload" hidden><div class="card"><p>새 버전을 불러오지 못했어요.</p><button class="btn main" onclick="location.reload()">새로고침</button></div></div>
</div>

<script>
  setTimeout(function () { if (!window.trashReady) document.getElementById('reload').hidden = false; }, 4000);
</script>
<script type="module">
import * as L from './logic.js?v=2';

const $ = (id) => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const save = L.loadSave(window.localStorage);
const persist = () => { save.lastSeen = Date.now(); L.storeSave(window.localStorage, save); };
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, k) => a + (b - a) * k;
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return '#' + [16, 8, 0].map((s) => ch(s).toString(16).padStart(2, '0')).join('');   // 다시 섞을 수 있게 #rrggbb로
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// ---------- 화면 크기: 기기의 실제 해상도로 그린다(행성이 커지면 디테일이 늘어날 뿐 픽셀이 커지지 않음) ----------
let CW = 390, CH = 780, DPR = 2, SKY_TOP = 120, GROUND = 500, SCENE_BOT = 520, maxR = 195;
function resize() {
  const r = app.getBoundingClientRect();
  DPR = Math.min(3, window.devicePixelRatio || 1);
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  const topH = $('top').offsetHeight, panelTop = CH - $('panel').offsetHeight;
  $('news').style.top = `${panelTop - 24}px`;
  SKY_TOP = topH;
  SCENE_BOT = panelTop - 24;
  GROUND = Math.round(SCENE_BOT - Math.max(34, (SCENE_BOT - SKY_TOP) * 0.13));
  maxR = CW * 0.5;
  city = null;
}
window.addEventListener('resize', resize);

// ---------- 소리 ----------
let ac = null;
function audio() {
  if (!save.sound) return null;
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { return null; }
  return ac;
}
function tone(freq, dur, { type = 'sine', vol = 0.05, to = null, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.05, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, { vol = 0.1, from = 2000, to = 200, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'lowpass';
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0);
}
const sfx = {
  launch() { tone(320, 0.18, { type: 'triangle', to: 900, vol: 0.05 }); noise(0.2, { vol: 0.03, from: 800, to: 3000 }); },
  buy() { [988, 1319].forEach((f, i) => tone(f, 0.12, { type: 'triangle', vol: 0.05, delay: i * 0.07 })); },
  hit() { noise(0.4, { vol: 0.12, from: 1500, to: 80 }); tone(90, 0.35, { vol: 0.12, to: 40 }); },
  // 행성의 낮은 울음: 다가올수록 자주, 낮게
  groan(p) { tone(70 - 30 * p, 2.2, { type: 'sawtooth', vol: 0.025 + 0.04 * p, to: 40 - 15 * p }); tone(105 - 40 * p, 2.2, { vol: 0.03, to: 60 }); },
  heartbeat() { tone(55, 0.18, { vol: 0.12, to: 40 }); tone(50, 0.2, { vol: 0.1, to: 38, delay: 0.25 }); },
  boom() { noise(3, { vol: 0.3, from: 3000, to: 40 }); tone(60, 2.8, { vol: 0.3, to: 20 }); },
  tick() { tone(660, 0.05, { type: 'triangle', vol: 0.03 }); },
};
const buzz = (p) => { if (save.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch { /* 없음 */ } };

// ---------- 행성 표면 결: 반복되는 잔 무늬(화면 해상도 그대로 깔아서 커져도 흐려지거나 깍두기가 되지 않게) ----------
function makeNoiseTile(size, seed) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  const rand = seeded(seed);
  const grid = (n) => { const a = new Float32Array(n * n); for (let i = 0; i < a.length; i++) a[i] = rand(); return a; };
  const octs = [[8, 0.5], [16, 0.25], [32, 0.15], [64, 0.1]].map(([n, w]) => ({ n, w, g: grid(n) }));
  const smooth = (t) => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let v = 0;
    for (const o of octs) {
      const fx = x / size * o.n, fy = y / size * o.n, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = smooth(fx - x0), ty = smooth(fy - y0), at = (i, j) => o.g[((j % o.n) * o.n + (i % o.n))];
      v += o.w * lerp(lerp(at(x0, y0), at(x0 + 1, y0), tx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), tx), ty);
    }
    const i = (y * size + x) * 4, k = Math.round(v * 255);
    d[i] = d[i + 1] = d[i + 2] = k; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
const noiseTile = makeNoiseTile(256, 7);
let noisePat = null;

// 행성의 핏줄(눈에서 뻗어 나가는 빛나는 균열): 행성 반지름 기준 좌표로 미리 만든다
const veins = (() => {
  const rand = seeded(13), list = [];
  for (let k = 0; k < 11; k++) {
    const pts = [[0, 0]];
    let a = (k / 11) * TAU + rand() * 0.4, x = 0, y = 0;
    for (let s = 0; s < 14; s++) { a += (rand() - 0.5) * 0.9; const st = 0.05 + rand() * 0.04; x += Math.cos(a) * st; y += Math.sin(a) * st * 0.8; pts.push([x, y]); }
    list.push({ pts, w: 0.6 + rand() * 0.8, ph: rand() * TAU });
  }
  return list;
})();

// ---------- 도시(강가의 빌딩 숲) ----------
let city = null;
function buildCity() {
  const rand = seeded(42), list = [];
  const maxH = (GROUND - SKY_TOP) * 0.42;
  const tones = [['#f6dcc8', '#d8b4a0'], ['#f0d0bc', '#ccA894'], ['#fae6d6', '#dcbcaa'], ['#e8c8b4', '#c4a08c'], ['#f2d8cc', '#d0b0a4']];
  for (const back of [true, false]) {
    let x = -10;
    while (x < CW + 10) {
      const w = (back ? 14 : 12) + rand() * 26;
      const mid = 1 - Math.abs((x + w / 2) / CW - 0.42) * 1.2;
      const h = Math.max(14, maxH * (back ? 0.35 : 0.2) + maxH * 0.65 * rand() * Math.max(0.25, mid));
      list.push({ x, w, h, tone: tones[Math.floor(rand() * tones.length)], back, fall: 0.74 + rand() * 0.24, seed: rand() * 1e6 });
      x += w * (0.7 + rand() * 0.4);
    }
  }
  list.push({ x: CW * 0.18, w: 22, h: maxH * 1.45, tone: ['#fbeee2', '#d8c4b4'], back: false, fall: 0.93, spire: true, seed: 5 });
  for (const b of list) {
    const extra = b.spire ? 46 : 0;
    const c = document.createElement('canvas'); c.width = Math.ceil(b.w * DPR); c.height = Math.ceil((b.h + extra) * DPR);
    const g = c.getContext('2d'); g.scale(DPR, DPR);
    const gr = g.createLinearGradient(0, extra, b.w, extra);
    gr.addColorStop(0, b.tone[0]); gr.addColorStop(0.7, b.tone[0]); gr.addColorStop(1, b.tone[1]);
    g.fillStyle = gr; g.fillRect(0, extra, b.w, b.h);
    const r2 = seeded(b.seed);
    g.fillStyle = 'rgba(120,140,170,0.35)';
    for (let y = extra + 4; y < extra + b.h - 3; y += 4.5) for (let xx = 2; xx < b.w - 3; xx += 3.5) if (r2() < 0.7) g.fillRect(xx, y, 1.6, 2.2);
    if (b.spire) { g.fillStyle = '#e4e8f0'; g.fillRect(b.w / 2 - 0.8, 0, 1.6, extra); g.fillStyle = b.tone[0]; g.fillRect(3, extra - 6, b.w - 6, 6); }
    b.img = c; b.extra = extra;
  }
  const trees = Array.from({ length: Math.round(CW / 4) }, () => ({ x: rand() * CW, r: 2 + rand() * 3, c: ['#5a8a3a', '#7aa040', '#d8b040', '#9ab040', '#c89a30'][Math.floor(rand() * 5)] }));
  const clouds = Array.from({ length: 9 }, () => ({ x: rand() * CW, y: SKY_TOP + (GROUND - SKY_TOP) * (0.55 + rand() * 0.3), s: 14 + rand() * 26, v: 2 + rand() * 6, seed: rand() * 1e6 }));
  for (const c of clouds) {
    const r2 = seeded(c.seed), blobs = Array.from({ length: 6 }, () => [(r2() - 0.5) * c.s * 1.6, (r2() - 0.6) * c.s * 0.35, c.s * (0.28 + r2() * 0.25)]);
    c.blobs = blobs;
  }
  const stars = Array.from({ length: 140 }, () => ({ x: rand() * CW, y: SKY_TOP + rand() * (GROUND - SKY_TOP), b: rand() }));
  city = { list, trees, clouds, stars };
}

// ---------- 상태 ----------
const shots = [], parts = [], meteors = [];
let shake = 0, flash = 0, ending = null, spawnAcc = 0, groanT = 3, beatT = 0, lastNews = '', gulp = 0, blink = 0, nextBlink = 4;
const planetPos = () => [CW / 2, SKY_TOP + (GROUND - SKY_TOP) * 0.36];
const SHOT_COLORS = ['#7dffb0', '#ffd23f', '#7ad0ff', '#ff8ab0', '#ffffff', '#c8a0ff'];

function launchShot(big = false) {
  shots.push({ x0: 10 + Math.random() * (CW - 20), y0: GROUND - 4, t: 0, T: 1.1 + Math.random() * 0.6, big, bend: (Math.random() - 0.5) * 120, c: SHOT_COLORS[Math.floor(Math.random() * SHOT_COLORS.length)], ang: Math.random() * TAU });
}
function tapLaunch() {
  if (ending) return;
  audio();
  const n = L.tapPower(save);
  L.addTrash(save, n);
  launchShot(true);
  sfx.launch(); buzz(8);
  const b = $('launch').getBoundingClientRect(), a = app.getBoundingClientRect();
  pop(`+${L.formatNumber(n)}톤`, b.left - a.left + b.width / 2 + (Math.random() - 0.5) * 60, b.top - a.top + 6);
  checkEnd();
}
function pop(text, x, y) {
  const el = document.createElement('div');
  el.className = 'pop ol'; el.textContent = text;
  el.style.left = `${x}px`; el.style.top = `${y}px`;
  $('fx').appendChild(el);
  setTimeout(() => el.remove(), 800);
}
function burst(x, y, n, colors, speed, life, g = 0, size = 2) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = speed * (0.3 + Math.random() * 0.8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, life: life * (0.6 + Math.random() * 0.6), max: life, c: colors[i % colors.length], s: size * (0.6 + Math.random() * 0.8) });
  }
}
function checkEnd() {
  if (!ending && save.mass >= L.END_MASS) { ending = { t: 0 }; persist(); }
}

// ---------- 갱신 ----------
let uiT = 0;
function update(dt) {
  const p = L.progress(save.mass);
  if (!ending) {
    const rate = L.totalRate(save);
    L.addTrash(save, rate * dt);
    save.time += dt;
    if (rate > 0) {
      spawnAcc += dt * Math.min(8, 0.6 + Math.log10(1 + rate) * 0.9);
      while (spawnAcc >= 1) { spawnAcc -= 1; launchShot(); }
    }
    checkEnd();
  }
  const [px, py] = planetPos(), r = L.apparentRadius(p, maxR);
  for (const s of shots) {
    s.t += dt;
    if (s.t >= s.T && !s.done) { s.done = true; gulp = Math.min(1, gulp + (s.big ? 0.25 : 0.08)); }
  }
  for (let i = shots.length - 1; i >= 0; i--) if (shots[i].done) shots.splice(i, 1);
  if (shots.length > 70) shots.splice(0, shots.length - 70);
  gulp *= Math.pow(0.05, dt);

  // 눈 깜빡임
  nextBlink -= dt;
  if (nextBlink <= 0) { blink = 0.25; nextBlink = 3 + Math.random() * 6; }
  blink = Math.max(0, blink - dt);

  if (!ending) {
    groanT -= dt;
    if (p > 0.4 && groanT <= 0) { groanT = 14 - 10 * p; sfx.groan(p); }
    if (p > 0.88) { beatT -= dt; if (beatT <= 0) { beatT = 1.4 - 0.6 * p; sfx.heartbeat(); } }
    if (p > 0.8 && Math.random() < dt * (p - 0.78) * 10) meteors.push({ x0: px + (Math.random() - 0.5) * r, y0: py + r * 0.7, x1: 10 + Math.random() * (CW - 20), t: 0, T: 0.9 + Math.random() * 0.6 });
  }
  shake = Math.max(shake * Math.pow(0.02, dt), p > 0.72 ? (p - 0.72) * 10 : 0);
  for (const m of meteors) {
    m.t += dt;
    if (m.t >= m.T && !m.done) { m.done = true; burst(m.x1, GROUND - 6, 22, ['#fff2c0', '#ffb040', '#ff5a20', '#6a4a40'], 70, 0.8, 90, 2.5); shake = Math.max(shake, 5); sfx.hit(); }
  }
  for (let i = meteors.length - 1; i >= 0; i--) if (meteors[i].done) meteors.splice(i, 1);
  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  flash *= Math.pow(0.05, dt);
  if (ending) updateEnding(dt);
  uiT -= dt;
  if (uiT <= 0) { uiT = 0.2; refreshList(); }
  updateTop(p);
}
function updateEnding(dt) {
  const e = ending;
  e.t += dt;
  shake = e.t < 3 ? 3 + e.t * 6 : Math.max(0, 20 - (e.t - 3) * 10);
  if (e.t < 0.1 && !e.g) { e.g = true; sfx.groan(1); }
  if (e.t < 3 && Math.random() < dt * 16) {
    const [px, py] = planetPos();
    meteors.push({ x0: px + (Math.random() - 0.5) * CW, y0: py + maxR * 0.6, x1: Math.random() * CW, t: 0, T: 0.5 + Math.random() * 0.4 });
  }
  if (e.t >= 2.8 && !e.boom) { e.boom = true; sfx.boom(); buzz([200, 80, 300]); }
  if (e.t >= 6.5 && !e.shown) { e.shown = true; showEnd(); }
}
function updateTop(p) {
  $('km').textContent = (ending ? 0 : Math.ceil(L.distanceKm(p))).toLocaleString('en-US');
  $('dist').classList.toggle('danger', p > 0.85);
  $('mass').textContent = L.formatNumber(save.mass);
  $('rate').textContent = L.formatRate(L.totalRate(save));
  $('cash').textContent = `${L.formatNumber(save.money)}원`;
  $('tapInfo').textContent = `한 번에 ${L.formatNumber(L.tapPower(save))}톤`;
  const news = L.currentNews(p);
  if (news !== lastNews) { lastNews = news; $('newsTxt').textContent = news; }
}

// ---------- 그리기 ----------
function render(now) {
  if (!city) buildCity();
  const t = now / 1000;
  const p = ending ? 1 : L.progress(save.mass);
  const dread = clamp01((p - 0.55) / 0.45);      // 공포가 짙어지는 정도
  const danger = clamp01((p - 0.78) / 0.22);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);

  // 하늘: 맑은 낮 → 행성이 해를 가려 어두워지고 → 보랏빛·핏빛
  const g = ctx.createLinearGradient(0, SKY_TOP, 0, GROUND);
  g.addColorStop(0, mix(mix('#3d7fdc', '#1a1238', dread), '#2a0610', danger));
  g.addColorStop(0.65, mix(mix('#8cc0ee', '#5a3a7a', dread), '#a0281a', danger));
  g.addColorStop(1, mix(mix('#cfe6f6', '#c08aa0', dread), '#ff8a3a', danger));
  ctx.fillStyle = g; ctx.fillRect(-30, 0, CW + 60, CH);
  // 낮인데 별이 보이기 시작한다
  if (dread > 0) {
    for (const s of city.stars) { ctx.globalAlpha = dread * (0.3 + 0.7 * s.b) * (0.7 + 0.3 * Math.sin(t * 2 + s.x)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.b > 0.85 ? 1.6 : 1, s.b > 0.85 ? 1.6 : 1); }
    ctx.globalAlpha = 1;
  }

  const [px, py] = planetPos();
  let R = L.apparentRadius(p, maxR);
  if (ending) R = maxR * (1 + Math.min(4, ending.t * ending.t * 0.4));
  R *= 1 + (0.012 * Math.sin(t * 1.6) * dread) + gulp * 0.015;   // 숨 쉬듯 맥동, 삼킬 때 살짝 부풂
  drawTendrils(px, py, R, t, p, false);
  drawPlanet(px, py, R, t, p, dread, danger);
  drawTendrils(px, py, R, t, p, true);

  // 구름: 절반을 넘으면 행성 쪽으로 빨려 올라간다
  const pull = clamp01((p - 0.5) / 0.45);
  for (const c of city.clouds) {
    c.x += c.v * 0.016 * (1 + pull * 5);
    if (c.x > CW + 80) c.x = -80;
    // 행성에 빨려 올라가며 옅어진다(행성을 가리지 않게)
    const x = lerp(c.x, px, pull * 0.4), y = lerp(c.y, py, pull * 0.4);
    ctx.globalAlpha = 1 - pull * 0.8;
    const top = mix(mix('#ffffff', '#e8c8e8', dread), '#ffb080', danger);
    for (const [bx, by, br] of c.blobs) {
      const gx = x + bx * (1 + pull * 0.6), gy = y + by;
      const gr = ctx.createRadialGradient(gx, gy - br * 0.3, br * 0.1, gx, gy, br);
      gr.addColorStop(0, top); gr.addColorStop(0.7, top); gr.addColorStop(1, rgba('#ffffff', 0));
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(gx, gy, br, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 날아가는 쓰레기: 빛 꼬리를 끌며 올라가 행성 둘레를 돌며 삼켜진다
  for (const s of shots) {
    const k = Math.min(1, s.t / s.T);
    let x, y;
    if (k < 0.75) {
      const e = k / 0.75, ee = e * e * (3 - 2 * e);
      const tx = px + Math.cos(s.ang) * R * 1.6, ty = py + Math.sin(s.ang) * R * 0.45;
      x = lerp(s.x0, tx, ee) + Math.sin(e * Math.PI) * s.bend; y = lerp(s.y0, ty, ee);
    } else {
      const e = (k - 0.75) / 0.25, a = s.ang + e * 3, rr = lerp(1.6, 0.2, e);
      x = px + Math.cos(a) * R * rr; y = py + Math.sin(a) * R * rr * 0.28;
    }
    const sz = (s.big ? 2.6 : 1.8);
    const gl = ctx.createRadialGradient(x, y, 0, x, y, sz * 4);
    gl.addColorStop(0, rgba('#ffffff', 0.9)); gl.addColorStop(0.3, rgba(s.c.length === 7 ? s.c : '#ffffff', 0.6)); gl.addColorStop(1, rgba('#ffffff', 0));
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, sz * 4, 0, TAU); ctx.fill();
    if (s.lx != null) { ctx.strokeStyle = rgba(s.c, 0.5); ctx.lineWidth = sz; ctx.beginPath(); ctx.moveTo(s.lx, s.ly); ctx.lineTo(x, y); ctx.stroke(); }
    s.lx = x; s.ly = y;
  }

  // 운석
  for (const m of meteors) {
    const k = Math.min(1, m.t / m.T);
    const x = lerp(m.x0, m.x1, k), y = lerp(m.y0, GROUND - 6, k * k);
    const tx = lerp(m.x0, m.x1, Math.max(0, k - 0.12)), ty = lerp(m.y0, GROUND - 6, Math.max(0, k - 0.12) ** 2);
    const lg = ctx.createLinearGradient(tx, ty, x, y);
    lg.addColorStop(0, 'rgba(255,90,30,0)'); lg.addColorStop(1, 'rgba(255,230,160,0.95)');
    ctx.strokeStyle = lg; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, TAU); ctx.fill();
  }

  // 도시: 지진이 나면 하나씩 무너져 내린다
  const sink = (b) => ending ? Math.max(clamp01((p - b.fall) / 0.07), clamp01(ending.t / 2.5)) : clamp01((p - b.fall) / 0.07);
  const haze = mix(mix('#c8dcf0', '#7a5a8a', dread), '#c05030', danger);
  for (const b of city.list) {
    const s = sink(b), h = b.h + b.extra;
    ctx.save(); ctx.beginPath(); ctx.rect(-30, 0, CW + 60, GROUND); ctx.clip();
    const jit = s > 0 && s < 1 ? (Math.random() - 0.5) * 2 : 0;
    ctx.drawImage(b.img, b.x + jit, GROUND - h + s * h, b.w, h);
    if (b.back || dread > 0) { ctx.globalAlpha = b.back ? 0.35 + dread * 0.3 : dread * 0.35; ctx.fillStyle = haze; ctx.fillRect(b.x + jit, GROUND - h + s * h, b.w, h); ctx.globalAlpha = 1; }
    ctx.restore();
    if (s > 0 && s < 1 && Math.random() < 0.25) parts.push({ x: b.x + Math.random() * b.w, y: GROUND - h * (1 - s), vx: (Math.random() - 0.5) * 20, vy: -8, g: 0, life: 1, max: 1, c: 'rgba(230,214,200,0.8)', s: 3 + Math.random() * 4 });
  }
  for (const tr of city.trees) { ctx.fillStyle = mix(tr.c, '#3a2020', danger * 0.6); ctx.beginPath(); ctx.arc(tr.x, GROUND - tr.r * 0.6, tr.r, 0, TAU); ctx.fill(); }

  // 강: 다가올수록 물이 차오르고(조석) 하늘빛을 비춘다
  const rise = clamp01((p - 0.62) / 0.38) * 18;
  const wy = GROUND - rise;
  const wg = ctx.createLinearGradient(0, wy, 0, SCENE_BOT + 24);
  wg.addColorStop(0, mix(mix('#8eb0d0', '#5a4a7a', dread), '#8a3020', danger)); wg.addColorStop(1, mix(mix('#4a6a90', '#201838', dread), '#401010', danger));
  ctx.fillStyle = wg; ctx.fillRect(-30, wy, CW + 60, CH);
  ctx.save(); ctx.globalAlpha = 0.28; ctx.translate(0, wy * 2); ctx.scale(1, -1);
  for (const b of city.list) { if (b.back) continue; const s = sink(b), h = (b.h + b.extra) * (1 - s); if (h > 1) ctx.drawImage(b.img, 0, s * b.img.height, b.img.width, b.img.height * (1 - s), b.x, wy - h, b.w, h); }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let y = wy + 3; y < SCENE_BOT + 24; y += 4) for (let x = ((y * 13) % 37) - 20; x < CW; x += 37) ctx.fillRect(x + Math.sin(t * 1.5 + y) * 4, y, 10 + (y % 7), 1);

  for (const q of parts) { ctx.globalAlpha = clamp01(q.life / q.max * 1.4); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 충돌: 행성이 하늘을 삼키고 → 하얗게 번쩍 → 우주에서 본 지구가 갈라진다
  if (ending) {
    const e = ending.t;
    if (e > 2.6) {
      if (e > 3.2) drawBrokenEarth(e - 3.2);
      const a = e < 3.2 ? (e - 2.6) / 0.6 : Math.max(0, 1 - (e - 3.2) / 1.4);
      ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, CW, CH); ctx.globalAlpha = 1;
    }
  }
  if (flash > 0.01) { ctx.globalAlpha = flash; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, CW, CH); ctx.globalAlpha = 1; }
}

// 행성: 사파이어빛 가스 행성. 쓰레기를 먹을수록 커지고, 폭풍이 눈이 되어 뜨이고, 핏줄이 빛난다.
function drawPlanet(cx, cy, R, t, p, dread, danger) {
  // 바깥 기운
  const auraR = R * (1.35 + 0.25 * dread);
  const ag = ctx.createRadialGradient(cx, cy, R * 0.92, cx, cy, auraR);
  ag.addColorStop(0, rgba(dread > 0.5 ? '#ff4a8a' : '#8ab8ff', 0.25 + 0.35 * p));
  ag.addColorStop(0.5, rgba('#8a5aff', 0.12 + 0.2 * dread));
  ag.addColorStop(1, rgba('#8a5aff', 0));
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx, cy, auraR, 0, TAU); ctx.fill();

  if (R < 9) {   // 아직 멀리: 낮달처럼 작고 희미한 점
    const sg = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, 0, cx, cy, R);
    sg.addColorStop(0, '#f4f6ff'); sg.addColorStop(1, '#a8b8e0');
    ctx.globalAlpha = 0.75 + 0.25 * (R / 9);
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    return;
  }

  // 고리(먹은 쓰레기가 모여 생긴 띠) 뒤쪽 절반
  drawRing(cx, cy, R, t, p, false);

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  // 바탕
  const base = ctx.createLinearGradient(cx, cy - R, cx, cy + R);
  base.addColorStop(0, mix('#2a4a9a', '#3a1a5a', dread));
  base.addColorStop(0.5, mix('#1a6a9a', '#2a1a4a', dread));
  base.addColorStop(1, mix('#1a2a6a', '#4a0a2a', dread));
  ctx.fillStyle = base; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  // 흐르는 띠
  const bands = 16;
  const pal = ['#5ad0e8', '#3a7ad0', '#8a6ae0', '#2a4aa0', '#7ae0d0', '#c08ae0', '#3a5ab8', '#e0b8f0'];
  const horror = ['#8a2a6a', '#3a0a3a', '#c0306a', '#2a0a2a', '#6a1a4a', '#e0507a', '#4a0a3a', '#a03060'];
  for (let i = 0; i < bands; i++) {
    const yy = cy - R + (i + 0.5) / bands * R * 2;
    const lat = (yy - cy) / R;
    const w = Math.sqrt(Math.max(0, 1 - lat * lat)) * R;
    ctx.beginPath();
    const steps = 28;
    for (let k = 0; k <= steps; k++) {
      const x = cx - w + (k / steps) * w * 2, u = (x - cx) / Math.max(1, w);
      const y = yy + Math.sin(u * 3 + t * (0.25 + (i % 3) * 0.08) + i * 1.7) * R * 0.035 + (1 - u * u) * R * 0.04;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = mix(pal[i % pal.length], horror[i % horror.length], dread);
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(i * 2.3);
    ctx.lineWidth = R * 2 / bands * (0.8 + 0.6 * ((i * 7) % 5) / 5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 잔 무늬(화면 해상도로 깔려 커져도 선명)
  if (!noisePat) noisePat = ctx.createPattern(noiseTile, 'repeat');
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.55;
  const ns = Math.max(0.5, Math.min(2.5, R / 160));
  ctx.translate(cx + t * 6 * ns, cy);
  ctx.scale(ns, ns * 0.55);
  ctx.fillStyle = noisePat; ctx.fillRect(-R / ns - 300, -R / (ns * 0.55) - 300, R * 2 / ns + 600, R * 2 / (ns * 0.55) + 600);
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  // 폭풍의 눈: 처음엔 소용돌이였다가 점점 진짜 눈이 되어 뜨인다
  const eyeK = clamp01((p - 0.35) / 0.25);
  if (eyeK > 0) drawEye(cx, cy + R * 0.22, R, t, p, eyeK, dread);
  // 빛나는 핏줄
  if (dread > 0) {
    const beat = 0.55 + 0.45 * Math.max(0, Math.sin(t * (2.2 + 2 * danger))) ** 3;
    const ex = cx, ey = cy + R * 0.22;
    for (const v of veins) {
      ctx.beginPath();
      v.pts.forEach(([x, y], i) => { const X = ex + x * R * 1.1, Y = ey + y * R * 1.1; if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y); });
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = rgba('#ff2a6a', 0.25 * dread * beat); ctx.lineWidth = Math.max(2, R * 0.03 * v.w); ctx.stroke();
      ctx.strokeStyle = rgba('#ffc0d0', 0.7 * dread * beat); ctx.lineWidth = Math.max(0.7, R * 0.007 * v.w); ctx.stroke();
    }
  }
  // 구 모양 명암: 왼쪽 위 빛, 오른쪽 아래 어둠, 가장자리 어둡게
  const sh = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R * 1.02);
  sh.addColorStop(0, 'rgba(255,255,255,0.18)'); sh.addColorStop(0.55, 'rgba(0,0,20,0)'); sh.addColorStop(0.85, 'rgba(0,0,20,0.45)'); sh.addColorStop(1, 'rgba(0,0,15,0.85)');
  ctx.fillStyle = sh; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  // 테두리 빛
  ctx.globalCompositeOperation = 'lighter';
  const rim = ctx.createRadialGradient(cx, cy, R * 0.82, cx, cy, R);
  rim.addColorStop(0, 'rgba(0,0,0,0)'); rim.addColorStop(1, rgba(dread > 0.5 ? '#ff6a9a' : '#9ad8ff', 0.35 + 0.25 * dread));
  ctx.fillStyle = rim; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  drawRing(cx, cy, R, t, p, true);
}

function drawEye(ex, ey, R, t, p, eyeK, dread) {
  const ew = R * 0.46, eh = ew * 0.55;
  // 소용돌이 팔
  ctx.save();
  ctx.globalAlpha = 0.5 * eyeK;
  for (let k = 0; k < 5; k++) {
    ctx.beginPath();
    for (let s = 0; s <= 40; s++) {
      const a = k / 5 * TAU + s * 0.12 - t * 0.25, rr = ew * (0.35 + s * 0.028);
      const x = ex + Math.cos(a) * rr, y = ey + Math.sin(a) * rr * 0.5;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = mix('#a8f0ff', '#ff8ab0', dread); ctx.lineWidth = Math.max(1, R * 0.012); ctx.stroke();
  }
  ctx.restore();
  // 눈꺼풀이 열리는 정도: 진행할수록 크게, 가끔 깜빡임
  const openK = clamp01((p - 0.55) / 0.35);
  const blinkK = blink > 0 ? Math.abs(Math.cos((blink / 0.25) * Math.PI)) : 1;
  const open = eh * openK * blinkK;
  // 눈 주변의 어두운 꺼짐
  const hollow = ctx.createRadialGradient(ex, ey, 0, ex, ey, ew * 1.1);
  hollow.addColorStop(0, rgba('#05000a', 0.55 * eyeK)); hollow.addColorStop(1, rgba('#05000a', 0));
  ctx.fillStyle = hollow; ctx.beginPath(); ctx.ellipse(ex, ey, ew * 1.1, ew * 0.6, 0, 0, TAU); ctx.fill();
  if (open < 0.5) {   // 감긴 눈: 가는 빛줄기
    ctx.strokeStyle = rgba('#ffd0a0', 0.6 * eyeK); ctx.lineWidth = Math.max(1, R * 0.006);
    ctx.beginPath(); ctx.ellipse(ex, ey, ew * 0.9, Math.max(0.5, open), 0, 0, TAU); ctx.stroke();
    return;
  }
  ctx.save();
  ctx.beginPath();
  // 아몬드 모양 눈꺼풀
  ctx.moveTo(ex - ew, ey);
  ctx.quadraticCurveTo(ex, ey - open * 2, ex + ew, ey);
  ctx.quadraticCurveTo(ex, ey + open * 2, ex - ew, ey);
  ctx.closePath();
  ctx.clip();
  const sclera = ctx.createRadialGradient(ex, ey, 0, ex, ey, ew);
  sclera.addColorStop(0, '#fff2c8'); sclera.addColorStop(0.6, '#f0a060'); sclera.addColorStop(1, '#6a1020');
  ctx.fillStyle = sclera; ctx.fillRect(ex - ew, ey - eh * 2, ew * 2, eh * 4);
  // 눈동자는 아래 도시를 내려다본다(살짝 흔들림)
  const lookX = Math.sin(t * 0.4) * ew * 0.12, lookY = eh * 0.25;
  const ir = eh * 0.95;
  const iris = ctx.createRadialGradient(ex + lookX, ey + lookY, ir * 0.15, ex + lookX, ey + lookY, ir);
  iris.addColorStop(0, '#ffe680'); iris.addColorStop(0.45, '#ff8a20'); iris.addColorStop(0.8, '#c0102a'); iris.addColorStop(1, '#3a0010');
  ctx.fillStyle = iris; ctx.beginPath(); ctx.arc(ex + lookX, ey + lookY, ir, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(80,0,10,0.45)'; ctx.lineWidth = Math.max(0.6, R * 0.004);
  for (let k = 0; k < 28; k++) { const a = k / 28 * TAU; ctx.beginPath(); ctx.moveTo(ex + lookX + Math.cos(a) * ir * 0.3, ey + lookY + Math.sin(a) * ir * 0.3); ctx.lineTo(ex + lookX + Math.cos(a) * ir * 0.95, ey + lookY + Math.sin(a) * ir * 0.95); ctx.stroke(); }
  // 세로로 찢어진 동공: 가까워질수록 가늘어진다(초점을 맞추듯)
  const pw = ir * (0.32 - 0.2 * dread);
  ctx.fillStyle = '#050005'; ctx.beginPath(); ctx.ellipse(ex + lookX, ey + lookY, pw, ir * 0.88, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(ex + lookX - ir * 0.35, ey + lookY - ir * 0.35, ir * 0.12, ir * 0.08, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
  // 눈꺼풀 테두리 빛
  ctx.strokeStyle = rgba('#ffb070', 0.55); ctx.lineWidth = Math.max(1, R * 0.008);
  ctx.beginPath(); ctx.moveTo(ex - ew, ey); ctx.quadraticCurveTo(ex, ey - open * 2, ex + ew, ey); ctx.quadraticCurveTo(ex, ey + open * 2, ex - ew, ey); ctx.stroke();
}

function drawRing(cx, cy, R, t, p, front) {
  const k = clamp01((p - 0.15) / 0.5);
  if (k <= 0) return;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-0.22);
  ctx.beginPath();
  if (front) ctx.rect(-R * 3, 0, R * 6, R * 3); else ctx.rect(-R * 3, -R * 3, R * 6, R * 3);
  ctx.clip();
  for (let i = 0; i < 9; i++) {
    const rr = R * (1.35 + i * 0.06 * (0.5 + k));
    ctx.strokeStyle = rgba(['#c8d8ff', '#ffd8a8', '#a8f0e0', '#e0c0ff'][i % 4], (0.08 + 0.06 * (i % 3)) * k);
    ctx.lineWidth = Math.max(1, R * 0.03 * (1 + (i % 2)));
    ctx.beginPath(); ctx.ellipse(0, 0, rr, rr * 0.24, 0, 0, TAU); ctx.stroke();
  }
  // 고리 속에서 반짝이는 쓰레기 조각
  const rand = seeded(3);
  for (let i = 0; i < 70 * k; i++) {
    const a = rand() * TAU + t * (0.15 + rand() * 0.1), rr = R * (1.35 + rand() * 0.5 * k);
    ctx.fillStyle = rgba(['#ffffff', '#ffe0a0', '#a0e8ff', '#ffa0c0'][i % 4], 0.5 + 0.5 * Math.sin(t * 3 + i));
    ctx.fillRect(Math.cos(a) * rr, Math.sin(a) * rr * 0.24, 1.3, 1.3);
  }
  ctx.restore();
}

// 지구를 향해 뻗어 내려오는 빛의 촉수(끝으로 갈수록)
function drawTendrils(cx, cy, R, t, p, front) {
  const k = clamp01((p - 0.7) / 0.3);
  if (k <= 0 || R < 20) return;
  for (let i = 0; i < 7; i++) {
    if ((i % 2 === 0) !== front) continue;
    const a0 = Math.PI * (0.18 + i * 0.11);
    const sx = cx + Math.cos(a0) * R * 0.95, sy = cy + Math.sin(a0) * R * 0.95;
    const len = (GROUND - sy) * (0.3 + 0.6 * k) * (0.7 + 0.3 * Math.sin(i * 1.9));
    ctx.beginPath(); ctx.moveTo(sx, sy);
    const steps = 20;
    for (let s = 1; s <= steps; s++) {
      const u = s / steps;
      const x = sx + Math.sin(u * 4 + t * 1.3 + i) * R * 0.12 * u + (sx - cx) * 0.3 * u;
      const y = sy + len * u;
      ctx.lineTo(x, y);
    }
    const lg = ctx.createLinearGradient(sx, sy, sx, sy + len);
    lg.addColorStop(0, rgba('#ff4a9a', 0.55 * k)); lg.addColorStop(0.6, rgba('#8a4aff', 0.3 * k)); lg.addColorStop(1, rgba('#8a4aff', 0));
    ctx.strokeStyle = lg; ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, R * 0.05) * (1 - 0.3 * (i % 3) / 2);
    ctx.stroke();
    ctx.lineWidth = Math.max(0.8, R * 0.012); ctx.strokeStyle = rgba('#ffd0f0', 0.4 * k); ctx.stroke();
  }
}

function drawBrokenEarth(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
  const rand = seeded(9);
  for (let i = 0; i < 160; i++) { ctx.fillStyle = `rgba(255,255,255,${0.3 + rand() * 0.7})`; ctx.fillRect(rand() * CW, rand() * CH, 1.2, 1.2); }
  const cx = CW / 2, cy = CH * 0.4, r = CW * 0.27, spread = Math.min(1, t / 3) * 60;
  // 지구를 삼킨 행성의 눈이 뒤에서 내려다본다
  const eg = ctx.createRadialGradient(cx, cy - r * 1.6, 0, cx, cy - r * 1.6, r * 1.4);
  eg.addColorStop(0, `rgba(255,120,60,${Math.min(0.5, t * 0.2)})`); eg.addColorStop(1, 'rgba(255,60,120,0)');
  ctx.fillStyle = eg; ctx.fillRect(0, 0, CW, CH);
  for (let k = 0; k < 7; k++) {
    const a0 = (k / 7) * TAU, a1 = ((k + 1) / 7) * TAU, am = (a0 + a1) / 2;
    ctx.save(); ctx.translate(cx + Math.cos(am) * spread, cy + Math.sin(am) * spread); ctx.rotate(t * 0.08 * (k % 2 ? 1 : -1));
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a1); ctx.closePath(); ctx.clip();
    const og = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    og.addColorStop(0, '#5aa8ff'); og.addColorStop(1, '#0a2a6a');
    ctx.fillStyle = og; ctx.fillRect(-r, -r, r * 2, r * 2);
    const lr = seeded(k + 3);
    ctx.fillStyle = '#4a9a5a';
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse((lr() - 0.5) * r * 1.4, (lr() - 0.5) * r * 1.4, 6 + lr() * 16, 4 + lr() * 9, lr() * 3, 0, TAU); ctx.fill(); }
    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.45);
    core.addColorStop(0, '#fff2a0'); core.addColorStop(0.5, '#ff6a20'); core.addColorStop(1, 'rgba(160,20,10,0)');
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, TAU); ctx.fill();
    ctx.restore();
  }
  for (let i = 0; i < 80; i++) { const a = rand() * TAU, d = r * 0.7 + spread * (1 + rand() * 3); ctx.fillStyle = ['#5aa8ff', '#4a9a5a', '#ff8a30', '#d8d0c0'][i % 4]; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 1 + rand() * 2, 0, TAU); ctx.fill(); }
}

// ---------- 발사대 목록 ----------
const ICONS = ['🛍️', '🚛', '🪃', '🚀', '🛰️', '🗼', '⛰️', '🏚️', '🏝️', '💥'];
let rows = null;
function buildList() {
  const list = $('list');
  list.innerHTML = '';
  rows = [];
  const tapRow = document.createElement('div'); tapRow.className = 'item';
  tapRow.innerHTML = '<div class="ic">🗑️</div>';
  const ti = document.createElement('div'); ti.className = 'info'; tapRow.appendChild(ti);
  const tb = document.createElement('button'); tapRow.appendChild(tb);
  tb.onclick = () => { if (L.buyTap(save)) { sfx.buy(); persist(); refreshList(); } };
  list.appendChild(tapRow);
  rows.push({ tap: true, info: ti, btn: tb });
  L.LAUNCHERS.forEach((ln, i) => {
    const row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<div class="ic">${ICONS[i]}</div>`;
    const info = document.createElement('div'); info.className = 'info'; row.appendChild(info);
    const btn = document.createElement('button'); row.appendChild(btn);
    btn.onclick = () => { if (L.buyLauncher(save, i)) { sfx.buy(); persist(); refreshList(); } };
    list.appendChild(row);
    rows.push({ i, row, info, btn, ic: row.firstChild });
  });
}
function refreshList() {
  if (!rows) buildList();
  const vis = L.visibleLaunchers(save);
  for (const r of rows) {
    if (r.tap) {
      const c = L.tapCost(save.tapLv);
      r.info.innerHTML = `<b>봉투 키우기 <small>Lv.${save.tapLv}</small></b><span>버튼 한 번에 보내는 쓰레기 두 배</span><span class="gain">한 번에 ${L.formatNumber(L.tapPower(save))}톤 → ${L.formatNumber(L.tapPower(save) * 2)}톤</span>`;
      r.btn.textContent = `${L.formatNumber(c)}원`; r.btn.disabled = save.money < c;
      continue;
    }
    const i = r.i, ln = L.LAUNCHERS[i], n = save.owned[i];
    r.row.hidden = i > vis;
    const locked = i === vis;
    r.row.classList.toggle('locked', locked);
    r.ic.textContent = locked ? '❔' : ICONS[i];
    if (locked) { r.info.innerHTML = `<b>???</b><span>${L.formatNumber(ln.cost * 0.5)}원을 모으면 공개</span>`; r.btn.textContent = '잠김'; r.btn.disabled = true; continue; }
    const next = L.MILESTONES.find((m) => n < m);
    const c = L.launcherCost(i, n);
    r.info.innerHTML = `<b>${ln.name} <small>× ${n}</small></b><span>${ln.desc}</span><span class="gain">초당 +${L.formatRate(L.nextGain(save, i))}톤${n ? ` · 지금 ${L.formatRate(L.launcherRate(save, i))}톤` : ''}${next ? ` · ${next}개면 ×2` : ''}</span>`;
    r.btn.textContent = `${L.formatNumber(c)}원`; r.btn.disabled = save.money < c;
  }
}

// ---------- 창 ----------
function modal(html, buttons) {
  const card = $('modalCard');
  card.innerHTML = html;
  for (const [label, cls, fn] of buttons) {
    const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.innerHTML = label;
    b.addEventListener('click', () => { sfx.tick(); fn(); });
    card.appendChild(b);
  }
  $('modal').hidden = false;
}
const closeModal = () => { $('modal').hidden = true; };
function fmtTime(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}시간 ${m}분` : `${m}분 ${Math.floor(s % 60)}초`; }
function showEnd() {
  const n = (save.earths || 0) + 1;
  modal(`<h2>지구 멸망</h2><p>쓰레기를 먹고 자란 행성이<br>마침내 지구를 삼켰습니다.<br>${n}번째 지구가 사라졌어요.</p>
    <div class="stats"><span>걸린 시간</span><b>${fmtTime(save.time)}</b><span>보낸 쓰레기</span><b>${L.formatNumber(save.sent)}톤</b>${save.best ? `<span>최고 기록</span><b>${fmtTime(Math.min(save.best, save.time))}</b>` : ''}</div>`, [
    [`새 지구에서 다시<small>모든 생산·발사 영구 ×${2 ** n}</small>`, 'main', () => {
      L.prestige(save); persist(); ending = null; shots.length = 0; meteors.length = 0; parts.length = 0; shake = 0; city = null; rows = null; refreshList(); closeModal();
    }],
  ]);
}
function settingsHtml() {
  return `<div class="setRow"><span>소리</span><button class="btn" id="setSound">${save.sound ? '켬' : '끔'}</button></div>
    <div class="setRow"><span>진동</span><button class="btn" id="setVib">${save.vibrate ? '켬' : '끔'}</button></div>`;
}
function showSettings() {
  modal(`<h2>환경설정</h2>${settingsHtml()}<p style="font-size:13px">부순 지구 ${save.earths || 0}개 · 생산 ×${L.prestigeMult(save)}</p>`, [
    ['기록 지우기', 'red', () => modal('<h2>기록 지우기</h2><p>질량, 돈, 발사대, 부순 지구가<br>모두 지워져요.</p>', [
      ['지우기', 'red', () => { Object.assign(save, L.defaultSave(), { sound: save.sound, vibrate: save.vibrate }); persist(); ending = null; city = null; rows = null; refreshList(); closeModal(); }],
      ['취소', '', showSettings],
    ])],
    ['닫기', 'main', closeModal],
  ]);
  $('setSound').onclick = () => { save.sound = !save.sound; persist(); $('setSound').textContent = save.sound ? '켬' : '끔'; };
  $('setVib').onclick = () => { save.vibrate = !save.vibrate; persist(); $('setVib').textContent = save.vibrate ? '켬' : '끔'; buzz(20); };
}
function applyOffline() {
  const now = Date.now(), away = (now - (save.lastSeen || now)) / 1000;
  save.lastSeen = now;
  if (away < 30 || ending || L.totalRate(save) <= 0) return;
  const r = L.offlineProgress(save, away);
  persist();
  if (r.tons <= 0) return;
  modal(`<h2>다녀오셨어요</h2><p>자리를 비운 ${fmtTime(r.seconds)} 동안<br>발사대가 쓰레기 <b>${L.formatNumber(r.tons)}톤</b>을 보내고<br>처리비 <b>${L.formatNumber(r.money)}원</b>을 벌었어요<br><br>행성이 그만큼 더 가까워졌습니다…</p>`, [['확인', 'main', () => { closeModal(); checkEnd(); }]]);
}

// ---------- 연결 ----------
const lb = $('launch');
lb.addEventListener('pointerdown', (e) => { e.preventDefault(); lb.classList.add('press'); tapLaunch(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) lb.addEventListener(ev, () => lb.classList.remove('press'));
lb.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && $('modal').hidden) { e.preventDefault(); tapLaunch(); } });
$('gear').addEventListener('click', showSettings);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); else applyOffline(); });
setInterval(persist, 3000);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  update(dt);
  render(now);
  requestAnimationFrame(frame);
}
resize();
refreshList();
applyOffline();
checkEnd();
requestAnimationFrame(frame);
window.trashReady = true;
window.__trash = { save, tapLaunch, L };
</script>
</body>
</html>
