<!doctype html>
<html lang="ko">
<head>

<style>

  }

  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ol { text-shadow: -2px 0 #000, 2px 0 #000, 0 -2px #000, 0 2px #000, -2px -2px #000, 2px 2px #000, -2px 2px #000, 2px -2px #000; }

  /* 위쪽 검은 띠: 쇼츠 자막처럼 */
  #top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 44px 8px; background: #000; text-align: center; }

  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 43%; display: flex; flex-direction: column;

  }

  #money small { font: 700 11px system-ui, sans-serif; color: #a8a0c8; }

  #money span { font: 700 11px system-ui, sans-serif; color: #c8c4dc; }
  #speedBox b { color: #ffd23f; }

  /* 뉴스 특보 */
  #tv { position: absolute; right: 8px; width: 58%; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.15); animation: tvIn 0.35s ease-out; }
  #tv.out { animation: tvOut 0.35s ease-in forwards; }
  @keyframes tvIn { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes tvOut { to { transform: scale(0.9); opacity: 0; } }
  #tvc { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tvLive { position: absolute; left: 6px; top: 5px; padding: 1px 5px; background: #e02a2a; border-radius: 3px; font: 900 8px system-ui, sans-serif; letter-spacing: 1px; }
  .tvLive::before { content: '● '; animation: blinkDot 1s steps(2) infinite; }
  @keyframes blinkDot { 50% { opacity: 0.2; } }
  .tvLogo { position: absolute; right: 6px; top: 4px; font: 900 9px system-ui, sans-serif; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  .tvLogo small { font-size: 10px; opacity: 0.8; }
  .tvSub { position: absolute; left: 4%; right: 4%; bottom: 24%; min-height: 1.3em; padding: 2px 5px; text-align: center; font: 800 10.5px/1.35 system-ui, sans-serif; background: rgba(0, 0, 0, 0.6); border-radius: 4px; }
  .tvLower { position: absolute; left: 0; right: 0; bottom: 0; height: 21%; display: flex; align-items: stretch; background: linear-gradient(#f4f6fa, #d8dee8); color: #10182a; }
  .tvLower .tag { flex: none; display: flex; align-items: center; padding: 0 6px; background: #d0202a; color: #fff; font: 900 11px system-ui, sans-serif; }
  .tvLower .head { flex: 1; display: flex; align-items: center; padding: 0 6px; font: 900 11px system-ui, sans-serif; white-space: nowrap; overflow: hidden; }
  .tvSkip { display: none; }
  #launch {
    position: relative; flex: 1; min-height: 76px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(#ff7a5a, #e8402a); color: #fff; border: none; border-radius: 16px; box-shadow: 0 6px 0 #8a1a10, 0 10px 24px rgba(255, 80, 40, 0.35);
    font: 900 24px system-ui, sans-serif; touch-action: manipulation;
  }
  #launch small { position: absolute; bottom: 9px; left: 0; right: 0; font: 700 11px system-ui, sans-serif; opacity: 0.9; }
  #launch.press { transform: translateY(5px); box-shadow: 0 1px 0 #8a1a10; }
  #list { flex: 1; margin-top: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
  .item .ic { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
  .item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .item .info b { font-size: 15px; }
  .item .info b small { font-size: 12px; color: #a8a0c8; }
  .item .info span { font-size: 11px; line-height: 1.3; color: #a8a4b8; }
  .item .info .gain { color: #7dffb0; font-weight: 800; }
  .item button { flex: none; width: 88px; min-height: 42px; padding: 0 4px; background: var(--gold); color: var(--ink); border: none; border-radius: 10px; box-shadow: 0 3px 0 #8a6a10; font: 900 14px system-ui, sans-serif; }
  .item button:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6a10; }
  .item button:disabled { background: #3a3850; color: #7a7690; box-shadow: none; }
  .item.locked { opacity: 0.55; }
  .pop { position: absolute; transform: translate(-50%, -50%); font: 900 18px system-ui, sans-serif; color: #fff; pointer-events: none; animation: up 0.8s ease-out forwards; white-space: nowrap; }
  @keyframes up { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -220%); } }

  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.72); }
  .card { width: 100%; max-width: 320px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: #1c1a2e; color: #fff; border: 1px solid #4a4670; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
  .card h2 { margin: 0; font: 900 28px system-ui, sans-serif; }
  .card p { margin: 0; text-align: center; line-height: 1.55; font-size: 15px; color: #d8d4e8; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
  .card .stats b { text-align: right; }
  .btn { width: 100%; min-height: 48px; background: #2e2b46; color: #fff; border: 1px solid #4a4670; border-radius: 12px; font: 900 16px system-ui, sans-serif; }
  .btn.main { background: var(--gold); color: var(--ink); border: none; }
  .btn.red { background: #7a2a3a; }
  .btn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.8; }
  .btn:active { transform: translateY(2px); }
  .setRow { width: 100%; display: flex; align-items: center; justify-content: space-between; font: 800 16px system-ui, sans-serif; }
  .setRow .btn { width: 100px; min-height: 40px; }
  #reload { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>

</div>

<script type="module">
import * as L from './logic.js?v=7';
import { createGlobe, AVG_COLOR } from './globe.js?v=2';

const $ = (id) => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const save = L.loadSave(window.localStorage);
const persist = () => { save.lastSeen = Date.now(); L.storeSave(window.localStorage, save); };
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, k) => a + (b - a) * k;
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return '#' + [16, 8, 0].map((s) => ch(s).toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * DPR)); c.height = Math.max(1, Math.ceil(h * DPR)); const g = c.getContext('2d'); g.scale(DPR, DPR); return [c, g]; }

// ---------- 화면 크기: 기기의 실제 해상도로 그린다 ----------
let CW = 390, CH = 780, DPR = 2, SKY_TOP = 120, GROUND = 500, SCENE_BOT = 520, maxR = 195;
function resize() {
  const r = app.getBoundingClientRect();
  DPR = Math.min(3, window.devicePixelRatio || 1);
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  const topH = $('top').offsetHeight, panelTop = CH - $('panel').offsetHeight;
  $('news').style.top = `${panelTop - 24}px`;
  SKY_TOP = topH;
  SCENE_BOT = panelTop - 24;
  GROUND = Math.round(SCENE_BOT - Math.max(40, (SCENE_BOT - SKY_TOP) * 0.15));
  maxR = CW * 0.5;
  city = null;
}
window.addEventListener('resize', resize);

// ---------- 소리 ----------
let ac = null;
function audio() {
  if (!save.sound) return null;
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { return null; }
  return ac;
}
function tone(freq, dur, { type = 'sine', vol = 0.05, to = null, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.05, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, { vol = 0.1, from = 2000, to = 200, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'lowpass';
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0);
}
const sfx = {
  launch() { noise(0.5, { vol: 0.05, from: 300, to: 1800 }); tone(120, 0.4, { type: 'triangle', vol: 0.03, to: 260 }); },
  buy() { [988, 1319].forEach((f, i) => tone(f, 0.12, { type: 'triangle', vol: 0.05, delay: i * 0.07 })); },
  hit() { noise(0.6, { vol: 0.14, from: 1200, to: 60 }); tone(70, 0.5, { vol: 0.12, to: 30 }); },
  rumble(p) { noise(2.2, { vol: 0.04 + 0.08 * p, from: 160, to: 40 }); tone(45, 2, { vol: 0.03 + 0.05 * p, to: 30 }); },
  boom() { noise(3.5, { vol: 0.32, from: 2500, to: 30 }); tone(50, 3.2, { vol: 0.3, to: 18 }); },
  tick() { tone(660, 0.05, { type: 'triangle', vol: 0.03 }); },
};
const buzz = (p) => { if (save.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch { /* 없음 */ } };

// ---------- 도시(강가의 빌딩 숲, 사진처럼) ----------
let city = null;
const CONCRETE = ['#c9c2b8', '#b9b1a7', '#d7cfc3', '#bfb5a6', '#a7a29c', '#cdbfac', '#d9d3cb', '#b3aca2'];
function buildingSprite(w, h, kind, r, spire) {
  const extra = spire ? h * 0.32 : 0;
  const [c, g] = canvasOf(w, h + extra);
  const top = extra;
  if (kind === 'glass') {
    const gr = g.createLinearGradient(0, top, 0, top + h);
    gr.addColorStop(0, '#a9c0d6'); gr.addColorStop(0.5, '#6f8ba6'); gr.addColorStop(1, '#4a627b');
    g.fillStyle = gr; g.fillRect(0, top, w, h);
    g.fillStyle = 'rgba(30,45,60,0.35)';
    for (let x = 2; x < w; x += 2.6) g.fillRect(x, top, 0.5, h);
    for (let y = top + 3; y < top + h; y += 3.2) g.fillRect(0, y, w, 0.35);
    const sky = g.createLinearGradient(0, top, w, top + h * 0.6);
    sky.addColorStop(0, 'rgba(230,240,250,0.35)'); sky.addColorStop(1, 'rgba(230,240,250,0)');
    g.fillStyle = sky; g.fillRect(0, top, w, h);
  } else {
    const base = CONCRETE[Math.floor(r() * CONCRETE.length)];
    const gr = g.createLinearGradient(0, top, 0, top + h);
    gr.addColorStop(0, mix(base, '#ffffff', 0.12)); gr.addColorStop(1, mix(base, '#000000', 0.18));
    g.fillStyle = gr; g.fillRect(0, top, w, h);
    const ww = 1.1 + r() * 0.8, gap = ww + 0.9 + r() * 0.8, fh = 2.6 + r() * 0.8;
    for (let y = top + 3; y < top + h - 2; y += fh) {
      for (let x = 1.2; x < w - 1.5; x += gap) {
        const lit = r();
        g.fillStyle = lit < 0.08 ? 'rgba(220,232,245,0.8)' : `rgba(55,70,88,${0.45 + r() * 0.25})`;
        g.fillRect(x, y, ww, fh * 0.55);
      }
    }
  }
  // 햇빛: 왼쪽 면이 밝고 오른쪽 끝은 그늘
  const sh = g.createLinearGradient(0, 0, w, 0);
  sh.addColorStop(0, 'rgba(255,248,235,0.22)'); sh.addColorStop(0.35, 'rgba(255,248,235,0)'); sh.addColorStop(0.8, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(20,20,30,0.28)');
  g.fillStyle = sh; g.fillRect(0, top, w, h);
  // 옥상 설비
  g.fillStyle = 'rgba(80,80,85,0.6)';
  if (w > 10 && r() < 0.7) g.fillRect(w * (0.2 + r() * 0.4), top - 1.5, w * 0.18, 1.5);
  if (r() < 0.3) g.fillRect(w * 0.7, top - 5, 0.5, 5);
  if (spire) {
    const tg = g.createLinearGradient(0, 0, w, 0);
    tg.addColorStop(0, '#f4f6f8'); tg.addColorStop(1, '#a8b4c0');
    g.fillStyle = tg; g.beginPath(); g.moveTo(w * 0.15, top); g.lineTo(w * 0.5, top - extra * 0.25); g.lineTo(w * 0.85, top); g.fill();
    g.fillStyle = '#d8dde4'; g.fillRect(w / 2 - 0.5, 0, 1, extra * 0.8);
  }
  return { img: c, extra };
}
function cloudSprite(w, r) {
  const h = w * 0.55;
  const [c, g] = canvasOf(w, h);
  for (let i = 0; i < 34; i++) {
    const bx = w * (0.15 + r() * 0.7), by = h * (0.35 + r() * 0.45) - Math.sin((bx / w) * Math.PI) * h * 0.25, br = w * (0.07 + r() * 0.12);
    const gr = g.createRadialGradient(bx - br * 0.2, by - br * 0.3, br * 0.1, bx, by, br);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.6, 'rgba(250,250,252,0.75)'); gr.addColorStop(1, 'rgba(250,250,252,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill();
  }
  // 아래쪽 그늘
  g.globalCompositeOperation = 'source-atop';
  const sh = g.createLinearGradient(0, 0, 0, h);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(0.55, 'rgba(120,135,160,0.05)'); sh.addColorStop(1, 'rgba(110,120,150,0.55)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  return c;
}
function buildCity() {
  const r = seeded(42), skyH = GROUND - SKY_TOP;
  const layers = [];
  for (const [li, hMin, hMax, wMin, wMax] of [[0, 0.12, 0.34, 6, 16], [1, 0.12, 0.45, 9, 24], [2, 0.08, 0.6, 11, 30]]) {
    const list = [];
    let x = -12;
    while (x < CW + 12) {
      const w = wMin + r() * (wMax - wMin);
      const mid = 1 - Math.abs((x + w / 2) / CW - 0.42) * 1.1;
      const h = skyH * (hMin + (hMax - hMin) * r() * Math.max(0.3, mid));
      const s = buildingSprite(w, h, r() < 0.3 ? 'glass' : 'concrete', r, false);
      list.push({ x, w, h, ...s, fallMag: 7.3 + r() * 2.4, layer: li });
      x += w * (0.75 + r() * 0.35);
    }
    layers.push(list);
  }
  const sp = buildingSprite(20, skyH * 0.72, 'glass', r, true);

// 지금 순간의 세계: 물리 계산값과 그것이 화면에 드러나는 정도
function world() {

  const cal = L.calendar(save), sd = L.seasonDay(cal.doy, cal.dayIndex, e.seasonAmp), w = L.seasonWeights(sd);

// ---------- 갱신 ----------
let uiT = 0;
function update(dt) {
  const W = world(), p = W.p;
  if (!ending) {
    const rate = L.totalRate(save);
    L.addLaunch(save, rate * dt);
    save.time += dt;
    save.days += dt;   // 1초 = 1일
    save.warm = L.relaxWarming(save.warm, W.e.tempRise, dt);
    if (rate > 0) {
      spawnAcc += dt * Math.min(5, 0.4 + Math.log10(1 + rate) * 0.6);
      while (spawnAcc >= 1) { spawnAcc -= 1; launchShot(); }
    }
    checkEnd();
  }
  if (globe) {
    const st = L.planetStage(p, W.c);
    globe.preload(st.type.id);
    if (st.next && p > st.next.from - 0.06) globe.preload(st.next.id);
    if (p > 0.8) { globe.preload('earth'); globe.preload(W.c.endId); }
  }
  for (const s of shots) {
    s.t += dt;
    if (s.t >= s.T && !s.done) { s.done = true; save.sats += 1; gulp = Math.min(1, gulp + (s.big ? 0.2 : 0.06)); }
  }
  for (let i = shots.length - 1; i >= 0; i--) if (shots[i].done && shots[i].t > shots[i].T + 1.2) shots.splice(i, 1);
  if (shots.length > 40) shots.splice(0, shots.length - 40);
  gulp *= Math.pow(0.05, dt);

  // 지진: 조석 응력이 클수록 자주, 세게
  if (!ending) {
    rumbleT -= dt;
    if (W.e.quake > 5.5 && rumbleT <= 0) { rumbleT = Math.max(2, 14 - (W.e.quake - 5.5) * 3); sfx.rumble(clamp01((W.e.quake - 5) / 5)); shake = Math.max(shake, W.quakeShake); }
    // 불덩이: 행성 가까이에서 부서진 파편과 위성 잔해가 떨어진다
    if (W.km < 60000 || W.e.insideRoche) {
      const R = L.screenRadius(p, L.focalPx(CW), W.c), [px, py] = planetPos();
      const rate = W.e.insideRoche ? 3 : (60000 - W.km) / 60000 * 1.5;
      if (Math.random() < dt * rate) meteors.push({ x0: px + (Math.random() - 0.5) * Math.min(R, CW), y0: py + Math.min(R, CW) * 0.4, x1: 10 + Math.random() * (CW - 20), t: 0, T: 1.2 + Math.random() * 0.8, trail: [] });
    }
  }
  shake = Math.max(shake * Math.pow(0.03, dt), W.quakeShake * 0.25);
  for (const m of meteors) {
    m.t += dt;
    if (m.t >= m.T && !m.done) {
      m.done = true; flash = Math.max(flash, 0.12);
      sparks(m.x1, GROUND - 4, 26, 90); smoke(m.x1, GROUND - 6, 8, 10);
      fires.push({ x: m.x1, life: 8 + Math.random() * 6 });
      shake = Math.max(shake, 5); sfx.hit();
    }
  }
  for (let i = meteors.length - 1; i >= 0; i--) if (meteors[i].done) meteors.splice(i, 1);
  for (const f of fires) { f.life -= dt; if (Math.random() < dt * 3) smoke(f.x, GROUND - 4, 1, 9, -18); }
  for (let i = fires.length - 1; i >= 0; i--) if (fires[i].life <= 0) fires.splice(i, 1);
  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.smoke) { q.s += q.grow * dt; q.vx += 3 * dt; } }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  if (parts.length > 500) parts.splice(0, parts.length - 500);

  flash *= Math.pow(0.03, dt);

  updateTop(W);
  queueNews(W);
}
// 계절 입자: 겨울 눈(기온이 영하 근처일 때만), 봄 꽃잎, 가을 낙엽
function updateFlakes(dt, W) {
  const snow = W.w.winter * clamp01((2 - W.temp) / 4), petals = W.w.spring * 0.6, leaves = W.w.autumn * 0.7;
  const want = snow * 90 + petals * 18 + leaves * 22;
  while (flakes.length < want && Math.random() < 0.9) {
    const r = Math.random() * (snow * 90 + petals * 18 + leaves * 22 || 1);
    const kind = r < snow * 90 ? 'snow' : r < snow * 90 + petals * 18 ? 'petal' : 'leaf';
    flakes.push({ kind, x: Math.random() * CW, y: SKY_TOP - 5 + Math.random() * 10, vx: kind === 'snow' ? (Math.random() - 0.5) * 8 : 6 + Math.random() * 14, vy: kind === 'snow' ? 14 + Math.random() * 16 : 10 + Math.random() * 12, ph: Math.random() * TAU, s: kind === 'snow' ? 0.8 + Math.random() * 1.4 : 1.6 + Math.random() * 1.4, c: kind === 'leaf' ? ['#d8742a', '#c4402a', '#e0a838'][Math.floor(Math.random() * 3)] : kind === 'petal' ? '#f6c4d4' : '#ffffff' });
    if (flakes.length > 140) break;
  }
  for (const f of flakes) { f.ph += dt * 2; f.x += (f.vx + Math.sin(f.ph) * 8) * dt; f.y += f.vy * dt; }
  for (let i = flakes.length - 1; i >= 0; i--) if (flakes[i].y > SCENE_BOT + 20 || flakes.length > want + 5 && Math.random() < 0.02) flakes.splice(i, 1);
}
function updateEnding(dt) {
  const e = ending;
  e.t += dt;
  shake = e.t < 3 ? 2 + e.t * 5 : Math.max(0, 16 - (e.t - 3) * 10);
  if (!e.r) { e.r = true; sfx.rumble(1); }
  if (e.t < 2.8 && Math.random() < dt * 12) {
    const [px, py] = planetPos();
    meteors.push({ x0: px + (Math.random() - 0.5) * CW, y0: py + maxR * 0.4, x1: Math.random() * CW, t: 0, T: 0.6 + Math.random() * 0.5, trail: [] });
  }
  if (e.t >= 2.8 && !e.boom) { e.boom = true; sfx.boom(); buzz([200, 80, 300]); }

}

// 계절별 하늘·나무 색
const SEASON_SKY = {
  spring: ['#3b70c6', '#7aa8dc', '#d8e6f2'], summer: ['#2559b8', '#5f97da', '#d6e8f6'],
  autumn: ['#3466b4', '#7ea2d0', '#ecdcc4'], winter: ['#5878a8', '#8ea6c4', '#e2e6ea'],
};
function seasonMix(w, pick) {
  let col = null, acc = 0;
  for (const k of ['spring', 'summer', 'autumn', 'winter']) {
    if (w[k] <= 0) continue;
    const c = pick(k);
    col = col ? mix(col, c, w[k] / (acc + w[k])) : c;
    acc += w[k];
  }
  return col;
}
const TREE_SEASON = {
  spring: (i) => (i % 2 ? '#f2b8cc' : '#8cc04a'), summer: (i) => ['#3e7a2a', '#4e8a34', '#356a26'][i % 3],
  autumn: (i) => ['#d0702a', '#c4402a', '#e0a838', '#a85a28'][i % 4], winter: () => '#6e6052',
};
function render(now) {
  if (!city) buildCity();
  const t = now / 1000, W = world(), p = W.p, { eclipse, heat, w } = W;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.save();
  ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);

  // 하늘: 계절빛 → 행성이 커지며 어두워지고 → 달아오르며 붉게
  const sky = (i) => seasonMix(w, (k) => SEASON_SKY[k][i]);
  const zen = mix(mix(sky(0), '#070b1c', eclipse), '#2a0c14', heat * 0.6);
  const midc = mix(mix(sky(1), '#1c2440', eclipse), '#7a2a1a', heat * 0.7);
  const hor = mix(mix(sky(2), '#4a4a60', eclipse), '#ff8a40', heat * 0.8);
  const g = ctx.createLinearGradient(0, SKY_TOP, 0, GROUND);
  g.addColorStop(0, zen); g.addColorStop(0.6, midc); g.addColorStop(1, hor);

  ctx.fillStyle = sg; ctx.fillRect(sunX - 150, sunY - 150, 300, 300);

  const aur = clamp01((Math.log10(Math.max(1, W.e.tideRatio)) - 1.5) / 1.5) * (1 - heat * 0.6);
  if (aur > 0) {
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();

      ctx.strokeStyle = rgba(k === 1 ? '#c070ff' : '#60ff9a', 0.12 * aur); ctx.lineWidth = 26 - k * 6; ctx.stroke();
    }
  }

  // 행성과 그 둘레를 도는 인공위성들
  const [px, py] = planetPos();
  const R0 = L.screenRadius(Math.min(p, 1), L.focalPx(CW), W.c);   // 실제 각크기 θ = asin(R/D)를 화각 60° 카메라로

  for (const layer of city.layers) {
    for (const b of layer) {
      const s = sink(b), h = b.h + b.extra;
      ctx.save(); ctx.beginPath(); ctx.rect(-30, 0, CW + 60, GROUND); ctx.clip();
      const jit = s > 0 && s < 1 ? (Math.random() - 0.5) * 1.5 : 0, y = GROUND - h + s * h;
      ctx.drawImage(b.img, b.x + jit, y, b.w, h);
      if (snowRoof > 0.05 && b.layer === 2 && !b.extra) { ctx.globalAlpha = snowRoof * 0.9; ctx.fillStyle = '#f4f8fc'; ctx.fillRect(b.x + jit, y - 1, b.w, 2.2); }
      ctx.globalAlpha = Math.min(0.9, hazeAlpha[b.layer] + eclipse * 0.45);
      ctx.fillStyle = mix(hor, '#101020', eclipse * 0.6); ctx.fillRect(b.x + jit, y, b.w, h);
      ctx.restore();
      if (s > 0 && s < 1 && Math.random() < 0.12) smoke(b.x + b.w / 2, GROUND - h * (1 - s), 1, b.w * 0.5, -10);
    }
  }
  for (const f of fires) {
    const fl = 0.7 + 0.3 * Math.sin(t * 13 + f.x);
    const gl = ctx.createRadialGradient(f.x, GROUND - 4, 0, f.x, GROUND - 4, 22);
    gl.addColorStop(0, `rgba(255,200,90,${0.8 * fl})`); gl.addColorStop(0.4, `rgba(255,100,30,${0.45 * fl})`); gl.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(f.x, GROUND - 4, 22, 0, TAU); ctx.fill();
  }
  // 강가 나무: 봄꽃 → 짙은 초록 → 단풍 → 앙상한 가지(눈 덮임)
  city.trees.forEach((tr, i) => {
    let col = seasonMix(w, (k) => TREE_SEASON[k](i));
    col = mix(col, '#140c10', eclipse * 0.6);
    if (heat > 0.3) col = mix(col, '#4a3a2a', (heat - 0.3));
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tr.x, GROUND - tr.rr * 0.5, tr.rr, 0, TAU); ctx.fill();
    if (snowRoof > 0.05) { ctx.globalAlpha = snowRoof; ctx.fillStyle = '#f4f8fc'; ctx.beginPath(); ctx.arc(tr.x, GROUND - tr.rr * 0.9, tr.rr * 0.7, Math.PI, 0); ctx.fill(); ctx.globalAlpha = 1; }
  });

  // 강: 조석 해일로 차오르고(하루 두 번 밀물), 겨울엔 차갑게
  const rise = W.tide * 26 * (0.75 + 0.25 * Math.sin(t * 1.4));
  const wy = GROUND - rise;
  const wg = ctx.createLinearGradient(0, wy, 0, SCENE_BOT + 24);
  wg.addColorStop(0, mix(mix(hor, '#506880', 0.45), '#8a98a8', w.winter * 0.3)); wg.addColorStop(1, mix(mix('#2a4462', '#05070f', eclipse), '#3a1008', heat * 0.6));
  ctx.fillStyle = wg; ctx.fillRect(-30, wy, CW + 60, CH);
  ctx.save(); ctx.beginPath(); ctx.rect(-30, wy, CW + 60, CH); ctx.clip();
  ctx.globalAlpha = 0.32;
  for (const b of city.layers[2]) {
    const s = sink(b), h = (b.h + b.extra) * (1 - s);
    if (h < 1) continue;
    const slices = Math.ceil(h / 2);
    for (let i = 0; i < slices; i++) {
      const sy0 = (1 - (i + 1) / slices) * b.img.height * (1 - s) + s * b.img.height;
      const off = Math.sin(t * 2 + i * 0.7 + b.x) * 1.2 * (i / slices + 0.2);
      ctx.drawImage(b.img, 0, sy0, b.img.width, b.img.height * (1 - s) / slices, b.x + off, wy + i * 2, b.w, 2);
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  for (let y = wy + 2; y < SCENE_BOT + 24; y += 2.5) {
    const k = (y - wy) / (SCENE_BOT + 24 - wy);
    ctx.fillStyle = `rgba(255,250,235,${0.25 * (1 - k) * sunA})`;
    ctx.fillRect(sunX + Math.sin(t * 3 + y) * 6 - 6 - k * 10, y, 12 + k * 20, 0.7);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(((y * 37) % CW) + Math.sin(t + y) * 5, y, 14, 0.6);
  }

  // 연기·불꽃·눈·꽃잎·낙엽
  for (const q of parts) {
    const a = clamp01(q.life / q.max * 1.3);
    if (q.smoke) { ctx.globalAlpha = a * 0.7; ctx.drawImage(smokeImg, q.x - q.s * 1.4, q.y - q.s * 1.4, q.s * 2.8, q.s * 2.8); continue; }
    ctx.globalAlpha = a; ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, TAU); ctx.fill();
  }
  for (const f of flakes) {
    ctx.globalAlpha = f.kind === 'snow' ? 0.9 : 0.85; ctx.fillStyle = f.c;
    ctx.beginPath();
    if (f.kind === 'snow') ctx.arc(f.x, f.y, f.s, 0, TAU);
    else ctx.ellipse(f.x, f.y, f.s, f.s * 0.55, f.ph, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (ending) drawEnding(ending.t, t, W);
  if (flash > 0.01) { ctx.globalAlpha = flash; ctx.fillStyle = '#fff6e0'; ctx.fillRect(0, 0, CW, CH); ctx.globalAlpha = 1; }
}

// 쏘아 올린 위성들: 행성 둘레를 기울어진 궤도로 돈다(먼 쪽 절반은 행성 뒤로)
function drawSatellites(c, cx, cy, R, t, front, maxN = 90) {
  if (R < 4) return;
  const n = Math.min(maxN, Math.floor(save.sats));
  for (let i = 0; i < n; i++) {
    const h1 = ((i * 2654435761) >>> 0) / 4294967296, h2 = ((i * 2246822519 + 7) >>> 0) / 4294967296, h3 = ((i * 3266489917 + 13) >>> 0) / 4294967296;
    const a = R * (1.25 + 1.6 * h1), bR = a * (0.12 + 0.35 * h2), rot = (h3 - 0.5) * 1.4;
    const th = h2 * TAU + t * 0.9 / Math.pow(a / R, 1.5);
    const near = Math.sin(th) > 0;
    if (near !== front) continue;
    const ox = Math.cos(th) * a, oy = Math.sin(th) * bR;
    const x = cx + ox * Math.cos(rot) - oy * Math.sin(rot), y = cy + ox * Math.sin(rot) + oy * Math.cos(rot);
    const s = Math.max(0.7, Math.min(2.2, R / 60));
    c.fillStyle = rgba('#ffffff', 0.85); c.fillRect(x - s / 2, y - s / 2, s, s);
    if (h1 > 0.7) { c.fillStyle = rgba('#9fd4ff', 0.6); c.fillRect(x - s * 1.6, y - s * 0.2, s * 3.2, s * 0.4); }   // 태양 전지판
  }
}

// 천문대 망원경: 행성이 아직 하늘의 점일 때, 오른쪽 위 둥근 화면에 확대해서 보여 준다(뉴스가 뜨면 잠시 숨김)
function drawScope(t, W, skyR) {
  const k = 1 - clamp01((skyR - 30) / 25);
  if (k <= 0 || !globe) return;
  const r = 44, cx = CW - r - 12, cy = SKY_TOP + r + 12, id = L.planetStage(Math.min(W.p, 1), W.c).type.id;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = '#02030a'; ctx.fill();
  ctx.save(); ctx.clip();
  const rr = seeded(77);
  for (let i = 0; i < 30; i++) { ctx.fillStyle = `rgba(255,255,255,${0.2 + rr() * 0.6})`; ctx.fillRect(cx - r + rr() * r * 2, cy - r + rr() * r * 2, 0.8, 0.8); }
  const pr = r * 0.42;
  drawSatellites(ctx, cx, cy, pr, t, false, 40);
  const out = globe.render(id, Math.round(pr * DPR), t, {});
  if (out) { const e = out.extent * pr; ctx.drawImage(out.canvas, cx - e, cy - e, e * 2, e * 2); }
  drawSatellites(ctx, cx, cy, pr, t, true, 40);
  const vg = ctx.createRadialGradient(cx, cy, r * 0.75, cx, cy, r);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
  ctx.fillText(`망원경 · 위성 ${L.formatNumber(save.sats)}기`, CW - 10, cy + r + 13);
  ctx.restore();
}

// ---------- 뉴스 특보: 거리와 지구 영향이 기준을 넘을 때마다 앵커가 오른쪽 위에 나온다 ----------
let tv = null;
const newsQueue = [];
const tvc = $('tvc'), tvx = tvc.getContext('2d');
function queueNews(W) {
  if (ending) return;
  const fresh = L.pendingNews(Math.min(W.p, 1), W.c, save.newsSeen, save.warm);
  if (fresh.length) {
    for (const n of fresh) { save.newsSeen.push(n.id); newsQueue.push(n); }
    while (newsQueue.length > 3) newsQueue.shift();   // 한꺼번에 몰리면 최근 것만
    persist();
  }
  if (!tv && newsQueue.length && $('modal').hidden) startBroadcast(newsQueue.shift());
}
function startBroadcast(n) {
  tv = { t: 0, lines: n.lines, line: 0, shown: 0, lineT: 0 };
  $('tvHead').textContent = n.head;
  $('tvSub').textContent = '';
  const el = $('tv');
  el.style.top = `${SKY_TOP + 8}px`;
  el.classList.remove('out'); el.hidden = false;
  const r = el.getBoundingClientRect();
  tvc.width = Math.round(r.width * DPR); tvc.height = Math.round(r.height * DPR);
  [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.5, { type: 'triangle', vol: 0.045, delay: i * 0.12 }));
  tone(196, 1.2, { type: 'sawtooth', vol: 0.02 });
}
function endBroadcast() {
  if (!tv || tv.closing) return;
  tv.closing = true;
  $('tv').classList.add('out');
  setTimeout(() => { $('tv').hidden = true; tv = null; }, 350);
}
function updateBroadcast(dt, t) {
  if (!tv) return;
  tv.t += dt; tv.lineT += dt;
  const line = tv.lines[tv.line] || '';
  tv.shown = Math.min(line.length, Math.floor(tv.lineT * 22));
  $('tvSub').textContent = line.slice(0, tv.shown);
  tv.talking = tv.shown < line.length;
  if (tv.lineT > line.length / 22 + 1.4) {
    if (tv.line + 1 < tv.lines.length) { tv.line++; tv.lineT = 0; }
    else endBroadcast();
  }
  drawStudio(t);
}
$('tv').addEventListener('pointerdown', (e) => { e.preventDefault(); endBroadcast(); });

// 방송국 스튜디오: 왼쪽에 앵커, 오른쪽 모니터에 망원경 생중계
function drawStudio(t) {
  const c = tvx, w = tvc.width / DPR, h = tvc.height / DPR, W = world(), p = Math.min(W.p, 1);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = c.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0a1838'); bg.addColorStop(1, '#1d3f7c');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  c.globalAlpha = 0.07; c.fillStyle = '#9cc8ff';
  for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(w * (0.1 + i * 0.22), 0); c.lineTo(w * (0.18 + i * 0.22), 0); c.lineTo(w * (0.05 + i * 0.22), h); c.lineTo(w * (-0.05 + i * 0.22), h); c.fill(); }
  c.globalAlpha = 1;
  const mx = w * 0.52, my = h * 0.15, mw = w * 0.44, mh = h * 0.48;
  c.fillStyle = '#000'; c.fillRect(mx, my, mw, mh);
  const rr = seeded(5);
  for (let i = 0; i < 30; i++) { c.fillStyle = `rgba(255,255,255,${0.2 + rr() * 0.6})`; c.fillRect(mx + rr() * mw, my + rr() * mh, 0.7, 0.7); }
  const id = L.planetStage(p, W.c).type.id, pr = mh * 0.32;
  c.save(); c.beginPath(); c.rect(mx, my, mw, mh); c.clip();
  drawSatellites(c, mx + mw / 2, my + mh / 2, pr, t, false, 30);
  const out = globe && globe.render(id, Math.round(pr * DPR), t, {});
  if (out) { const e = out.extent * pr; c.drawImage(out.canvas, mx + mw / 2 - e, my + mh / 2 - e, e * 2, e * 2); }
  drawSatellites(c, mx + mw / 2, my + mh / 2, pr, t, true, 30);
  c.restore();
  c.strokeStyle = 'rgba(150,200,255,0.8)'; c.lineWidth = 1; c.strokeRect(mx, my, mw, mh);
  c.font = '800 6.5px system-ui, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'left';
  c.fillText('천문대 생중계', mx + 3, my + 8);
  c.textAlign = 'right'; c.fillText(`${L.formatKm(W.km)}km · ${L.formatSpeed(L.speedKms(p, W.c))}`, mx + mw - 3, my + mh - 4);
  drawAnchor(c, w * 0.26, h, t, tv && tv.talking);
  const dg = c.createLinearGradient(0, h * 0.7, 0, h);
  dg.addColorStop(0, '#24365e'); dg.addColorStop(1, '#0c1528');
  c.fillStyle = dg; c.fillRect(0, h * 0.7, w, h * 0.3);
  c.fillStyle = 'rgba(120,200,255,0.8)'; c.fillRect(0, h * 0.7, w, 1);
}
function drawAnchor(c, cx, h, t, talking) {
  const u = h, bob = Math.sin(t * 1.7) * u * 0.003;
  c.save(); c.translate(0, bob);
  // 뒷머리(단발)
  const hair = c.createLinearGradient(cx, u * 0.2, cx, u * 0.6);
  hair.addColorStop(0, '#3a2418'); hair.addColorStop(1, '#1a0f0a');
  c.fillStyle = hair;
  c.beginPath(); c.ellipse(cx, u * 0.38, u * 0.125, u * 0.16, 0, Math.PI, 0); c.lineTo(cx + u * 0.13, u * 0.56); c.quadraticCurveTo(cx, u * 0.6, cx - u * 0.13, u * 0.56); c.closePath(); c.fill();
  // 목
  c.fillStyle = '#dca486'; c.fillRect(cx - u * 0.035, u * 0.45, u * 0.07, u * 0.13);
  // 정장
  const suit = c.createLinearGradient(cx, u * 0.55, cx, u);
  suit.addColorStop(0, '#26355a'); suit.addColorStop(1, '#111a30');
  c.fillStyle = suit;
  c.beginPath(); c.moveTo(cx - u * 0.27, u); c.lineTo(cx - u * 0.23, u * 0.64); c.quadraticCurveTo(cx - u * 0.2, u * 0.57, cx - u * 0.08, u * 0.555); c.lineTo(cx + u * 0.08, u * 0.555); c.quadraticCurveTo(cx + u * 0.2, u * 0.57, cx + u * 0.23, u * 0.64); c.lineTo(cx + u * 0.27, u); c.closePath(); c.fill();
  c.fillStyle = '#f2f0ec';
  c.beginPath(); c.moveTo(cx - u * 0.055, u * 0.555); c.lineTo(cx + u * 0.055, u * 0.555); c.lineTo(cx, u * 0.69); c.closePath(); c.fill();
  c.strokeStyle = '#0c1222'; c.lineWidth = u * 0.006;
  c.beginPath(); c.moveTo(cx - u * 0.055, u * 0.555); c.lineTo(cx - u * 0.01, u * 0.72); c.moveTo(cx + u * 0.055, u * 0.555); c.lineTo(cx + u * 0.01, u * 0.72); c.stroke();
  c.fillStyle = '#222'; c.beginPath(); c.arc(cx - u * 0.07, u * 0.62, u * 0.008, 0, TAU); c.fill();   // 핀 마이크
  // 얼굴
  const skin = c.createRadialGradient(cx - u * 0.02, u * 0.35, u * 0.01, cx, u * 0.38, u * 0.11);
  skin.addColorStop(0, '#f8d8c0'); skin.addColorStop(1, '#dba78a');
  c.fillStyle = skin; c.beginPath(); c.ellipse(cx, u * 0.375, u * 0.082, u * 0.103, 0, 0, TAU); c.fill();
  c.fillStyle = '#d9a486'; c.beginPath(); c.ellipse(cx - u * 0.082, u * 0.385, u * 0.012, u * 0.02, 0, 0, TAU); c.ellipse(cx + u * 0.082, u * 0.385, u * 0.012, u * 0.02, 0, 0, TAU); c.fill();
  c.fillStyle = '#e8c060'; c.beginPath(); c.arc(cx - u * 0.083, u * 0.408, u * 0.005, 0, TAU); c.arc(cx + u * 0.083, u * 0.408, u * 0.005, 0, TAU); c.fill();
  c.fillStyle = 'rgba(240,120,120,0.16)'; c.beginPath(); c.arc(cx - u * 0.045, u * 0.4, u * 0.02, 0, TAU); c.arc(cx + u * 0.045, u * 0.4, u * 0.02, 0, TAU); c.fill();
  // 앞머리
  c.fillStyle = hair;
  c.beginPath(); c.ellipse(cx, u * 0.33, u * 0.09, u * 0.07, 0, Math.PI * 1.02, Math.PI * 1.98); c.quadraticCurveTo(cx + u * 0.02, u * 0.3, cx - u * 0.06, u * 0.36); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cx - u * 0.09, u * 0.33); c.quadraticCurveTo(cx - u * 0.1, u * 0.42, cx - u * 0.085, u * 0.47); c.lineTo(cx - u * 0.075, u * 0.36); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cx + u * 0.09, u * 0.33); c.quadraticCurveTo(cx + u * 0.1, u * 0.42, cx + u * 0.085, u * 0.47); c.lineTo(cx + u * 0.075, u * 0.36); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,220,180,0.18)'; c.lineWidth = u * 0.004; c.beginPath(); c.ellipse(cx - u * 0.02, u * 0.31, u * 0.05, u * 0.03, -0.4, Math.PI, Math.PI * 1.6); c.stroke();
  // 눈썹·눈(가끔 깜빡임)
  c.strokeStyle = '#3a2618'; c.lineWidth = u * 0.006; c.lineCap = 'round';
  c.beginPath(); c.moveTo(cx - u * 0.05, u * 0.35); c.quadraticCurveTo(cx - u * 0.035, u * 0.342, cx - u * 0.02, u * 0.348); c.moveTo(cx + u * 0.02, u * 0.348); c.quadraticCurveTo(cx + u * 0.035, u * 0.342, cx + u * 0.05, u * 0.35); c.stroke();
  const blink = (t % 4.2) < 0.12 ? 0.15 : 1;
  c.fillStyle = '#24160e';
  c.beginPath(); c.ellipse(cx - u * 0.035, u * 0.368, u * 0.012, u * 0.008 * blink, 0, 0, TAU); c.ellipse(cx + u * 0.035, u * 0.368, u * 0.012, u * 0.008 * blink, 0, 0, TAU); c.fill();
  if (blink === 1) { c.fillStyle = '#fff'; c.beginPath(); c.arc(cx - u * 0.031, u * 0.365, u * 0.003, 0, TAU); c.arc(cx + u * 0.039, u * 0.365, u * 0.003, 0, TAU); c.fill(); }
  // 코
  c.strokeStyle = 'rgba(150,90,70,0.45)'; c.lineWidth = u * 0.004;
  c.beginPath(); c.moveTo(cx + u * 0.003, u * 0.375); c.quadraticCurveTo(cx - u * 0.006, u * 0.398, cx + u * 0.006, u * 0.402); c.stroke();
  // 입: 말할 때 움직인다
  const open = talking ? Math.max(0, Math.sin(t * 19) * 0.6 + Math.sin(t * 31) * 0.4) : 0;
  c.fillStyle = '#7a2434'; c.beginPath(); c.ellipse(cx, u * 0.425, u * 0.018, u * (0.003 + 0.009 * open), 0, 0, TAU); c.fill();
  c.strokeStyle = '#c0646a'; c.lineWidth = u * 0.004; c.beginPath(); c.ellipse(cx, u * 0.425, u * 0.019, u * (0.004 + 0.009 * open), 0, 0, TAU); c.stroke();
  c.restore();
}

function drawGlobe(out, cx, cy, R, alpha = 1) {
  const e = out.extent * R;
  ctx.globalAlpha = alpha;
  ctx.drawImage(out.canvas, cx - e, cy - e, e * 2, e * 2);
  ctx.globalAlpha = 1;
}
function drawPlanet(cx, cy, R, t, p, eclipse, heat) {
  const st = L.planetStage(Math.min(p, 1), cfg());
  const id = st.type.id, nid = st.next ? st.next.id : null;
  const day = clamp01(1 - eclipse / 0.6) * 0.6;   // 밝은 낮일수록 그늘진 쪽이 하늘에 묻힌다
  const Rdev = Math.max(6, Math.min(900, Math.round(R * DPR)));
  const hot = (x) => (x === cfg().endId ? heat : 0);
  const out = globe && R >= 3.5 ? globe.render(id, Rdev, t, { heat: hot(id), day }) : null;
  if (!out) {   // 아직 멀거나 지도를 불러오는 중: 하늘의 밝은 점
    const c = AVG_COLOR[id] || '#c0c0c0', rr = Math.max(1.3, R);
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr * 4 + 3);
    glow.addColorStop(0, rgba('#ffffff', 0.5)); glow.addColorStop(1, rgba('#ffffff', 0));
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, rr * 4 + 3, 0, TAU); ctx.fill();
    const gg = ctx.createRadialGradient(cx - rr * 0.35, cy - rr * 0.35, 0, cx, cy, rr);
    gg.addColorStop(0, mix(c, '#ffffff', 0.45)); gg.addColorStop(0.7, c); gg.addColorStop(1, mix(c, '#000000', 0.5));
    ctx.globalAlpha = 0.6 + 0.4 * (1 - day); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    return;
  }
  drawGlobe(out, cx, cy, R);
  if (st.blend > 0 && nid) {
    const o2 = globe.render(nid, Rdev, t, { heat: hot(nid), day });
    if (o2) drawGlobe(o2, cx, cy, R, st.blend);
  }
}

// 충돌: 하늘을 덮은 행성 → 하얀 섬광 → 우주에서 본 지구와, 실제 크기 비율의 행성이 부딪혀 지구가 부서진다
const earthCopy = document.createElement('canvas');
function drawEnding(e, t, W) {
  if (e < 2.6) return;
  if (e > 3.2) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
    const r = seeded(9);
    for (let i = 0; i < 260; i++) { ctx.fillStyle = `rgba(255,255,255,${0.15 + r() * 0.8})`; ctx.fillRect(r() * CW, r() * CH, r() < 0.9 ? 0.8 : 1.5, r() < 0.9 ? 0.8 : 1.5); }
    const k = e - 3.2, endId = W.c.endId;
    const er = CW * 0.2, ex = CW * 0.42, ey = CH * 0.5;
    const ratio = L.BODY_DATA[endId].radiusKm / L.EARTH.radiusKm, gr = er * ratio;
    const ang = -0.75, gap = Math.max(0, 1 - k) * er * 0.6;
    const gx = ex + Math.cos(ang) * (er + gr + gap), gy = ey + Math.sin(ang) * (er + gr + gap);
    const g = globe && globe.render(endId, Math.min(800, Math.round(gr * DPR)), t, { heat: 0.85 });
    if (g) drawGlobe(g, gx, gy, gr);
    const contactX = ex + Math.cos(ang) * er, contactY = ey + Math.sin(ang) * er;
    const eo = globe && globe.render('earth', Math.min(800, Math.round(er * DPR)), t, { heat: Math.min(1, Math.max(0, k - 0.6)) });
    if (eo) {
      if (earthCopy.width !== eo.canvas.width) { earthCopy.width = eo.canvas.width; earthCopy.height = eo.canvas.height; }
      const ec = earthCopy.getContext('2d'); ec.clearRect(0, 0, earthCopy.width, earthCopy.height); ec.drawImage(eo.canvas, 0, 0);
      const ext = eo.extent * er;
      if (k < 1.4) ctx.drawImage(earthCopy, ex - ext, ey - ext, ext * 2, ext * 2);
      else {
        const spread = (k - 1.4) * 40;
        for (let sI = 0; sI < 8; sI++) {
          const a0 = (sI / 8) * TAU, a1 = ((sI + 1) / 8) * TAU, am = (a0 + a1) / 2;
          ctx.save(); ctx.translate(ex + Math.cos(am) * spread, ey + Math.sin(am) * spread); ctx.rotate((k - 1.4) * 0.12 * (sI % 2 ? 1 : -1));
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, er, a0, a1); ctx.closePath(); ctx.clip();
          ctx.drawImage(earthCopy, -ext, -ext, ext * 2, ext * 2);
          const core = ctx.createRadialGradient(0, 0, 0, 0, 0, er * 0.6);
          core.addColorStop(0, 'rgba(255,240,170,0.95)'); core.addColorStop(0.4, 'rgba(255,110,30,0.8)'); core.addColorStop(1, 'rgba(120,20,10,0)');
          ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, er * 0.6, 0, TAU); ctx.fill();
          ctx.restore();
        }
        const rr = seeded(4);
        for (let i = 0; i < 140; i++) { const a = rr() * TAU, d = er * 0.8 + spread * (1 + rr() * 2.5); ctx.fillStyle = ['#ffb040', '#6a5a50', '#4a7ab8', '#ff6a20'][i % 4]; ctx.beginPath(); ctx.arc(ex + Math.cos(a) * d, ey + Math.sin(a) * d, 0.6 + rr() * 1.6, 0, TAU); ctx.fill(); }
      }
    }
    if (k > 0.8) {
      const kk = k - 0.8;
      const cg = ctx.createRadialGradient(contactX, contactY, 0, contactX, contactY, er * (0.4 + kk * 0.7));
      cg.addColorStop(0, `rgba(255,250,220,${Math.min(1, 0.4 + kk * 0.4)})`); cg.addColorStop(0.3, 'rgba(255,160,60,0.5)'); cg.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(contactX, contactY, er * (0.4 + kk * 0.7), 0, TAU); ctx.fill();
    }
  }
  const a = e < 3.2 ? (e - 2.6) / 0.6 : Math.max(0, 1 - (e - 3.2) / 1.2);
  ctx.globalAlpha = a; ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, CW, CH); ctx.globalAlpha = 1;
}

// ---------- 발사대 목록 ----------
const ICONS = ['🛰️', '🚀', '🌦️', '📡', '🏗️', '🗼', '☄️', '🏭', '🌑', '💍'];
let rows = null;
function buildList() {
  const list = $('list');
  list.innerHTML = '';
  rows = [];
  const tapRow = document.createElement('div'); tapRow.className = 'item';
  tapRow.innerHTML = '<div class="ic">🚀</div>';
  const ti = document.createElement('div'); ti.className = 'info'; tapRow.appendChild(ti);
  const tb = document.createElement('button'); tapRow.appendChild(tb);
  tb.onclick = () => { if (L.buyTap(save)) { sfx.buy(); persist(); refreshList(); } };
  list.appendChild(tapRow);
  rows.push({ tap: true, info: ti, btn: tb });
  L.LAUNCHERS.forEach((ln, i) => {
    const row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<div class="ic">${ICONS[i]}</div>`;
    const info = document.createElement('div'); info.className = 'info'; row.appendChild(info);
    const btn = document.createElement('button'); row.appendChild(btn);
    btn.onclick = () => { if (L.buyLauncher(save, i)) { sfx.buy(); persist(); refreshList(); } };
    list.appendChild(row);
    rows.push({ i, row, info, btn, ic: row.firstChild });
  });
}
function refreshList() {
  if (!rows) buildList();
  const vis = L.visibleLaunchers(save);
  for (const r of rows) {
    if (r.tap) {
      const c = L.tapCost(save.tapLv);
      r.info.innerHTML = `<b>로켓 키우기 <small>Lv.${save.tapLv}</small></b><span>버튼 한 번에 쏘는 위성 두 배</span><span class="gain">한 번에 ${L.formatNumber(L.tapPower(save))}톤 → ${L.formatNumber(L.tapPower(save) * 2)}톤</span>`;
      r.btn.textContent = `${L.formatNumber(c)}원`; r.btn.disabled = save.money < c;
      continue;
    }
    const i = r.i, ln = L.LAUNCHERS[i], n = save.owned[i];
    r.row.hidden = i > vis;
    const locked = i === vis;
    r.row.classList.toggle('locked', locked);
    r.ic.textContent = locked ? '❔' : ICONS[i];
    if (locked) { r.info.innerHTML = `<b>???</b><span>${L.formatNumber(ln.cost * 0.5)}원을 모으면 공개</span>`; r.btn.textContent = '잠김'; r.btn.disabled = true; continue; }
    const next = L.MILESTONES.find((m) => n < m);
    const c = L.launcherCost(i, n);
    r.info.innerHTML = `<b>${ln.name} <small>× ${n}</small></b><span>${ln.desc}</span><span class="gain">초당 +${L.formatRate(L.nextGain(save, i))}톤${n ? ` · 지금 ${L.formatRate(L.launcherRate(save, i))}톤` : ''}${next ? ` · ${next}개면 ×2` : ''}</span>`;
    r.btn.textContent = `${L.formatNumber(c)}원`; r.btn.disabled = save.money < c;
  }
}

// ---------- 창 ----------
function modal(html, buttons) {
  const card = $('modalCard');
  card.innerHTML = html;
  for (const [label, cls, fn] of buttons) {
    const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.innerHTML = label;
    b.addEventListener('click', () => { sfx.tick(); fn(); });
    card.appendChild(b);
  }
  $('modal').hidden = false;
}
const closeModal = () => { $('modal').hidden = true; };
function fmtTime(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}시간 ${m}분` : `${m}분 ${Math.floor(s % 60)}초`; }
function showEnd() {
  const c = cfg(), next = L.stageConfig(c.stage + 1), e = L.effects(1, c), cal = L.calendar(save);
  modal(`<h2>스테이지 ${c.stage} 클리어</h2><p>위성을 거느리며 ${c.endName}만큼 자란 행성이<br>${cal.y}년 ${cal.m}월 ${cal.d}일, 지구와 부딪혔습니다.</p>
    <div class="stats"><span>걸린 날</span><b>${L.formatNumber(save.time)}일</b><span>쏘아 올린 위성</span><b>${L.formatNumber(save.sats)}기 · ${L.formatNumber(save.sent)}톤</b><span>충돌 속도</span><b>${L.formatSpeed(L.speedKms(1, c))}</b><span>마지막 조석력</span><b>달의 ${L.formatTimes(e.tideRatio)}배</b></div>`, [
    [`스테이지 ${next.stage} 시작<small>목표: ${next.endName}급 · 모든 발사 영구 ×${L.formatTimes(L.STAGE_BONUS ** next.stage / L.STAGE_BONUS)}</small>`, 'main', () => {
      L.nextStage(save); persist(); ending = null; shots.length = 0; meteors.length = 0; parts.length = 0; fires.length = 0; newsQueue.length = 0; shake = 0; city = null; rows = null; refreshList(); closeModal();
    }],
  ]);
}
function settingsHtml() {
  return `<div class="setRow"><span>소리</span><button class="btn" id="setSound">${save.sound ? '켬' : '끔'}</button></div>
    <div class="setRow"><span>진동</span><button class="btn" id="setVib">${save.vibrate ? '켬' : '끔'}</button></div>`;
}
function showSettings() {
  modal(`<h2>환경설정</h2>${settingsHtml()}<p style="font-size:13px">스테이지 ${save.stage} · 발사 ×${L.formatTimes(L.prestigeMult(save))}</p><p style="font-size:11px;opacity:.7">행성 지도: Solar System Scope(CC BY 4.0), NASA/JPL</p>`, [
    ['기록 지우기', 'red', () => modal('<h2>기록 지우기</h2><p>스테이지, 위성, 돈, 발사대, 날짜가<br>모두 지워져요.</p>', [
      ['지우기', 'red', () => { Object.assign(save, L.defaultSave(), { sound: save.sound, vibrate: save.vibrate }); persist(); ending = null; city = null; rows = null; newsQueue.length = 0; refreshList(); closeModal(); }],
      ['취소', '', showSettings],
    ])],
    ['닫기', 'main', closeModal],
  ]);
  $('setSound').onclick = () => { save.sound = !save.sound; persist(); $('setSound').textContent = save.sound ? '켬' : '끔'; };
  $('setVib').onclick = () => { save.vibrate = !save.vibrate; persist(); $('setVib').textContent = save.vibrate ? '켬' : '끔'; buzz(20); };
}
function applyOffline() {
  const now = Date.now(), away = (now - (save.lastSeen || now)) / 1000;
  save.lastSeen = now;
  if (away < 30 || ending || L.totalRate(save) <= 0) return;
  const r = L.offlineProgress(save, away);
  save.sats += Math.round(r.seconds * Math.min(5, 0.4 + Math.log10(1 + L.totalRate(save)) * 0.6));
  persist();
  if (r.tons <= 0) return;
  modal(`<h2>다녀오셨어요</h2><p>자리를 비운 ${fmtTime(r.seconds)}(${L.formatNumber(r.seconds)}일) 동안<br>발사대가 위성 <b>${L.formatNumber(r.tons)}톤</b>을 쏘아 올리고<br>계약금 <b>${L.formatNumber(r.money)}원</b>을 벌었어요<br><br>행성은 그만큼 더 무거워지고 가까워졌습니다.</p>`, [['확인', 'main', () => { closeModal(); checkEnd(); }]]);
}

// ---------- 연결 ----------
const lb = $('launch');
lb.addEventListener('pointerdown', (e) => { e.preventDefault(); lb.classList.add('press'); tapLaunch(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) lb.addEventListener(ev, () => lb.classList.remove('press'));
lb.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && $('modal').hidden) { e.preventDefault(); tapLaunch(); } });
$('gear').addEventListener('click', showSettings);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); else applyOffline(); });
setInterval(persist, 3000);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  update(dt);
  render(now);
  updateBroadcast(Math.min(0.1, dt), now / 1000);
  requestAnimationFrame(frame);
}
resize();
refreshList();
applyOffline();
checkEnd();
requestAnimationFrame(frame);
window.trashReady = true;
window.__trash = { save, tapLaunch, L, planetPos: () => planetPos() };
</script>
