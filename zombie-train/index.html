<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>좀비 열차</title>
<style>
  :root { --bg: #17110d; --card: #2a1f18; --line: #4a3a2c; --cream: #f0e2c0; --gold: #ffcf5a; --red: #e0503a; --gnb: 62px; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--cream);
    font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { display: flex; justify-content: center; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; overflow: hidden; background: #000; }
  #scene { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
  #fx { position: absolute; left: 0; top: 0; pointer-events: none; }
  .sh { text-shadow: 0 1px 0 #000, 0 0 3px #000, 1px 0 0 #000, -1px 0 0 #000; }

  /* 위: 시계, 노선, 수치 */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top)) 50px 10px 10px; pointer-events: none; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0)); }
  #clock { font: 900 15px system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #clock small { font-size: 12px; font-weight: 800; opacity: 0.85; }
  #route { margin-top: 4px; display: flex; align-items: center; gap: 6px; font: 800 12px system-ui, sans-serif; }
  #route i { position: relative; flex: 1; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.55); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2); }
  #route i b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: linear-gradient(90deg, #c9a24a, #ffcf5a); }
  #route i em { position: absolute; top: -9px; font-style: normal; font-size: 13px; transform: translateX(-50%); }
  #km { margin-top: 3px; font: 800 11.5px system-ui, sans-serif; opacity: 0.9; font-variant-numeric: tabular-nums; }
  #bars { margin-top: 6px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bar { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center; gap: 2px 4px; font: 800 11px system-ui, sans-serif; white-space: nowrap; }
  .bar i { grid-column: 1 / 3; }
  .bar i { height: 7px; border-radius: 2px; background: rgba(12, 8, 6, 0.8); box-shadow: 0 0 0 1px #000; overflow: hidden; }
  .bar i b { display: block; height: 100%; width: 50%; background: var(--c, #8fd06a); }
  .bar .v { text-align: right; font-variant-numeric: tabular-nums; }
  .bar.low .lb, .bar.low .v { color: #ff8a6a; animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #res { margin-top: 6px; display: flex; gap: 10px; font: 800 12.5px system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #res .low b { color: #ff8a6a; }
  #gear { display: none; }
  #banner { position: absolute; left: 50%; top: calc(132px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 6px 12px; border-radius: 10px; background: rgba(20, 12, 8, 0.85); border: 1px solid var(--line); font: 900 13.5px system-ui, sans-serif; white-space: nowrap; pointer-events: none; transition: opacity 0.3s; z-index: 3; }
  #banner.red { background: rgba(120, 20, 14, 0.9); border-color: #ff7a5a; }
  #banner.hide { opacity: 0; }

  /* 오른쪽 행동 버튼(쇼츠·릴스 버튼처럼) */
  #acts { position: absolute; right: 8px; bottom: calc(var(--gnb) + env(safe-area-inset-bottom) + 14px); display: flex; flex-direction: column; gap: 10px; align-items: center; z-index: 2; }
  .act { width: 58px; padding: 0; border: none; background: none; color: #fff; font: 800 11px/1.15 system-ui, sans-serif; text-shadow: 0 1px 2px #000, 0 0 3px #000; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .act b { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(20, 12, 8, 0.62); box-shadow: 0 0 0 2px rgba(255, 230, 190, 0.35), 0 3px 8px rgba(0, 0, 0, 0.5); }
  .act small { font-size: 10px; font-weight: 700; opacity: 0.85; }
  .act:active b { transform: scale(0.92); }
  .act:disabled { opacity: 0.45; }
  .act.hot b { background: rgba(150, 60, 24, 0.85); box-shadow: 0 0 0 2px #ffb070, 0 0 14px rgba(255, 140, 60, 0.6); }
  .act.forage b { background: rgba(40, 80, 34, 0.85); }

  /* 아래 GNB */
  #gnb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; height: calc(var(--gnb) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(14, 9, 6, 0.94); border-top: 1px solid rgba(255, 230, 190, 0.12); }
  #gnb button { border: none; background: none; color: rgba(240, 226, 192, 0.55); font: 800 10.5px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
  #gnb button span { font-size: 21px; filter: grayscale(0.7); }
  #gnb button.on { color: var(--gold); }
  #gnb button.on span { filter: none; }
  #gnb button .dot { position: absolute; top: 8px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px #0e0906; }

  /* 탭 시트 */
  #sheet { position: absolute; left: 0; right: 0; bottom: calc(var(--gnb) + env(safe-area-inset-bottom)); z-index: 5; max-height: 62%; display: flex; flex-direction: column; background: rgba(23, 17, 13, 0.97); border-top: 2px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5); animation: up 0.2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  #sheet h3 { margin: 0; padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: baseline; font: 900 16px system-ui, sans-serif; color: var(--gold); }
  #sheet h3 span { font-size: 12.5px; color: var(--cream); opacity: 0.8; font-weight: 700; }
  #sheetBody { overflow-y: auto; padding: 0 12px 14px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
  .up { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .up .ic { font-size: 20px; text-align: center; }
  .up .nm { font: 900 13px system-ui, sans-serif; }
  .up .nm em { font-style: normal; color: var(--gold); font-size: 11.5px; margin-left: 3px; }
  .up .ds { font-size: 11px; opacity: 0.75; margin-top: 1px; }
  .up button { min-width: 64px; min-height: 36px; border: none; border-radius: 8px; background: #c98a2a; color: #1a0f06; font: 900 13px system-ui, sans-serif; }
  .up button:disabled { background: #3a2c20; color: #8a7a68; }
  .up.max button { background: #2c3a2a; color: #9fd08a; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .kv b { color: #fff; text-align: right; }
  .stops { display: flex; flex-direction: column; gap: 0; padding: 4px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .stop { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
  .stop:last-child { border: none; }
  .stop.done { opacity: 0.5; }
  .stop.next { color: var(--gold); font-weight: 900; }

  .screen { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.72); }
  .card { width: 100%; max-width: 330px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--card); border: 2px solid #000; box-shadow: 0 0 0 2px var(--line), 0 12px 40px rgba(0, 0, 0, 0.6); border-radius: 14px; }
  .card h2 { margin: 0; font: 900 22px system-ui, sans-serif; text-align: center; }
  .card p { margin: 0; text-align: center; line-height: 1.55; font-size: 14.5px; opacity: 0.92; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14.5px; }
  .card .stats b { text-align: right; color: #fff; }
  .card ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; align-self: stretch; }
  .btn { width: 100%; min-height: 48px; padding: 6px 10px; background: #3a2c20; color: #fff; border: none; border-radius: 10px; box-shadow: 0 3px 0 #160e08; font: 900 15.5px system-ui, sans-serif; }
  .btn.main { background: var(--gold); color: #1a0f06; }
  .btn.red { background: #8a2a1e; }
  .btn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.8; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #160e08; }
  #reload { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); z-index: 9; }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <canvas id="cv"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div id="hud" class="sh">
    <div id="clock"></div>
    <div id="route"><span id="from"></span><i><b id="rbar"></b><em id="rtrain">🚃</em></i><span id="to"></span></div>
    <div id="km"></div>
    <div id="bars">
      <div class="bar" id="bHunger" style="--c:#e0a04a"><span class="lb">🍖 배부름</span><span class="v"></span><i><b></b></i></div>
      <div class="bar" id="bWarmth" style="--c:#ff7a3a"><span class="lb">🔥 체온</span><span class="v"></span><i><b></b></i></div>
      <div class="bar" id="bHealth" style="--c:#e04a5a"><span class="lb">❤️ 체력</span><span class="v"></span><i><b></b></i></div>
      <div class="bar" id="bMood" style="--c:#b49af0"><span class="lb">😺 기분</span><span class="v"></span><i><b></b></i></div>
    </div>
    <div id="res"><span id="cFood">🥫 <b></b></span><span id="cFuel">🪵 <b></b></span><span id="cScrap">🔩 <b></b></span><span id="cMeds">💊 <b></b></span><span id="cWin">🪟 <b></b></span></div>
  </div>
  <div id="banner" class="hide sh"></div>
  <div id="acts">
    <button class="act" id="aFeed"><b>🥫</b>먹이<small></small></button>
    <button class="act" id="aStove"><b>🔥</b><span></span><small></small></button>
    <button class="act" id="aRepair"><b>🔧</b>수리<small>🔩 2</small></button>
    <button class="act" id="aHeal"><b>💊</b>약<small>+40</small></button>
    <button class="act forage" id="aForage" hidden><b>🪓</b>땔감<small>2시간</small></button>
  </div>
  <div id="sheet" hidden><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div>
  <nav id="gnb">
    <button data-tab="room" class="on"><span>🚃</span>객실</button>
    <button data-tab="ups"><span>🔧</span>개조<i class="dot" id="upDot" hidden></i></button>
    <button data-tab="route"><span>🗺️</span>노선</button>
    <button data-tab="log"><span>🏆</span>기록</button>
    <button data-tab="set"><span>⚙️</span>설정</button>
  </nav>
  <div id="modal" class="screen" hidden><div class="card" id="card"></div></div>
  <button id="reload" class="btn main" style="width:auto" hidden onclick="location.reload()">다시 불러오기</button>
</div>
<script>
  setTimeout(function () { if (!window.zombieReady) document.getElementById('reload').hidden = false; }, 4000);
</script>
<script type="module">
import * as L from './logic.js?v=1';
import { Buf, createRoom, compose, catSprite, catBody, zombieSprite } from './pixel.js?v=1';

const $ = (id) => document.getElementById(id);
const save = L.loadSave(localStorage);
const PET = '모모';

// ---------- 화면 크기: 낮은 해상도(가로 200픽셀)로 그리고 픽셀 그대로 키워 화면을 꽉 채운다 ----------
const AW = 200;
const cv = $('cv'), fx = $('fx'), scene = $('scene');
let room = null, buf = null, img = null, actx = null, art = null, fctx = null;
let SW = 390, SH = 480, K = 2, DPR = 1;
function resize() {
  SW = scene.clientWidth; SH = scene.clientHeight; DPR = Math.min(3, window.devicePixelRatio || 1);
  K = SW / AW;
  const AH = Math.max(120, Math.round(SH / K));
  if (!room || room.AH !== AH) {
    room = createRoom(AW, AH);
    buf = new Buf(AW, AH);
    art = document.createElement('canvas'); art.width = AW; art.height = AH;
    actx = art.getContext('2d');
    img = actx.createImageData(AW, AH);
    buf.d = new Uint32Array(img.data.buffer);
  }
  cv.width = Math.round(SW * DPR); cv.height = Math.round(room.AH * K * DPR);
  cv.style.width = `${SW}px`; cv.style.height = `${room.AH * K}px`;
  fx.width = Math.round(SW * DPR); fx.height = Math.round(SH * DPR);
  fx.style.width = `${SW}px`; fx.style.height = `${SH}px`;
  fctx = fx.getContext('2d');
}
new ResizeObserver(() => resize()).observe(scene);
resize();

// ---------- 소리 ----------
let ac = null;
function audio() {
  if (!save.sound) return null;
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { return null; }
  return ac;
}
function tone(freq, dur, { type = 'sine', vol = 0.05, to = null, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.05, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, { vol = 0.1, from = 2000, to = 200, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay, n = Math.floor(a.sampleRate * dur);
  const b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = b; f.type = 'lowpass';
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0);
}
const sfx = {
  clack() { noise(0.07, { vol: 0.05, from: 500, to: 90 }); noise(0.07, { vol: 0.04, from: 500, to: 90, delay: 0.13 }); },
  groan() { tone(95, 1.3, { type: 'sawtooth', vol: 0.025, to: 62 }); tone(101, 1.1, { type: 'sawtooth', vol: 0.018, to: 70, delay: 0.1 }); },
  bang() { noise(0.12, { vol: 0.12, from: 380, to: 60 }); },
  hit() { noise(0.12, { vol: 0.14, from: 2600, to: 200 }); tone(140, 0.12, { type: 'square', vol: 0.03, to: 80 }); },
  kill() { noise(0.35, { vol: 0.12, from: 900, to: 80 }); tone(70, 0.4, { type: 'sawtooth', vol: 0.03, to: 40 }); },
  zap() { tone(1400, 0.2, { type: 'square', vol: 0.02, to: 300 }); noise(0.25, { vol: 0.06, from: 6000, to: 1000 }); },
  meow() { tone(760, 0.18, { type: 'triangle', vol: 0.05, to: 1150 }); tone(1100, 0.3, { type: 'triangle', vol: 0.045, to: 620, delay: 0.16 }); },
  eat() { [0, 0.15, 0.3].forEach((d) => noise(0.06, { vol: 0.05, from: 1800, to: 600, delay: d })); },
  click() { tone(520, 0.05, { type: 'square', vol: 0.025 }); },
  buy() { [660, 880, 1320].forEach((f, i) => tone(f, 0.12, { type: 'square', vol: 0.025, delay: i * 0.07 })); },
  chime() { [784, 659, 523].forEach((f, i) => tone(f, 0.45, { type: 'triangle', vol: 0.05, delay: i * 0.3 })); },
  crackle() { noise(0.03, { vol: 0.03, from: 3000, to: 1500 }); },
  sad() { [392, 349, 311, 262].forEach((f, i) => tone(f, 0.5, { type: 'triangle', vol: 0.05, delay: i * 0.35 })); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, { type: 'square', vol: 0.03, delay: i * 0.12 })); },
};
const buzz = (p) => { if (save.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch { /* 없음 */ } };

// ---------- 스프라이트 미리 만들기 ----------
const CAT = {};
for (const m of ['sleep', 'awake', 'happy', 'scared']) CAT[m] = catSprite(m);
CAT.eat = [catSprite('eat', 0), catSprite('eat', 1)];
const BODY = [catBody(0), catBody(1)];
let zSprites = null, zSpriteW = 0;
function zombieFrames(variant) {
  const w = Math.round(room.winRect.w * 0.82);
  if (!zSprites || zSpriteW !== w) { zSprites = {}; zSpriteW = w; }
  return zSprites[variant] || (zSprites[variant] = [zombieSprite(w, 0, variant), zombieSprite(w, 1, variant)]);
}

// ---------- 상태(화면 전용) ----------
const view = { scroll: 0, t: 0, zVariant: 0, zHit: 0, eatT: 0, petT: 0, nap: 0, blink: 0, floats: [], hearts: [], shake: 0, clackT: 0, bangT: 0, crackT: 0, lastZombie: null, warned: -1 };
function banner(text, red = false, ms = 2200) {
  const b = $('banner');
  b.textContent = text; b.className = `sh${red ? ' red' : ''}`;
  clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.add('hide'), ms);
}
function floatText(text, x, y, color = '#fff') { view.floats.push({ text, x, y, color, t: 0 }); }

// ---------- 고양이 기분 → 그림 ----------
function catView() {
  const z = save.zombie, night = L.isNight(L.hourOf(save));
  const cold = save.warmth < 30, t = view.t;
  let mood, body = null;
  if (save.dead) mood = 'sleep';
  else if (z && z.t > L.ZOMBIE_APPROACH * 0.5) { mood = 'scared'; body = BODY[0]; }
  else if (view.eatT > 0) { mood = 'eat'; body = BODY[Math.floor(t * 2) % 2]; }
  else if (view.petT > 0) { mood = 'happy'; body = BODY[Math.floor(t * 3) % 2]; }
  else if (night || save.health < 35 || view.nap > 0) mood = 'sleep';
  else { mood = view.blink > 0 ? 'sleep' : 'awake'; body = BODY[Math.floor(t * 0.8) % 2]; }
  const sprite = mood === 'eat' ? CAT.eat[Math.floor(t * 6) % 2] : CAT[mood];
  let dx = 0, dy = 0;
  if (mood === 'sleep') dy = Math.floor(t * 0.6) % 2;
  if (mood === 'scared') dx = Math.round(Math.sin(t * 40));
  if (cold) dx += Math.round(Math.sin(t * 30) * 0.6);
  return { mood, sprite, body, dx, dy, tint: cold ? 0xffe0a080 : 0 };
}

// ---------- 그리기 ----------
const isRain = () => { const b = Math.floor(save.minutes / 360); return ((b * 7919) % 5) === 0; };
function render() {
  const z = save.zombie;
  let zv = null;
  if (z) {
    if (view.lastZombie !== z) { view.lastZombie = z; view.zVariant = Math.floor(Math.random() * 6); }
    const fr = zombieFrames(view.zVariant), k = Math.min(1, z.t / L.ZOMBIE_APPROACH);
    zv = { k, hit: view.zHit > 0, sprite: fr[k >= 1 ? Math.floor(view.t * 2.2) % 2 : 0] };
  }
  const cat = catView();
  const o = {
    t: view.t, daylight: L.daylight(L.hourOf(save)), scroll: view.scroll, crowd: Math.min(1, L.zombieRate(save) / 1.6),
    rain: isRain(), station: !!save.station, zombie: zv, fire: save.stoveOn && save.fuel > 0 ? 1 : 0, fuel: save.fuel, food: save.food,
    barricade: save.barricade / L.barricadeMax(save), plates: save.up.plate, lampOn: true, radioOn: save.up.radio > 0,
    cat: { sprite: cat.sprite, body: cat.body, dx: cat.dx, dy: cat.dy, tint: cat.tint },
  };
  room._plates = save.up.plate;
  compose(buf, room, o);
  actx.putImageData(img, 0, 0);
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  const sx = view.shake > 0 ? Math.round((Math.random() - 0.5) * 6 * view.shake) * DPR : 0;
  g.drawImage(art, 0, 0, room.AW, room.AH, sx, 0, cv.width, cv.height);
  drawFx(cat);
}
// 픽셀 위에 얹는 글자들(또렷한 폰트)
function drawFx(cat) {
  const c = fctx, k = K;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, SW, SH);
  c.textAlign = 'center'; c.textBaseline = 'middle';

    c.beginPath(); c.arc(bx - 12, by + 12, 3, 0, Math.PI * 2); c.fill();

  c.globalAlpha = 1;

  c.font = '900 14px system-ui, sans-serif'; c.lineWidth = 3; c.strokeStyle = '#000';

}

let last = performance.now(), uiT = 0;
function frame(now) {

  const paused = !$('modal').hidden;
  if (!paused) {
    const ev = L.step(save, dt);
    for (const e of ev) {
      if (e === 'zombie') { sfx.groan(); banner('🧟 좀비가 창문에 붙었어요!', true); buzz([30, 50, 30]); }
      if (e === 'zap') { sfx.zap(); floatText('⚡ 지지직!', room.winRect.x + room.winRect.w / 2, room.winRect.y + room.winRect.h / 2, '#a8e0ff'); }
      if (e === 'day') banner(`☀️ ${L.dayOf(save)}일째 아침`);
      if (e === 'station') onStation();
      if (e === 'arrive') onArrive();
      if (e === 'dead') onDead();
    }
    const h = L.hourOf(save);
    if (save.up.radio && L.hordeNight(save) && h >= 16 && h < 20 && view.warned !== L.dayOf(save)) { view.warned = L.dayOf(save); banner('📻 오늘 밤 좀비 떼 경보! 창문을 고쳐 두세요', true, 3500); }
    const moving = save.fuel > 0 && !save.station && !save.arrived;
    if (moving) { view.scroll += (12 + L.speedKmh(save) * 1.1) * dt; view.clackT -= dt; if (view.clackT <= 0) { view.clackT = 1.1 - Math.min(0.5, L.speedKmh(save) / 80); sfx.clack(); } }
    if (save.zombie && save.zombie.t > L.ZOMBIE_APPROACH) { view.bangT -= dt; if (view.bangT <= 0) { view.bangT = 0.9; sfx.bang(); view.shake = Math.max(view.shake, 0.25); } }
    if (save.stoveOn && save.fuel > 0) { view.crackT -= dt; if (view.crackT <= 0) { view.crackT = 0.4 + Math.random() * 1.5; sfx.crackle(); } }
    // 낮잠과 깜빡임
    if (view.nap > 0) view.nap -= dt; else if (Math.random() < dt / 40) view.nap = 8 + Math.random() * 10;
    if (view.blink > 0) view.blink -= dt; else if (Math.random() < dt / 3) view.blink = 0.15;
  }
  view.eatT = Math.max(0, view.eatT - dt); view.petT = Math.max(0, view.petT - dt); view.zHit = Math.max(0, view.zHit - dt); view.shake = Math.max(0, view.shake - dt * 2);
  for (const f of view.floats) f.t += dt; view.floats = view.floats.filter((f) => f.t < 1);
  for (const hh of view.hearts) hh.t += dt; view.hearts = view.hearts.filter((hh) => hh.t < 1);
  render();
  uiT -= dt; if (uiT <= 0) { uiT = 0.2; updateUI(); }
  requestAnimationFrame(frame);
}
updateUI();
if (save.station) onStation(); else if (save.dead) onDead(); else if (save.arrived) onArrive(); else if (!save.seenIntro) intro();
requestAnimationFrame(frame);
window.__zt = { save, L, view, room: () => room };
window.zombieReady = true;
</script>
