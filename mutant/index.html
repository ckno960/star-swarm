<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';
import { mergeGeometries } from './vendor/jsm/utils/BufferGeometryUtils.js';
import * as L from './logic.js?v=1';

const $ = (id) => document.getElementById(id);
const save = L.loadSave(localStorage);
const persist = () => L.storeSave(localStorage, save);

// ---------- 렌더러: 낮은 해상도로 그려 픽셀이 보이게 ----------
const PIX = 3;
const cv = $('cv'), app = $('app');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fc4e8');
scene.fog = new THREE.Fog('#9fc4e8', 60, 230);
const camera = new THREE.PerspectiveCamera(62, 1, 0.3, 400);
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(Math.ceil(w / PIX), Math.ceil(h / PIX), false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
scene.add(new THREE.HemisphereLight('#d8ecff', '#5a5040', 1.6));
const sun = new THREE.DirectionalLight('#fff2d8', 1.6); sun.position.set(60, 100, 30); scene.add(sun);

// ---------- 픽셀 텍스처 ----------
function pixTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// 건물 벽: 한 칸 = 가로 4m, 한 층 3.5m. 창문 두 개와 기둥
const wallTex = pixTex(8, 8, (g) => {
  g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, 8, 8);
  g.fillStyle = '#3c4656'; g.fillRect(1, 2, 2, 4); g.fillRect(5, 2, 2, 4);
  g.fillStyle = '#6a7a90'; g.fillRect(1, 2, 2, 1); g.fillRect(5, 2, 2, 1);
  g.fillStyle = '#b8b8b8'; g.fillRect(0, 7, 8, 1);
});
const roadTex = pixTex(16, 16, (g) => {
  g.fillStyle = '#4a4a50'; g.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 18; i++) { g.fillStyle = Math.random() < 0.5 ? '#52525a' : '#424248'; g.fillRect(Math.random() * 16 | 0, Math.random() * 16 | 0, 1, 1); }
});
const walkTex = pixTex(8, 8, (g) => { g.fillStyle = '#a8a298'; g.fillRect(0, 0, 8, 8); g.fillStyle = '#968f84'; g.fillRect(0, 0, 8, 1); g.fillRect(0, 0, 1, 8); g.fillRect(4, 4, 4, 1); });

// ---------- 도시 ----------
const BLOCK = 40, STREETW = 14, P = BLOCK + STREETW, N = 6, HALF = (N * P) / 2;
const boxes = [];   // 건물 충돌 상자 { x0, x1, z0, z1, h }
const PALETTE = ['#c8b8a0', '#a8b4c4', '#c49a7a', '#b0b0a8', '#9aa890', '#c8c0b0', '#8c96a8'].map((c) => new THREE.Color(c));
const roofMat = new THREE.MeshLambertMaterial({ color: '#6a6a70' });
const wallMats = PALETTE.map((c) => new THREE.MeshLambertMaterial({ map: wallTex, color: c }));
function building(x0, x1, z0, z1, h, pal) {
  const w = x1 - x0, d = z1 - z0, g = new THREE.BoxGeometry(w, h, d);
  // 면마다 창문이 실제 크기로 반복되게 UV를 늘린다
  const uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const sx = f < 2 ? d / 8 : w / 8, sy = f === 2 || f === 3 ? d / 8 : h / 3.5;
    for (let v = 0; v < 4; v++) { const i = f * 4 + v; uv.setXY(i, uv.getX(i) * sx, uv.getY(i) * sy); }
  }
  const m = new THREE.Mesh(g, [wallMats[pal], wallMats[pal], roofMat, roofMat, wallMats[pal], wallMats[pal]]);
  m.position.set((x0 + x1) / 2, h / 2, (z0 + z1) / 2);
  scene.add(m);
  boxes.push({ x0, x1, z0, z1, h });
  // 옥상 난간과 실외기
  if (h > 14 && Math.random() < 0.6) { const ac = new THREE.Mesh(new THREE.BoxGeometry(3, 1.6, 2), roofMat); ac.position.set(x0 + 3 + Math.random() * (w - 6), h + 0.8, z0 + 3 + Math.random() * (d - 6)); scene.add(ac); }
}
function buildCity() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(N * P + 80, N * P + 80), new THREE.MeshLambertMaterial({ map: roadTex }));
  ground.material.map.repeat.set((N * P + 80) / 4, (N * P + 80) / 4);
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const walkMat = new THREE.MeshLambertMaterial({ map: walkTex });
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const cx = -HALF + STREETW / 2 + i * P + BLOCK / 2, cz = -HALF + STREETW / 2 + j * P + BLOCK / 2;
    const side = new THREE.Mesh(new THREE.BoxGeometry(BLOCK + 3, 0.25, BLOCK + 3), walkMat);
    side.geometry.attributes.uv.array.forEach((v, k, a) => { a[k] = v * (BLOCK + 3) / 2; });
    side.position.set(cx, 0.12, cz); scene.add(side);
    // 블록을 1~4개 건물로 나눈다
    const split = Math.random(), m = 2;
    const rects = split < 0.25 ? [[-20, 20, -20, 20]] : split < 0.6 ? [[-20, -1, -20, 20], [1, 20, -20, 20]] : [[-20, -1, -20, -1], [1, 20, -20, -1], [-20, -1, 1, 20], [1, 20, 1, 20]];
    for (const [a, b, c, d] of rects) {
      const h = 12 + Math.floor(Math.random() * 10) * 5 * (Math.abs(i - 2.5) + Math.abs(j - 2.5) < 2.5 ? 1.3 : 0.8);
      building(cx + a + m, cx + b - m, cz + c + m, cz + d - m, Math.round(h / 3.5) * 3.5, Math.floor(Math.random() * PALETTE.length));
    }
  }
  // 가로등(점)
  const lampMat = new THREE.MeshLambertMaterial({ color: '#30323a' });
  for (let i = 0; i <= N; i++) for (let j = 0; j < N; j++) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 5, 0.2), lampMat); p.position.set(-HALF + i * P + STREETW / 2 - 1.2, 2.5, -HALF + STREETW / 2 + j * P + BLOCK / 2); scene.add(p); }
}
const streetLines = []; for (let i = 0; i <= N; i++) streetLines.push(-HALF + i * P);   // 길 한가운데
const onStreet = (v) => streetLines[Math.round((v + HALF) / P)] ?? 0;
// 높이: 옥상 위에 있으면 옥상 높이
function groundAt(x, z, y) {
  let g = 0;
  for (const b of boxes) if (x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1 && y >= b.h - 0.6 && b.h > g) g = b.h;
  return g;
}
// 원(반지름 r)을 건물 밖으로 밀어낸다. 벽에 닿으면 벽의 바깥 방향을 돌려준다
function pushOut(p, r, y) {
  let wall = null;
  for (const b of boxes) {
    if (y >= b.h - 0.3) continue;
    const cx = Math.max(b.x0, Math.min(p.x, b.x1)), cz = Math.max(b.z0, Math.min(p.z, b.z1)), dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-6) { const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k; wall = { nx: dx / d, nz: dz / d, b }; }
    else {   // 안에 들어간 경우: 가장 가까운 면으로
      const o = [[b.x0 - p.x, 'x', -1], [b.x1 - p.x, 'x', 1], [b.z0 - p.z, 'z', -1], [b.z1 - p.z, 'z', 1]].sort((a, c) => Math.abs(a[0]) - Math.abs(c[0]))[0];
      if (o[1] === 'x') { p.x += o[0] + o[2] * r; wall = { nx: o[2], nz: 0, b }; } else { p.z += o[0] + o[2] * r; wall = { nx: 0, nz: o[2], b }; }
    }
  }
  return wall;
}

// ---------- 사람 모델(코드로 만든 가벼운 모델: 몸통 1 + 다리 2) ----------
const vMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const legGeo = new THREE.BoxGeometry(0.16, 0.86, 0.18).translate(0, -0.43, 0);
const pantsMats = new Map();
const pantsMat = (c) => { if (!pantsMats.has(c)) pantsMats.set(c, new THREE.MeshLambertMaterial({ color: c, flatShading: true })); return pantsMats.get(c); };
function cbox(w, h, d, x, y, z, color) {
  const g = new THREE.BoxGeometry(w, h, d).translate(x, y, z), c = new THREE.Color(color), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
const CIV_SHIRTS = ['#c23a32', '#3a62b8', '#3e8a4a', '#e0b83a', '#e6e2d8', '#2a2a30', '#7a4aa8', '#e07a2a'];
function personModel(kind) {
  const r = Math.random, skin = kind === 'infected' ? '#9ab48a' : ['#f0c8a0', '#d8a878', '#b07850', '#7a5038'][Math.floor(r() * 4)];
  const shirt = kind === 'soldier' ? '#4a5a34' : kind === 'infected' ? '#5a1e1a' : CIV_SHIRTS[Math.floor(r() * CIV_SHIRTS.length)];
  const pants = kind === 'soldier' ? '#3a4228' : kind === 'infected' ? '#2a2420' : ['#2a3348', '#4a4038', '#1e1e22', '#6a6a70'][Math.floor(r() * 4)];
  const parts = [cbox(0.44, 0.62, 0.26, 0, 1.2, 0, shirt), cbox(0.13, 0.58, 0.15, 0.29, 1.18, 0, shirt), cbox(0.13, 0.58, 0.15, -0.29, 1.18, 0, shirt),
    cbox(0.11, 0.1, 0.12, 0.29, 0.85, 0, skin), cbox(0.11, 0.1, 0.12, -0.29, 0.85, 0, skin), cbox(0.24, 0.26, 0.26, 0, 1.66, 0, skin)];
  if (kind === 'soldier') { parts.push(cbox(0.3, 0.14, 0.32, 0, 1.82, 0, '#3a4a2a'), cbox(0.08, 0.08, 0.8, 0.18, 1.2, -0.3, '#18181a'), cbox(0.48, 0.3, 0.3, 0, 1.3, 0, '#3a4228')); }
  else if (kind === 'infected') parts.push(cbox(0.26, 0.06, 0.28, 0, 1.8, 0, '#3a4a30'), cbox(0.06, 0.06, 0.02, 0.06, 1.68, -0.13, '#ff3a2a'), cbox(0.06, 0.06, 0.02, -0.06, 1.68, -0.13, '#ff3a2a'));
  else { const hair = ['#2a1a10', '#6a3a1a', '#c89a4a', '#1a1a1a'][Math.floor(r() * 4)]; parts.push(cbox(0.26, 0.08, 0.28, 0, 1.8, 0.01, hair)); if (r() < 0.3) parts.push(cbox(0.27, 0.07, 0.36, 0, 1.84, -0.04, CIV_SHIRTS[Math.floor(r() * 8)])); }
  const g = new THREE.Group(), body = new THREE.Mesh(mergeGeometries(parts), vMat);
  g.add(body);
  const legs = [0.11, -0.11].map((x) => { const l = new THREE.Mesh(legGeo, pantsMat(pants)); l.position.set(x, 0.9, 0); g.add(l); return l; });
  if (kind === 'infected') body.rotation.x = -0.25;
  return { g, body, legs };
}

// ---------- 플레이어(Blender 모델) ----------
let player = null;
const playerParts = {};
async function loadPlayer() {
  const gltf = await new GLTFLoader().loadAsync('./models/person.glb');
  const root = gltf.scene;
  root.traverse((o) => {
    if (o.name) playerParts[o.name] = o;
    if (o.isMesh) {
      const n = o.material.name;
      const col = { skin: '#c8a090', hair: '#1a1416', shirt: '#26262e', pants: '#1c1c22', shoe: '#101012', hat: '#26262e', eye: '#ff3a2a' }[n];
      o.material = new THREE.MeshLambertMaterial({ color: col || o.material.color, flatShading: true });
      o.material.userData.part = n;
    }
  });
  for (const n of ['glasses', 'hatFedora', 'case', 'umbrella', 'bag']) if (playerParts[n]) playerParts[n].visible = false;
  // 빨간 변이 줄무늬(후드)
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.06, 0.26), new THREE.MeshLambertMaterial({ color: '#c01818' }));
  stripe.position.set(0, 1.25, 0); root.add(stripe); playerParts.stripe = stripe;
  player = { g: root, pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(), yaw: 0, onGround: true, wall: null, climbing: false, gliding: false, dashT: 0, dashCd: 0, atkCd: 0, absorbT: 0, phase: 0, hitT: 0, slamT: 0 };
  scene.add(root);
  setDisguiseLook(false);
}
function setDisguiseLook(on) {
  if (!player) return;
  player.g.traverse((o) => {
    if (!o.isMesh || !o.material.userData.part) return;
    const p = o.material.userData.part;
    if (p === 'shirt') o.material.color.set(on ? '#4a5a34' : '#26262e');
    if (p === 'pants') o.material.color.set(on ? '#3a4228' : '#1c1c22');
    if (p === 'hat') o.material.color.set(on ? '#3a4a2a' : '#26262e');
  });
  if (playerParts.hatCap) playerParts.hatCap.visible = on;
  if (playerParts.stripe) playerParts.stripe.visible = !on;
}

// ---------- 사람들 ----------
const npcs = [];
function randomStreetPoint(farFrom, minD = 40) {
  for (let i = 0; i < 30; i++) {
    const vertical = Math.random() < 0.5, line = streetLines[Math.floor(Math.random() * streetLines.length)], t = (Math.random() * 2 - 1) * HALF * 0.95;
    const x = vertical ? line : t, z = vertical ? t : line;
    if (!farFrom || Math.hypot(x - farFrom.x, z - farFrom.z) > minD) return { x, z, vertical };
  }
  return { x: 0, z: 0, vertical: true };
}
function spawnNpc(kind, at) {
  const m = personModel(kind), p = at || randomStreetPoint(player && player.pos);

// ---------- 군인 눈에 띄었나 ----------
function soldierSees(range = 35) {

// ---------- 플레이어 움직임 ----------
const GRAV = 32;
function stepPlayer(dt) {
  const p = player, mm = L.moveMul(save);

  const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }

    p.vel.z += (wz * run - p.vel.z) * Math.min(1, accel * dt);

// 높은 곳에서 떨어지면 땅이 울린다(거대 주먹과 같은 충격파)
function slam(fromFall) {

  burst(p.x, 0.5, p.z, '#8a8478', 16, 9); sfx.slam(); buzz(40);
  for (const n of npcs) { if (n.dead) continue; const d = Math.hypot(n.x - p.x, n.z - p.z); if (d < r) hurtNpc(n, fromFall ? 30 : 0, (n.x - p.x) / (d || 1), (n.z - p.z) / (d || 1), 10); }

// ---------- 공격과 흡수 ----------
function hurtNpc(n, dmg, dx, dz, knock) {

}
function attack() {

  p.atkCd = w.cd; p.atkSwing = 1;

    if (d > w.range + 0.4 || Math.abs(n.y - p.pos.y) > 2.5) continue;

}
function absorbNearest() {

  for (const n of npcs) { if (n.dead) continue; const d = Math.hypot(n.x - p.pos.x, n.z - p.pos.z); if (d < bd && Math.abs(n.y - p.pos.y) < 2) { best = n; bd = d; } }

// ---------- 사람들 움직임 ----------
function stepNpcs(dt) {
  const pp = player.pos;
  for (let i = npcs.length - 1; i >= 0; i--) {
    const n = npcs[i];
    if (n.dead) { n.deadT += dt; n.g.rotation.x = Math.min(Math.PI / 2, n.deadT * 6) * -1; n.g.position.y = n.y + 0.15; if (n.deadT > 4) removeNpc(n); continue; }
    n.cd -= dt; n.t -= dt;
    let tx = null, tz = null, speed = L.KINDS[n.kind].speed;
    const dP = Math.hypot(pp.x - n.x, pp.z - n.z);
    if (n.kind === 'infected') {
      // 가장 가까운 사람(또는 플레이어)을 쫓는다
      let tgt = dP < 30 && !save.disguise ? { x: pp.x, z: pp.z, d: dP, p: true } : null;
      for (const m of npcs) if (m !== n && !m.dead && m.kind !== 'infected') { const d = Math.hypot(m.x - n.x, m.z - n.z); if (d < 25 && (!tgt || d < tgt.d)) tgt = { x: m.x, z: m.z, d, m }; }

    } else if (n.kind === 'soldier') {
      // 경계 중이고 변장이 아니면 플레이어를, 아니면 가까운 감염체를 쏜다
      let tgt = null;
      if (save.alert > 0 && !save.disguise && dP < 45) tgt = { x: pp.x, y: pp.y + 1.2, z: pp.z, p: true, d: dP };
      for (const m of npcs) if (m.kind === 'infected' && !m.dead) { const d = Math.hypot(m.x - n.x, m.z - n.z); if (d < 28 && (!tgt || d < tgt.d)) tgt = { x: m.x, y: 1.2, z: m.z, m, d }; }

        n.g.rotation.y = Math.atan2(-(tgt.x - n.x), -(tgt.z - n.z)); speed = 0;
        if (tgt.d > 14) { tx = tgt.x; tz = tgt.z; speed = 2; }
        if (n.cd <= 0) { n.cd = 0.5 + Math.random() * 0.4; sfx.gun(); tracer(new THREE.Vector3(n.x, 1.4, n.z), new THREE.Vector3(tgt.x + (Math.random() - 0.5) * 2, tgt.y + (Math.random() - 0.5), tgt.z + (Math.random() - 0.5) * 2)); if (Math.random() < (tgt.p ? 0.35 : 0.5)) { if (tgt.p) hurtPlayer(5); else { tgt.m.hp -= 20; if (tgt.m.hp <= 0) { tgt.m.dead = true; tgt.m.deadT = 0; } } } }
      }
    } else if (n.state === 'flee' || (dP < 12 && (save.alert > 0 || player.atkSwing > 0))) {
      if (n.state !== 'flee') { n.state = 'flee'; n.t = 4; }
      tx = n.x + (n.x - pp.x); tz = n.z + (n.z - pp.z); speed = 4.2;
      if (n.t <= 0) { n.state = 'walk'; n.goal = null; }
    }
    if (tx === null) {
      if (!n.goal || Math.hypot(n.goal.x - n.x, n.goal.z - n.z) < 1.5) { if (n.goal) n.axis = n.axis === 'x' ? 'z' : 'x'; walkGoal(n); }
      tx = n.goal.x; tz = n.goal.z;
    }
    const dx = tx - n.x, dz = tz - n.z, d = Math.hypot(dx, dz);
    let vx = d > 0.3 ? (dx / d) * speed : 0, vz = d > 0.3 ? (dz / d) * speed : 0;
    vx += n.knock.x; vz += n.knock.y; n.knock.multiplyScalar(Math.pow(0.02, dt));
    const pos = { x: n.x + vx * dt, z: n.z + vz * dt };
    pushOut(pos, 0.35, 0);
    n.x = Math.max(-HALF - 20, Math.min(HALF + 20, pos.x)); n.z = Math.max(-HALF - 20, Math.min(HALF + 20, pos.z));
    const sp = Math.hypot(vx, vz);
    n.phase += dt * sp * 2.4;
    const sw = Math.sin(n.phase) * Math.min(1, sp / 2) * 0.7;
    n.legs[0].rotation.x = sw; n.legs[1].rotation.x = -sw;
    n.g.position.set(n.x, n.y, n.z);
    if (sp > 0.2 && !(n.kind === 'soldier' && speed === 0)) n.g.rotation.y = Math.atan2(-vx, -vz);
  }
}
function hurtPlayer(n) {
  if (L.damage(save, n)) die();
  player.hitT = 0.15; sfx.hurt();
}
let dead = false;
function die() {
  if (dead) return; dead = true; buzz([80, 60, 160]); sfx.boom();
  modal(`<h2>💀 쓰러졌어요</h2><p>EP의 20%를 잃고 옥상에서 다시 깨어나요.</p>`, [['다시 일어나기', 'main', () => {
    L.respawn(save); dead = false; setDisguiseLook(false);
    const b = boxes.filter((x) => x.h > 20)[Math.floor(Math.random() * boxes.filter((x) => x.h > 20).length)];
    player.pos.set((b.x0 + b.x1) / 2, b.h, (b.z0 + b.z1) / 2); player.vel.set(0, 0, 0);
    for (const h of helis) scene.remove(h.g); helis.length = 0;
    close(); persist();
  }]]);
}

// ---------- 세계 유지(인원 채우기, 둥지, 헬기) ----------
let popT = 0;
function stepWorld(dt) {
  popT -= dt;
  if (popT <= 0) {
    popT = 1;
    const count = (k) => npcs.filter((n) => n.kind === k && !n.dead).length;
    if (count('civ') < 22) spawnNpc('civ');
    if (count('soldier') < L.soldiersWanted(save.alert)) spawnNpc('soldier');
    // 멀리 떨어진 사람은 정리해서 가볍게
    for (const n of [...npcs]) if (Math.hypot(n.x - player.pos.x, n.z - player.pos.z) > 170 && n.kind !== 'infected') removeNpc(n);
  }
  for (let i = hives.length - 1; i >= 0; i--) {
    const h = hives[i];
    h.m.scale.setScalar(1 + Math.sin(performance.now() / 300 + i) * 0.05);
    if (h.hp <= 0) { burst(h.x, 2, h.z, '#8a1a28', 30, 10); sfx.boom(); scene.remove(h.m); hives.splice(i, 1); L.hiveDestroyed(save); msg('💥 감염 둥지를 부쉈어요! +120 EP'); setTimeout(spawnHive, 30000); continue; }
    h.spawnT -= dt;
    const inf = npcs.filter((n) => n.kind === 'infected' && !n.dead);
    if (h.spawnT <= 0 && inf.length < 18) { h.spawnT = 6; spawnNpc('infected', { x: h.x + (Math.random() - 0.5) * 6, z: h.z + (Math.random() - 0.5) * 6, vertical: true }); }
  }
  // 헬기: 플레이어 주위를 돌며 사격
  while (helis.filter((h) => !h.down).length < L.helisWanted(save.alert)) spawnHeli();
  for (let i = helis.length - 1; i >= 0; i--) {
    const h = helis[i], g = h.g;
    h.rotor.rotation.y += dt * 25;
    if (h.down) { h.vy -= 20 * dt; g.position.y += h.vy * dt; g.rotation.z += dt * 3; if (g.position.y < 1) { burst(g.position.x, 1, g.position.z, '#ff8a2a', 30, 12); sfx.boom(); scene.remove(g); helis.splice(i, 1); } continue; }
    if (h.hp <= 0) { h.down = true; save.kills++; L.raiseAlert(save, 1); msg('💥 헬기 격추!'); burst(g.position.x, g.position.y, g.position.z, '#ff8a2a', 20, 10); sfx.boom(); continue; }
    if (L.helisWanted(save.alert) === 0) { g.position.y += dt * 10; if (g.position.y > 90) { scene.remove(g); helis.splice(i, 1); } continue; }
    h.ang += dt * 0.35;
    const tx = player.pos.x + Math.cos(h.ang) * 24, tz = player.pos.z + Math.sin(h.ang) * 24, ty = Math.max(player.pos.y + 16, 28);
    g.position.x += (tx - g.position.x) * Math.min(1, dt * 0.8); g.position.z += (tz - g.position.z) * Math.min(1, dt * 0.8); g.position.y += (ty - g.position.y) * Math.min(1, dt * 0.8);
    g.lookAt(player.pos.x, g.position.y, player.pos.z); g.rotateY(Math.PI);
    h.cd -= dt;
    if (h.cd <= 0 && !save.disguise) { h.cd = 0.9; sfx.gun(); tracer(g.position.clone().add(new THREE.Vector3(0, -1, 0)), player.pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 3, 1, (Math.random() - 0.5) * 3))); if (Math.random() < 0.3) hurtPlayer(8); }
  }
  for (let i = bits.length - 1; i >= 0; i--) { const b = bits[i]; b.t -= dt; b.v.y -= 20 * dt; b.m.position.addScaledVector(b.v, dt); if (b.m.position.y < 0.1) { b.m.position.y = 0.1; b.v.multiplyScalar(0.5); } if (b.t <= 0) { scene.remove(b.m); bits.splice(i, 1); } }
  for (let i = tracers.length - 1; i >= 0; i--) { const t = tracers[i]; t.t -= dt; if (t.t <= 0) { scene.remove(t.l); t.l.geometry.dispose(); tracers.splice(i, 1); } }
}

// ---------- 카메라 ----------
const camTarget = new THREE.Vector3();
function stepCamera(dt) {
  const p = player.pos;
  camTarget.lerp(new THREE.Vector3(p.x, p.y + 2, p.z), Math.min(1, dt * 10));
  let dist = 9;
  const dir = new THREE.Vector3(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch));
  // 건물 안으로 들어가면 당긴다
  for (let k = 1; k <= 8; k++) { const q = camTarget.clone().addScaledVector(dir, (dist * k) / 8); if (boxes.some((b) => q.x > b.x0 - 0.3 && q.x < b.x1 + 0.3 && q.z > b.z0 - 0.3 && q.z < b.z1 + 0.3 && q.y < b.h + 0.3)) { dist = Math.max(2.5, (dist * (k - 1)) / 8); break; } }
  camera.position.copy(camTarget).addScaledVector(dir, dist);
  camera.lookAt(camTarget);
}

// ---------- 화면 글자 ----------
function updateHud() {
  $('hpBar').querySelector('i').style.width = `${(save.hp / L.maxHp(save)) * 100}%`;
  $('alert').innerHTML = '⚠'.repeat(save.alert) + `<span class="off">${'⚠'.repeat(5 - save.alert)}</span>`;
  $('ep').textContent = `🧬 ${save.ep} EP`;
  const w = L.WEAPONS[save.weapon];
  $('wep').textContent = `${w.icon} ${w.name}`; $('atkIcon').textContent = w.icon;
  $('disg').hidden = !save.disguise;
  $('hives').textContent = `🔴 둥지 ${hives.length}`;
  $('evoDot').hidden = !L.UPGRADES.some((u) => save.ep >= L.upgradeCost(save, u.id));
}

// ---------- 창 ----------
let paused = false;
function modal(html, buttons) {
  paused = true;
  const card = $('card'); card.innerHTML = html;
  for (const [label, cls, fn] of buttons) { const b = document.createElement('button'); b.className = `btn ${cls || ''}`; b.innerHTML = label; b.onclick = fn; card.appendChild(b); }
  $('modal').hidden = false;
}
function close() { $('modal').hidden = true; paused = false; }
function evo() {
  modal(`<h2>🧬 진화</h2><p>흡수로 모은 EP로 몸을 바꿔요. 가진 EP: <b style="color:var(--gold)">${save.ep}</b></p><div id="ups" style="width:100%;display:flex;flex-direction:column;gap:6px"></div>`, [['닫기', 'main', () => close()]]);
  const box = $('ups');
  for (const u of L.UPGRADES) {
    const lv = save.up[u.id], cost = L.upgradeCost(save, u.id), row = document.createElement('div');
    row.className = 'up';
    row.innerHTML = `<div style="font-size:20px">${u.icon}</div><div><div class="nm">${u.name}<em>Lv.${lv}/${u.max}</em></div><div class="ds">${u.desc}</div></div>`;
    const b = document.createElement('button'); b.textContent = lv >= u.max ? '완료' : `${cost} EP`; b.disabled = !(save.ep >= cost);
    b.onclick = () => { if (L.buyUpgrade(save, u.id)) { sfx.buy(); if (u.id === 'hp') save.hp += 40; persist(); evo(); } };
    row.appendChild(b); box.appendChild(row);
  }
}
function intro() {
  modal(`<h2>🦠 뮤턴트 시티</h2><p>몸을 바꾸는 변이체가 되어 도시를 마음대로 누비세요.</p><ul>
    <li>🕹️ 왼쪽 아래를 끌어 이동, 화면을 끌어 시점 돌리기</li>
    <li>⤴ 점프. 벽 쪽으로 밀면 <b>벽을 달려 올라가요</b>. 공중에서 점프를 누르고 있으면 <b>활공</b></li>
    <li>🩸 사람을 <b>흡수</b>해 체력과 EP를 얻어요. 군인을 흡수하면 <b>군인으로 변장</b></li>
    <li>👊 공격, 🔄 무기 바꾸기(주먹 · 칼날 팔 · 거대 주먹), 💨 돌진</li>
    <li>⚠ 군인 앞에서 날뛰면 경계가 올라요. 3단계부터 헬기 출동. 숨어 있으면 내려가요</li>
    <li>🔴 감염 둥지를 부수면 EP를 많이 얻어요. 🧬로 진화</li>
    <li>⌨️ 컴퓨터: WASD 이동, 스페이스 점프, J 공격, K 흡수, L 돌진, Q 무기</li></ul>`,
  [['시작', 'main', () => { save.seenIntro = true; persist(); close(); }]]);
}
$('evo').onclick = () => evo();
$('pause').onclick = () => modal(`<h2>⏸ 멈춤</h2><div class="stats"><span>흡수</span><b>${save.absorbed}</b><span>처치</span><b>${save.kills}</b><span>부순 둥지</span><b>${save.hives}</b><span>모은 EP</span><b>${save.totalEp}</b></div>`, [
  ['계속', 'main', () => close()], [`소리 ${save.sound ? '켬' : '끔'}`, '', () => { save.sound = !save.sound; persist(); close(); }], ['❓ 하는 법', '', () => intro()]]);

// ---------- 루프 ----------
let last = performance.now(), hudT = 0, saveT = 0, prevAlert = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (player && !paused && !dead) {
    if (input.wep) { save.weapon = (save.weapon + 1) % L.WEAPONS.length; msg(`${L.WEAPONS[save.weapon].icon} ${L.WEAPONS[save.weapon].name}`); }
    if (input.atk) attack();
    if (input.abs) absorbNearest();
    input.wep = input.atk = input.abs = false;
    player.atkCd -= dt;
    stepPlayer(dt);
    if (player.gliding) act('glide');
    stepNpcs(dt);
    stepWorld(dt);
    L.stepAlert(save, dt, soldierSees());
    L.stepRegen(save, dt);
    if (save.alert > prevAlert) { sfx.alarm(); msg(`⚠ 경계 ${save.alert}단계!`, true); }
    prevAlert = save.alert;
    stepCamera(dt);
    saveT -= dt; if (saveT <= 0) { saveT = 5; persist(); }
  }
  if (player) renderer.render(scene, camera);
  hudT -= dt; if (hudT <= 0) { hudT = 0.15; updateHud(); }
  requestAnimationFrame(frame);
}
resize();
buildCity();
loadPlayer().then(() => {
  player.pos.set(streetLines[3], 0, streetLines[3] + 6);
  for (let i = 0; i < 18; i++) spawnNpc('civ');
  for (let i = 0; i < 8; i++) spawnNpc('soldier');
  for (let i = 0; i < 3; i++) spawnHive();
  camTarget.copy(player.pos);
  if (!save.seenIntro) intro();
  requestAnimationFrame(frame);
  window.mutantReady = true;
}).catch((e) => { console.error(e); $('reload').hidden = false; });
window.__mt = { save, L, get player() { return player; }, boxes, camera, npcs, hives, helis, input, keys, setYaw: (y) => { camYaw = y; }, setPitch: (p) => { camPitch = p; } };
</script>
</body>
</html>
