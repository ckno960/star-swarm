<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>럭키 셀</title>
<style>
  :root { --bg: #0e1410; --wall: #1a2420; --card: #1e2a24; --line: #3a5246; --green: #5fe08a; --gold: #ffd23f; --red: #ff5a4a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #eef6f0; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; justify-content: center; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(120% 80% at 50% 30%, #22302a, var(--bg)); }
  #app.shake { animation: shake 0.35s; }
  @keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
  #app.curse::after { content: ''; position: absolute; inset: 0; background: rgba(200, 20, 10, 0.35); pointer-events: none; animation: fade 0.6s forwards; }
  @keyframes fade { to { opacity: 0; } }
  /* 위: 빚과 코인 */
  #top { flex: none; padding: calc(8px + env(safe-area-inset-top)) 12px 6px; }
  #stage { display: flex; justify-content: space-between; font: 800 12.5px system-ui, sans-serif; opacity: 0.9; }
  #coinsRow { margin-top: 2px; display: flex; align-items: baseline; justify-content: space-between; }
  #coins { font: 900 34px/1.1 system-ui, sans-serif; color: var(--gold); font-variant-numeric: tabular-nums; }
  #debt { font: 900 15px system-ui, sans-serif; color: var(--red); }
  #debt.ok { color: var(--green); }
  #bar { margin-top: 5px; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.5); overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c84a3a, #ffd23f, #5fe08a); transition: width 0.3s; }
  #gear { position: absolute; right: 8px; top: calc(6px + env(safe-area-inset-top)); width: 34px; height: 34px; border: none; border-radius: 9px; background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 16px; display: none; }
  /* 기계 */
  #mid { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 4px 10px; gap: 8px; }
  #machine { display: flex; align-items: stretch; gap: 8px; }
  #frame { flex: 1; padding: 8px; border-radius: 14px; background: linear-gradient(#5a1e22, #3a1216); box-shadow: 0 0 0 2px #7a2a2e, 0 0 0 5px #24090c, 0 10px 30px rgba(0, 0, 0, 0.6); position: relative; }
  #reels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 5px; border-radius: 8px; background: #0a0606; }
  .col { display: grid; grid-template-rows: repeat(3, 1fr); gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 6px; background: linear-gradient(#fdfaf0, #e2dccc); display: flex; align-items: center; justify-content: center; font-size: clamp(22px, 8.2vw, 38px); line-height: 1; position: relative; }
  .col.rolling .cell { filter: blur(1.5px); animation: roll 0.11s linear infinite; }
  @keyframes roll { from { transform: translateY(-18%); } to { transform: translateY(18%); } }
  .col.stop .cell { animation: thunk 0.22s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes thunk { from { transform: translateY(-22%); } }
  .col.tease { box-shadow: 0 0 0 2px var(--gold), 0 0 14px var(--gold); border-radius: 8px; }
  .cell.win { background: linear-gradient(#fff3a8, #ffd23f); box-shadow: 0 0 0 2px #fff, 0 0 14px #ffd23f; animation: winPop 0.3s; z-index: 1; }
  @keyframes winPop { 50% { transform: scale(1.18); } }
  .cell.dim { opacity: 0.45; }
  .cell.dead { background: linear-gradient(#ff8a7a, #c8281a); animation: winPop 0.3s; }
  #marquee { margin-top: 7px; height: 26px; border-radius: 6px; background: #0a0606; display: flex; align-items: center; justify-content: center; font: 900 14px system-ui, sans-serif; color: var(--gold); letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; }
  #marquee.bad { color: var(--red); }
  /* 레버 */
  #lever { flex: none; width: 46px; position: relative; touch-action: none; }
  #track { position: absolute; left: 50%; top: 14px; bottom: 14px; width: 8px; margin-left: -4px; border-radius: 4px; background: #24090c; box-shadow: inset 0 0 0 1px #7a2a2e; }
  #knob { position: absolute; left: 50%; top: 0; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a7a, #c8281a 60%, #7a1208); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6); }
  #lever.ready #knob { animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), 0 0 16px #ff6a5a; } }
  #leverTip { position: absolute; left: -4px; right: -4px; bottom: -2px; text-align: center; font: 800 10px system-ui, sans-serif; opacity: 0.7; }
  #pips { display: flex; justify-content: center; gap: 5px; font: 800 12.5px system-ui, sans-serif; align-items: center; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .pip.used { background: #2a3a32; box-shadow: none; }
  #charms { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .slot { width: 46px; height: 46px; border-radius: 10px; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(0, 0, 0, 0.25); }
  .slot.has { border-style: solid; border-color: #6a8a78; background: var(--card); }
  .slot.fire { animation: winPop 0.3s; border-color: var(--gold); }
  #bottom { flex: none; padding: 6px 12px calc(12px + env(safe-area-inset-bottom)); }
  #spinBtn { width: 100%; min-height: 62px; border: none; border-radius: 16px; background: linear-gradient(#ff6a5a, #c8281a); color: #fff; font: 900 22px system-ui, sans-serif; letter-spacing: 2px; box-shadow: 0 6px 0 #6a1208, 0 10px 20px rgba(0, 0, 0, 0.5); }
  #spinBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6a1208; }
  #spinBtn:disabled { background: #3a4a42; box-shadow: 0 6px 0 #1a2420; color: #8a9a92; }
  #spinBtn small { display: block; font-size: 12px; letter-spacing: 0; font-weight: 700; opacity: 0.85; }
  #tip { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 90%; padding: 8px 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.88); border: 1px solid var(--line); font: 700 13px/1.4 system-ui, sans-serif; text-align: center; z-index: 4; }
  /* 창 */
  .screen { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(0, 0, 0, 0.78); }
  .card { width: 100%; max-width: 350px; max-height: 94%; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; }
  .card h2 { margin: 0; font: 900 22px system-ui, sans-serif; text-align: center; }
  .card p { margin: 0; text-align: center; line-height: 1.5; font-size: 14px; }
  .card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; align-self: stretch; }
  .card .stats { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
  .card .stats b { text-align: right; color: var(--gold); }
  .btn { width: 100%; min-height: 46px; padding: 4px 10px; border: none; border-radius: 10px; background: #33443c; color: #fff; font: 900 15px system-ui, sans-serif; }
  .btn.main { background: var(--gold); color: #2a1a04; }
  .btn.red { background: #7a2a2a; }
  .btn small { display: block; font-size: 11.5px; font-weight: 700; opacity: 0.8; }
  .btn:disabled { opacity: 0.45; }
  .item { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 10px; background: #16201b; border: 1px solid var(--line); }
  .item .ic { font-size: 24px; text-align: center; }
  .item .nm { font: 900 13.5px system-ui, sans-serif; } .item .nm em { font-style: normal; font-size: 11px; color: var(--green); margin-left: 4px; }
  .item .ds { font-size: 11.5px; opacity: 0.8; margin-top: 1px; }
  .item button { min-width: 70px; min-height: 38px; border: none; border-radius: 9px; background: linear-gradient(#6ae08a, #2a9a52); color: #06240f; font: 900 13px system-ui, sans-serif; }
  .item button:disabled { background: #33443c; color: #8a9a92; }
  .item.sold { opacity: 0.35; }
  .row { display: flex; gap: 8px; width: 100%; }
  .sub { font: 800 12.5px system-ui, sans-serif; align-self: flex-start; color: var(--green); margin-top: 4px; }
  #reload { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); z-index: 9; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="stage"><span id="stageL"></span><span id="stageR"></span></div>
    <div id="coinsRow"><span id="coins">0</span><span id="debt"></span></div>
    <div id="bar"><i></i></div>
  </div>
  <div id="mid">
    <div id="machine">
      <div id="frame">
        <div id="reels"></div>
        <div id="marquee">레버를 당기세요</div>
      </div>
      <div id="lever"><div id="track"></div><div id="knob"></div><div id="leverTip">당겨요 ↓</div></div>
    </div>
    <div id="pips"></div>
    <div id="charms"></div>
  </div>
  <div id="bottom"><button id="spinBtn">SPIN<small></small></button></div>
  <div id="tip" hidden></div>
  <div id="modal" class="screen" hidden><div class="card" id="card"></div></div>
  <button id="reload" class="btn main" style="width:auto;padding:0 16px" hidden onclick="location.reload()">다시 불러오기</button>
</div>
<script>setTimeout(function () { if (!window.luckyReady) document.getElementById('reload').hidden = false; }, 4000);</script>
<script type="module">
import * as L from './logic.js?v=1';

const $ = (id) => document.getElementById(id);
const save = L.loadSave(localStorage);
let run = save.run;
const persist = () => { save.run = run && !run.over ? run : null; L.storeSave(localStorage, save); };
const icon = (id) => L.sym(id).icon;

// ---------- 소리 ----------
let ac = null;
function audio() { if (!save.sound) return null; try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { return null; } return ac; }
function tone(f, dur, { type = 'sine', vol = 0.05, to = null, delay = 0 } = {}) { const a = audio(); if (!a) return; const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.01, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02); }
function noise(dur, { vol = 0.1, from = 2000, to = 200 } = {}) { const a = audio(); if (!a) return; const t0 = a.currentTime, n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(f).connect(g).connect(a.destination); s.start(t0); }
const sfx = {
  ratchet() { noise(0.03, { vol: 0.06, from: 3000, to: 1200 }); },
  pull() { noise(0.18, { vol: 0.2, from: 900, to: 120 }); tone(90, 0.2, { type: 'triangle', vol: 0.1, to: 50 }); },
  tick() { tone(700 + Math.random() * 200, 0.02, { type: 'square', vol: 0.01 }); },
  thunk(i) { noise(0.07, { vol: 0.16, from: 700, to: 120 }); tone(150 + i * 28, 0.09, { type: 'triangle', vol: 0.09, to: 90 }); },
  tease() { tone(400, 0.5, { type: 'sawtooth', vol: 0.025, to: 900 }); },
  win(i) { const f = 523 * 2 ** (Math.min(i, 14) / 12 * 2); tone(f, 0.16, { type: 'square', vol: 0.04 }); tone(f * 1.5, 0.2, { type: 'triangle', vol: 0.03, delay: 0.05 }); },
  big() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.2, { type: 'square', vol: 0.045, delay: i * 0.08 })); },
  miss() { tone(200, 0.15, { type: 'triangle', vol: 0.03, to: 140 }); },
  curse() { tone(110, 0.7, { type: 'sawtooth', vol: 0.08, to: 50 }); noise(0.5, { vol: 0.15, from: 500, to: 60 }); },
  buy() { [784, 1175].forEach((f, i) => tone(f, 0.08, { type: 'square', vol: 0.03, delay: i * 0.05 })); },
  paid() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.05, delay: i * 0.1 })); },
  dead() { [330, 262, 196, 131].forEach((f, i) => tone(f, 0.5, { type: 'sawtooth', vol: 0.04, delay: i * 0.3 })); },
};
const buzz = (p) => { if (save.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch { /* 없음 */ } };

// ---------- 릴 화면 ----------
const reelsEl = $('reels'), cols = [], cells = [];
for (let c = 0; c < L.COLS; c++) { const col = document.createElement('div'); col.className = 'col'; cells.push([]); for (let r = 0; r < L.ROWS; r++) { const d = document.createElement('div'); d.className = 'cell'; d.textContent = ['🍋', '🍒', '🍀', '🔔', '💎'][(c + r) % 5]; col.appendChild(d); cells[c].push(d); } reelsEl.appendChild(col); cols.push(col); }
const randIcon = () => { const w = L.weights(run), ids = Object.keys(w).filter((k) => w[k] > 0); return icon(ids[Math.floor(Math.random() * ids.length)]); };
const marquee = (t, bad = false) => { const m = $('marquee'); m.textContent = t; m.classList.toggle('bad', bad); };
let fast = false;
const wait = (ms) => new Promise((ok) => setTimeout(ok, fast ? ms * 0.25 : ms));

// ---------- 위쪽 글자 ----------
let shown = 0, target = 0;
function setCoins(v, instant) { target = v; if (instant) shown = v; }
function tickCoins() { if (shown !== target) { const d = target - shown; shown += Math.abs(d) < 2 ? d : d * 0.2; if (Math.abs(target - shown) < 1) shown = target; $('coins').textContent = `🪙 ${Math.round(shown)}`; } requestAnimationFrame(tickCoins); }
function updateTop() {
  $('stageL').textContent = `기한 ${run.deadline} · 라운드 ${run.round}/${L.ROUNDS}`;
  $('stageR').textContent = `최고 기록: 기한 ${save.best}`;
  const ok = run.coins >= run.debt;
  $('debt').textContent = ok ? `빚 ${run.debt} ✔ 갚을 수 있어요` : `빚 ${run.debt} (−${run.debt - run.coins})`;
  $('debt').classList.toggle('ok', ok);
  $('bar').querySelector('i').style.width = `${Math.min(100, (run.coins / run.debt) * 100)}%`;
  const n = L.spinsPerRound(run), pips = $('pips'); pips.innerHTML = '남은 스핀&nbsp;';
  for (let i = 0; i < n; i++) { const p = document.createElement('i'); p.className = `pip${i >= run.spinsLeft ? ' used' : ''}`; pips.appendChild(p); }
  const cb = $('charms'); cb.innerHTML = '';
  for (let i = 0; i < run.slots; i++) { const id = run.charms[i], s = document.createElement('div'); s.className = `slot${id ? ' has' : ''}`; if (id) { s.textContent = L.charm(id).icon; s.dataset.id = id; s.onclick = () => tip(`${L.charm(id).icon} ${L.charm(id).name}: ${L.charm(id).desc}`); } cb.appendChild(s); }
  const b = $('spinBtn'); b.disabled = busy || run.spinsLeft <= 0 || run.phase !== 'spin';
  b.querySelector('small').textContent = run.spinsLeft > 0 ? `남은 스핀 ${run.spinsLeft}` : '';
  $('lever').classList.toggle('ready', !b.disabled);
}
function tip(text) { const t = $('tip'); t.textContent = text; t.hidden = false; clearTimeout(tip.t); tip.t = setTimeout(() => { t.hidden = true; }, 2600); }
function fireCharm(id) { const el = document.querySelector(`.slot[data-id="${id}"]`); if (el) { el.classList.remove('fire'); void el.offsetWidth; el.classList.add('fire'); } }

// ---------- 스핀 ----------
let busy = false;
async function doSpin() {
  if (busy || !run || run.phase !== 'spin' || run.spinsLeft <= 0) return;
  busy = true; fast = false; audio();
  const before = run.coins, res = L.spin(run);
  sfx.pull(); buzz(30);
  for (const col of cells) for (const d of col) d.className = 'cell';
  for (const col of cols) col.className = 'col rolling';
  marquee('. . .'); updateTop();
  const flick = setInterval(() => { for (let c = 0; c < L.COLS; c++) if (cols[c].classList.contains('rolling')) for (const d of cells[c]) d.textContent = randIcon(); sfx.tick(); }, 60);
  await wait(420);
  for (let c = 0; c < L.COLS; c++) {
    // 앞 열들이 한 줄로 맞아 가고 있으면 뜸을 들인다
    const alive = c >= 2 && [0, 1, 2].some((r) => { let id = null; for (let k = 0; k < c; k++) { const s = res.grid[k][r]; if (s === 'wild') continue; if (id === null) id = s; else if (id !== s) return false; } return true; });
    if (alive) { cols[c].classList.add('tease'); sfx.tease(); buzz([15, 40, 15, 40, 15]); await wait(c === 4 ? 750 : 480); }
    else await wait(170);
    cols[c].className = 'col stop';
    for (let r = 0; r < L.ROWS; r++) cells[c][r].textContent = icon(res.grid[c][r]);
    sfx.thunk(c); buzz(12);
  }
  clearInterval(flick);
  await wait(220);
  // 당첨 줄을 하나씩
  let sum = 0;
  if (!res.wins.length && !res.skulls.length) { marquee('꽝'); sfx.miss(); }
  for (let i = 0; i < res.wins.length; i++) {
    const w = res.wins[i];
    for (const col of cells) for (const d of col) d.className = 'cell dim';
    for (const [c, r] of w.cells) cells[c][r].className = 'cell win';
    sum += w.pay;
    marquee(`${L.KINDS[w.kind].name} ${icon(w.sym)} +${w.pay}${w.lotto ? ' 🎟️×5!' : ''}`);
    if (w.lotto) fireCharm('ticket');
    sfx.win(i); buzz(18);
    setCoins(before + sum);
    await wait(w.kind === 'full' ? 900 : 380);
  }
  for (const col of cells) for (const d of col) d.classList.remove('dim');
  if (res.tags.length) { marquee(`${sum} ${res.tags.join(' ')} = +${Math.round(sum * res.mult)}`); for (const id of run.charms) if (['dice', 'hourglass', 'horseshoe'].includes(id)) fireCharm(id); sfx.win(8); await wait(520); }
  if (res.flat) { fireCharm('cat'); }
  if (res.blocked) { fireCharm('holy'); marquee(`🧿 저주를 막았어요 +${res.blocked}`); await wait(450); }
  if (res.curse) {
    for (const s of res.skulls) for (const [c, r] of s.cells) cells[c][r].className = 'cell dead';
    marquee(`💀 저주! −${res.curse}`, true); sfx.curse(); buzz([80, 40, 160]);
    $('app').classList.remove('shake', 'curse'); void $('app').offsetWidth; $('app').classList.add('shake', 'curse');
    await wait(700);
  } else if (res.total >= Math.max(60, run.debt * 0.25)) { sfx.big(); buzz([30, 30, 30, 30, 80]); $('app').classList.remove('shake'); void $('app').offsetWidth; $('app').classList.add('shake'); marquee(`🎉 대박! +${res.total}`); await wait(500); }
  else if (res.total > 0 && (res.wins.length > 1 || res.flat)) marquee(`+${res.total}`);
  setCoins(run.coins);
  busy = false; persist(); updateTop();
  if (run.spinsLeft <= 0) { await wait(650); roundEnd(); }
}
// 진행 중에 화면을 누르면 빨리 감기
$('frame').addEventListener('pointerdown', () => { if (busy) fast = true; });
$('spinBtn').onclick = () => doSpin();

// ---------- 레버: 아래로 끌어당기면 돈다 ----------
const lever = $('lever'), knob = $('knob');
let drag = null, pulled = false, lastNotch = 0;
const maxY = () => lever.clientHeight - 40 - 14;
function setKnob(y, spring) { knob.style.transition = spring ? 'top 0.35s cubic-bezier(.3,1.6,.5,1)' : 'none'; knob.style.top = `${y}px`; }
lever.addEventListener('pointerdown', (e) => { audio(); drag = { id: e.pointerId, y: e.clientY, k: parseFloat(knob.style.top) || 0 }; pulled = false; lever.setPointerCapture(e.pointerId); });
lever.addEventListener('pointermove', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const y = Math.max(0, Math.min(maxY(), drag.k + e.clientY - drag.y)); setKnob(y, false);
  const notch = Math.floor(y / 14); if (notch !== lastNotch) { lastNotch = notch; sfx.ratchet(); buzz(5); }
  if (!pulled && y > maxY() * 0.8) { pulled = true; doSpin(); }
});
const leverEnd = (e) => { if (drag && drag.id === e.pointerId) { drag = null; setKnob(0, true); lastNotch = 0; } };
lever.addEventListener('pointerup', leverEnd); lever.addEventListener('pointercancel', leverEnd);

// ---------- 창 ----------
function modal(html, buttons = []) { const card = $('card'); card.innerHTML = html; for (const [label, cls, fn, dis] of buttons) { const b = document.createElement('button'); b.className = `btn ${cls || ''}`; b.innerHTML = label; b.disabled = !!dis; b.onclick = fn; card.appendChild(b); } $('modal').hidden = false; card.scrollTop = 0; return card; }
const close = () => { $('modal').hidden = true; };

function roundEnd() {
  const wasDeadline = run.deadline, ev = L.endRound(run);
  setCoins(run.coins); persist();
  if (ev.dead) return gameOver();
  if (ev.paid) { sfx.paid(); buzz([40, 40, 100]); }
  L.rollShop(run); persist();
  shop(ev.paid ? `✅ 기한 ${wasDeadline}의 빚 ${ev.paid}을 갚았어요!` : ev.interest ? `🐷 이자 +${ev.interest}` : '');
}
function shop(note = '') {
  updateTop();
  const early = run.round > 1 && run.coins >= run.debt, skipped = L.ROUNDS - run.round + 1;
  const card = modal(`<h2>🛒 부적 상점</h2>${note ? `<p style="color:var(--green);font-weight:800">${note}</p>` : ''}
    <p>🪙 <b style="color:var(--gold)">${run.coins}</b> · 다음 빚 <b style="color:var(--red)">${run.debt}</b> (기한 ${run.deadline}, 라운드 ${run.round}/${L.ROUNDS})</p>
    <div id="offers" style="width:100%;display:flex;flex-direction:column;gap:6px"></div>
    <div class="sub">가진 부적 ${run.charms.length}/${run.slots} <span style="opacity:.7;font-weight:700">(누르면 반값에 팔아요)</span></div>
    <div id="owned" style="width:100%;display:flex;flex-direction:column;gap:6px"></div>`, [
    [`🔁 다시 뽑기 <small>${L.rerollCost(run) ? `🪙 ${L.rerollCost(run)}` : '무료'}</small>`, '', () => { if (L.reroll(run)) { sfx.buy(); persist(); shop(); } }, run.coins < L.rerollCost(run)],
    ...(early ? [[`💸 빚 미리 갚기 <small>남은 ${skipped}라운드를 건너뛰고 보너스 🪙 ${skipped * Math.round(run.debt * 0.15)}</small>`, '', () => { const e = L.payEarly(run); if (e) { sfx.paid(); setCoins(run.coins); L.rollShop(run); persist(); shop(`💸 빚 ${e.paid}을 미리 갚았어요! 보너스 +${e.bonus}`); } }]] : []),
    [`🎰 ${run.round === 1 ? `기한 ${run.deadline} 시작` : `라운드 ${run.round} 시작`}`, 'main', () => { L.startRound(run); persist(); close(); marquee('레버를 당기세요'); updateTop(); }],
  ]);
  const offers = card.querySelector('#offers');
  run.shop.forEach((id, i) => {
    const row = document.createElement('div');
    if (!id) { row.className = 'item sold'; row.innerHTML = '<div class="ic">✔</div><div class="nm">샀어요</div><div></div>'; offers.appendChild(row); return; }
    const c = L.charm(id), p = L.priceOf(run, id);
    row.className = 'item'; row.innerHTML = `<div class="ic">${c.icon}</div><div><div class="nm">${c.name}</div><div class="ds">${c.desc}</div></div>`;
    const b = document.createElement('button'); b.textContent = `🪙 ${p}`; b.disabled = run.coins < p || run.charms.length >= run.slots;
    b.onclick = () => { if (L.buyCharm(run, i)) { sfx.buy(); buzz(15); setCoins(run.coins); persist(); shop(); } };
    row.appendChild(b); offers.appendChild(row);
  });
  const owned = card.querySelector('#owned');
  if (!run.charms.length) owned.innerHTML = '<p style="font-size:12.5px;opacity:.6">아직 없어요</p>';
  for (const id of run.charms) {
    const c = L.charm(id), row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<div class="ic">${c.icon}</div><div><div class="nm">${c.name}</div><div class="ds">${c.desc}</div></div>`;
    const b = document.createElement('button'); b.textContent = `팔기 +${Math.floor(L.priceOf(run, id) / 2)}`; b.style.background = '#5a3a3a'; b.style.color = '#fff';
    b.onclick = () => { L.sellCharm(run, id); sfx.buy(); setCoins(run.coins); persist(); shop(); };
    row.appendChild(b); owned.appendChild(row);
  }
}
function gameOver() {
  const over = run.over, got = L.finishRun(save, run), stats = `<div class="stats"><span>넘긴 기한</span><b>${over.cleared}</b><span>모자란 코인</span><b>${over.short}</b><span>이번 판 번 코인</span><b>${run.earned}</b><span>최고의 한 방</span><b>${run.bestSpin}</b></div>`;
  run = null; persist(); sfx.dead(); buzz([100, 60, 300]);
  modal(`<h2>🕳️ 빚을 못 갚았어요</h2><p>바닥이 열리고… 다시 독방에서 눈을 떠요.</p>${stats}<p style="font:900 20px system-ui;color:var(--gold)">⭐ 별 +${got}</p>`, [['⭐ 별로 강해지기', 'main', () => meta()]]);
}
function meta() {
  const card = modal(`<h2>⭐ 환생 강화</h2><p>별 <b style="color:var(--gold)">⭐ ${save.stars}</b> · 최고 기록: 기한 ${save.best}</p><div id="metas" style="width:100%;display:flex;flex-direction:column;gap:6px"></div>`, [['🎰 새 판 시작', 'main', () => newGame()]]);
  const box = card.querySelector('#metas');
  for (const m of L.META) {
    const lv = save.meta[m.id] || 0, cost = L.metaCost(save, m.id), row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<div class="ic">${m.icon}</div><div><div class="nm">${m.name}<em>Lv.${lv}/${m.max}</em></div><div class="ds">${m.desc}</div></div>`;
    const b = document.createElement('button'); b.textContent = lv >= m.max ? '최대' : `⭐ ${cost}`; b.disabled = !(save.stars >= cost);
    b.onclick = () => { if (L.buyMeta(save, m.id)) { sfx.buy(); persist(); meta(); } };
    row.appendChild(b); box.appendChild(row);
  }
}
function newGame() { run = L.newRun(save); L.startRound(run); setCoins(run.coins, true); $('coins').textContent = `🪙 ${run.coins}`; persist(); close(); marquee('레버를 당기세요'); updateTop(); }
function intro() {
  modal(`<h2>🎰 럭키 셀</h2><p>독방에 갇혔어요. 슬롯머신으로 <b>기한마다 불어나는 빚</b>을 갚아야 나갈 수 있어요.</p><ul>
    <li><b>레버를 아래로 당기거나</b> SPIN을 눌러 돌려요. 돌아가는 중에 기계를 누르면 빨리 감기</li>
    <li>같은 무늬가 <b>가로 3칸 이상 · 세로 · 대각선 · 지그재그</b>로 이어지면 코인을 받아요</li>
    <li>한 기한은 3라운드, 라운드마다 스핀 5번. 3라운드가 끝날 때 빚만큼 코인이 있어야 해요</li>
    <li>라운드 사이 상점에서 <b>부적</b>을 사 확률과 배당을 바꿔요</li>
    <li>💀이 가로로 3개 이어지면 저주: 코인 절반을 잃어요</li>
    <li>빚을 못 갚으면 끝. 넘긴 기한만큼 ⭐별을 받아 영구 강화를 사요</li></ul>`, [['시작', 'main', () => { save.seenIntro = true; if (!run) newGame(); else { close(); resume(); } }]]);
}
function resume() { setCoins(run.coins, true); $('coins').textContent = `🪙 ${run.coins}`; updateTop(); if (run.phase === 'shop') { if (!run.shop.length) L.rollShop(run); shop(); } else if (run.spinsLeft <= 0) roundEnd(); }
$('stageR').onclick = () => { if (!busy) modal(`<h2>⚙ 설정</h2><div class="stats"><span>도전한 판</span><b>${save.runs + 1}번째</b><span>최고 기록</span><b>기한 ${save.best}</b><span>가진 별</span><b>⭐ ${save.stars}</b></div>`, [
  [`소리 ${save.sound ? '켬 🔊' : '끔 🔇'}`, '', () => { save.sound = !save.sound; persist(); close(); }], [`진동 ${save.vibrate ? '켬' : '끔'}`, '', () => { save.vibrate = !save.vibrate; persist(); close(); }],
  ['❓ 하는 법', '', intro], ['🏳️ 이번 판 포기', 'red', () => { if (confirm('이번 판을 포기할까요? 넘긴 기한만큼 별은 받아요.')) { run.over = { cleared: run.deadline - 1, short: Math.max(0, run.debt - run.coins) }; gameOver(); } }], ['닫기', 'main', close]]); };

tickCoins();
if (!save.seenIntro) { if (!run) { run = L.newRun(save); L.startRound(run); } updateTop(); intro(); }
else if (run) resume(); else { run = L.newRun(save); L.startRound(run); setCoins(run.coins, true); updateTop(); meta(); }
window.__lc = { L, save, get run() { return run; }, doSpin, cells };
window.luckyReady = true;
</script>
</body>
</html>
