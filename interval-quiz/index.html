<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101a33">
<title>음악 이론 퀴즈</title>
<style>
  :root {
    --bg: #101a33; --panel: #1b2a4d; --line: #34497a; --text: #f3f5fb; --dim: #9fb0d6;
    --accent: #ffcf4d; --ok: #43d17a; --bad: #ff5d6c; --paper: #fbf7ec; --ink: #1d1d1f;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  body { position: fixed; inset: 0; }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto; box-sizing: border-box;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .screen[hidden] { display: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* 처음 화면 */
  #home { justify-content: center; gap: 10px; }
  #home h1 { margin: 0; text-align: center; font-size: 34px; letter-spacing: 2px; }
  #home .sub { margin: 0 0 14px; text-align: center; color: var(--dim); font-size: 15px; }
  .screen .sub { font-size: 15px; }
  .menu {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px 18px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px; text-align: left;
  }
  .menu b { font-size: 20px; }
  .symbol { flex: 1; display: grid; place-items: center; min-height: 80px; color: var(--ink); font-size: 48px; font-weight: 900; }
  .opts .choice.long { font-size: 18px; }
  .grid.q5 { grid-template-columns: repeat(5, 1fr); }
  .grid.q7 { grid-template-columns: repeat(7, 1fr); }
  #pro-answer .choice { min-height: 44px; padding: 0; }
  .slots { display: flex; gap: 8px; align-items: stretch; }
  #pro-slots { flex: 1; display: flex; gap: 6px; }
  .slot {
    flex: 1; min-height: 44px; display: grid; place-items: center; border-radius: 10px;
    border: 2px dashed var(--line); font-weight: 900; font-size: 19px;
  }
  .slot.filled { border-style: solid; background: var(--panel); }
  .slot.right { border-color: var(--ok); color: var(--ok); }
  .slot.wrong { border-color: var(--bad); color: var(--bad); }
  .ctl:disabled { opacity: 0.35; }
  .credit { margin: 14px 0 0; text-align: center; font-size: 11px; color: var(--dim); opacity: 0.7; }
  .menu span { font-size: 14px; color: var(--dim); }
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .stage {
    display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px; text-align: left;
  }
  .stage .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--line); font-weight: 800;
  }
  .stage .info { flex: 1; min-width: 0; }
  .stage .name { font-weight: 800; font-size: 17px; }
  .stage .desc { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .stage .badge { flex: none; font-size: 13px; font-weight: 800; color: var(--dim); }
  .stage .badge.clear { color: var(--ok); }
  .stage.cleared { border-color: var(--ok); }
  .stage.cleared .num { background: var(--ok); color: #08240f; }
  .stage:disabled { opacity: 0.4; }
  .wide {
    min-height: 52px; border-radius: 14px; border: 2px solid var(--accent);
    background: transparent; color: var(--accent); font-weight: 800; font-size: 17px;
  }
  .wide.fill { background: var(--accent); color: #2a1f00; }
  .wide:disabled { opacity: 0.35; }

  /* 문제 화면 */
  .top { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .back {
    width: 40px; height: 40px; border: none; background: none; font-size: 22px; padding: 0;
  }
  .top .title { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .count { font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }
  .paper {
    background: var(--paper); border-radius: 16px; padding: 6px 4px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  }
  .paper svg { display: block; width: 100%; height: auto; }
  /* 문제 화면의 오선지는 남는 높이만큼만 차지한다 (노치·홈 바가 있는 폰에서도 건반까지 들어오게) */
  #staff { flex: 1 1 0; min-height: 80px; max-height: 200px; display: flex; }
  #staff svg { height: 100%; }
  #feedback {
    min-height: 48px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; font-size: 14px; color: var(--dim); padding: 4px 0;
  }
  #feedback b { font-size: 18px; }
  #feedback b.ok { color: var(--ok); }
  #feedback b.bad { color: var(--bad); }
  .label { font-size: 13px; color: var(--dim); font-weight: 700; margin: 6px 2px 6px; }
  .grid { display: grid; gap: 8px; }
  .grid.q3 { grid-template-columns: repeat(3, 1fr); }
  .grid.q4 { grid-template-columns: repeat(4, 1fr); margin-top: 8px; }
  .choice {
    min-height: 46px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel); font-weight: 800; font-size: 17px;
  }
  .choice.on { border-color: var(--accent); background: #3a3420; color: var(--accent); }
  .choice.right { border-color: var(--ok); background: #163824; color: var(--ok); }
  .choice.wrong { border-color: var(--bad); background: #3d1820; color: var(--bad); }
  .spacer { flex: 1; min-height: 10px; }

  /* 듣기 버튼과 건반 */
  .controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 10px; }
  .ctl {
    min-height: 40px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel); font-weight: 800; font-size: 15px; padding: 0 10px;
  }
  .ctl.toggle { font-size: 13px; color: var(--dim); }
  #keyboard { margin-top: 6px; }
  #keyboard[hidden] { display: none; }
  .kb-labels { position: relative; height: 22px; }
  .kb-labels span {
    position: absolute; bottom: 3px; transform: translateX(-50%); white-space: nowrap;
    font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 6px; color: #10131c;
  }
  .kb-labels.two { height: 40px; }
  .kb-labels span.row2 { bottom: 21px; }
  .kb-labels span.left { transform: translateX(-100%); }
  .kb-labels span.right { transform: none; }
  .keys { position: relative; display: flex; height: 84px; touch-action: none; }
  .wkey {
    flex: 1; position: relative; padding: 0; margin-right: -1px;
    background: #fbf7ec; border: 1px solid #1d1d1f; border-radius: 0 0 5px 5px;
  }
  .wkey small { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 9px; color: #8a8576; text-align: center; }
  .bkey {
    position: absolute; top: 0; z-index: 1; height: 56%; width: 4.1%; transform: translateX(-50%);
    padding: 0; border: none; background: #1d1d1f; border-radius: 0 0 4px 4px;
  }
  .m1 { --mark: var(--accent); }
  .m2 { --mark: #4dd6ff; }
  .wkey.m1, .wkey.m2, .bkey.m1, .bkey.m2 { background: var(--mark); }
  .wkey.m1.m2, .bkey.m1.m2, .kb-labels span.m1.m2 { background: linear-gradient(90deg, var(--accent) 50%, #4dd6ff 50%); }
  .kb-labels span.m1, .kb-labels span.m2 { background: var(--mark); }
  .wkey.press { filter: brightness(0.8); }
  .bkey.press { filter: brightness(2.2); }

  /* 키가 작은 휴대폰 */
  @media (max-height: 760px) {
    #feedback { min-height: 40px; }
    .label { margin: 4px 2px; }
    .grid { gap: 6px; }
    .grid.q4 { margin-top: 6px; }
    .choice { min-height: 38px; font-size: 16px; }
    .wide { min-height: 46px; }
    .ctl { min-height: 36px; }
    .keys { height: 66px; }
    .kb-labels { height: 20px; }
    .kb-labels.two { height: 38px; }
    .opts .choice { min-height: 50px; }
  }

  /* 결과 */
  #result { justify-content: center; align-items: stretch; gap: 12px; text-align: center; }
  #result .big { font-size: 64px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #result .big small { font-size: 28px; color: var(--dim); }
  #result .msg { font-size: 18px; font-weight: 800; margin-bottom: 16px; }

  /* 오답 노트 */
  #wrong-list { flex: 1; overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 4px 0 12px; }
  .wrong-item { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 14px; padding: 8px; }
  .wrong-item .paper { flex: none; width: 130px; padding: 0; border-radius: 10px; box-shadow: none; }
  .wrong-item .txt { font-size: 14px; line-height: 1.5; }
  .wrong-item .txt b { color: var(--ok); }
  .wrong-item .txt s { color: var(--bad); }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; }

  /* 자유연습 설정 */
  #free .hint { font-size: 13px; color: var(--dim); margin: -2px 2px 6px; min-height: 18px; }
  #free .grid.q2 { grid-template-columns: repeat(2, 1fr); }
  #free .choice { font-size: 16px; }
  #free .choice.sym { font-size: 15px; padding: 0 2px; white-space: nowrap; }
  .opts .choice { min-height: 56px; font-size: 21px; }
</style>
</head>
<body>

<section id="home" class="screen">
  <h1>음악 이론 퀴즈</h1>
  <p class="sub">문제 유형을 골라 주세요</p>
  <div class="list" id="types"></div>
  <p class="credit">피아노 소리: Salamander Grand Piano (Alexander Holm, CC BY 3.0)</p>
</section>

<section id="level-screen" class="screen" hidden>
  <div class="top">
    <button class="back" id="level-back" aria-label="뒤로">←</button>
    <span class="title">코드톤 퀴즈</span>
  </div>
  <p class="sub" style="margin:18px 2px 6px;color:var(--dim)">어떻게 답할지 골라 주세요</p>
  <div class="list">
    <button class="menu" data-level="beginner"><b>비기너</b><span>구성음 묶음 보기 4개 중에서 고르기</span></button>
    <button class="menu" data-level="pro"><b>프로</b><span>음 이름 버튼으로 구성음을 직접 입력 (E♭과 D♯처럼 철자까지)</span></button>
  </div>
</section>

<section id="menu-screen" class="screen" hidden>
  <div class="top">
    <button class="back" id="menu-back" aria-label="뒤로">←</button>
    <span class="title" id="menu-title"></span>
  </div>
  <p class="sub" id="menu-sub" style="margin:18px 2px 6px;color:var(--dim)"></p>
  <div class="list">
    <button class="menu" id="open-stages"><b>단계별 연습</b><span id="stages-summary"></span></button>
    <button class="menu" id="open-free"><b>자유연습</b><span id="free-summary"></span></button>
    <button id="open-wrongs" class="wide" style="margin-top:8px"></button>
  </div>
</section>

<section id="stages-screen" class="screen" hidden>
  <div class="top">
    <button class="back" id="stages-back" aria-label="뒤로">←</button>
    <span class="title" id="stages-title">단계별 연습</span>
  </div>
  <div class="list" id="stages"></div>
</section>

<section id="free" class="screen" hidden>
  <div class="top">
    <button class="back" id="free-back" aria-label="뒤로">←</button>
    <span class="title" id="free-title">자유연습</span>
  </div>
  <div class="label" style="margin-top:12px" id="free-q-label"></div>
  <div class="grid q4" id="free-q" style="margin-top:0"></div>
  <div class="hint" id="free-hint"></div>
  <div class="label">문제 수</div>
  <div class="grid q5" id="free-count"></div>
  <div class="label" style="margin-top:14px" id="free-down-label"></div>
  <div class="grid q2" id="free-down"></div>
  <div class="spacer"></div>
  <button class="wide fill" id="free-start">시작</button>
</section>

<section id="quiz" class="screen" hidden>
  <div class="top">
    <button class="back" id="quit" aria-label="그만하기">←</button>
    <span class="title" id="quiz-title"></span>
    <span class="count" id="quiz-count"></span>
  </div>
  <div class="bar"><i id="quiz-bar"></i></div>
  <div class="paper" id="staff"></div>
  <div id="feedback"></div>
  <div id="iv-answer">
    <div class="label">성질</div>
    <div class="grid q3" id="q-row1"></div>
    <div class="grid q4" id="q-row2"></div>
    <div class="label" style="margin-top:12px">도수</div>
    <div class="grid q4" id="d-grid" style="margin-top:0"></div>
  </div>
  <div id="opt-answer" hidden>
    <div class="label" id="opt-label"></div>
    <div class="grid opts" id="options" style="grid-template-columns: 1fr 1fr"></div>
  </div>
  <div id="pro-answer" hidden>
    <div class="label">구성음 입력 · 임시표를 먼저 고르고 음 이름을 누르세요</div>
    <div class="slots"><div id="pro-slots"></div><button class="ctl" id="pro-erase" aria-label="한 음 지우기">⌫</button></div>
    <div class="grid q5" id="pro-acc" style="margin-top:8px"></div>
    <div class="grid q7" id="pro-letters" style="margin-top:6px"></div>
  </div>
  <div style="height:12px"></div>
  <button class="wide fill" id="submit">확인</button>
  <div class="controls">
    <button class="ctl" id="play-together">같이 듣기</button>
    <button class="ctl" id="play-apart">따로 듣기</button>
    <button class="ctl toggle" id="toggle-keys"></button>
  </div>
  <div id="keyboard">
    <div class="kb-labels" id="kb-labels"></div>
    <div class="keys" id="keys"></div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <div id="result-title" style="font-weight:800;color:var(--dim)"></div>
  <div class="big" id="result-score"></div>
  <div class="msg" id="result-msg"></div>
  <div id="result-buttons" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<section id="wrongs" class="screen" hidden>
  <div class="top">
    <button class="back" id="wrongs-back" aria-label="뒤로">←</button>
    <span class="title" id="wrongs-title">오답 노트</span>
    <span class="count" id="wrongs-count"></span>
  </div>
  <div id="wrong-list"></div>
  <button class="wide fill" id="retry-wrongs">틀린 문제 다시 풀기</button>
</section>

<script type="module">
import * as L from './logic.js?v=5';
import * as C from './chords.js?v=3';
import * as K from './keys.js?v=1';
import * as T from './tones.js?v=1';

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 저장 불가 환경: 이번 실행 동안만 유지 */ }
}
// 저장이 안 되는 환경에서도 이번 실행 동안은 기록이 남도록 메모리에 먼저 둔다
const memory = {};
const get = (key, fallback) => (memory[key] ??= load(key, fallback));
const put = (key, value) => { memory[key] = value; save(key, value); };

const $ = id => document.getElementById(id);
function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
}
function el(tag, props = {}, children = []) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
}

// ── 문제 유형 4가지 ──
// 저장 이름은 앞서 만든 음정·코드 퀴즈의 기록이 그대로 이어지게 예전 이름을 쓴다
const QUIZ = {
  interval: {
    title: '음정 퀴즈', short: '음정', desc: '악보의 두 음 사이 음정 맞히기',
    sub: '악보의 두 음 사이 음정을 맞혀 보세요', freeDesc: '성질과 문제 수를 골라서 연습',
    stages: L.STAGES, round: L.makeRound, free: L.makeFreeRound,
    freeDefaults: { qualities: [...L.QUALITIES], count: 10, down: false },
    addWrong: L.addWrong, removeWrong: L.removeWrong,
    keys: { progress: 'intervalQuiz.progress', wrongs: 'intervalQuiz.wrongs', free: 'intervalQuiz.free' },
  },
  chord: {
    title: '코드 퀴즈', short: '코드', desc: '악보의 화음을 보고 코드 이름 맞히기',
    sub: '악보의 화음을 보고 코드 이름을 맞혀 보세요', freeDesc: '코드 종류와 문제 수를 골라서 연습',
    stages: C.CHORD_STAGES, round: C.makeChordRound, free: C.makeFreeChordRound,
    freeDefaults: { types: C.CHORD_TYPES.map(t => t.id), count: 10, inversions: false },
    addWrong: C.addChordWrong, removeWrong: C.removeChordWrong,
    keys: { progress: 'intervalQuiz.chordProgress', wrongs: 'intervalQuiz.chordWrongs', free: 'intervalQuiz.chordFree' },
  },
  key: {
    title: '조표 퀴즈', short: '조표', desc: '♯·♭ 조표를 보고 장조·단조 맞히기',
    sub: '조표를 보고 무슨 조인지 맞혀 보세요', freeDesc: '장조·단조, ♯조·♭조를 골라서 연습',
    stages: K.KEY_STAGES, round: K.makeKeyRound, free: K.makeFreeKeyRound,
    freeDefaults: { modes: ['major', 'minor'], sides: ['sharp', 'flat'], count: 10 },
    addWrong: K.addKeyWrong, removeWrong: K.removeKeyWrong,
    keys: { progress: 'intervalQuiz.key.progress', wrongs: 'intervalQuiz.key.wrongs', free: 'intervalQuiz.key.free' },
  },
  tones: {
    title: '코드톤 퀴즈', short: '코드톤', desc: '코드 이름을 보고 구성음 맞히기 (비기너·프로)',
    sub: '코드 이름을 보고 구성음을 맞혀 보세요', freeDesc: '코드 종류와 문제 수를 골라서 연습',
    stages: T.TONE_STAGES, round: T.makeToneRound, free: T.makeFreeToneRound,
    freeDefaults: { types: C.CHORD_TYPES.map(t => t.id), count: 10 },
    addWrong: T.addToneWrong, removeWrong: T.removeToneWrong,
    // 비기너와 프로는 진행과 오답 노트를 따로, 자유연습 설정은 같이 쓴다
    keys: { progress: 'intervalQuiz.tones.{level}.progress', wrongs: 'intervalQuiz.tones.{level}.wrongs', free: 'intervalQuiz.tones.free' },
  },
};
const TYPE_ORDER = ['interval', 'chord', 'key', 'tones'];
let kind = 'interval';
let level = get('intervalQuiz.tonesLevel', 'beginner');
const quiz = () => QUIZ[kind];
const storeKey = what => quiz().keys[what].replace('{level}', level);
const prog = () => get(storeKey('progress'), {});
const wrongList = () => get(storeKey('wrongs'), []);
const setWrongs = list => put(storeKey('wrongs'), list);
const freeOpts = () => (memory[storeKey('free')] ??= { ...quiz().freeDefaults, ...load(storeKey('free'), {}) });
const saveFree = () => put(storeKey('free'), freeOpts());
const isPro = () => kind === 'tones' && level === 'pro';
const levelName = () => (level === 'pro' ? '프로' : '비기너');
const fullTitle = () => quiz().title + (kind === 'tones' ? ` · ${levelName()}` : '');
const clearedCount = () => quiz().stages.filter((_, i) => L.isCleared(prog(), i)).length;

// ── 악보 그리기 (SVG) ──
// 오선 간격 10. 맨 아래 줄(미4) y=70, 맨 위 줄(파5) y=30
const NS = 'http://www.w3.org/2000/svg';
const yOf = s => 70 - (s - 30) * 5;
const CLEF = 'M20 31 C14 31 13 24 19 22 C27 20 30 30 24 36 C17 42 6 36 9 25 C12 15 26 9 26 -6 '
  + 'C26 -15 19 -16 17 -7 C14 3 22 30 23 46 C24 54 14 56 13 49';

function svg(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function accidental(a, x, y) {
  const g = svg('g', { transform: `translate(${x} ${y})`, stroke: '#1d1d1f', fill: 'none', 'stroke-linecap': 'butt' });
  const flat = dx => {
    g.append(svg('path', { d: `M${dx} -14 L${dx} 4`, 'stroke-width': 1.3 }));
    g.append(svg('path', { d: `M${dx} 4 C${dx + 9} -1 ${dx + 8} -8 ${dx} -2`, 'stroke-width': 1.9 }));
  };
  if (a === 1) {
    g.append(svg('path', { d: 'M-2 -9 L-2 10 M2 -10 L2 9', 'stroke-width': 1.2 }));
    g.append(svg('path', { d: 'M-5 -2 L5 -5 M-5 5 L5 2', 'stroke-width': 2.6 }));
  } else if (a === -1) {
    flat(-3);
  } else if (a === 2) {
    g.append(svg('path', { d: 'M-4 -4 L4 4 M4 -4 L-4 4', 'stroke-width': 1.4 }));
    for (const [cx, cy] of [[-4, -4], [4, -4], [-4, 4], [4, 4]]) {
      g.append(svg('rect', { x: cx - 1.7, y: cy - 1.7, width: 3.4, height: 3.4, fill: '#1d1d1f', stroke: 'none' }));
    }
  } else if (a === -2) {
    flat(-8); flat(-1);
  }
  return g;
}

function note(n, x) {
  const g = svg('g', {});
  const s = L.step(n), y = yOf(s);
  const ledgers = [];
  for (let k = 28; k >= s; k -= 2) ledgers.push(k);
  for (let k = 40; k <= s; k += 2) ledgers.push(k);
  for (const k of ledgers) {
    g.append(svg('line', { x1: x - 11, x2: x + 11, y1: yOf(k), y2: yOf(k), stroke: '#1d1d1f', 'stroke-width': 1.2 }));
  }
  g.append(svg('ellipse', { cx: x, cy: y, rx: 6.6, ry: 4.6, fill: '#1d1d1f' }));
  g.append(svg('ellipse', { cx: x, cy: y, rx: 3.9, ry: 2.2, fill: '#fbf7ec', transform: `rotate(-35 ${x} ${y})` }));
  if (n.a) g.append(accidental(n.a, x - (n.a === -2 ? 18 : 14), y));
  return g;
}

function ledgerSteps(s) {
  const out = [];
  for (let k = 28; k >= s; k -= 2) out.push(k);
  for (let k = 40; k <= s; k += 2) out.push(k);
  return out;
}

// 화음: 음을 세로로 쌓는다. 2도로 붙은 음은 오른쪽으로 비켜 쓰고, 임시표는 겹치지 않게 왼쪽으로 줄을 나눠 단다
function chord(notes, x) {
  const g = svg('g', {});
  const sorted = [...notes].sort((a, b) => L.step(a) - L.step(b));
  const shifted = [];
  sorted.forEach((n, i) => {
    shifted[i] = i > 0 && L.step(n) - L.step(sorted[i - 1]) === 1 && !shifted[i - 1];
  });
  const anyShift = shifted.some(Boolean);
  const ledgers = new Set(sorted.flatMap(n => ledgerSteps(L.step(n))));
  for (const k of ledgers) {
    g.append(svg('line', { x1: x - 11, x2: x + (anyShift ? 24 : 11), y1: yOf(k), y2: yOf(k), stroke: '#1d1d1f', 'stroke-width': 1.2 }));
  }
  sorted.forEach((n, i) => {
    const cx = x + (shifted[i] ? 13 : 0), y = yOf(L.step(n));
    g.append(svg('ellipse', { cx, cy: y, rx: 6.6, ry: 4.6, fill: '#1d1d1f' }));
    g.append(svg('ellipse', { cx, cy: y, rx: 3.9, ry: 2.2, fill: '#fbf7ec', transform: `rotate(-35 ${cx} ${y})` }));
  });
  // 위 음부터 임시표를 달고, 6도 안쪽에 이미 단 임시표가 있으면 한 칸 왼쪽 줄로
  const columns = [];
  for (const n of [...sorted].reverse().filter(n => n.a)) {
    let c = 0;
    while ((columns[c] ?? []).some(s => Math.abs(s - L.step(n)) < 6)) c++;
    (columns[c] ??= []).push(L.step(n));
    g.append(accidental(n.a, x - 14 - c * 11 - (n.a === -2 ? 4 : 0), yOf(L.step(n))));
  }
  return g;
}

function staffBase(width) {
  const root = svg('svg', { viewBox: `0 -8 ${width} 104`, role: 'img' });
  for (let i = 0; i < 5; i++) {
    root.append(svg('line', { x1: 4, x2: width - 4, y1: 30 + i * 10, y2: 30 + i * 10, stroke: '#1d1d1f', 'stroke-width': 1 }));
  }
  const clef = svg('g', { transform: 'translate(2 30)' });
  clef.append(svg('path', { d: CLEF, fill: 'none', stroke: '#1d1d1f', 'stroke-width': 2.6, 'stroke-linecap': 'round' }));
  clef.append(svg('circle', { cx: 15.5, cy: 49.5, r: 3.2, fill: '#1d1d1f' }));
  root.append(clef);
  return root;
}

function drawStaff(q, width = 200) {
  const root = staffBase(width);
  root.setAttribute('aria-label', q.kind === 'chord' ? '오선지 위의 화음' : '오선지 위의 두 음');
  if (q.kind === 'chord') {
    root.append(chord(q.notes, width * 0.6));
    return root;
  }
  const x1 = width * 0.45, x2 = width * 0.75;
  root.append(note(q.a, x1), note(q.b, x2));
  return root;
}

// 조표: 높은음자리표 오른쪽에 ♯·♭을 정해진 자리에 차례로 단다
function drawKeySignature(sig, width = 200) {
  const root = staffBase(width);
  root.setAttribute('aria-label', K.sigText(sig));
  const steps = sig > 0 ? K.SHARP_STEPS : K.FLAT_STEPS;
  for (let i = 0; i < Math.abs(sig); i++) {
    root.append(accidental(Math.sign(sig), 52 + i * 13, yOf(steps[i])));
  }
  return root;
}

// 코드톤 문제: 채점 전에는 코드 이름만 크게 보여준다
function drawSymbol(name) {
  return el('div', { className: 'symbol', textContent: name });
}

function drawQuestion(q, done) {
  if (q.kind === 'key') return drawKeySignature(q.sig);
  if (q.kind === 'tones') return done ? drawStaff({ kind: 'chord', notes: q.notes }) : drawSymbol(q.name);
  return drawStaff(q);
}

// ── 처음 화면: 문제 유형 고르기 ──
function home() {
  document.title = '음악 이론 퀴즈';
  $('types').replaceChildren(...TYPE_ORDER.map(k => {
    const b = el('button', { className: 'menu' }, [
      el('b', { textContent: QUIZ[k].title }),
      el('span', { textContent: QUIZ[k].desc }),
    ]);
    b.onclick = () => {
      kind = k;
      if (k === 'tones') levelScreen();
      else menuScreen();
    };
    return b;
  }));
  show('home');
}

function levelScreen() {
  show('level-screen');
}
for (const b of document.querySelectorAll('[data-level]')) {
  b.onclick = () => { level = b.dataset.level; put('intervalQuiz.tonesLevel', level); menuScreen(); };
}
$('level-back').onclick = home;

// ── 유형별 메뉴: 단계별 연습 · 자유연습 · 오답 노트 ──
function menuScreen() {
  document.title = quiz().title;
  $('menu-title').textContent = fullTitle();
  $('menu-sub').textContent = quiz().sub;
  $('stages-summary').textContent = `${quiz().stages.length}단계 중 ${clearedCount()}단계 통과`;
  $('free-summary').textContent = quiz().freeDesc;
  $('open-wrongs').textContent = `오답 노트 (${wrongList().length})`;
  show('menu-screen');
}
$('menu-back').onclick = () => (kind === 'tones' ? levelScreen() : home());
$('open-wrongs').onclick = () => openWrongs();
$('open-stages').onclick = () => stagesScreen();
$('open-free').onclick = () => freeScreen();
$('stages-back').onclick = menuScreen;
$('free-back').onclick = menuScreen;

function stagesScreen() {
  const list = $('stages');
  list.replaceChildren();
  $('stages-title').textContent = `단계별 연습 · ${quiz().short}${kind === 'tones' ? ' ' + levelName() : ''}`;
  quiz().stages.forEach((st, i) => {
    const unlocked = L.isUnlocked(prog(), i);
    const cleared = L.isCleared(prog(), i);
    const best = prog().best?.[i];
    const badge = !unlocked ? '🔒' : cleared ? `CLEAR ${best}/10` : best !== undefined ? `최고 ${best}/10` : '';
    const b = el('button', { className: 'stage' + (cleared ? ' cleared' : ''), disabled: !unlocked }, [
      el('span', { className: 'num', textContent: i + 1 }),
      el('span', { className: 'info' }, [
        el('div', { className: 'name', textContent: st.name }),
        el('div', { className: 'desc', textContent: st.desc }),
      ]),
      el('span', { className: 'badge' + (cleared ? ' clear' : ''), textContent: badge }),
    ]);
    b.onclick = () => startRound(i);
    list.append(b);
  });
  show('stages-screen');
}

// ── 자유연습 설정 ──
// sections: [제목, 버튼들] 두 칸. 두 번째 칸이 없으면 숨긴다
function freeScreen() {
  const o = freeOpts();
  $('free-title').textContent = `자유연습 · ${quiz().short}`;
  const chip = (text, on, onClick, cls = '') => {
    const b = el('button', { className: 'choice' + cls + (on ? ' on' : ''), textContent: text });
    b.onclick = () => { onClick(); saveFree(); freeScreen(); };
    return b;
  };
  const toggle = (list, v) => (list.includes(v) ? list.filter(x => x !== v) : [...list, v]);
  const multi = (field, items, cls = '') => {
    const all = items.map(([v]) => v);
    return [
      ...items.map(([v, text]) => chip(text, o[field].includes(v), () => { o[field] = toggle(o[field], v); }, cls)),
      chip(o[field].length === all.length ? '모두 끄기' : '모두', false, () => {
        o[field] = o[field].length === all.length ? [] : [...all];
      }, ' sym'),
    ];
  };
  const chordItems = C.CHORD_TYPES.map(t => [t.id, 'C' + t.symbol]);
  let first, second = null, ready;
  if (kind === 'interval') {
    first = ['성질 (여러 개 선택)', multi('qualities', ['완전', '장', '단', '증', '감', '겹증', '겹감'].map(q => [q, q]))];
    second = ['방향', [
      chip('올라가는 음정만', !o.down, () => { o.down = false; }),
      chip('내려가는 음정도', o.down, () => { o.down = true; }),
    ]];
    ready = o.qualities.length > 0;
  } else if (kind === 'chord') {
    first = ['코드 종류 (여러 개 선택)', multi('types', chordItems, ' sym')];
    second = ['자리바꿈', [
      chip('기본형만', !o.inversions, () => { o.inversions = false; }),
      chip('자리바꿈도', o.inversions, () => { o.inversions = true; }),
    ]];
    ready = o.types.length > 0;
  } else if (kind === 'key') {
    first = ['장조·단조 (여러 개 선택)', [
      chip('장조 (major)', o.modes.includes('major'), () => { o.modes = toggle(o.modes, 'major'); }),
      chip('단조 (minor)', o.modes.includes('minor'), () => { o.modes = toggle(o.modes, 'minor'); }),
    ]];
    second = ['조표 종류 (여러 개 선택)', [
      chip('♯ 조', o.sides.includes('sharp'), () => { o.sides = toggle(o.sides, 'sharp'); }),
      chip('♭ 조', o.sides.includes('flat'), () => { o.sides = toggle(o.sides, 'flat'); }),
    ]];
    ready = o.modes.length > 0 && o.sides.length > 0;
  } else {
    first = ['코드 종류 (여러 개 선택)', multi('types', chordItems, ' sym')];
    ready = o.types.length > 0;
  }
  $('free-q-label').textContent = first[0];
  $('free-q').className = 'grid ' + (kind === 'key' ? 'q2' : 'q4');
  $('free-q').replaceChildren(...first[1]);
  $('free-hint').textContent = ready ? '' : '하나 이상 골라 주세요';
  $('free-count').replaceChildren(...L.FREE_COUNTS.map(n => chip(String(n), o.count === n, () => { o.count = n; })));
  $('free-down-label').hidden = $('free-down').hidden = !second;
  if (second) {
    $('free-down-label').textContent = second[0];
    $('free-down').replaceChildren(...second[1]);
  }
  $('free-start').disabled = !ready;
  show('free');
}
$('free-start').onclick = () => startRound('free');

// ── 문제 풀기 ──
// mode: 단계 번호, 'free'(자유연습), 'review'(오답 다시 풀기)
let round = null;
let picked = {}, checked = false, proAcc = 0;

function startRound(mode) {
  loadPiano();
  const questions = mode === 'review' ? wrongList().slice(0, L.QUESTION_COUNT).map(w => ({ ...w }))
    : mode === 'free' ? quiz().free(freeOpts())
    : quiz().round(mode);
  // 음정 문제(logic.js)와 예전 오답 노트에는 kind가 없다
  for (const q of questions) q.kind ??= 'interval';
  round = { mode, questions, index: 0, score: 0 };
  $('quiz-title').textContent = mode === 'review' ? `오답 다시 풀기 · ${quiz().short}`
    : mode === 'free' ? `자유연습 · ${quiz().short}${kind === 'tones' ? ' ' + levelName() : ''}`
    : `${mode + 1}단계 · ${quiz().stages[mode].name}`;
  $('iv-answer').hidden = kind !== 'interval';
  $('opt-answer').hidden = kind === 'interval' || isPro();
  $('pro-answer').hidden = !isPro();
  $('opt-label').textContent = kind === 'chord' ? '코드 이름' : kind === 'key' ? '조 이름' : '구성음';
  nextQuestion();
  show('quiz');
}

// 음정 답 버튼(성질·도수)
const qButtons = {}, dButtons = {};
function buildChoices() {
  const row1 = ['완전', '장', '단'], row2 = ['겹감', '감', '증', '겹증'];
  for (const [row, names] of [[$('q-row1'), row1], [$('q-row2'), row2]]) {
    for (const q of names) {
      const b = el('button', { className: 'choice', textContent: q });
      b.onclick = () => choose('quality', q);
      qButtons[q] = b;
      row.append(b);
    }
  }
  for (const d of L.DEGREES) {
    const b = el('button', { className: 'choice', textContent: `${d}도` });
    b.onclick = () => choose('degree', d);
    dButtons[d] = b;
    $('d-grid').append(b);
  }
}
buildChoices();

// 프로 입력 버튼: 임시표(누른 뒤 다음 음 하나에만 붙음)와 음 이름
const ACC_BUTTONS = [[-2, '♭♭'], [-1, '♭'], [0, '♮'], [1, '♯'], [2, '♯♯']];
function buildProInput() {
  $('pro-acc').replaceChildren(...ACC_BUTTONS.map(([a, text]) => {
    const b = el('button', { className: 'choice', textContent: text });
    b.dataset.acc = a;
    b.onclick = () => { if (!checked) { proAcc = a; refreshChoices(); } };
    return b;
  }));
  $('pro-letters').replaceChildren(...'CDEFGAB'.split('').map((ch, l) => {
    const b = el('button', { className: 'choice', textContent: ch });
    b.onclick = () => {
      const q = round?.questions[round.index];
      if (!q || checked || picked.list.length >= q.answer.names.length) return;
      picked.list.push(C.enName({ l, o: 4, a: proAcc }));
      proAcc = 0;
      refreshChoices();
    };
    return b;
  }));
  $('pro-erase').onclick = () => { if (!checked) { picked.list.pop(); refreshChoices(); } };
}
buildProInput();

function choose(field, value) {
  if (checked) return;
  picked[field] = value;
  refreshChoices();
}

function mark(isPicked, isAnswer) {
  if (!checked) return isPicked ? ' on' : '';
  if (isAnswer) return ' right';
  return isPicked ? ' wrong' : '';
}

const answerText = q => (q.kind === 'interval' ? `${q.answer.quality}${q.answer.degree}도`
  : q.kind === 'tones' ? T.tonesText(q.answer.names) : q.answer.name);
const isReady = q => (q.kind === 'interval' ? picked.quality && picked.degree
  : isPro() ? picked.list.length === q.answer.names.length : !!picked.name);
const pickedText = q => (q.kind === 'interval' ? `${picked.quality ?? '?'}${picked.degree ?? '?'}도`
  : isPro() ? T.tonesText(picked.list) : picked.name);

function refreshChoices() {
  const q = round.questions[round.index];
  if (q.kind === 'interval') {
    for (const [k, b] of Object.entries(qButtons)) b.className = 'choice' + mark(picked.quality === k, q.answer.quality === k);
    for (const [k, b] of Object.entries(dButtons)) b.className = 'choice' + mark(picked.degree === Number(k), q.answer.degree === Number(k));
  } else if (isPro()) {
    const size = q.answer.names.length;
    $('pro-slots').replaceChildren(...Array.from({ length: size }, (_, i) => {
      const name = picked.list[i];
      const cls = !checked || !name ? '' : q.answer.names.includes(name) ? ' right' : ' wrong';
      return el('span', { className: 'slot' + (name ? ' filled' : '') + cls, textContent: name ?? '' });
    }));
    for (const b of $('pro-acc').children) b.className = 'choice' + (Number(b.dataset.acc) === proAcc && !checked ? ' on' : '');
  } else {
    const answer = answerText(q);
    for (const b of $('options').children) b.className = 'choice' + mark(picked.name === b.textContent, answer === b.textContent);
  }
  $('submit').disabled = !checked && !isReady(q);
  const nothing = q.kind === 'interval' ? !picked.quality && !picked.degree : isPro() ? !picked.list.length : !picked.name;
  $('submit').textContent = checked ? (round.index + 1 < round.questions.length ? '다음 문제' : '결과 보기')
    : nothing ? (q.kind === 'interval' ? '성질과 도수를 골라 주세요' : isPro() ? '구성음을 입력해 주세요' : '답을 골라 주세요')
    : isPro() && !isReady(q) ? `${picked.list.length} / ${q.answer.names.length}음 입력`
    : `${pickedText(q)} 확인`;
  const silent = !soundNotes(q, true).length;
  $('play-together').disabled = $('play-apart').disabled = silent;
}

function prompt(q) {
  if (q.kind === 'interval') return L.step(q.a) > L.step(q.b) ? '내려가는 음정이에요' : '두 음 사이의 음정은?';
  if (q.kind === 'chord') return '이 코드의 이름은?';
  if (q.kind === 'key') return q.mode === 'major' ? '이 조표의 장조(major)는?' : '이 조표의 단조(minor)는?';
  return isPro() ? `이 코드의 구성음 ${q.answer.names.length}개를 입력하세요` : '이 코드의 구성음은?';
}

function nextQuestion() {
  const q = round.questions[round.index];
  picked = { quality: null, degree: null, name: null, list: [] };
  checked = false;
  proAcc = 0;
  $('staff').replaceChildren(drawQuestion(q, false));
  markKeys(q);
  if (q.kind !== 'interval' && !isPro()) {
    $('options').replaceChildren(...q.options.map(name => {
      const b = el('button', { className: 'choice' + (q.kind === 'tones' ? ' long' : ''), textContent: name });
      b.onclick = () => choose('name', name);
      return b;
    }));
  }
  $('feedback').replaceChildren(el('span', { textContent: prompt(q) }));
  $('quiz-count').textContent = `${round.index + 1} / ${round.questions.length}`;
  $('quiz-bar').style.width = (round.index / round.questions.length) * 100 + '%';
  refreshChoices();
}

function grade(q) {
  if (q.kind === 'interval') return L.isCorrect(q, picked.quality, picked.degree);
  if (q.kind === 'tones') return T.isToneCorrect(q, isPro() ? picked.list : picked.name);
  return picked.name === q.answer.name;
}

const explain = q => (q.kind === 'interval' ? L.explain(q) : q.kind === 'chord' ? C.explainChord(q)
  : q.kind === 'key' ? K.explainKey(q) : T.explainTones(q));

$('submit').onclick = () => {
  if (!round) return;
  const q = round.questions[round.index];
  if (!checked) {
    if (!isReady(q)) return;
    checked = true;
    const ok = grade(q);
    if (ok) {
      round.score++;
      if (round.mode === 'review') setWrongs(quiz().removeWrong(wrongList(), q));
    } else {
      const mine = q.kind === 'interval' ? { quality: picked.quality, degree: picked.degree } : pickedText(q);
      setWrongs(quiz().addWrong(wrongList(), q, mine));
    }
    $('feedback').replaceChildren(
      el('b', { className: ok ? 'ok' : 'bad', textContent: ok ? '정답!' : `틀렸어요 · 정답은 ${answerText(q)}` }),
      el('span', { textContent: explain(q) }),
    );
    // 조표·코드톤은 채점한 뒤에야 악보·건반에 답(스케일·구성음)을 보여준다
    $('staff').replaceChildren(drawQuestion(q, true));
    markKeys(q);
    $('quiz-bar').style.width = ((round.index + 1) / round.questions.length) * 100 + '%';
    refreshChoices();
    return;
  }
  round.index++;
  if (round.index < round.questions.length) nextQuestion();
  else finish();
};

// 그만두면 들어온 화면으로 돌아간다
$('quit').onclick = () => {
  const mode = round?.mode;
  round = null;
  if (mode === 'free') freeScreen();
  else if (mode === 'review') openWrongs();
  else stagesScreen();
};

// ── 소리: 그랜드 피아노 녹음(Salamander Grand Piano) ──
// 단3도 간격 녹음 9개를 받아 두고, 가장 가까운 녹음의 재생 속도를 바꿔 나머지 음을 낸다
const PIANO_SAMPLES = { C4: 48, Ds4: 51, Fs4: 54, A4: 57, C5: 60, Ds5: 63, Fs5: 66, A5: 69, C6: 72 };
let actx = null, piano = null;
function audio() {
  actx ??= new (window.AudioContext || window.webkitAudioContext)();
  // 아이폰은 다른 앱에 갔다 오면 'interrupted'가 되므로 running이 아니면 모두 깨운다
  if (actx.state !== 'running') actx.resume().catch(() => {});
  return actx;
}

// 아이폰 사파리는 화면을 누른 그 순간에 소리를 시작해야 오디오가 열린다.
// 녹음을 불러오는 동안 기다리면 그 순간이 지나 버리므로, 누를 때마다 들리지 않는 아주 짧은 소리를 먼저 낸다
function unlockAudio() {
  const ctx = audio();
  const src = ctx.createBufferSource();
  src.buffer = ctx.createBuffer(1, 1, 22050);
  src.connect(ctx.destination);
  src.start(0);
}
for (const type of ['touchend', 'click']) {
  addEventListener(type, unlockAudio, { capture: true, passive: true });
}
// iOS 17+: 무음 모드에서도 음악처럼 소리가 나게
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch { /* 지원 안 하는 기기 */ }

// 녹음을 못 받으면 null → 직접 만든 소리로 대신 낸다
function loadPiano() {
  const ctx = audio();
  piano ??= Promise.all(Object.entries(PIANO_SAMPLES).map(async ([name, p]) => {
    const res = await fetch(`piano/${name}.mp3`);
    if (!res.ok) throw new Error(name);
    const data = await res.arrayBuffer();
    const buf = await new Promise((ok, fail) => ctx.decodeAudioData(data, ok, fail));
    return [p, buf];
  })).then(Object.fromEntries).catch(() => null);
  return piano;
}

// p: logic.js의 pitch 값(가운데 도 = 48)
async function tone(p, delay = 0, dur = 1.6) {
  const samples = await loadPiano();
  const ctx = audio();
  if (ctx.state !== 'running') await Promise.race([ctx.resume(), new Promise(ok => setTimeout(ok, 300))]).catch(() => {});
  setTimeout(() => flashKey(p), delay * 1000);
  if (!samples) return synthTone(ctx, p, delay, dur);
  const base = Object.values(PIANO_SAMPLES).reduce((a, b) => (Math.abs(b - p) < Math.abs(a - p) ? b : a));
  const t = ctx.currentTime + 0.02 + delay;
  const src = ctx.createBufferSource();
  src.buffer = samples[base];
  src.playbackRate.value = 2 ** ((p - base) / 12);
  const out = ctx.createGain();
  out.gain.setValueAtTime(1.5, t);
  out.gain.setValueAtTime(1.5, t + dur);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  src.connect(out);
  out.connect(ctx.destination);
  src.start(t);
  src.stop(t + dur + 0.55);
}

// 녹음이 없을 때 쓰는 피아노 비슷한 소리
function synthTone(ctx, p, delay, dur) {
  const f = 440 * 2 ** ((p + 12 - 69) / 12);
  const t = ctx.currentTime + 0.02 + delay;
  const out = ctx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(f * 6, t);
  lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);
  lp.connect(out);
  out.connect(ctx.destination);
  for (const [type, mul, g] of [['triangle', 1, 1], ['sine', 2, 0.3], ['sine', 3, 0.1]]) {
    const o = ctx.createOscillator();
    const og = ctx.createGain();
    o.type = type;
    o.frequency.value = f * mul;
    og.gain.value = g;
    o.connect(og);
    og.connect(lp);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
}

// 들려줄 음: 음정은 악보 왼쪽 음부터, 화음은 아래 음부터.
// 조표·코드톤은 소리가 곧 답이라 채점한 뒤에만 (조표: 같이 = 으뜸화음, 따로 = 스케일)
function soundNotes(q, together) {
  if (q.kind === 'interval') return [q.a, q.b];
  if (q.kind === 'chord') return q.notes;
  if (!checked) return [];
  if (q.kind === 'key') {
    const s = placedScale(q);
    return together ? [s[0], s[2], s[4]] : s;
  }
  return q.notes;
}

// 스케일이 건반 밖으로 나가면 한 옥타브 옮긴다 (C♭ major는 가운데 도보다 낮게 시작하므로)
function placedScale(q) {
  const s = K.scale(q.sig, q.mode);
  const shift = s.some(n => L.pitch(n) < L.KEY_LOW) ? 1 : s.some(n => L.pitch(n) > L.KEY_HIGH) ? -1 : 0;
  return s.map(n => ({ ...n, o: n.o + shift }));
}

$('play-together').onclick = () => {
  const q = round?.questions[round.index];
  if (!q) return;
  for (const n of soundNotes(q, true)) tone(L.pitch(n), 0, q.kind === 'interval' ? 1.6 : 2);
};
$('play-apart').onclick = () => {
  const q = round?.questions[round.index];
  if (!q) return;
  const gap = q.kind === 'interval' ? 0.75 : q.kind === 'key' ? 0.35 : 0.5;
  soundNotes(q, false).forEach((n, i, all) => tone(L.pitch(n), i * gap, i === all.length - 1 ? 1.4 : 1.2));
};

// ── 건반 (가운데 도 ~ 높은 도) ──
const KEYS_KEY = 'intervalQuiz.keyboard';
const keyEls = {};
const whiteCount = (L.KEY_HIGH - L.KEY_LOW) / 12 * 7 + 1;

function buildKeyboard() {
  const box = $('keys');
  for (let i = 0; i < whiteCount; i++) {
    const n = { l: i % 7, o: 4 + Math.floor(i / 7), a: 0 };
    const w = el('button', { className: 'wkey', ariaLabel: L.noteName(n) });
    if (n.l === 0) w.append(el('small', { textContent: '도' }));
    addKey(w, L.pitch(n), (i + 0.5) / whiteCount);
    box.append(w);
    // 도·레·파·솔·라 오른쪽에 검은 건반
    if ([0, 1, 3, 4, 5].includes(n.l) && i < whiteCount - 1) {
      const b = el('button', { className: 'bkey', ariaLabel: L.noteName({ ...n, a: 1 }) });
      b.style.left = ((i + 1) / whiteCount) * 100 + '%';
      addKey(b, L.pitch(n) + 1, (i + 1) / whiteCount);
      box.append(b);
    }
  }
}

function addKey(e, p, x) {
  keyEls[p] = { e, x };
  e.onpointerdown = ev => { ev.preventDefault(); unlockAudio(); tone(p, 0, 1.2); };
}

function flashKey(p) {
  const k = keyEls[p];
  if (!k) return;
  k.e.classList.add('press');
  setTimeout(() => k.e.classList.remove('press'), 300);
}

// 건반 표시: 음정은 두 음(악보 왼쪽 음 노랑, 오른쪽 음 파랑), 나머지는 표시할 음 전부를 노랑으로
function markKeys(q) {
  for (const { e } of Object.values(keyEls)) e.classList.remove('m1', 'm2');
  const labels = $('kb-labels');
  labels.replaceChildren();
  labels.classList.toggle('two', q.kind !== 'interval');
  if (q.kind !== 'interval') return markManyKeys(keyNotes(q), labels);
  const pa = L.pitch(q.a), pb = L.pitch(q.b);
  keyEls[pa]?.e.classList.add('m1');
  keyEls[pb]?.e.classList.add('m2');
  if (pa === pb) {
    if (keyEls[pa]) labels.append(label(`${L.noteName(q.a)}·${L.noteName(q.b)}`, 'm1 m2', keyEls[pa].x));
    return;
  }
  // 두 건반이 가까우면 이름표가 겹치지 않게 양옆으로 벌린다
  const close = keyEls[pa] && keyEls[pb] && Math.abs(keyEls[pa].x - keyEls[pb].x) < 0.1;
  for (const [n, p, m, other] of [[q.a, pa, 'm1', pb], [q.b, pb, 'm2', pa]]) {
    if (!keyEls[p]) continue;
    const side = close ? (p < other ? ' left' : ' right') : '';
    labels.append(label(L.noteName(n), m + side, keyEls[p].x));
  }
}

// 코드: 구성음. 조표: 채점 전에는 조표의 ♯·♭ 음(건반의 모든 옥타브), 채점 뒤에는 스케일. 코드톤: 채점 뒤에만 구성음
function keyNotes(q) {
  if (q.kind === 'chord') return q.notes;
  if (q.kind === 'key') {
    if (checked) return placedScale(q);
    return K.signatureNotes(q.sig).flatMap(n => [4, 5, 6].map(o => ({ ...n, o })))
      .filter(n => L.pitch(n) >= L.KEY_LOW && L.pitch(n) <= L.KEY_HIGH);
  }
  return checked ? q.notes : [];
}

// 이름표가 붙으면 두 줄로 엇갈려 단다
function markManyKeys(notes, labels) {
  const byKey = new Map();
  for (const n of notes) {
    const p = L.pitch(n);
    if (!keyEls[p]) continue;
    keyEls[p].e.classList.add('m1');
    byKey.set(p, [...new Set([...(byKey.get(p) ?? []), C.enName(n)])]);
  }
  const lastX = [-1, -1];
  for (const [p, nameList] of [...byKey].sort((a, b) => a[0] - b[0])) {
    const x = keyEls[p].x;
    const row = x - lastX[0] < 0.09 && x - lastX[1] >= 0.09 ? 1 : 0;
    lastX[row] = x;
    labels.append(label(nameList.join('·'), 'm1' + (row ? ' row2' : ''), x));
  }
}

function label(text, cls, x) {
  const span = el('span', { className: cls, textContent: text });
  span.style.left = x * 100 + '%';
  return span;
}

let showKeys = load(KEYS_KEY, true);
function applyKeysToggle() {
  $('keyboard').hidden = !showKeys;
  $('toggle-keys').textContent = showKeys ? '건반 숨기기' : '건반 보이기';
}
$('toggle-keys').onclick = () => {
  showKeys = !showKeys;
  save(KEYS_KEY, showKeys);
  applyKeysToggle();
};
buildKeyboard();
applyKeysToggle();

// ── 결과 ──
function finish() {
  const { mode, score, questions } = round;
  const total = questions.length;
  const buttons = [];
  if (mode === 'review') {
    $('result-title').textContent = `오답 다시 풀기 · ${quiz().short}`;
    const left = wrongList().length;
    $('result-msg').textContent = left ? `오답 노트에 ${left}문제 남았어요` : '오답 노트를 모두 비웠어요!';
    if (left) buttons.push(['한 번 더', true, () => startRound('review')]);
  } else if (mode === 'free') {
    $('result-title').textContent = `자유연습 · ${fullTitle()}`;
    $('result-msg').textContent = `${Math.round(score / total * 100)}% 맞혔어요`;
    buttons.push(['같은 설정으로 다시', true, () => startRound('free')]);
    buttons.push(['설정 바꾸기', false, freeScreen]);
  } else {
    const wasUnlocked = L.isUnlocked(prog(), mode + 1);
    put(storeKey('progress'), L.recordRound(prog(), mode, score));
    const passed = score >= L.PASS_SCORE;
    const hasNext = mode + 1 < quiz().stages.length;
    $('result-title').textContent = `${fullTitle()} ${mode + 1}단계 · ${quiz().stages[mode].name}`;
    $('result-msg').textContent = !passed ? `${L.PASS_SCORE}개 이상 맞히면 통과예요`
      : !hasNext ? '모든 단계를 통과했어요!'
      : wasUnlocked ? '통과!' : `통과! ${mode + 2}단계가 열렸어요`;
    if (passed && hasNext) buttons.push(['다음 단계', true, () => startRound(mode + 1)]);
    buttons.push(['다시 풀기', !passed || !hasNext, () => startRound(mode)]);
  }
  buttons.push(['메뉴로', false, menuScreen]);
  $('result-score').replaceChildren(String(score), el('small', { textContent: ` / ${total}` }));
  $('result-buttons').replaceChildren(...buttons.map(([text, fill, fn]) => {
    const b = el('button', { className: 'wide' + (fill ? ' fill' : ''), textContent: text });
    b.onclick = fn;
    return b;
  }));
  round = null;
  show('result');
}

// ── 오답 노트 ──
function wrongText(w) {
  if (w.kind === 'chord') return [w.notes.map(C.enName).join(' '), w.answer.name, w.picked];
  if (w.kind === 'key') return [`${K.sigText(w.sig)} · ${w.mode === 'major' ? '장조' : '단조'}`, w.answer.name, w.picked];
  if (w.kind === 'tones') return [w.name, T.tonesText(w.answer.names), w.picked];
  return [`${L.noteName(w.a)} → ${L.noteName(w.b)}`, `${w.answer.quality}${w.answer.degree}도`, `${w.picked.quality}${w.picked.degree}도`];
}

function openWrongs() {
  const list = $('wrong-list');
  list.replaceChildren();
  const items = wrongList();
  $('wrongs-title').textContent = `오답 노트 · ${quiz().short}${kind === 'tones' ? ' ' + levelName() : ''}`;
  if (!items.length) list.append(el('p', { className: 'empty', textContent: '아직 틀린 문제가 없어요' }));
  for (const w of items) {
    const paper = el('div', { className: 'paper' });
    paper.append(drawQuestion(w, true));
    const [what, right, mine] = wrongText(w);
    const txt = el('div', { className: 'txt' }, [
      el('div', { textContent: what }),
      el('div', {}, ['정답 ', el('b', { textContent: right })]),
      el('div', {}, ['내 답 ', el('s', { textContent: mine })]),
    ]);
    list.append(el('div', { className: 'wrong-item' }, [paper, txt]));
  }
  $('wrongs-count').textContent = `${items.length}문제`;
  $('retry-wrongs').disabled = !items.length;
  show('wrongs');
}
$('wrongs-back').onclick = menuScreen;
$('retry-wrongs').onclick = () => startRound('review');

home();
</script>
