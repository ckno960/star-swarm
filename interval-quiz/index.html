<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101a33">
<title>음정 퀴즈</title>
<style>
  :root {
    --bg: #101a33; --panel: #1b2a4d; --line: #34497a; --text: #f3f5fb; --dim: #9fb0d6;
    --accent: #ffcf4d; --ok: #43d17a; --bad: #ff5d6c; --paper: #fbf7ec; --ink: #1d1d1f;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  body { position: fixed; inset: 0; }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto; box-sizing: border-box;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .screen[hidden] { display: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* 처음 화면 */
  #home { justify-content: center; gap: 10px; }
  #home h1 { margin: 0; text-align: center; font-size: 34px; letter-spacing: 2px; }
  #home .sub { margin: 0 0 14px; text-align: center; color: var(--dim); font-size: 15px; }
  .menu {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px 18px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px; text-align: left;
  }
  .menu b { font-size: 20px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--panel); border-radius: 14px; margin-bottom: 4px; }
  .tabs button { min-height: 44px; border: none; border-radius: 10px; background: none; color: var(--dim); font-weight: 800; font-size: 17px; }
  .tabs button.on { background: var(--accent); color: #2a1f00; }
  .credit { margin: 14px 0 0; text-align: center; font-size: 11px; color: var(--dim); opacity: 0.7; }
  .menu span { font-size: 14px; color: var(--dim); }
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .stage {
    display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px; text-align: left;
  }
  .stage .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--line); font-weight: 800;
  }
  .stage .info { flex: 1; min-width: 0; }
  .stage .name { font-weight: 800; font-size: 17px; }
  .stage .desc { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .stage .badge { flex: none; font-size: 13px; font-weight: 800; color: var(--dim); }
  .stage .badge.clear { color: var(--ok); }
  .stage.cleared { border-color: var(--ok); }
  .stage.cleared .num { background: var(--ok); color: #08240f; }
  .stage:disabled { opacity: 0.4; }
  .wide {
    min-height: 52px; border-radius: 14px; border: 2px solid var(--accent);
    background: transparent; color: var(--accent); font-weight: 800; font-size: 17px;
  }
  .wide.fill { background: var(--accent); color: #2a1f00; }
  .wide:disabled { opacity: 0.35; }

  /* 문제 화면 */
  .top { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .back {
    width: 40px; height: 40px; border: none; background: none; font-size: 22px; padding: 0;
  }
  .top .title { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .count { font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }
  .paper {
    background: var(--paper); border-radius: 16px; padding: 6px 4px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  }
  .paper svg { display: block; width: 100%; height: auto; }
  /* 문제 화면의 오선지는 남는 높이만큼만 차지한다 (노치·홈 바가 있는 폰에서도 건반까지 들어오게) */
  #staff { flex: 1 1 0; min-height: 80px; max-height: 200px; display: flex; }
  #staff svg { height: 100%; }
  #feedback {
    min-height: 48px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; font-size: 14px; color: var(--dim); padding: 4px 0;
  }
  #feedback b { font-size: 18px; }
  #feedback b.ok { color: var(--ok); }
  #feedback b.bad { color: var(--bad); }
  .label { font-size: 13px; color: var(--dim); font-weight: 700; margin: 6px 2px 6px; }
  .grid { display: grid; gap: 8px; }
  .grid.q3 { grid-template-columns: repeat(3, 1fr); }
  .grid.q4 { grid-template-columns: repeat(4, 1fr); margin-top: 8px; }
  .choice {
    min-height: 46px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel); font-weight: 800; font-size: 17px;
  }
  .choice.on { border-color: var(--accent); background: #3a3420; color: var(--accent); }
  .choice.right { border-color: var(--ok); background: #163824; color: var(--ok); }
  .choice.wrong { border-color: var(--bad); background: #3d1820; color: var(--bad); }
  .spacer { flex: 1; min-height: 10px; }

  /* 듣기 버튼과 건반 */
  .controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 10px; }
  .ctl {
    min-height: 40px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel); font-weight: 800; font-size: 15px; padding: 0 10px;
  }
  .ctl.toggle { font-size: 13px; color: var(--dim); }
  #keyboard { margin-top: 6px; }
  #keyboard[hidden] { display: none; }
  .kb-labels { position: relative; height: 22px; }
  .kb-labels span {
    position: absolute; bottom: 3px; transform: translateX(-50%); white-space: nowrap;
    font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 6px; color: #10131c;
  }
  .kb-labels.two { height: 40px; }
  .kb-labels span.row2 { bottom: 21px; }
  .kb-labels span.left { transform: translateX(-100%); }
  .kb-labels span.right { transform: none; }
  .keys { position: relative; display: flex; height: 84px; touch-action: none; }
  .wkey {
    flex: 1; position: relative; padding: 0; margin-right: -1px;
    background: #fbf7ec; border: 1px solid #1d1d1f; border-radius: 0 0 5px 5px;
  }
  .wkey small { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 9px; color: #8a8576; text-align: center; }
  .bkey {
    position: absolute; top: 0; z-index: 1; height: 56%; width: 4.1%; transform: translateX(-50%);
    padding: 0; border: none; background: #1d1d1f; border-radius: 0 0 4px 4px;
  }
  .m1 { --mark: var(--accent); }
  .m2 { --mark: #4dd6ff; }
  .wkey.m1, .wkey.m2, .bkey.m1, .bkey.m2 { background: var(--mark); }
  .wkey.m1.m2, .bkey.m1.m2, .kb-labels span.m1.m2 { background: linear-gradient(90deg, var(--accent) 50%, #4dd6ff 50%); }
  .kb-labels span.m1, .kb-labels span.m2 { background: var(--mark); }
  .wkey.press { filter: brightness(0.8); }
  .bkey.press { filter: brightness(2.2); }

  /* 키가 작은 휴대폰 */
  @media (max-height: 760px) {
    #feedback { min-height: 40px; }
    .label { margin: 4px 2px; }
    .grid { gap: 6px; }
    .grid.q4 { margin-top: 6px; }
    .choice { min-height: 38px; font-size: 16px; }
    .wide { min-height: 46px; }
    .ctl { min-height: 36px; }
    .keys { height: 66px; }
    .kb-labels { height: 20px; }
    .kb-labels.two { height: 38px; }
    .opts .choice { min-height: 50px; }
  }

  /* 결과 */
  #result { justify-content: center; align-items: stretch; gap: 12px; text-align: center; }
  #result .big { font-size: 64px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #result .big small { font-size: 28px; color: var(--dim); }
  #result .msg { font-size: 18px; font-weight: 800; margin-bottom: 16px; }

  /* 오답 노트 */
  #wrong-list { flex: 1; overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 4px 0 12px; }
  .wrong-item { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 14px; padding: 8px; }
  .wrong-item .paper { flex: none; width: 130px; padding: 0; border-radius: 10px; box-shadow: none; }
  .wrong-item .txt { font-size: 14px; line-height: 1.5; }
  .wrong-item .txt b { color: var(--ok); }
  .wrong-item .txt s { color: var(--bad); }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; }

  /* 자유연습 설정 */
  #free .hint { font-size: 13px; color: var(--dim); margin: -2px 2px 6px; min-height: 18px; }
  #free .grid.q5 { grid-template-columns: repeat(5, 1fr); }
  #free .grid.q2 { grid-template-columns: repeat(2, 1fr); }
  #free .choice { font-size: 16px; }
  #free .choice.sym { font-size: 15px; padding: 0 2px; white-space: nowrap; }
  .opts .choice { min-height: 56px; font-size: 21px; }
</style>
</head>
<body>

<section id="home" class="screen">
  <h1 id="home-title">음정 퀴즈</h1>
  <p class="sub" id="home-sub"></p>
  <div class="tabs" id="kind-tabs">
    <button data-kind="interval">음정</button>
    <button data-kind="chord">코드</button>
  </div>
  <button class="menu" id="open-stages"><b>단계별 연습</b><span id="stages-summary"></span></button>
  <button class="menu" id="open-free"><b>자유연습</b><span id="free-summary"></span></button>
  <button id="open-wrongs" class="wide" style="margin-top:8px"></button>
  <p class="credit">피아노 소리: Salamander Grand Piano (Alexander Holm, CC BY 3.0)</p>
</section>

<section id="stages-screen" class="screen" hidden>
  <div class="top">
    <button class="back" id="stages-back" aria-label="뒤로">←</button>
    <span class="title" id="stages-title">단계별 연습</span>
  </div>
  <div class="list" id="stages"></div>
</section>

<section id="free" class="screen" hidden>
  <div class="top">
    <button class="back" id="free-back" aria-label="뒤로">←</button>
    <span class="title" id="free-title">자유연습</span>
  </div>
  <div class="label" style="margin-top:12px" id="free-q-label">성질 (여러 개 선택)</div>
  <div class="grid q4" id="free-q" style="margin-top:0"></div>
  <div class="hint" id="free-hint"></div>
  <div class="label">문제 수</div>
  <div class="grid q5" id="free-count"></div>
  <div class="label" style="margin-top:14px" id="free-down-label">방향</div>
  <div class="grid q2" id="free-down"></div>
  <div class="spacer"></div>
  <button class="wide fill" id="free-start">시작</button>
</section>

<section id="quiz" class="screen" hidden>
  <div class="top">
    <button class="back" id="quit" aria-label="그만하기">←</button>
    <span class="title" id="quiz-title"></span>
    <span class="count" id="quiz-count"></span>
  </div>
  <div class="bar"><i id="quiz-bar"></i></div>
  <div class="paper" id="staff"></div>
  <div id="feedback"></div>
  <div id="iv-answer">
    <div class="label">성질</div>
    <div class="grid q3" id="q-row1"></div>
    <div class="grid q4" id="q-row2"></div>
    <div class="label" style="margin-top:12px">도수</div>
    <div class="grid q4" id="d-grid" style="margin-top:0"></div>
  </div>
  <div id="ch-answer" hidden>
    <div class="label">코드 이름</div>
    <div class="grid q2 opts" id="ch-options" style="grid-template-columns: 1fr 1fr"></div>
  </div>
  <div style="height:12px"></div>
  <button class="wide fill" id="submit">확인</button>
  <div class="controls">
    <button class="ctl" id="play-together">같이 듣기</button>
    <button class="ctl" id="play-apart">따로 듣기</button>
    <button class="ctl toggle" id="toggle-keys"></button>
  </div>
  <div id="keyboard">
    <div class="kb-labels" id="kb-labels"></div>
    <div class="keys" id="keys"></div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <div id="result-title" style="font-weight:800;color:var(--dim)"></div>
  <div class="big" id="result-score"></div>
  <div class="msg" id="result-msg"></div>
  <div id="result-buttons" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<section id="wrongs" class="screen" hidden>
  <div class="top">
    <button class="back" id="wrongs-back" aria-label="뒤로">←</button>
    <span class="title" id="wrongs-title">오답 노트</span>
    <span class="count" id="wrongs-count"></span>
  </div>
  <div id="wrong-list"></div>
  <button class="wide fill" id="retry-wrongs">틀린 문제 다시 풀기</button>
</section>

<script type="module">
import * as L from './logic.js?v=4';
import * as C from './chords.js?v=2';

// 음정 퀴즈와 코드 퀴즈는 진행·오답 노트를 따로 저장한다
const PROGRESS_KEY = 'intervalQuiz.progress';
const WRONGS_KEY = 'intervalQuiz.wrongs';
const CHORD_PROGRESS_KEY = 'intervalQuiz.chordProgress';
const CHORD_WRONGS_KEY = 'intervalQuiz.chordWrongs';
const KIND_KEY = 'intervalQuiz.kind';
let progress = load(PROGRESS_KEY, {});
let wrongs = load(WRONGS_KEY, []);
let chordProgress = load(CHORD_PROGRESS_KEY, {});
let chordWrongs = load(CHORD_WRONGS_KEY, []);
let kind = load(KIND_KEY, 'interval');
const isChord = () => kind === 'chord';
const stages = () => (isChord() ? C.CHORD_STAGES : L.STAGES);
const prog = () => (isChord() ? chordProgress : progress);
const wrongList = () => (isChord() ? chordWrongs : wrongs);
function setWrongs(list) {
  if (isChord()) save(CHORD_WRONGS_KEY, chordWrongs = list);
  else save(WRONGS_KEY, wrongs = list);
}

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 저장 불가 환경: 이번 실행 동안만 유지 */ }
}

const $ = id => document.getElementById(id);
function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
}
function el(tag, props = {}, children = []) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
}

// ── 악보 그리기 (SVG) ──
// 오선 간격 10. 맨 아래 줄(미4) y=70, 맨 위 줄(파5) y=30
const NS = 'http://www.w3.org/2000/svg';
const yOf = s => 70 - (s - 30) * 5;
const CLEF = 'M20 31 C14 31 13 24 19 22 C27 20 30 30 24 36 C17 42 6 36 9 25 C12 15 26 9 26 -6 '
  + 'C26 -15 19 -16 17 -7 C14 3 22 30 23 46 C24 54 14 56 13 49';

function svg(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function accidental(a, x, y) {
  const g = svg('g', { transform: `translate(${x} ${y})`, stroke: '#1d1d1f', fill: 'none', 'stroke-linecap': 'butt' });
  const flat = dx => {
    g.append(svg('path', { d: `M${dx} -14 L${dx} 4`, 'stroke-width': 1.3 }));
    g.append(svg('path', { d: `M${dx} 4 C${dx + 9} -1 ${dx + 8} -8 ${dx} -2`, 'stroke-width': 1.9 }));
  };
  if (a === 1) {
    g.append(svg('path', { d: 'M-2 -9 L-2 10 M2 -10 L2 9', 'stroke-width': 1.2 }));
    g.append(svg('path', { d: 'M-5 -2 L5 -5 M-5 5 L5 2', 'stroke-width': 2.6 }));
  } else if (a === -1) {
    flat(-3);
  } else if (a === 2) {
    g.append(svg('path', { d: 'M-4 -4 L4 4 M4 -4 L-4 4', 'stroke-width': 1.4 }));
    for (const [cx, cy] of [[-4, -4], [4, -4], [-4, 4], [4, 4]]) {
      g.append(svg('rect', { x: cx - 1.7, y: cy - 1.7, width: 3.4, height: 3.4, fill: '#1d1d1f', stroke: 'none' }));
    }
  } else if (a === -2) {
    flat(-8); flat(-1);
  }
  return g;
}

function note(n, x) {
  const g = svg('g', {});
  const s = L.step(n), y = yOf(s);
  const ledgers = [];
  for (let k = 28; k >= s; k -= 2) ledgers.push(k);
  for (let k = 40; k <= s; k += 2) ledgers.push(k);
  for (const k of ledgers) {
    g.append(svg('line', { x1: x - 11, x2: x + 11, y1: yOf(k), y2: yOf(k), stroke: '#1d1d1f', 'stroke-width': 1.2 }));
  }
  g.append(svg('ellipse', { cx: x, cy: y, rx: 6.6, ry: 4.6, fill: '#1d1d1f' }));
  g.append(svg('ellipse', { cx: x, cy: y, rx: 3.9, ry: 2.2, fill: '#fbf7ec', transform: `rotate(-35 ${x} ${y})` }));
  if (n.a) g.append(accidental(n.a, x - (n.a === -2 ? 18 : 14), y));
  return g;
}

function ledgerSteps(s) {
  const out = [];
  for (let k = 28; k >= s; k -= 2) out.push(k);
  for (let k = 40; k <= s; k += 2) out.push(k);
  return out;
}

// 화음: 음을 세로로 쌓는다. 2도로 붙은 음은 오른쪽으로 비켜 쓰고, 임시표는 겹치지 않게 왼쪽으로 줄을 나눠 단다
function chord(notes, x) {
  const g = svg('g', {});
  const sorted = [...notes].sort((a, b) => L.step(a) - L.step(b));
  const shifted = [];
  sorted.forEach((n, i) => {
    shifted[i] = i > 0 && L.step(n) - L.step(sorted[i - 1]) === 1 && !shifted[i - 1];
  });
  const anyShift = shifted.some(Boolean);
  const ledgers = new Set(sorted.flatMap(n => ledgerSteps(L.step(n))));
  for (const k of ledgers) {
    g.append(svg('line', { x1: x - 11, x2: x + (anyShift ? 24 : 11), y1: yOf(k), y2: yOf(k), stroke: '#1d1d1f', 'stroke-width': 1.2 }));
  }
  sorted.forEach((n, i) => {
    const cx = x + (shifted[i] ? 13 : 0), y = yOf(L.step(n));
    g.append(svg('ellipse', { cx, cy: y, rx: 6.6, ry: 4.6, fill: '#1d1d1f' }));
    g.append(svg('ellipse', { cx, cy: y, rx: 3.9, ry: 2.2, fill: '#fbf7ec', transform: `rotate(-35 ${cx} ${y})` }));
  });
  // 위 음부터 임시표를 달고, 6도 안쪽에 이미 단 임시표가 있으면 한 칸 왼쪽 줄로
  const columns = [];
  for (const n of [...sorted].reverse().filter(n => n.a)) {
    let c = 0;
    while ((columns[c] ?? []).some(s => Math.abs(s - L.step(n)) < 6)) c++;
    (columns[c] ??= []).push(L.step(n));
    g.append(accidental(n.a, x - 14 - c * 11 - (n.a === -2 ? 4 : 0), yOf(L.step(n))));
  }
  return g;
}

function drawStaff(q, width = 200) {
  const root = svg('svg', { viewBox: `0 -8 ${width} 104`, role: 'img' });
  root.setAttribute('aria-label', q.kind === 'chord' ? '오선지 위의 화음' : '오선지 위의 두 음');
  for (let i = 0; i < 5; i++) {
    root.append(svg('line', { x1: 4, x2: width - 4, y1: 30 + i * 10, y2: 30 + i * 10, stroke: '#1d1d1f', 'stroke-width': 1 }));
  }
  const clef = svg('g', { transform: 'translate(2 30)' });
  clef.append(svg('path', { d: CLEF, fill: 'none', stroke: '#1d1d1f', 'stroke-width': 2.6, 'stroke-linecap': 'round' }));
  clef.append(svg('circle', { cx: 15.5, cy: 49.5, r: 3.2, fill: '#1d1d1f' }));
  root.append(clef);
  if (q.kind === 'chord') {
    root.append(chord(q.notes, width * 0.6));
    return root;
  }
  const x1 = width * 0.45, x2 = width * 0.75;
  root.append(note(q.a, x1), note(q.b, x2));
  return root;
}

// ── 처음 화면 ──
function home() {
  const cleared = stages().filter((_, i) => L.isCleared(prog(), i)).length;
  $('home-title').textContent = isChord() ? '코드 퀴즈' : '음정 퀴즈';
  $('home-sub').textContent = isChord() ? '악보의 화음을 보고 코드 이름을 맞혀 보세요' : '악보의 두 음 사이 음정을 맞혀 보세요';
  document.title = isChord() ? '코드 퀴즈' : '음정 퀴즈';
  for (const b of $('kind-tabs').children) b.className = b.dataset.kind === kind ? 'on' : '';
  $('stages-summary').textContent = `${stages().length}단계 중 ${cleared}단계 통과`;
  $('free-summary').textContent = isChord() ? '코드 종류와 문제 수를 골라서 연습' : '성질과 문제 수를 골라서 연습';
  $('open-wrongs').textContent = `오답 노트 (${wrongList().length})`;
  show('home');
}
for (const b of $('kind-tabs').children) {
  b.onclick = () => { kind = b.dataset.kind; save(KIND_KEY, kind); home(); };
}
$('open-wrongs').onclick = () => openWrongs();
$('open-stages').onclick = () => stagesScreen();

    const b = el('button', { className: 'stage' + (cleared ? ' cleared' : ''), disabled: !unlocked }, [

// ── 자유연습 설정 ──
const FREE_KEY = 'intervalQuiz.free';
let freeOpts = { qualities: [...L.QUALITIES], count: 10, down: false, ...load(FREE_KEY, {}) };

const CHORD_FREE_KEY = 'intervalQuiz.chordFree';
let chordFreeOpts = { types: C.CHORD_TYPES.map(t => t.id), count: 10, inversions: false, ...load(CHORD_FREE_KEY, {}) };

  $('free-q-label').textContent = '성질 (여러 개 선택)';

// 코드 자유연습: 종류(C를 근음으로 한 기호로 보여줌), 자리바꿈, 문제 수

$('free-start').onclick = () => startRound('free');

// ── 문제 풀기 ──
// mode: 단계 번호, 'free'(자유연습), 'review'(오답 다시 풀기)
let round = null;

function startRound(mode) {
  loadPiano();
  const questions = mode === 'review' ? wrongList().slice(0, L.QUESTION_COUNT).map(w => ({ ...w }))
    : mode === 'free' ? (isChord() ? C.makeFreeChordRound(chordFreeOpts) : L.makeFreeRound(freeOpts))
    : isChord() ? C.makeChordRound(mode) : L.makeRound(mode);
  round = { mode, questions, index: 0, score: 0 };
  const types = chordFreeOpts.types;
  $('quiz-title').textContent = mode === 'review' ? '오답 다시 풀기'
    : mode === 'free' && isChord() ? `자유연습 · ${types.length === C.CHORD_TYPES.length ? '모든 코드' : types.length <= 3 ? types.map(t => 'C' + C.TYPE_BY_ID[t].symbol).join('·') : `코드 ${types.length}종류`}`
    : mode === 'free' ? `자유연습 · ${freeOpts.qualities.length === L.QUALITIES.length ? '모든 성질' : freeOpts.qualities.join('·')}`
    : `${mode + 1}단계 · ${stages()[mode].name}`;
  $('iv-answer').hidden = isChord();
  $('ch-answer').hidden = !isChord();
  nextQuestion();
  show('quiz');
}

let picked = { quality: null, degree: null, name: null }, checked = false;
const qButtons = {}, dButtons = {};

function buildChoices() {
  const row1 = ['완전', '장', '단'], row2 = ['겹감', '감', '증', '겹증'];
  for (const [row, names] of [[$('q-row1'), row1], [$('q-row2'), row2]]) {
    for (const q of names) {
      const b = el('button', { className: 'choice', textContent: q });
      b.onclick = () => choose('quality', q);
      qButtons[q] = b;
      row.append(b);
    }
  }
  for (const d of L.DEGREES) {
    const b = el('button', { className: 'choice', textContent: `${d}도` });
    b.onclick = () => choose('degree', d);
    dButtons[d] = b;
    $('d-grid').append(b);
  }
}
buildChoices();

function choose(kind, value) {
  if (checked) return;
  picked[kind] = value;
  refreshChoices();
}

function refreshChoices() {
  const q = round.questions[round.index];
  if (q.kind === 'chord') return refreshChordChoices(q);
  for (const [k, b] of Object.entries(qButtons)) {
    b.className = 'choice' + mark(picked.quality === k, q.answer.quality === k);
  }
  for (const [k, b] of Object.entries(dButtons)) {
    b.className = 'choice' + mark(picked.degree === Number(k), q.answer.degree === Number(k));
  }
  const ready = picked.quality && picked.degree;
  $('submit').disabled = !checked && !ready;
  $('submit').textContent = checked ? (round.index + 1 < round.questions.length ? '다음 문제' : '결과 보기')
    : !picked.quality && !picked.degree ? '성질과 도수를 골라 주세요'
    : `${picked.quality ?? '?'}${picked.degree ?? '?'}도 확인`;
}

function refreshChordChoices(q) {
  for (const b of $('ch-options').children) {
    b.className = 'choice' + mark(picked.name === b.textContent, q.answer.name === b.textContent);
  }
  $('submit').disabled = !checked && !picked.name;
  $('submit').textContent = checked ? (round.index + 1 < round.questions.length ? '다음 문제' : '결과 보기')
    : picked.name ? `${picked.name} 확인` : '코드 이름을 골라 주세요';
}

function mark(isPicked, isAnswer) {
  if (!checked) return isPicked ? ' on' : '';
  if (isAnswer) return ' right';
  return isPicked ? ' wrong' : '';
}

function nextQuestion() {
  const q = round.questions[round.index];
  picked = { quality: null, degree: null, name: null };
  checked = false;
  $('staff').replaceChildren(drawStaff(q));
  markKeys(q);
  if (q.kind === 'chord') {
    $('ch-options').replaceChildren(...q.options.map(name => {
      const b = el('button', { className: 'choice', textContent: name });
      b.onclick = () => choose('name', name);
      return b;
    }));
  }
  $('feedback').replaceChildren(el('span', {
    textContent: q.kind === 'chord' ? '이 코드의 이름은?' : L.step(q.a) > L.step(q.b) ? '내려가는 음정이에요' : '두 음 사이의 음정은?',
  }));
  $('quiz-count').textContent = `${round.index + 1} / ${round.questions.length}`;
  $('quiz-bar').style.width = (round.index / round.questions.length) * 100 + '%';
  refreshChoices();
}

$('submit').onclick = () => {
  if (!round) return;
  const q = round.questions[round.index];
  if (!checked) {
    const isCh = q.kind === 'chord';
    if (isCh ? !picked.name : !picked.quality || !picked.degree) return;
    checked = true;
    const ok = isCh ? picked.name === q.answer.name : L.isCorrect(q, picked.quality, picked.degree);
    if (ok) {
      round.score++;
      if (round.mode === 'review') setWrongs(isCh ? C.removeChordWrong(chordWrongs, q) : L.removeWrong(wrongs, q));
    } else {
      setWrongs(isCh ? C.addChordWrong(chordWrongs, q, picked.name) : L.addWrong(wrongs, q, { quality: picked.quality, degree: picked.degree }));
    }
    const answerText = isCh ? q.answer.name : `${q.answer.quality}${q.answer.degree}도`;
    $('feedback').replaceChildren(
      el('b', { className: ok ? 'ok' : 'bad', textContent: ok ? '정답!' : `틀렸어요 · 정답은 ${answerText}` }),
      el('span', { textContent: isCh ? C.explainChord(q) : L.explain(q) }),
    );
    $('quiz-bar').style.width = ((round.index + 1) / round.questions.length) * 100 + '%';
    refreshChoices();
    return;
  }
  round.index++;
  if (round.index < round.questions.length) nextQuestion();
  else finish();
};

// 그만두면 들어온 화면으로 돌아간다
$('quit').onclick = () => {
  const mode = round?.mode;
  round = null;
  if (mode === 'free') freeScreen();
  else if (mode === 'review') openWrongs();
  else stagesScreen();
};

// ── 소리: 그랜드 피아노 녹음(Salamander Grand Piano) ──
// 단3도 간격 녹음 9개를 받아 두고, 가장 가까운 녹음의 재생 속도를 바꿔 나머지 음을 낸다
const PIANO_SAMPLES = { C4: 48, Ds4: 51, Fs4: 54, A4: 57, C5: 60, Ds5: 63, Fs5: 66, A5: 69, C6: 72 };
let actx = null, piano = null;
function audio() {
  actx ??= new (window.AudioContext || window.webkitAudioContext)();
  // 아이폰은 다른 앱에 갔다 오면 'interrupted'가 되므로 running이 아니면 모두 깨운다
  if (actx.state !== 'running') actx.resume().catch(() => {});
  return actx;
}

// 아이폰 사파리는 화면을 누른 그 순간에 소리를 시작해야 오디오가 열린다.
// 녹음을 불러오는 동안 기다리면 그 순간이 지나 버리므로, 누를 때마다 들리지 않는 아주 짧은 소리를 먼저 낸다
function unlockAudio() {
  const ctx = audio();
  const src = ctx.createBufferSource();
  src.buffer = ctx.createBuffer(1, 1, 22050);
  src.connect(ctx.destination);
  src.start(0);
}
for (const type of ['touchend', 'click']) {
  addEventListener(type, unlockAudio, { capture: true, passive: true });
}
// iOS 17+: 무음 모드에서도 음악처럼 소리가 나게
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch { /* 지원 안 하는 기기 */ }

// 녹음을 못 받으면 null → 직접 만든 소리로 대신 낸다
function loadPiano() {
  const ctx = audio();
  piano ??= Promise.all(Object.entries(PIANO_SAMPLES).map(async ([name, p]) => {
    const res = await fetch(`piano/${name}.mp3`);
    if (!res.ok) throw new Error(name);
    const data = await res.arrayBuffer();
    const buf = await new Promise((ok, fail) => ctx.decodeAudioData(data, ok, fail));
    return [p, buf];
  })).then(Object.fromEntries).catch(() => null);
  return piano;
}

// p: logic.js의 pitch 값(가운데 도 = 48)
async function tone(p, delay = 0, dur = 1.6) {
  const samples = await loadPiano();
  const ctx = audio();
  if (ctx.state !== 'running') await Promise.race([ctx.resume(), new Promise(ok => setTimeout(ok, 300))]).catch(() => {});
  setTimeout(() => flashKey(p), delay * 1000);
  if (!samples) return synthTone(ctx, p, delay, dur);
  const base = Object.values(PIANO_SAMPLES).reduce((a, b) => (Math.abs(b - p) < Math.abs(a - p) ? b : a));
  const t = ctx.currentTime + 0.02 + delay;
  const src = ctx.createBufferSource();
  src.buffer = samples[base];
  src.playbackRate.value = 2 ** ((p - base) / 12);
  const out = ctx.createGain();
  out.gain.setValueAtTime(1.5, t);
  out.gain.setValueAtTime(1.5, t + dur);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  src.connect(out);
  out.connect(ctx.destination);
  src.start(t);
  src.stop(t + dur + 0.55);
}

// 녹음이 없을 때 쓰는 피아노 비슷한 소리
function synthTone(ctx, p, delay, dur) {
  const f = 440 * 2 ** ((p + 12 - 69) / 12);
  const t = ctx.currentTime + 0.02 + delay;
  const out = ctx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(f * 6, t);
  lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);
  lp.connect(out);
  out.connect(ctx.destination);
  for (const [type, mul, g] of [['triangle', 1, 1], ['sine', 2, 0.3], ['sine', 3, 0.1]]) {
    const o = ctx.createOscillator();
    const og = ctx.createGain();
    o.type = type;
    o.frequency.value = f * mul;
    og.gain.value = g;
    o.connect(og);
    og.connect(lp);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
}

// 음정은 악보 왼쪽 음부터, 화음은 아래 음부터
const notesOf = q => (q.kind === 'chord' ? q.notes : [q.a, q.b]);
$('play-together').onclick = () => {
  const q = round?.questions[round.index];
  if (!q) return;
  for (const n of notesOf(q)) tone(L.pitch(n), 0, q.kind === 'chord' ? 2 : 1.6);
};
$('play-apart').onclick = () => {
  const q = round?.questions[round.index];
  if (!q) return;
  const gap = q.kind === 'chord' ? 0.5 : 0.75;
  notesOf(q).forEach((n, i, all) => tone(L.pitch(n), i * gap, i === all.length - 1 ? 1.4 : 1.2));
};

// ── 건반 (가운데 도 ~ 높은 도) ──
const KEYS_KEY = 'intervalQuiz.keyboard';
const keyEls = {};
const whiteCount = (L.KEY_HIGH - L.KEY_LOW) / 12 * 7 + 1;

function buildKeyboard() {
  const box = $('keys');
  for (let i = 0; i < whiteCount; i++) {
    const n = { l: i % 7, o: 4 + Math.floor(i / 7), a: 0 };
    const w = el('button', { className: 'wkey', ariaLabel: L.noteName(n) });
    if (n.l === 0) w.append(el('small', { textContent: '도' }));
    addKey(w, L.pitch(n), (i + 0.5) / whiteCount);
    box.append(w);
    // 도·레·파·솔·라 오른쪽에 검은 건반
    if ([0, 1, 3, 4, 5].includes(n.l) && i < whiteCount - 1) {
      const b = el('button', { className: 'bkey', ariaLabel: L.noteName({ ...n, a: 1 }) });
      b.style.left = ((i + 1) / whiteCount) * 100 + '%';
      addKey(b, L.pitch(n) + 1, (i + 1) / whiteCount);
      box.append(b);
    }
  }
}

function addKey(e, p, x) {
  keyEls[p] = { e, x };
  e.onpointerdown = ev => { ev.preventDefault(); unlockAudio(); tone(p, 0, 1.2); };
}

function flashKey(p) {
  const k = keyEls[p];
  if (!k) return;
  k.e.classList.add('press');
  setTimeout(() => k.e.classList.remove('press'), 300);
}

// 문제의 두 음을 건반에 색으로 표시하고, 위에 음 이름을 단다 (왼쪽 음 노랑, 오른쪽 음 파랑)
function markKeys(q) {
  for (const { e } of Object.values(keyEls)) e.classList.remove('m1', 'm2');
  const labels = $('kb-labels');
  labels.replaceChildren();
  labels.classList.toggle('two', q.kind === 'chord');
  if (q.kind === 'chord') return markChordKeys(q, labels);
  const pa = L.pitch(q.a), pb = L.pitch(q.b);
  keyEls[pa]?.e.classList.add('m1');
  keyEls[pb]?.e.classList.add('m2');
  if (pa === pb) {
    if (keyEls[pa]) labels.append(label(`${L.noteName(q.a)}·${L.noteName(q.b)}`, 'm1 m2', keyEls[pa].x));
    return;
  }
  // 두 건반이 가까우면 이름표가 겹치지 않게 양옆으로 벌린다
  const close = keyEls[pa] && keyEls[pb] && Math.abs(keyEls[pa].x - keyEls[pb].x) < 0.1;
  for (const [n, p, m, other] of [[q.a, pa, 'm1', pb], [q.b, pb, 'm2', pa]]) {
    if (!keyEls[p]) continue;
    const side = close ? (p < other ? ' left' : ' right') : '';
    labels.append(label(L.noteName(n), m + side, keyEls[p].x));
  }
}

// 화음: 모든 음을 노랑으로 칠하고, 이름표가 붙으면 두 줄로 엇갈려 단다
function markChordKeys(q, labels) {
  const byKey = new Map();
  for (const n of q.notes) {
    const p = L.pitch(n);
    if (!keyEls[p]) continue;
    keyEls[p].e.classList.add('m1');
    byKey.set(p, [...(byKey.get(p) ?? []), C.enName(n)]);
  }
  let lastX = [-1, -1];
  for (const [p, nameList] of [...byKey].sort((a, b) => a[0] - b[0])) {
    const x = keyEls[p].x;
    const row = x - lastX[0] < 0.09 && x - lastX[1] >= 0.09 ? 1 : 0;
    lastX[row] = x;
    labels.append(label(nameList.join('·'), 'm1' + (row ? ' row2' : ''), x));
  }
}

function label(text, cls, x) {
  const span = el('span', { className: cls, textContent: text });
  span.style.left = x * 100 + '%';
  return span;
}

let showKeys = load(KEYS_KEY, true);
function applyKeysToggle() {
  $('keyboard').hidden = !showKeys;
  $('toggle-keys').textContent = showKeys ? '건반 숨기기' : '건반 보이기';
}
$('toggle-keys').onclick = () => {
  showKeys = !showKeys;
  save(KEYS_KEY, showKeys);
  applyKeysToggle();
};
buildKeyboard();
applyKeysToggle();

// ── 결과 ──
function finish() {
  const { mode, score, questions } = round;
  const total = questions.length;
  const buttons = [];
  if (mode === 'review') {
    $('result-title').textContent = '오답 다시 풀기';
    const left = wrongList().length;
    $('result-msg').textContent = left ? `오답 노트에 ${left}문제 남았어요` : '오답 노트를 모두 비웠어요!';
    if (left) buttons.push(['한 번 더', true, () => startRound('review')]);
  } else if (mode === 'free') {
    $('result-title').textContent = `자유연습 · ${isChord() ? '코드' : '음정'}`;
    $('result-msg').textContent = `${Math.round(score / total * 100)}% 맞혔어요`;
    buttons.push(['같은 설정으로 다시', true, () => startRound('free')]);
    buttons.push(['설정 바꾸기', false, freeScreen]);
  } else {
    const wasUnlocked = L.isUnlocked(prog(), mode + 1);
    if (isChord()) save(CHORD_PROGRESS_KEY, chordProgress = L.recordRound(chordProgress, mode, score));
    else save(PROGRESS_KEY, progress = L.recordRound(progress, mode, score));
    const passed = score >= L.PASS_SCORE;
    const hasNext = mode + 1 < stages().length;
    $('result-title').textContent = `${isChord() ? '코드' : '음정'} ${mode + 1}단계 · ${stages()[mode].name}`;
    $('result-msg').textContent = !passed ? `${L.PASS_SCORE}개 이상 맞히면 통과예요`
      : !hasNext ? '모든 단계를 통과했어요!'
      : wasUnlocked ? '통과!' : `통과! ${mode + 2}단계가 열렸어요`;
    if (passed && hasNext) buttons.push(['다음 단계', true, () => startRound(mode + 1)]);
    buttons.push(['다시 풀기', !passed || !hasNext, () => startRound(mode)]);
  }
  buttons.push(['처음으로', false, home]);
  $('result-score').replaceChildren(String(score), el('small', { textContent: ` / ${total}` }));
  $('result-buttons').replaceChildren(...buttons.map(([label, fill, fn]) => {
    const b = el('button', { className: 'wide' + (fill ? ' fill' : ''), textContent: label });
    b.onclick = fn;
    return b;
  }));
  round = null;
  show('result');
}

// ── 오답 노트 ──
function openWrongs() {
  const list = $('wrong-list');
  list.replaceChildren();
  const items = wrongList();
  $('wrongs-title').textContent = `오답 노트 · ${isChord() ? '코드' : '음정'}`;
  if (!items.length) list.append(el('p', { className: 'empty', textContent: '아직 틀린 문제가 없어요' }));
  for (const w of items) {
    const paper = el('div', { className: 'paper' });
    paper.append(drawStaff(w));
    const isCh = w.kind === 'chord';
    const txt = el('div', { className: 'txt' }, [
      el('div', { textContent: isCh ? w.notes.map(C.enName).join(' ') : `${L.noteName(w.a)} → ${L.noteName(w.b)}` }),
      el('div', {}, ['정답 ', el('b', { textContent: isCh ? w.answer.name : `${w.answer.quality}${w.answer.degree}도` })]),
      el('div', {}, ['내 답 ', el('s', { textContent: isCh ? w.picked : `${w.picked.quality}${w.picked.degree}도` })]),
    ]);
    list.append(el('div', { className: 'wrong-item' }, [paper, txt]));
  }
  $('wrongs-count').textContent = `${items.length}문제`;
  $('retry-wrongs').disabled = !items.length;
  show('wrongs');
}
$('wrongs-back').onclick = home;
$('retry-wrongs').onclick = () => startRound('review');

home();
</script>
