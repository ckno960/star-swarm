<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>나이트 라인</title>
<style>
  :root { --bg: #1b1b2a; --panel: #26263a; --line: #4a4a6a; --text: #f2f2f2; --accent: #ffd23f; --red: #ff5c5c; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 16px system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  body { display: flex; justify-content: center; }
  main { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
  #play, #bonus { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #play[hidden], #bonus[hidden] { display: none; }
  h1 { margin: 4px 0 0; font-size: 26px; letter-spacing: 3px; color: var(--accent); text-shadow: 3px 3px 0 #000; }
  #hud { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 17px; }
  #stagePick { display: flex; align-items: center; gap: 6px; }
  #stats { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  #coins { color: var(--accent); font-weight: 700; }
  button {
    font: 700 16px system-ui, sans-serif; color: var(--text); background: var(--panel);
    border: 3px solid var(--line); border-radius: 0; min-height: 44px; padding: 0 14px; box-shadow: 3px 3px 0 #000;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  button:disabled { opacity: 0.35; }
  button.primary { border-color: var(--accent); }
  #stagePick button { min-height: 36px; min-width: 36px; padding: 0; }
  #board { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 3px solid #000; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(0, 0, 0, 0.7); text-align: center;
  }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0; font-size: 30px; color: var(--accent); text-shadow: 3px 3px 0 #000; }
  #overlay p { margin: 0; opacity: 0.85; }
  #overlay div { display: flex; gap: 8px; }
  #tools { display: flex; gap: 8px; }
  #dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  #dpad button { padding: 0; min-height: 0; font-size: 22px; }
  #bonus h2 { margin: 0; font-size: 24px; color: var(--accent); text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
  #reels { display: flex; gap: 6px; padding: 6px; background: #000; border: 3px solid var(--accent); }
  #reels span {
    width: 52px; height: 60px; display: flex; align-items: center; justify-content: center;
    background: #f2f2f2; color: #1b1b2a; font: 900 34px system-ui, sans-serif;
  }
  #reels span.seven { color: #e02020; }
  #reels.jackpot { animation: flash 0.15s steps(2) 12; }
  @keyframes flash { 50% { border-color: #ff5c5c; background: #ffd23f; } }
  #reelMsg { min-height: 22px; font-weight: 700; color: var(--accent); text-align: center; }
  #bonusInfo { display: flex; gap: 16px; font-size: 16px; }
  #toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    background: #000; border: 3px solid var(--accent); padding: 8px 16px; white-space: nowrap; pointer-events: none;
    transition: opacity 0.2s; opacity: 0; z-index: 10;
  }
  #toast.show { opacity: 1; }
  .hint { font-size: 12px; opacity: 0.6; text-align: center; margin: 0; line-height: 1.5; }
  @media (hover: hover) and (pointer: fine) { #dpad { display: none; } }
</style>
</head>
<body>
<main>
  <h1>나이트 라인</h1>
  <div id="hud">
    <div id="stagePick">
      <button id="prevStage" aria-label="이전 스테이지">◀</button>
      <span id="stageLabel"></span>
      <button id="nextStage" aria-label="다음 스테이지">▶</button>
    </div>
    <div id="stats"><span id="left"></span><span id="coins"></span></div>
  </div>

  <div id="play">
    <div id="board">
      <canvas id="canvas" role="img" aria-label="게임 화면. 기사와 몬스터가 있는 격자입니다."></canvas>
      <div id="overlay" hidden></div>
    </div>
    <div id="tools">
      <button id="undoBtn">되돌리기</button>
      <button id="resetBtn">다시</button>
      <button id="hintBtn">힌트</button>
    </div>
    <div id="dpad">
      <span></span><button data-dir="up" aria-label="위">▲</button><span></span>
      <button data-dir="left" aria-label="왼쪽">◀</button><span></span><button data-dir="right" aria-label="오른쪽">▶</button>
      <span></span><button data-dir="down" aria-label="아래">▼</button><span></span>
    </div>
    <p class="hint">밀기·방향키로 4방향 이동. 기사는 그 방향의 첫 몬스터까지 달려가 처치해요.<br>몬스터가 없는 방향으로는 갈 수 없어요. 갑옷 몬스터는 두 번 때려야 쓰러져요.</p>
  </div>

  <section id="bonus" hidden>
    <h2>보너스 파친코</h2>
    <div id="reels" aria-live="polite"><span>7</span><span>7</span><span>7</span></div>
    <div id="reelMsg"></div>
    <canvas id="pachi" role="img" aria-label="파친코 판. 위를 눌러 공을 떨어뜨립니다."></canvas>
    <div id="bonusInfo"><span id="ballsLeft"></span><span id="won"></span></div>
    <button id="dropBtn" class="primary">공 발사</button>
    <button id="claimBtn" class="primary" hidden>계속하기</button>
    <p class="hint">판 위쪽을 누르면 그 자리에서 공이 떨어져요.<br>가운데 START에 들어가면 슬롯이 돌아요. 7 세 개면 잭팟!</p>
  </section>
</main>
<div id="toast"></div>

<script type="module">
import { createStage, move, undo, targetIn, isCleared, isStuck, hint, DIRS, TOUGH_FROM_STAGE } from './game.js';
import {
  createBoard, dropBall, stepBoard, isFinished, spinReels,
  BOARD_W, BOARD_H, BALL_R, SLOTS, SLOT_W, SLOT_TOP, SYMBOLS,
} from './pachinko.js';

const $ = id => document.getElementById(id);
const CELL = 16, SLIDE_MS_PER_CELL = 45, BONUS_EVERY = 10, MAX_HELD_SPINS = 4;
const PACHI_SCALE = 4; // 파친코 판은 내부 해상도를 키워서 칸 숫자가 번지지 않게 한다
const SPRITES = {
  knight: [
    '.....rr.....',
    '....rr......',
    '...gggggg...',
    '..gggggggg..',
    '..gkkkkkkg..',
    '..gggggggg..',
    '...gggggg...',
    '..bbbbbbbb.w',
    '.gbbbybbbbgw',
    '.gbbbbbbbbgw',
    '..bbbbbbbb.h',
    '...gg..gg...',
    '..ggg..ggg..',
  ],
  monsters: [
    [ // 슬라임
      '............',
      '............',
      '............',
      '............',
      '.....mm.....',
      '...mmmmmm...',
      '..mmmmmmmm..',
      '.mmwkmmwkmm.',
      '.mmkkmmkkmm.',
      'mmmmmmmmmmmm',
      'mmmmddddmmmm',
      '.mmmmmmmmmm.',
      '..mmmmmmmm..',
    ],
    [ // 박쥐
      '............',
      '............',
      'm..........m',
      'mm...mm...mm',
      'mmm.mmmm.mmm',
      'mmmmwkkwmmmm',
      '.mmmkkkkmmm.',
      '..mmmddmmm..',
      '...m.mm.m...',
      '............',
      '............',
      '............',
      '............',
    ],
    [ // 유령
      '....mmmm....',
      '...mmmmmm...',
      '..mmmmmmmm..',
      '..mkkmmkkm..',
      '..mkkmmkkm..',
      '..mmmmmmmm..',
      '..mmmkkmmm..',
      '..mmmmmmmm..',
      '..mmmmmmmm..',
      '..mmmmmmmm..',
      '..mmmmmmmm..',
      '..m.mm.mm.m.',
      '............',
    ],
    [ // 갑옷 오크 (체력 2)
      '..a......a..',
      '..aa....aa..',
      '..aaaaaaaa..',
      '.aawwaawwaa.',
      '.aaaaaaaaaa.',
      '..mmmmmmmm..',
      '.mmtmmmmtmm.',
      'aaaaaaaaaaaa',
      'aamaaaaaamaa',
      '.aaaaaaaaaa.',
      '..mmm..mmm..',
      '..mm....mm..',
      '.aaa....aaa.',
    ],
  ],
};
const KNIGHT_COLORS = { r: '#e04040', g: '#c8ccd8', k: '#20202a', b: '#3a5fcf', y: '#ffd23f', w: '#e8e8f0', h: '#8a5a2a' };
const MONSTER_COLORS = [
  { m: '#5bd65b', d: '#3a9a3a', k: '#111', w: '#fff' },
  { m: '#9b5bd9', d: '#6a3a9a', k: '#111', w: '#ff5c5c' },
  { m: '#e8e8f0', d: '#b0b0c8', k: '#20202a', w: '#fff' },
  { a: '#7a8aa8', m: '#4a8a3a', w: '#ff3030', t: '#f2f2f2' },
];
const WHITE = new Proxy({}, { get: () => '#ffffff' });
// 한 대 맞은 갑옷 오크의 갑옷 금
const CRACKS = [[3, 1], [4, 2], [8, 8], [7, 9], [9, 7], [2, 8]];

const canvas = $('canvas'), ctx = canvas.getContext('2d');
const pachi = $('pachi'), pctx = pachi.getContext('2d');
pachi.width = BOARD_W * PACHI_SCALE; pachi.height = BOARD_H * PACHI_SCALE;
pctx.setTransform(PACHI_SCALE, 0, 0, PACHI_SCALE, 0, 0);

let cleared = load('knightLine.cleared', 0);
let coins = load('knightLine.coins', 0);
let bonusDone = load('knightLine.bonus', 0); // 보너스를 받은 마지막 스테이지
let stage = Math.min(cleared + 1, load('knightLine.stage', 1));
let s, initialCount = 0, anim = null, queued = null, facing = 'right', shake = null, hintDir = null, hintAt = 0;
let particles = [], hitFlash = null, toastTimer = null;
let bonus = null;

function load(key, fallback) {
  try { return Number(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, String(value)); } catch {}
}

function startStage(n) {
  stage = n;
  save('knightLine.stage', n);
  s = createStage(n);
  initialCount = s.monsters.length;
  anim = queued = shake = hintDir = hitFlash = bonus = null;
  particles = [];
  canvas.width = canvas.height = s.size * CELL;
  $('overlay').hidden = true;
  $('play').hidden = false;
  $('bonus').hidden = true;
  fitBoard();
  updateHud();
  if (n === TOUGH_FROM_STAGE) toast('갑옷 오크 등장! 두 번 때려야 쓰러져요');
}

function updateHud() {
  $('stageLabel').textContent = `스테이지 ${stage}`;
  $('prevStage').disabled = stage <= 1 || !!bonus;
  $('nextStage').disabled = stage > cleared || !!bonus;
  $('left').textContent = `남은 몬스터 ${s.monsters.length}`;
  $('coins').textContent = `코인 ${coins}`;
  $('undoBtn').disabled = !s.history.length;
}

function addCoins(n) {
  coins += n;
  save('knightLine.coins', coins);
  updateHud();
}

function toast(text) {
  $('toast').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

function tryMove(dir) {
  if (!$('overlay').hidden || bonus) return;
  if (anim) { queued = dir; return; } // 달리는 중에 누른 방향은 도착하자마자 이어서 실행
  if (dir === 'left' || dir === 'right') facing = dir;
  const from = { ...s.knight };
  const r = move(s, dir);
  if (!r) { shake = { dir, start: performance.now() }; return; }
  hintDir = null;
  const cells = Math.abs(s.knight.x - from.x) + Math.abs(s.knight.y - from.y);
  anim = {
    from, to: { ...s.knight }, dir, ...r, start: performance.now(),
    dur: cells ? cells * SLIDE_MS_PER_CELL + 40 : 140, // 바로 옆을 때릴 때는 제자리에서 찌르는 동작
  };
  updateHud();
}

function finishMove(now) {
  const { monster: m, killed } = anim;
  anim = null;
  if (killed) burst(m.x * CELL + 8, m.y * CELL + 9, MONSTER_COLORS[m.kind].m ?? MONSTER_COLORS[m.kind].a, 14, 40);
  else { burst(m.x * CELL + 8, m.y * CELL + 8, '#ffffff', 8, 30); hitFlash = { m, at: now }; }
  if (isCleared(s)) {
    if (stage > cleared) { cleared = stage; save('knightLine.cleared', cleared); }
    updateHud();
    const text = `몬스터 ${initialCount}마리 처치!`;
    if (stage % BONUS_EVERY === 0 && stage > bonusDone)
      return showOverlay('STAGE CLEAR', `${text}<br>${stage}스테이지 보너스!`, [['보너스 파친코 ▶', startBonus, true]]);
    return showOverlay('STAGE CLEAR', text, [['다음 스테이지', () => startStage(stage + 1), true]]);
  }
  if (isStuck(s)) {
    return showOverlay('막혔어요', '어느 방향에도 몬스터가 없어요', [['되돌리기', doUndo, true], ['다시', () => startStage(stage)]]);
  }
  if (queued) { const d = queued; queued = null; tryMove(d); }
}

function burst(x, y, color, n, speed) {
  const born = performance.now();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.5 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, born, color });
  }
}

function showOverlay(title, html, buttons) {
  const o = $('overlay');
  o.innerHTML = `<h2>${title}</h2><p>${html}</p><div></div>`;
  for (const [label, fn, primary] of buttons) {
    const b = document.createElement('button');
    b.textContent = label;
    if (primary) b.className = 'primary';
    b.onclick = fn;
    o.querySelector('div').append(b);
  }
  o.hidden = false;
}

function doUndo() {
  if (anim || bonus) return;
  if (undo(s)) { $('overlay').hidden = true; hintDir = null; updateHud(); }
}

$('undoBtn').onclick = doUndo;
$('resetBtn').onclick = () => startStage(stage);
$('hintBtn').onclick = () => {
  if (anim || !$('overlay').hidden) return;
  const d = hint(s);
  if (d === undefined) return toast('너무 복잡해서 힌트를 못 찾았어요. 다시 해 보세요');
  if (!d) return toast('이 상태로는 깰 수 없어요. 되돌려 보세요');
  hintDir = d; hintAt = performance.now();
};
$('prevStage').onclick = () => startStage(stage - 1);
$('nextStage').onclick = () => startStage(stage + 1);

const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (bonus) {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); bonusDrop(); }
    return;
  }
  if (KEYS[e.code]) { e.preventDefault(); if (!e.repeat) tryMove(KEYS[e.code]); }
  else if (e.code === 'KeyZ' || e.code === 'Backspace') doUndo();
  else if (e.code === 'KeyR') startStage(stage);
});
for (const b of document.querySelectorAll('#dpad button'))
  b.addEventListener('pointerdown', e => { e.preventDefault(); tryMove(b.dataset.dir); });

// 판 위에서 손가락을 밀면 그 방향으로 이동
let swipe = null;
canvas.addEventListener('pointerdown', e => { swipe = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

function fitBoard() {
  const avail = Math.min(innerWidth - 32 - 6, innerHeight - 380, 640);
  canvas.style.width = canvas.style.height = `${Math.floor(Math.max(s.size * CELL, avail))}px`;
  // 슬롯, 버튼까지 한 화면에 들어오게 위아래 요소 높이만큼 뺀다
  const ph = Math.max(BOARD_H, Math.min(innerHeight - 470, (innerWidth - 38) * BOARD_H / BOARD_W, 720));
  pachi.style.height = `${Math.floor(ph)}px`;
  pachi.style.width = `${Math.floor(ph * BOARD_W / BOARD_H)}px`;
}
addEventListener('resize', fitBoard);

// ---------- 보너스 파친코 ----------

function startBonus() {
  // 시작하자마자 받은 것으로 기록해서 새로고침으로 다시 돌릴 수 없게 한다
  bonusDone = stage;
  save('knightLine.bonus', bonusDone);
  bonus = { board: createBoard(), won: 0, held: 0, spin: null, lastDrop: 0, floats: [], reached: false };
  $('play').hidden = true;
  $('bonus').hidden = false;
  $('dropBtn').hidden = false;
  $('claimBtn').hidden = true;
  $('reelMsg').textContent = 'START 구멍을 노려 보세요';
  $('reels').classList.remove('jackpot');
  showReels(['7', '7', '7']);
  fitBoard();
  updateHud();
  updateBonusInfo();
}

function bonusDrop(x = BOARD_W / 2 + (Math.random() - 0.5) * 24) {
  if (!bonus) return;
  const now = performance.now();
  if (now - bonus.lastDrop < 180) return;
  if (dropBall(bonus.board, x)) { bonus.lastDrop = now; updateBonusInfo(); }
}

$('dropBtn').addEventListener('pointerdown', e => { e.preventDefault(); bonusDrop(); });
pachi.addEventListener('pointerdown', e => {
  const r = pachi.getBoundingClientRect();
  bonusDrop((e.clientX - r.left) / r.width * BOARD_W);
});
$('claimBtn').onclick = () => startStage(stage + 1);

function updateBonusInfo() {
  const held = bonus.held ? ` (대기 ${bonus.held})` : '';
  $('ballsLeft').textContent = `남은 공 ${bonus.board.ballsLeft}${held}`;
  $('won').textContent = `획득 코인 ${bonus.won}`;
}

function showReels(symbols) {
  [...$('reels').children].forEach((el, i) => {
    el.textContent = symbols[i];
    el.classList.toggle('seven', symbols[i] === '7');
  });
}

function winCoins(n, x, y, text) {
  if (!n) return;
  bonus.won += n;
  addCoins(n);
  bonus.floats.push({ x, y, text: text ?? `+${n}`, born: performance.now() });
}

function updateBonus(now, dt) {
  const b = bonus;
  for (const l of stepBoard(b.board, dt)) {
    const slot = SLOTS[l.slot];
    if (slot.start) {
      if (b.held < MAX_HELD_SPINS) b.held++;
      b.floats.push({ x: l.x, y: SLOT_TOP - 4, text: 'START!', born: now });
    } else winCoins(slot.coins, l.x, SLOT_TOP - 4);
    updateBonusInfo();
  }

  // 슬롯: 왼쪽부터 차례로 멈춘다. 앞 두 개가 같으면 '리치'
  if (!b.spin && b.held) {
    b.held--;
    b.spin = { ...spinReels(), start: now };
    b.reached = false;
    $('reels').classList.remove('jackpot');
    $('reelMsg').textContent = '';
    updateBonusInfo();
  }
  if (b.spin) {
    const t = now - b.spin.start;
    const stops = [600, 900, b.spin.reels[0] === b.spin.reels[1] ? 1800 : 1200];
    showReels(b.spin.reels.map((sym, i) => (t >= stops[i] ? sym : SYMBOLS[Math.floor(now / 60 + i * 2) % SYMBOLS.length])));
    if (!b.reached && t >= stops[1] && b.spin.reels[0] === b.spin.reels[1]) {
      b.reached = true;
      $('reelMsg').textContent = b.spin.reels[0] === '7' ? '리치!! 잭팟 찬스!' : '리치!';
    }
    if (t >= stops[2] + 200) {
      const { coins: won, extraBalls, label, reels } = b.spin;
      b.spin = null;
      winCoins(won, BOARD_W / 2, 40, won ? `+${won}` : undefined);
      b.board.ballsLeft += extraBalls;
      $('reelMsg').textContent = won ? `${label} +${won} 코인${extraBalls ? ` · 보너스 공 +${extraBalls}` : ''}` : '꽝';
      if (reels.every(r => r === reels[0])) $('reels').classList.add('jackpot');
      if (label === 'JACKPOT!!') toast('🎰 JACKPOT!! +300 코인');
      updateBonusInfo();
    }
  }

  if (isFinished(b.board) && !b.spin && !b.held && $('claimBtn').hidden) {
    $('dropBtn').hidden = true;
    $('claimBtn').hidden = false;
    $('claimBtn').textContent = `계속하기 (+${b.won} 코인 획득)`;
  }
}

function renderBonus(now) {
  const p = (x, y, c, w = 1, h = 1) => { pctx.fillStyle = c; pctx.fillRect(x, y, w, h); };
  p(0, 0, '#14213d', BOARD_W, BOARD_H);
  for (let y = 0; y < BOARD_H; y += 8) p(0, y, '#172645', BOARD_W, 4);
  for (const peg of bonus.board.pegs) { p(peg.x - 1, peg.y - 1, '#ffd23f', 2, 2); p(peg.x - 1, peg.y - 1, '#fff6c0'); }
  // 바닥 칸
  SLOTS.forEach((slot, i) => {
    const x = Math.round(i * SLOT_W);
    const color = slot.start ? (Math.floor(now / 200) % 2 ? '#ff3030' : '#c01818') : slot.coins >= 10 ? '#2f7f4f' : slot.coins ? '#2a5a8a' : '#333344';
    p(x, SLOT_TOP, color, Math.ceil(SLOT_W), BOARD_H - SLOT_TOP);
    if (i) p(x, SLOT_TOP - 4, '#c8ccd8', 1, BOARD_H - SLOT_TOP + 4);
  });
  pctx.font = 'bold 7px monospace';
  pctx.textAlign = 'center';
  pctx.textBaseline = 'middle';
  SLOTS.forEach((slot, i) => {
    pctx.fillStyle = '#fff';
    pctx.fillText(slot.start ? 'S' : String(slot.coins), (i + 0.5) * SLOT_W, SLOT_TOP + 9);
  });
  for (const ball of bonus.board.balls) {
    const x = Math.round(ball.x), y = Math.round(ball.y);
    p(x - BALL_R + 1, y - BALL_R, '#e8e8f0', BALL_R * 2 - 2, BALL_R * 2);
    p(x - BALL_R, y - BALL_R + 1, '#e8e8f0', BALL_R * 2, BALL_R * 2 - 2);
    p(x - 1, y - 1, '#ffffff');
  }
  bonus.floats = bonus.floats.filter(f => now - f.born < 900);
  for (const f of bonus.floats) {
    const t = (now - f.born) / 900;
    pctx.fillStyle = `rgba(255, 210, 63, ${1 - t})`;
    pctx.fillText(f.text, f.x, f.y - t * 14);
  }
}

// ---------- 퍼즐 화면 그리기 ----------

function px(x, y, color, w = 1, h = 1) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawSprite(map, colors, x, y, flip = false) {
  const ox = Math.round(x) + 2, oy = Math.round(y) + 2;
  map.forEach((row, r) => {
    for (let c = 0; c < row.length; c++) {
      const ch = row[flip ? row.length - 1 - c : c];
      if (ch !== '.') px(ox + c, oy + r, colors[ch]);
    }
  });
}

function drawMonster(m, now) {
  const bob = Math.round(Math.sin(now / 300 + m.x * 1.7 + m.y));
  const x = m.x * CELL, y = m.y * CELL + bob;
  const flash = hitFlash && hitFlash.m === m && now - hitFlash.at < 200;
  drawSprite(SPRITES.monsters[m.kind], flash ? WHITE : MONSTER_COLORS[m.kind], x, y);
  if (m.kind !== 3) return;
  if (m.hp === 1) for (const [cx, cy] of CRACKS) px(x + 2 + cx, y + 2 + cy, '#20202a');
  // 남은 체력 칸
  for (let i = 0; i < 2; i++) px(x + 4 + i * 5, y, i < m.hp ? '#ff3030' : '#3a3a4c', 3, 2);
}

function render(now) {
  requestAnimationFrame(render);
  const dt = Math.min(0.05, (now - (render.last ?? now)) / 1000);
  render.last = now;
  if (bonus) { updateBonus(now, dt); renderBonus(now); return; }
  if (!s) return;
  for (let y = 0; y < s.size; y++)
    for (let x = 0; x < s.size; x++) {
      const X = x * CELL, Y = y * CELL;
      px(X, Y, (x + y) % 2 ? '#4a4a5e' : '#525268', CELL, CELL);
      px(X, Y + CELL - 1, '#3a3a4c', CELL, 1);
      px(X + CELL - 1, Y, '#3a3a4c', 1, CELL);
    }

  // 힌트: 다음에 갈 방향의 몬스터까지 점선
  if (hintDir && !anim) {
    const m = targetIn(s, hintDir);
    if (m && Math.floor((now - hintAt) / 250) % 2 === 0) {
      const [dx, dy] = DIRS[hintDir];
      for (let x = s.knight.x + dx, y = s.knight.y + dy; x !== m.x || y !== m.y; x += dx, y += dy)
        px(x * CELL + 6, y * CELL + 6, '#ffd23f', 4, 4);
      px(m.x * CELL, m.y * CELL, 'rgba(255, 210, 63, 0.35)', CELL, CELL);
    }
  }

  let kx = s.knight.x * CELL, ky = s.knight.y * CELL;
  if (anim) {
    const t = Math.min(1, (now - anim.start) / anim.dur);
    const [dx, dy] = DIRS[anim.dir];
    if (anim.from.x === anim.to.x && anim.from.y === anim.to.y) {
      const lunge = Math.sin(t * Math.PI) * 5;
      kx += dx * lunge; ky += dy * lunge;
    } else {
      const e = t * t; // 점점 빨라지며 돌진
      kx = (anim.from.x + (anim.to.x - anim.from.x) * e) * CELL;
      ky = (anim.from.y + (anim.to.y - anim.from.y) * e) * CELL;
      // 달려간 길에 남는 잔상
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      const x0 = anim.from.x * CELL + 6, y0 = anim.from.y * CELL + 6;
      ctx.fillRect(Math.min(x0, kx + 6), Math.min(y0, ky + 6), Math.abs(kx - anim.from.x * CELL) + 4, Math.abs(ky - anim.from.y * CELL) + 4);
    }
  }

  // 쓰러뜨리는 중인 몬스터는 기사가 도착할 때까지 보여 준다
  for (const m of anim?.killed ? [...s.monsters, anim.monster] : s.monsters) drawMonster(m, now);

  if (shake) {
    const t = (now - shake.start) / 250;
    if (t >= 1) shake = null;
    else {
      const [dx, dy] = DIRS[shake.dir];
      const off = Math.sin(t * Math.PI * 4) * 2 * (1 - t);
      kx += dx * off; ky += dy * off;
    }
  }
  drawSprite(SPRITES.knight, KNIGHT_COLORS, kx, ky, facing === 'left');

  particles = particles.filter(p => now - p.born < 400);
  for (const p of particles) {
    const t = (now - p.born) / 1000;
    px(Math.round(p.x + p.vx * t), Math.round(p.y + p.vy * t), p.color, 2, 2);
  }

  if (anim && now - anim.start >= anim.dur) finishMove(now);
}

startStage(stage);
requestAnimationFrame(render);
</script>
